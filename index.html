<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self';">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4ecdc">
<title>오늘의 한마디</title>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="192x192" href="icon2-192.png"><link rel="shortcut icon" href="favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon2.png"><link rel="apple-touch-icon" href="apple-touch-icon2.png"><link rel="manifest" href="manifest2.json">
<style>
:root{--bg:#f4ecdc;--card:#fffaf0;--ink:#3b2f24;--sub:#7a6a58;--accent:#8a4b2a;--line:#e6d8bf;--seal:#b03a2e;--fz:1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;-webkit-text-size-adjust:100%;line-height:1.6;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:rgba(244,236,220,.97);border-bottom:1px solid var(--line);padding:10px 12px 8px;text-align:center}
h1{margin:0;font-size:22px;letter-spacing:2px;color:var(--accent)}
h1 small{font-size:14px;color:var(--sub);letter-spacing:0;margin-left:6px}
.date{font-size:20px;margin:4px 0 8px;font-weight:700}
.nav{display:flex;gap:8px;justify-content:center}
.nav button,.tools button{font:inherit;font-size:18px;border:1px solid #c9b48f;background:#fffaf0;color:var(--ink);border-radius:12px;padding:8px 14px;min-height:44px;cursor:pointer}
.nav button.today{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.nav button:active,.tools button:active{transform:scale(.97)}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin:14px 0;box-shadow:0 1px 3px rgba(90,60,30,.08)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:10px}
.book{font-size:calc(19px*var(--fz));font-weight:700;color:var(--accent)}
.book .hz{font-size:.85em;color:var(--sub);font-weight:400;margin-left:4px}
.no{font-size:13px;color:var(--sub);white-space:nowrap}
.chap{font-size:calc(15px*var(--fz));color:var(--sub);margin:-4px 0 8px}
.orig{font-size:calc(24px*var(--fz));line-height:1.7;letter-spacing:1px;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.en{font-family:Georgia,"Times New Roman",serif;font-size:calc(20px*var(--fz));line-height:1.55;font-style:italic;color:#3b2f24}
.eum{font-size:calc(17px*var(--fz));color:#6b5a46;margin:8px 0 6px;white-space:pre-line;word-break:keep-all}
.pul{font-size:calc(18px*var(--fz));line-height:1.75;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);word-break:keep-all}
.lab{display:inline-block;font-size:12px;color:#fff;background:#b8946a;border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:2px;font-style:normal;font-family:sans-serif}
.card{border-left-width:8px}
.mx{background:#fff7ef;border-color:#e2c3a6;border-left-color:#a0522d}.mx .book{color:#a0522d}.mx .lab{background:#b9774f}
.cg{background:#f3f8ef;border-color:#c6dbbb;border-left-color:#4f7d3a}.cg .book{color:#3f6b2c}.cg .lab{background:#6d955a}
.zg{background:#f1f5fb;border-color:#c3d2e6;border-left-color:#3f5f8f}.zg .book{color:#34507c}.zg .lab{background:#6580ab}
.we{background:#f7f2fa;border-color:#d8c8e3;border-left-color:#7a4f96}.we .book{color:#6a3f86}.we .lab{background:#9171a8}
.memo{background:#fff4e0;border:2px solid #d9a05b}
.memo .book{color:var(--seal)}
.memo .item{margin:10px 0 14px}
.memo .src{font-size:calc(14px*var(--fz));color:var(--sub)}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.foot{font-size:13px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.5}
.hidden{display:none}
.replay{font-size:13px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<header>
  <h1>오늘의 한마디<small>一日一言</small></h1>
  <div class="date" id="date"></div>
  <div class="nav">
    <button id="prev" aria-label="전날">◀ 전날</button>
    <button id="today" class="today">오늘</button>
    <button id="next" aria-label="다음날">다음날 ▶</button>
  </div>
</header>
<main>
  <div id="memoTop"></div>
  <div id="cards"></div>
  <div class="tools">
    <button id="smaller">글자 작게</button>
    <button id="bigger">글자 크게</button>
    <button id="memoBtn">쌤의 메모</button>
  </div>
  <div id="memoBottom" class="hidden"></div>
  <div class="foot" id="foot"></div>
</main>
<script>
const D={"start":"2026-11-05","mx":[{"o":"子曰：「為善者，天報之以福；為不善者，天報之以禍。」","e":"자왈: “위선자, 천보지이복; 위불선자, 천보지이화.”","p":"공자께서 말씀하셨다. “착한 일을 하는 사람에게는 하늘이 복으로 갚아 주고, 착하지 않은 일을 하는 사람에게는 하늘이 화로 갚는다.”","c":"계선편(繼善篇)","src":0},{"o":"《易》云：「積善之家必有餘慶，積不善之家必有餘殃。」","e":"역운: “적선지가필유여경, 적불선지가필유여앙.”","p":"『주역』에 이르기를, “착한 일을 쌓은 집안에는 반드시 남는 경사가 있고, 착하지 않은 일을 쌓은 집안에는 반드시 남는 재앙이 있다.”","c":"계선편(繼善篇)","src":3},{"o":"漢昭烈將終，敕後主曰：「勿以惡小而為之，勿以善小而不為。」","e":"한소열장종, 칙후주왈: “물이악소이위지, 물이선소이불위.”","p":"한나라 소열제(유비)가 세상을 떠나며 후주(유선)에게 당부하였다. “악한 일은 작다고 해서 하지 말고, 착한 일은 작다고 해서 안 하지 말라.”","c":"계선편(繼善篇)","src":4},{"o":"莊子曰：「一日不念善，諸惡自皆起。」","e":"장자왈: “일일불념선, 제악자개기.”","p":"장자가 말하였다. “하루라도 착한 일을 생각하지 않으면 온갖 나쁜 마음이 저절로 일어난다.”","c":"계선편(繼善篇)","src":5},{"o":"《晉國語》云：「從善如登，從惡如崩。」","e":"진국어운: “종선여등, 종악여붕.”","p":"『진국어』에 이르기를, “착한 길을 따르기는 산을 오르듯 어렵고, 악한 길을 따르기는 무너지듯 쉽다.”","c":"계선편(繼善篇)","src":8},{"o":"太公曰：「善事須貪，惡事莫樂。」","e":"태공왈: “선사수탐, 악사막락.”","p":"태공이 말하였다. “착한 일은 욕심내어 하고, 나쁜 일은 즐기지 말라.”","c":"계선편(繼善篇)","src":9},{"o":"太公曰：「見善如渴，聞惡如聾。為善最樂，道理最大。」","e":"태공왈: “견선여갈, 문악여롱. 위선최락, 도리최대.”","p":"태공이 말하였다. “착한 것을 보면 목마른 듯이 반기고, 나쁜 말은 귀먹은 듯이 흘려들어라. 착한 일을 하는 것이 가장 큰 즐거움이요, 도리가 가장 크다.”","c":"계선편(繼善篇)","src":11},{"o":"馬援曰：「終身為善，善猶不足；一日行惡，惡自有餘。」","e":"마원왈: “종신위선, 선유부족; 일일행악, 악자유여.”","p":"마원이 말하였다. “평생 착한 일을 해도 오히려 모자라고, 단 하루 나쁜 일을 해도 그 악은 넘치고 남는다.”","c":"계선편(繼善篇)","src":12},{"o":"《易》曰：「出其言善，則千里應之；出言不善，則千里違之。」","e":"역왈: “출기언선, 즉천리응지; 출언불선, 즉천리위지.”","p":"『주역』에 이르기를, “착한 말을 하면 천 리 밖에서도 호응하고, 착하지 않은 말을 하면 천 리 밖에서도 등을 돌린다.”","c":"계선편(繼善篇)","src":14},{"o":"恩義廣施，人生何處不相逢？仇冤莫結，路逢險處難迴避。","e":"은의광시, 인생하처불상봉? 구원막결, 노봉험처난회피.","p":"은혜와 의리를 널리 베풀어라. 사람이 살다 보면 어디선들 다시 만나지 않겠는가? 원수를 맺지 말라. 좁고 험한 길에서 만나면 피하기 어렵다.","c":"계선편(繼善篇)","src":19},{"o":"與人方便，自己方便。","e":"여인방편, 자기방편.","p":"남을 편하게 해 주면 결국 나도 편해진다.","c":"계선편(繼善篇)","src":28},{"o":"先儒曰：「一日或聞一善言，行一善事，此日方不虛生。」","e":"선유왈: “일일혹문일선언, 행일선사, 차일방불허생.”","p":"옛 선비가 말하였다. “하루에 착한 말 한마디를 듣거나 착한 일 하나를 하면, 그날은 비로소 헛되이 산 날이 아니다.”","c":"계선편(繼善篇)","src":39},{"o":"孟子曰：「順天者存，逆天者亡。」","e":"맹자왈: “순천자존, 역천자망.”","p":"맹자가 말하였다. “하늘의 뜻을 따르는 자는 살아남고, 하늘을 거스르는 자는 망한다.”","c":"천리편(天理篇)","src":44},{"o":"諸葛武侯曰：「謀事在人，成事在天。」","e":"제갈무후왈: “모사재인, 성사재천.”","p":"제갈공명이 말하였다. “일을 꾀하는 것은 사람에게 달렸고, 일을 이루는 것은 하늘에 달렸다.”","c":"천리편(天理篇)","src":46},{"o":"康節邵先生曰：「天聽寂無音，蒼蒼何處尋？非高亦非遠，都只在人心。」","e":"강절소선생왈: “천청적무음, 창창하처심? 비고역비원, 도지재인심.”","p":"소강절 선생이 말하였다. “하늘은 소리 없이 듣고 있으니, 저 푸른 하늘을 어디서 찾겠는가? 높은 데도 먼 데도 있지 않고, 모두 사람의 마음속에 있다.”","c":"천리편(天理篇)","src":48},{"o":"人心生一念，天地悉皆知。善惡若無報，乾坤必有私。","e":"인심생일념, 천지실개지. 선악약무보, 건곤필유사.","p":"사람이 마음속에 한 생각을 일으키면 하늘과 땅이 다 안다. 선과 악에 갚음이 없다면 하늘과 땅이 사사로운 것이리라.","c":"천리편(天理篇)","src":49},{"o":"人可欺，天不可欺。人可瞞，天不可瞞。","e":"인가기, 천불가기. 인가만, 천불가만.","p":"사람은 속일 수 있어도 하늘은 속일 수 없다. 사람은 감출 수 있어도 하늘은 감출 수 없다.","c":"천리편(天理篇)","src":52},{"o":"湛湛青天不可欺，未曾舉意我先知。勸君莫作虧心事，古往今來放過誰？","e":"담담청천불가기, 미증거의아선지. 권군막작휴심사, 고왕금래방과수?","p":"맑고 푸른 하늘은 속일 수 없으니, 뜻을 내기도 전에 하늘이 먼저 안다. 그대에게 권하노니 양심에 어긋난 일을 하지 말라. 예부터 지금까지 하늘이 그냥 넘어간 사람이 누가 있던가?","c":"천리편(天理篇)","src":54},{"o":"人善人欺天不欺，人惡人怕天不怕。","e":"인선인기천불기, 인악인파천불파.","p":"사람이 착하면 남은 업신여겨도 하늘은 업신여기지 않고, 사람이 악하면 남은 두려워해도 하늘은 두려워하지 않는다.","c":"천리편(天理篇)","src":55},{"o":"子夏曰：「死生有命，富貴在天。」","e":"자하왈: “사생유명, 부귀재천.”","p":"자하가 말하였다. “죽고 사는 것은 운명에 달렸고, 부귀는 하늘에 달렸다.”","c":"순명편(順命篇)","src":65},{"o":"一飲一啄，事皆前定。","e":"일음일탁, 사개전정.","p":"한 번 마시고 한 번 쪼아 먹는 것까지도 모두 미리 정해져 있다.","c":"순명편(順命篇)","src":67},{"o":"萬事分已定，浮生空自忙。","e":"만사분이정, 부생공자망.","p":"모든 일은 분수가 이미 정해져 있는데, 덧없는 인생이 공연히 스스로 바쁘다.","c":"순명편(順命篇)","src":68},{"o":"會不如命，智不如福。","e":"회불여명, 지불여복.","p":"재주가 있어도 운명만 못하고, 지혜가 있어도 복만 못하다.","c":"순명편(順命篇)","src":71},{"o":"子曰：「知命之人，見利不動，臨死不怨。」","e":"자왈: “지명지인, 견리부동, 임사불원.”","p":"공자께서 말씀하셨다. “운명을 아는 사람은 이익을 보아도 흔들리지 않고, 죽음 앞에서도 원망하지 않는다.”","c":"순명편(順命篇)","src":75},{"o":"命裡有終須有，命裡無莫強求。","e":"명리유종수유, 명리무막강구.","p":"팔자에 있는 것은 끝내 오게 마련이고, 팔자에 없는 것은 억지로 구하지 말라.","c":"순명편(順命篇)","src":80},{"o":"《詩》云：「父兮生我，母兮鞠我。哀哀父母，生我劬勞。欲報深恩，昊天罔極。」","e":"시운: “부혜생아, 모혜국아. 애애부모, 생아구로. 욕보심은, 호천망극.”","p":"『시경』에 이르기를, “아버지 나를 낳으시고 어머니 나를 기르셨네. 애달프다 부모님, 나를 낳아 기르시느라 고생하셨네. 그 깊은 은혜 갚으려 하나 하늘처럼 끝이 없구나.”","c":"효행편(孝行篇)","src":82},{"o":"父母在，不遠遊，遊必有方。","e":"부모재, 불원유, 유필유방.","p":"부모가 살아 계시면 멀리 나가 놀지 말고, 나가더라도 반드시 가는 곳을 알려 드려라.","c":"효행편(孝行篇)","src":88},{"o":"父母之年不可不知也。一則以喜，一則以懼。","e":"부모지년불가부지야. 일즉이희, 일즉이구.","p":"부모의 나이는 꼭 알고 있어야 한다. 한편으로는 오래 사셔서 기쁘고, 한편으로는 늙어 가셔서 두렵기 때문이다.","c":"효행편(孝行篇)","src":89},{"o":"太公曰：「孝於親，子亦孝之。身既不孝，子何孝焉？」","e":"태공왈: “효어친, 자역효지. 신기불효, 자하효언?”","p":"태공이 말하였다. “내가 부모에게 효도하면 내 자식도 나에게 효도한다. 내가 효도하지 않으면서 자식이 어찌 효도하겠는가?”","c":"효행편(孝行篇)","src":92},{"o":"孝順還生孝順子，忤逆還生忤逆兒。不信但看簷頭水，點點滴滴不差移。","e":"효순환생효순자, 오역환생오역아. 불신단간첨두수, 점점적적불차이.","p":"효도하는 사람은 효도하는 자식을 낳고, 불효하는 사람은 불효하는 자식을 낳는다. 못 믿겠거든 처마 끝 낙숫물을 보라. 똑똑 떨어지는 물방울이 한 치도 어긋나지 않고 같은 자리에 떨어진다.","c":"효행편(孝行篇)","src":93},{"o":"養子方知父母恩，立身方知人辛苦。","e":"양자방지부모은, 입신방지인신고.","p":"자식을 길러 봐야 부모의 은혜를 알고, 스스로 세상에 서 봐야 남의 고생을 안다.","c":"효행편(孝行篇)","src":95},{"o":"《性理書》云：「見人之善而尋己之善，見人之惡而尋己之惡，如此方是有益。」","e":"성리서운: “견인지선이심기지선, 견인지악이심기지악, 여차방시유익.”","p":"『성리서』에 이르기를, “남의 좋은 점을 보면 내게도 그런 점이 있는지 찾아보고, 남의 나쁜 점을 보면 내게도 그런 점이 있는지 찾아보라. 이렇게 해야 비로소 도움이 된다.”","c":"정기편(正己篇)","src":114},{"o":"魯共公曰：「以德勝人則強，以財勝人則兇，以力勝人則亡。」","e":"노공공왈: “이덕승인즉강, 이재승인즉흉, 이력승인즉망.”","p":"노공공이 말하였다. “덕으로 남을 이기면 강해지고, 재물로 남을 이기면 흉해지고, 힘으로 남을 이기면 망한다.”","c":"정기편(正己篇)","src":122},{"o":"孟子曰：「以力服人者，非心服也。以德服人者，中心悅而誠服也。」","e":"맹자왈: “이력복인자, 비심복야. 이덕복인자, 중심열이성복야.”","p":"맹자가 말하였다. “힘으로 남을 복종시키면 마음으로 따르는 것이 아니다. 덕으로 복종시키면 속마음으로 기뻐하며 진심으로 따른다.”","c":"정기편(正己篇)","src":124},{"o":"太公曰：「見人善事，即須記之。見人惡事，即須掩之。」","e":"태공왈: “견인선사, 즉수기지. 견인악사, 즉수엄지.”","p":"태공이 말하였다. “남의 좋은 일을 보거든 곧 기억해 두고, 남의 나쁜 일을 보거든 곧 덮어 주어라.”","c":"정기편(正己篇)","src":125},{"o":"馬援曰：「聞人過失，如聞父母之名，耳可得聞口不可得言也。」","e":"마원왈: “문인과실, 여문부모지명, 이가득문구불가득언야.”","p":"마원이 말하였다. “남의 허물을 듣거든 부모의 이름을 듣듯이 하라. 귀로 들을 수는 있어도 입으로 말해서는 안 된다.”","c":"정기편(正己篇)","src":127},{"o":"《近思錄》云：「遷善當如風之速，改過當如雷之烈。」","e":"근사록운: “천선당여풍지속, 개과당여뢰지열.”","p":"『근사록』에 이르기를, “착한 쪽으로 옮겨 가기는 바람처럼 빨리 하고, 허물을 고치기는 우레처럼 단호하게 하라.”","c":"정기편(正己篇)","src":131},{"o":"子貢曰：「君子之過也，如日月之食焉。過也，人皆見之。更也，人皆仰之。」","e":"자공왈: “군자지과야, 여일월지식언. 과야, 인개견지. 경야, 인개앙지.”","p":"자공이 말하였다. “군자의 허물은 일식이나 월식과 같다. 허물이 있으면 사람들이 모두 보고, 고치면 사람들이 모두 우러러본다.”","c":"정기편(正己篇)","src":132},{"o":"知過必改，得能莫忘。","e":"지과필개, 득능막망.","p":"허물을 알면 반드시 고치고, 할 줄 알게 된 것은 잊지 말라.","c":"정기편(正己篇)","src":133},{"o":"道吾惡者是吾師，道吾好是吾賊。","e":"도오악자시오사, 도오호시오적.","p":"나의 잘못을 말해 주는 사람은 나의 스승이요, 나의 좋은 점만 말하는 사람은 나를 해치는 사람이다.","c":"정기편(正己篇)","src":136},{"o":"子曰：「三人行，必有我師焉。擇其善者而從之，其不善者而改之。」","e":"자왈: “삼인행, 필유아사언. 택기선자이종지, 기불선자이개지.”","p":"공자께서 말씀하셨다. “세 사람이 길을 가면 그 가운데 반드시 나의 스승이 있다. 좋은 점은 골라서 따르고, 좋지 않은 점은 보고 나를 고친다.”","c":"정기편(正己篇)","src":137},{"o":"太公曰：「勤為無價之寶，慎是護身之符。」","e":"태공왈: “근위무가지보, 신시호신지부.”","p":"태공이 말하였다. “부지런함은 값을 매길 수 없는 보배요, 삼가는 것은 몸을 지키는 부적이다.”","c":"정기편(正己篇)","src":140},{"o":"子曰：「君子食無求飽，居無求安。」","e":"자왈: “군자식무구포, 거무구안.”","p":"공자께서 말씀하셨다. “군자는 먹을 때 배부르기를 바라지 않고, 살 곳에 편안하기를 바라지 않는다.”","c":"정기편(正己篇)","src":151},{"o":"子曰：「君子欲訥於言，而敏於行。」","e":"자왈: “군자욕눌어언, 이민어행.”","p":"공자께서 말씀하셨다. “군자는 말은 더디게 하고, 행동은 재빠르게 하고자 한다.”","c":"정기편(正己篇)","src":172},{"o":"酒中不語真君子，財上分明大丈夫。","e":"주중불어진군자, 재상분명대장부.","p":"술자리에서 말을 아끼는 이가 참된 군자요, 돈 문제에 분명한 이가 대장부다.","c":"정기편(正己篇)","src":186},{"o":"《大學》云：「富潤屋，德潤身。」","e":"대학운: “부윤옥, 덕윤신.”","p":"『대학』에 이르기를, “부유함은 집을 윤택하게 하고, 덕은 몸을 윤택하게 한다.”","c":"정기편(正己篇)","src":187},{"o":"寧可正而不足，不可邪而有餘。","e":"영가정이부족, 불가사이유여.","p":"차라리 바르게 살다가 모자랄지언정, 그릇되게 살아서 남아돌아서는 안 된다.","c":"정기편(正己篇)","src":188},{"o":"子曰：「良藥苦口利於病，忠言逆耳利於行。」","e":"자왈: “양약고구리어병, 충언역이리어행.”","p":"공자께서 말씀하셨다. “좋은 약은 입에 쓰지만 병에 이롭고, 바른 말은 귀에 거슬리지만 행실에 이롭다.”","c":"정기편(正己篇)","src":191},{"o":"作福不如避罪，避禍不如省非。","e":"작복불여피죄, 피화불여성비.","p":"복을 지으려 애쓰기보다 죄를 피하는 것이 낫고, 화를 피하려 애쓰기보다 잘못을 살피는 것이 낫다.","c":"정기편(正己篇)","src":192},{"o":"凡戲無益，惟勤有功。","e":"범희무익, 유근유공.","p":"무릇 놀이는 이로움이 없고, 오직 부지런함만이 공이 있다.","c":"정기편(正己篇)","src":203},{"o":"人非賢莫交，物非義莫取，忿非善莫舉，事非是莫說。謹則無憂，忍則無辱，靜則常安，儉則常足。","e":"인비현막교, 물비의막취, 분비선막거, 사비시막설. 근즉무우, 인즉무욕, 정즉상안, 검즉상족.","p":"어질지 않은 사람은 사귀지 말고, 옳지 않은 물건은 갖지 말고, 착하지 않은 분노는 드러내지 말고, 옳지 않은 일은 입에 올리지 말라. 삼가면 근심이 없고, 참으면 욕됨이 없고, 고요하면 늘 편안하고, 검소하면 늘 넉넉하다.","c":"정기편(正己篇)","src":208},{"o":"耳不聞人之非，目不視人之短，口不言人之過，庶幾君子。","e":"이불문인지비, 목불시인지단, 구불언인지과, 서기군자.","p":"귀로는 남의 잘못을 듣지 않고, 눈으로는 남의 단점을 보지 않고, 입으로는 남의 허물을 말하지 않으면 군자에 가깝다.","c":"정기편(正己篇)","src":213},{"o":"子曰：「君子泰而不驕，小人驕而不泰。」","e":"자왈: “군자태이불교, 소인교이불태.”","p":"공자께서 말씀하셨다. “군자는 느긋하되 교만하지 않고, 소인은 교만하되 느긋하지 못하다.”","c":"정기편(正己篇)","src":220},{"o":"責人之非，不如行己之是。揚己之是，不如克己之非。","e":"책인지비, 불여행기지시. 양기지시, 불여극기지비.","p":"남의 잘못을 꾸짖는 것은 내가 옳은 일을 행하는 것만 못하다. 나의 옳음을 자랑하는 것은 나의 잘못을 이겨 내는 것만 못하다.","c":"정기편(正己篇)","src":233},{"o":"《景行錄》云：「知足可樂，多貪則憂。」","e":"경행록운: “지족가락, 다탐즉우.”","p":"『경행록』에 이르기를, “만족할 줄 알면 즐겁고, 욕심이 많으면 근심스럽다.”","c":"안분편(安分篇)","src":234},{"o":"知足者貧賤亦樂，不知足者富貴亦憂。","e":"지족자빈천역락, 부지족자부귀역우.","p":"만족할 줄 아는 사람은 가난해도 즐겁고, 만족할 줄 모르는 사람은 부귀해도 근심한다.","c":"안분편(安分篇)","src":235},{"o":"知足常足，終身不辱。知止常止，終身不恥。","e":"지족상족, 종신불욕. 지지상지, 종신불치.","p":"만족할 줄 알아 늘 넉넉하면 평생 욕되지 않고, 멈출 줄 알아 늘 그치면 평생 부끄럽지 않다.","c":"안분편(安分篇)","src":236},{"o":"《擊壤詩》云：「安分身無辱，知機心自閒。雖居人世上，卻是出人間。」","e":"격양시운: “안분신무욕, 지기심자한. 수거인세상, 각시출인간.”","p":"『격양시』에 이르기를, “분수를 지키면 몸에 욕됨이 없고, 때를 알면 마음이 절로 한가롭다. 비록 인간 세상에 살고 있으나 도리어 세상 밖에 사는 것과 같다.”","c":"안분편(安分篇)","src":239},{"o":"不義而富且貴，於我如浮雲。","e":"불의이부차귀, 어아여부운.","p":"의롭지 않게 얻은 부와 귀는 나에게 뜬구름과 같다.","c":"안분편(安分篇)","src":242},{"o":"先儒曰：「休怨我不如人，不如我者尚眾。休誇我能勝人，勝如我者更多。」","e":"선유왈: “휴원아불여인, 불여아자상중. 휴과아능승인, 승여아자갱다.”","p":"옛 선비가 말하였다. “내가 남만 못하다고 원망하지 말라. 나만 못한 사람이 아직 많다. 내가 남보다 낫다고 자랑하지 말라. 나보다 나은 사람이 더 많다.”","c":"안분편(安分篇)","src":253},{"o":"過度求福適以速禍，安分遠禍將自得福。","e":"과도구복적이속화, 안분원화장자득복.","p":"지나치게 복을 구하면 오히려 화를 재촉하고, 분수를 지켜 화를 멀리하면 저절로 복을 얻는다.","c":"안분편(安分篇)","src":255},{"o":"《書》曰：「滿招損，謙受益。」","e":"서왈: “만초손, 겸수익.”","p":"『서경』에 이르기를, “가득 차면 덜어짐을 부르고, 겸손하면 보탬을 받는다.”","c":"안분편(安分篇)","src":260},{"o":"將心比心，便是佛心。","e":"장심비심, 변시불심.","p":"내 마음에 비추어 남의 마음을 헤아리면, 그것이 곧 부처의 마음이다.","c":"존심편(存心篇)","src":269},{"o":"以己之心，度人之心。","e":"이기지심, 탁인지심.","p":"내 마음으로 남의 마음을 헤아려라.","c":"존심편(存心篇)","src":270},{"o":"得意處，早回頭。","e":"득의처, 조회두.","p":"뜻대로 잘될 때 일찌감치 돌아보라.","c":"존심편(存心篇)","src":277},{"o":"常將有日思無日，莫待無時思有時。","e":"상장유일사무일, 막대무시사유시.","p":"넉넉한 날에도 없을 때를 생각하고, 없게 된 뒤에야 있던 때를 그리워하지 말라.","c":"존심편(存心篇)","src":288},{"o":"有錢常記無錢日，安樂常思病患時。","e":"유전상기무전일, 안락상사병환시.","p":"돈이 있을 때 늘 돈 없던 날을 기억하고, 편안할 때 늘 병들었을 때를 생각하라.","c":"존심편(存心篇)","src":289},{"o":"施恩勿求報，與人勿追悔。","e":"시은물구보, 여인물추회.","p":"은혜를 베풀었으면 갚기를 바라지 말고, 남에게 주었으면 뒤에 후회하지 말라.","c":"존심편(存心篇)","src":292},{"o":"寸心不昧，萬法皆明。","e":"촌심불매, 만법개명.","p":"한 치 마음이 어둡지 않으면 모든 이치가 다 밝아진다.","c":"존심편(存心篇)","src":293},{"o":"念念有如臨敵日，心心常似過橋時。","e":"염념유여림적일, 심심상사과교시.","p":"생각마다 적과 마주한 날처럼 조심하고, 마음마다 늘 외나무다리를 건널 때처럼 삼가라.","c":"존심편(存心篇)","src":295},{"o":"是非只為多開口，煩惱皆因強出頭。","e":"시비지위다개구, 번뇌개인강출두.","p":"시비는 모두 입을 많이 열어서 생기고, 번뇌는 모두 억지로 나서서 생긴다.","c":"존심편(存心篇)","src":301},{"o":"君子愛財，取之有道。","e":"군자애재, 취지유도.","p":"군자도 재물을 좋아하지만, 그것을 얻는 데는 바른 길이 있다.","c":"존심편(存心篇)","src":304},{"o":"子曰：「君子坦蕩蕩，小人常戚戚。」","e":"자왈: “군자탄탕탕, 소인상척척.”","p":"공자께서 말씀하셨다. “군자는 마음이 평탄하고 넓으며, 소인은 늘 근심하고 초조하다.”","c":"존심편(存心篇)","src":306},{"o":"各人自掃門前雪，莫管他人屋上霜。","e":"각인자소문전설, 막관타인옥상상.","p":"각자 제 집 문 앞의 눈이나 쓸고, 남의 집 지붕 위 서리까지 간섭하지 말라.","c":"존심편(存心篇)","src":309},{"o":"早知今日，悔不當初。","e":"조지금일, 회부당초.","p":"오늘 이렇게 될 줄 일찍 알았더라면, 처음에 그러지 말 것을 하고 후회한다.","c":"존심편(存心篇)","src":310},{"o":"心不負人，面無慚色。","e":"심불부인, 면무참색.","p":"마음이 남을 저버리지 않으면 얼굴에 부끄러운 빛이 없다.","c":"존심편(存心篇)","src":311},{"o":"兒孫自有兒孫福，莫與兒孫作馬牛。","e":"아손자유아손복, 막여아손작마우.","p":"자손은 저마다 제 복을 타고나니, 자손을 위해 말이나 소처럼 고생만 하지 말라.","c":"존심편(存心篇)","src":317},{"o":"世上無難事，都來心不專。","e":"세상무난사, 도래심부전.","p":"세상에 어려운 일은 없다. 모두 마음을 한곳에 모으지 않아서 어려울 뿐이다.","c":"존심편(存心篇)","src":318},{"o":"子曰：「無欲速，無見小利。欲速則不達，見小利則大事不成。」","e":"자왈: “무욕속, 무견소리. 욕속즉부달, 견소리즉대사불성.”","p":"공자께서 말씀하셨다. “빨리 하려고 서두르지 말고, 작은 이익을 보지 말라. 서두르면 이르지 못하고, 작은 이익을 보면 큰일을 이루지 못한다.”","c":"존심편(存心篇)","src":329},{"o":"《景行錄》云：「人性如水。水一傾則不可復，性一縱則不可反。制水者必以堤防，制性者必以禮法。」","e":"경행록운: “인성여수. 수일경즉불가복, 성일종즉불가반. 제수자필이제방, 제성자필이례법.”","p":"『경행록』에 이르기를, “사람의 성품은 물과 같다. 물은 한번 쏟으면 되담을 수 없고, 성품은 한번 풀어 놓으면 되돌리기 어렵다. 물을 다스리려면 둑을 쌓아야 하고, 성품을 다스리려면 예법을 지켜야 한다.”","c":"계성편(戒性篇)","src":348},{"o":"忍一時之氣，免百日之憂。","e":"인일시지기, 면백일지우.","p":"한때의 분을 참으면 백 날의 근심을 면한다.","c":"계성편(戒性篇)","src":349},{"o":"得忍且忍，得戒且戒。不忍不戒，小事成大。","e":"득인차인, 득계차계. 불인불계, 소사성대.","p":"참을 수 있으면 우선 참고, 삼갈 수 있으면 우선 삼가라. 참지 않고 삼가지 않으면 작은 일이 큰일이 된다.","c":"계성편(戒性篇)","src":350},{"o":"《景行錄》云：「屈己者能處眾，好勝者必遇敵。」","e":"경행록운: “굴기자능처중, 호승자필우적.”","p":"『경행록』에 이르기를, “자기를 굽힐 줄 아는 사람은 여러 사람과 잘 어울리고, 이기기를 좋아하는 사람은 반드시 적을 만난다.”","c":"계성편(戒性篇)","src":356},{"o":"凡事留人情，後來好相見。","e":"범사류인정, 후래호상견.","p":"모든 일에 인정을 남겨 두면 뒷날 좋은 얼굴로 다시 만난다.","c":"계성편(戒性篇)","src":360},{"o":"先儒曰：「為人所不能為，方稱奇男子。忍人所不能忍，乃是大丈夫。」","e":"선유왈: “위인소불능위, 방칭기남자. 인인소불능인, 내시대장부.”","p":"옛 선비가 말하였다. “남이 하지 못하는 일을 해내야 비로소 뛰어난 남자라 하고, 남이 참지 못하는 것을 참아 내야 비로소 대장부라 한다.”","c":"계성편(戒性篇)","src":362},{"o":"子曰：「敏而好學，不恥下問。」","e":"자왈: “민이호학, 불치하문.”","p":"공자께서 말씀하셨다. “영민하면서도 배우기를 좋아하고, 아랫사람에게 묻는 것을 부끄러워하지 않는다.”","c":"권학편(勸學篇)","src":366},{"o":"《禮記》曰：「玉不琢不成器，人不學不知道。」","e":"예기왈: “옥불탁불성기, 인불학부지도.”","p":"『예기』에 이르기를, “옥도 다듬지 않으면 그릇이 되지 못하고, 사람도 배우지 않으면 도리를 알지 못한다.”","c":"권학편(勸學篇)","src":370},{"o":"太公曰：「人生不學，冥冥如夜行。」","e":"태공왈: “인생불학, 명명여야행.”","p":"태공이 말하였다. “사람이 살면서 배우지 않으면 캄캄한 밤길을 걷는 것과 같다.”","c":"권학편(勸學篇)","src":371},{"o":"《禮記》曰：「獨學無友，則孤陋寡聞。」","e":"예기왈: “독학무우, 즉고루과문.”","p":"『예기』에 이르기를, “벗 없이 혼자 배우면 견문이 좁고 들은 것이 적어진다.”","c":"권학편(勸學篇)","src":379},{"o":"學到老，不會到老。","e":"학도로, 불회도로.","p":"늙도록 배워도 늙도록 다 알지 못한다.","c":"권학편(勸學篇)","src":382},{"o":"少年易老學難成，一寸光陰不可輕。未覺池塘春草夢，階前梧葉已秋聲。","e":"소년이로학난성, 일촌광음불가경. 미각지당춘초몽, 계전오엽이추성.","p":"소년은 늙기 쉽고 학문은 이루기 어려우니, 짧은 시간도 가벼이 여기지 말라. 연못가 봄풀의 꿈이 깨기도 전에, 섬돌 앞 오동잎은 벌써 가을 소리를 낸다.","c":"권학편(勸學篇)","src":391},{"o":"陶淵明詩云：「盛年不重來，一日難再晨。及時當勉勵，歲月不待人。」","e":"도연명시운: “성년부중래, 일일난재신. 급시당면려, 세월부대인.”","p":"도연명의 시에 이르기를, “젊은 시절은 두 번 오지 않고, 하루에 새벽은 두 번 오지 않는다. 때를 놓치지 말고 힘써라. 세월은 사람을 기다려 주지 않는다.”","c":"권학편(勸學篇)","src":392},{"o":"荀子曰：「不積跬步，無以至千里。不積小流，無以成江河。」","e":"순자왈: “부적규보, 무이지천리. 부적소류, 무이성강하.”","p":"순자가 말하였다. “반걸음이라도 쌓지 않으면 천 리에 이를 수 없고, 작은 물줄기가 모이지 않으면 강과 바다를 이룰 수 없다.”","c":"권학편(勸學篇)","src":393},{"o":"《景行錄》云：「賓客不來門戶俗，詩書不教子孫愚。」","e":"경행록운: “빈객불래문호속, 시서불교자손우.”","p":"『경행록』에 이르기를, “손님이 찾아오지 않으면 집안이 속되어지고, 시와 글을 가르치지 않으면 자손이 어리석어진다.”","c":"훈자편(訓子篇)","src":397},{"o":"莊子曰：「事雖小，不作不成；子雖賢，不教不明。」","e":"장자왈: “사수소, 부작불성; 자수현, 불교불명.”","p":"장자가 말하였다. “일이 작더라도 하지 않으면 이루지 못하고, 자식이 똑똑하더라도 가르치지 않으면 밝아지지 않는다.”","c":"훈자편(訓子篇)","src":398},{"o":"《漢書》曰：「黃金滿盈，不如教子一經；賜子千金，不如教子一藝。」","e":"한서왈: “황금만영, 불여교자일경; 사자천금, 불여교자일예.”","p":"『한서』에 이르기를, “황금이 상자에 가득해도 자식에게 경서 한 권 가르치는 것만 못하고, 자식에게 천금을 주어도 기술 하나 가르치는 것만 못하다.”","c":"훈자편(訓子篇)","src":399},{"o":"至樂莫如讀書，至要莫如教子。","e":"지락막여독서, 지요막여교자.","p":"가장 큰 즐거움은 책 읽는 것만 한 것이 없고, 가장 중요한 일은 자식 가르치는 것만 한 것이 없다.","c":"훈자편(訓子篇)","src":400},{"o":"嚴父出孝子，嚴母出巧女。","e":"엄부출효자, 엄모출교녀.","p":"엄한 아버지가 효자를 길러 내고, 엄한 어머니가 솜씨 좋은 딸을 길러 낸다.","c":"훈자편(訓子篇)","src":405},{"o":"人皆愛珠玉，我愛子孫賢。","e":"인개애주옥, 아애자손현.","p":"사람들은 모두 구슬과 옥을 아끼지만, 나는 자손이 어진 것을 아낀다.","c":"훈자편(訓子篇)","src":409},{"o":"家和貧也好，不義富如何？但存一子孝，何用子孫多？","e":"가화빈야호, 불의부여하? 단존일자효, 하용자손다?","p":"집안이 화목하면 가난해도 좋지만, 의롭지 않으면 부자인들 무엇하리. 효도하는 자식 하나만 있으면 자손이 많은들 무엇하리.","c":"성심편(省心篇)","src":416},{"o":"得寵思辱，居安慮危。","e":"득총사욕, 거안려위.","p":"총애를 받을 때 욕됨을 생각하고, 편안할 때 위태로움을 염려하라.","c":"성심편(省心篇)","src":420},{"o":"欲知未來，先察已往。","e":"욕지미래, 선찰이왕.","p":"앞날을 알고 싶거든 먼저 지난 일을 살펴보라.","c":"성심편(省心篇)","src":428},{"o":"天有不測風雲，人有旦夕禍福。","e":"천유불측풍운, 인유단석화복.","p":"하늘에는 예측할 수 없는 바람과 구름이 있고, 사람에게는 아침저녁으로 바뀌는 화와 복이 있다.","c":"성심편(省心篇)","src":432},{"o":"疑人莫用，用人莫疑。","e":"의인막용, 용인막의.","p":"의심스러운 사람은 쓰지 말고, 쓴 사람은 의심하지 말라.","c":"성심편(省心篇)","src":442},{"o":"《家語》云：「安不可忘危，治不可忘亂。」","e":"가어운: “안불가망위, 치불가망란.”","p":"『공자가어』에 이르기를, “편안할 때 위태로움을 잊지 말고, 잘 다스려질 때 어지러움을 잊지 말라.”","c":"성심편(省心篇)","src":445},{"o":"畫虎畫皮難畫骨，知人知面不知心。","e":"화호화피난화골, 지인지면부지심.","p":"범을 그릴 때 가죽은 그려도 뼈는 그리기 어렵고, 사람을 알 때 얼굴은 알아도 마음은 알지 못한다.","c":"성심편(省心篇)","src":449},{"o":"太公曰：「凡人不可貌相，海水不可斗量。」","e":"태공왈: “범인불가모상, 해수불가두량.”","p":"태공이 말하였다. “사람은 겉모습으로 헤아릴 수 없고, 바닷물은 말로 될 수 없다.”","c":"성심편(省心篇)","src":452},{"o":"不經一事，不長一智。","e":"불경일사, 부장일지.","p":"한 가지 일을 겪지 않으면 한 가지 지혜가 자라지 않는다.","c":"성심편(省心篇)","src":473},{"o":"來說是非者，便是是非人。","e":"내설시비자, 변시시비인.","p":"남의 시비를 말하러 오는 사람이 바로 시비를 만드는 사람이다.","c":"성심편(省心篇)","src":475},{"o":"孟子曰：「得道者多助，失道者寡助。」","e":"맹자왈: “득도자다조, 실도자과조.”","p":"맹자가 말하였다. “도리를 얻은 사람은 돕는 이가 많고, 도리를 잃은 사람은 돕는 이가 적다.”","c":"성심편(省心篇)","src":482},{"o":"黃金千里未為貴，得人一語勝千金。","e":"황금천리미위귀, 득인일어승천금.","p":"황금 천 냥도 귀한 것이 아니다. 남에게서 좋은 말 한마디 듣는 것이 천금보다 낫다.","c":"성심편(省心篇)","src":489},{"o":"求人不如求己，能管不如能推。","e":"구인불여구기, 능관불여능추.","p":"남에게 구하는 것은 나에게 구하는 것만 못하고, 이것저것 맡아 하는 것은 사양할 줄 아는 것만 못하다.","c":"성심편(省心篇)","src":492},{"o":"知事少時煩惱少，識人多處是非多。","e":"지사소시번뇌소, 식인다처시비다.","p":"아는 일이 적을 때는 번뇌도 적고, 아는 사람이 많은 곳에는 시비도 많다.","c":"성심편(省心篇)","src":495},{"o":"大富由天，小富由勤。","e":"대부유천, 소부유근.","p":"큰 부자는 하늘이 내고, 작은 부자는 부지런함이 만든다.","c":"성심편(省心篇)","src":539},{"o":"《家語》云：「水至清則無魚，人至察則無徒。」","e":"가어운: “수지청즉무어, 인지찰즉무도.”","p":"『공자가어』에 이르기를, “물이 너무 맑으면 고기가 없고, 사람이 너무 따지면 따르는 무리가 없다.”","c":"성심편(省心篇)","src":564},{"o":"輕諾者信必寡，面譽者背必非。","e":"경낙자신필과, 면예자배필비.","p":"쉽게 승낙하는 사람은 믿음이 적고, 앞에서 칭찬하는 사람은 뒤에서 헐뜯는다.","c":"성심편(省心篇)","src":574},{"o":"《景行錄》云：「器滿則溢，人滿則喪。」","e":"경행록운: “기만즉일, 인만즉상.”","p":"『경행록』에 이르기를, “그릇이 차면 넘치고, 사람이 자만하면 잃는다.”","c":"성심편(省心篇)","src":630},{"o":"尺璧非寶，寸陰是競。","e":"척벽비보, 촌음시경.","p":"한 자 되는 구슬이 보배가 아니요, 한 치의 시간을 다투어 아껴야 한다.","c":"성심편(省心篇)","src":632},{"o":"孟子曰：「天時不如地利，地利不如人和。」","e":"맹자왈: “천시불여지리, 지리불여인화.”","p":"맹자가 말하였다. “하늘의 때는 땅의 이로움만 못하고, 땅의 이로움은 사람의 화합만 못하다.”","c":"성심편(省心篇)","src":638},{"o":"遠水難救近火，遠親不如近鄰。","e":"원수난구근화, 원친불여근린.","p":"먼 데 물로는 가까운 불을 끄기 어렵고, 먼 친척은 가까운 이웃만 못하다.","c":"성심편(省心篇)","src":639},{"o":"著意栽花花不發，無心插柳柳成陰。","e":"착의재화화불발, 무심삽류류성음.","p":"애써 꽃을 심어도 꽃은 피지 않고, 무심코 꽂은 버들가지는 그늘을 이룬다.","c":"성심편(省心篇)","src":651},{"o":"《性理書》云：「接物之要：己所不欲，勿施於人；行有不得，反求諸己。」","e":"성리서운: “접물지요: 기소불욕, 물시어인; 행유부득, 반구제기.”","p":"『성리서』에 이르기를, “사람을 대하는 요점은 이렇다. 내가 원하지 않는 일은 남에게 시키지 말고, 일이 뜻대로 되지 않으면 돌이켜 나에게서 원인을 찾아라.”","c":"성심편(省心篇)","src":657},{"o":"《景行錄》云：「為政之要，曰公與清。成家之要，曰儉與勤。」","e":"경행록운: “위정지요, 왈공여청. 성가지요, 왈검여근.”","p":"『경행록』에 이르기를, “나라를 다스리는 요점은 공정함과 청렴함이요, 집안을 일으키는 요점은 검소함과 부지런함이다.”","c":"입교편(立教篇)","src":661},{"o":"勤者富之本，儉者富之源。","e":"근자부지본, 검자부지원.","p":"부지런함은 부유함의 뿌리요, 검소함은 부유함의 샘이다.","c":"입교편(立教篇)","src":663},{"o":"《性理書》云：「五教之目：父子有親，君臣有義，夫婦有別，長幼有序，朋友有信。」","e":"성리서운: “오교지목: 부자유친, 군신유의, 부부유별, 장유유서, 붕우유신.”","p":"『성리서』에 이르기를, “다섯 가지 가르침은 이렇다. 부모와 자식은 친함이 있고, 임금과 신하는 의리가 있고, 남편과 아내는 분별이 있고, 어른과 아이는 차례가 있고, 벗과 벗은 믿음이 있다.”","c":"입교편(立教篇)","src":665},{"o":"《童蒙訓》曰：「當官之法，唯有三事：曰清，曰慎，曰勤。知此三者，則知所以持身矣。」","e":"동몽훈왈: “당관지법, 유유삼사: 왈청, 왈신, 왈근. 지차삼자, 즉지소이지신의.”","p":"『동몽훈』에 이르기를, “벼슬하는 법에는 오직 세 가지가 있으니, 청렴함과 삼감과 부지런함이다. 이 세 가지를 알면 몸가짐을 아는 것이다.”","c":"치정편(治政篇)","src":679},{"o":"其身正，不令而行。其身不正，雖令不從。","e":"기신정, 불령이행. 기신부정, 수령부종.","p":"자신이 바르면 시키지 않아도 행해지고, 자신이 바르지 않으면 시켜도 따르지 않는다.","c":"치정편(治政篇)","src":689},{"o":"勤儉常豐，至老不窮。","e":"근검상풍, 지로불궁.","p":"부지런하고 검소하면 늘 풍족하여 늙도록 궁하지 않다.","c":"치가편(治家篇)","src":703},{"o":"有錢常備無錢日，安樂須防病患時。","e":"유전상비무전일, 안락수방병환시.","p":"돈이 있을 때 늘 돈 없을 날을 대비하고, 편안할 때 반드시 병들 때를 대비하라.","c":"치가편(治家篇)","src":705},{"o":"子孝雙親樂，家和萬事成。","e":"자효쌍친락, 가화만사성.","p":"자식이 효도하면 두 어버이가 즐겁고, 집안이 화목하면 모든 일이 이루어진다.","c":"치가편(治家篇)","src":711},{"o":"莊子云：「兄弟為手足，夫婦為衣服。衣服破時更得新，手足斷時難再續。」","e":"장자운: “형제위수족, 부부위의복. 의복파시갱득신, 수족단시난재속.”","p":"장자가 말하였다. “형제는 손발과 같고, 아내는 옷과 같다. 옷은 해지면 새로 얻을 수 있지만, 손발은 끊어지면 다시 잇기 어렵다.”","c":"안의편(安義篇)","src":724},{"o":"蘇東坡云：「富不親兮貧不疏，此是人間大丈夫。富則進兮貧則退，此是人間真小輩。」","e":"소동파운: “부불친혜빈불소, 차시인간대장부. 부즉진혜빈즉퇴, 차시인간진소배.”","p":"소동파가 말하였다. “부자라고 가까이하지 않고 가난하다고 멀리하지 않는 이가 세상의 대장부요, 부자면 다가가고 가난하면 물러나는 이는 세상의 참 소인배다.”","c":"안의편(安義篇)","src":725},{"o":"有子曰：「禮之用，和為貴。」","e":"유자왈: “예지용, 화위귀.”","p":"유자가 말하였다. “예를 행할 때는 조화를 이루는 것이 가장 귀하다.”","c":"준례편(遵禮篇)","src":733},{"o":"若要人重我，無過我重人。","e":"약요인중아, 무과아중인.","p":"남이 나를 존중해 주기를 바란다면, 내가 먼저 남을 존중하는 것보다 나은 방법이 없다.","c":"준례편(遵禮篇)","src":742},{"o":"老子曰：「人之有信，如車有輪。」","e":"노자왈: “인지유신, 여거유륜.”","p":"노자가 말하였다. “사람에게 믿음이 있는 것은 수레에 바퀴가 있는 것과 같다.”","c":"존신편(存信篇)","src":755},{"o":"君子一言，快馬一鞭。一言既出，駟馬難追。","e":"군자일언, 쾌마일편. 일언기출, 사마난추.","p":"군자의 말 한마디는 빠른 말에 채찍 한 번과 같다. 한번 내뱉은 말은 네 필 말이 끄는 수레로도 따라잡지 못한다.","c":"존신편(存信篇)","src":756},{"o":"子路無宿諾。","e":"자로무숙낙.","p":"자로는 승낙한 일을 묵혀 두는 법이 없었다.","c":"존신편(存信篇)","src":757},{"o":"子曰：「夫人不言，言必有中。」","e":"자왈: “부인불언, 언필유중.”","p":"공자께서 말씀하셨다. “저 사람은 말을 잘 하지 않지만, 말을 하면 반드시 이치에 맞는다.”","c":"언어편(言語篇)","src":762},{"o":"君平曰：「口舌者，禍患之門，滅身之斧也。」","e":"군평왈: “구설자, 화환지문, 멸신지부야.”","p":"군평이 말하였다. “입과 혀는 화와 근심이 드나드는 문이요, 몸을 망치는 도끼다.”","c":"언어편(言語篇)","src":766},{"o":"荀子曰：「與人善言，暖如布帛。傷人之言，深如矛戟。」","e":"순자왈: “여인선언, 난여포백. 상인지언, 심여모극.”","p":"순자가 말하였다. “남에게 건네는 좋은 말은 솜옷처럼 따뜻하고, 남을 해치는 말은 창보다 깊이 찌른다.”","c":"언어편(言語篇)","src":768},{"o":"刀瘡易好，惡語難消。","e":"도창이호, 악어난소.","p":"칼에 베인 상처는 쉽게 낫지만, 모진 말로 입은 상처는 지워지지 않는다.","c":"언어편(言語篇)","src":770},{"o":"口是傷人斧，唇是割舌刀。閉口深藏舌，安身處處牢。","e":"구시상인부, 순시할설도. 폐구심장설, 안신처처뢰.","p":"입은 사람을 해치는 도끼요, 혀는 몸을 베는 칼이다. 입을 다물고 혀를 깊이 감추면 어디서든 몸이 편안하다.","c":"언어편(言語篇)","src":772},{"o":"《論語》云：「一言可以興邦，一言可以喪邦。」","e":"논어운: “일언가이흥방, 일언가이상방.”","p":"『논어』에 이르기를, “말 한마디로 나라를 일으킬 수도 있고, 말 한마디로 나라를 잃을 수도 있다.”","c":"언어편(言語篇)","src":774},{"o":"酒逢知己千鐘少，話不投機半句多。","e":"주봉지기천종소, 화불투기반구다.","p":"술은 마음 맞는 벗을 만나면 천 잔도 적고, 말은 뜻이 맞지 않으면 반 마디도 많다.","c":"언어편(言語篇)","src":778},{"o":"與好人交者，如蘭蕙之香，一家種之，兩家皆香。與惡人交者，如抱子上牆，一人失腳，兩人遭殃。","e":"여호인교자, 여란혜지향, 일가종지, 양가개향. 여악인교자, 여포자상장, 일인실각, 양인조앙.","p":"“착한 사람과 사귀는 것은 난초 향기와 같아서 한 집에서 심어도 두 집이 다 향기롭다. 악한 사람과 사귀는 것은 아이를 안고 담에 오르는 것과 같아서 한 사람이 발을 헛디디면 두 사람이 다 다친다.”","c":"교우편(交友篇)","src":789},{"o":"相識滿天下，知心能幾人？","e":"상식만천하, 지심능기인?","p":"얼굴 아는 사람은 세상에 가득하지만, 마음을 아는 사람은 몇이나 되겠는가?","c":"교우편(交友篇)","src":799},{"o":"古人結交惟結心，今人結交惟結面。","e":"고인결교유결심, 금인결교유결면.","p":"옛사람은 마음으로 사귀었는데, 요즘 사람은 얼굴로만 사귄다.","c":"교우편(交友篇)","src":801},{"o":"宋弘曰：「糟糠之妻不下堂，貧賤之交不可忘。」","e":"송홍왈: “조강지처불하당, 빈천지교불가망.”","p":"송홍이 말하였다. “가난할 때 함께 고생한 아내는 내쫓지 않고, 가난하고 천할 때 사귄 벗은 잊지 않는다.”","c":"교우편(交友篇)","src":802},{"o":"酒食弟兄千個有，急難之時一個無。","e":"주식제형천개유, 급난지시일개무.","p":"술 마시고 밥 먹을 때 형님 아우 하는 이는 천 명이나 되지만, 급하고 어려울 때는 한 명도 없다.","c":"교우편(交友篇)","src":804},{"o":"君子之交淡如水，小人之交甜似蜜。","e":"군자지교담여수, 소인지교첨사밀.","p":"군자의 사귐은 물처럼 담박하고, 소인의 사귐은 꿀처럼 달다.","c":"교우편(交友篇)","src":806},{"o":"路遙知馬力，事久見人心。","e":"노요지마력, 사구견인심.","p":"길이 멀어야 말의 힘을 알고, 일을 오래 겪어야 사람의 마음을 안다.","c":"교우편(交友篇)","src":809}],"cg":[{"o":"棲守道德者，寂寞一時；依附權勢者，淒涼萬古。故達人觀物外之物，思身後之身，寧受一時之寂寞，毋取萬古之淒涼。","e":"서수도덕자, 적막일시; 의부권세자, 처량만고. 고달인관물외지물, 사신후지신, 영수일시지적막, 무취만고지처량.","p":"도덕을 지키며 사는 사람은 한때 쓸쓸하지만, 권세에 빌붙는 사람은 만고에 처량하다. 그러므로 통달한 사람은 눈앞의 것 너머를 보고 죽은 뒤의 자신을 생각하여, 차라리 한때의 쓸쓸함을 받을지언정 만고의 처량함을 택하지 않는다.","c":"전집 제1장(前集 第1)","src":0},{"o":"涉世淺，點染亦淺；歷事深，機械亦深。故君子與其練達，不若樸魯；與其曲謹，不若疏狂。","e":"섭세천, 점염역천; 역사심, 기계역심. 고군자여기련달, 불약박로; 여기곡근, 불약소광.","p":"세상 경험이 얕으면 물드는 것도 얕고, 겪은 일이 깊으면 꾀도 깊어진다. 그러므로 군자는 약삭빠르기보다 차라리 소박하고 투박한 것이 낫고, 지나치게 조심스럽기보다 차라리 거리낌 없는 것이 낫다.","c":"전집 제2장(前集 第2)","src":1},{"o":"君子之心事，天青日白，不可使人不知。\n君子之才華，玉韞珠藏，不可使人易知。","e":"군자지심사, 천청일백, 불가사인부지.\n군자지재화, 옥온주장, 불가사인이지.","p":"군자의 마음은 푸른 하늘에 밝은 해처럼 남이 모르게 해서는 안 되고, 군자의 재주는 옥을 싸 두고 구슬을 감추듯 남이 쉽게 알게 해서는 안 된다.","c":"전집 제3장(前集 第3)","src":2},{"o":"疾風怒雨，禽鳥戚戚；\n霽日光風，草木欣欣。\n可見天地不可一日無和氣，人心不可一日無喜神。","e":"질풍노우, 금조척척;\n제일광풍, 초목흔흔.\n가견천지불가일일무화기, 인심불가일일무희신.","p":"모진 바람과 성난 비에는 새들도 근심하고, 갠 날 맑은 바람에는 풀과 나무도 기뻐한다. 하늘과 땅에 하루도 화기가 없어서는 안 되듯, 사람 마음에도 하루도 기쁜 기운이 없어서는 안 된다.","c":"전집 제6장(前集 第6)","src":5},{"o":"醲肥辛甘非真味，真味只是淡；\n神奇卓異非至人，至人只是常。","e":"농비신감비진미, 진미지시담;\n신기탁이비지인, 지인지시상.","p":"진하고 기름지고 맵고 단 것은 참맛이 아니다. 참맛은 그저 담백할 뿐이다. 신기하고 유별난 사람은 지극한 사람이 아니다. 지극한 사람은 그저 평범할 뿐이다.","c":"전집 제7장(前集 第7)","src":6},{"o":"天地寂然不動，而氣機無一息少停；\n日月晝夜奔馳，而貞明則萬古不易。\n故君子閒時要有喫緊的心思，忙處要有悠閒的趣味。","e":"천지적연부동, 이기기무일식소정;\n일월주야분치, 이정명즉만고불역.\n고군자한시요유끽긴적심사, 망처요유유한적취미.","p":"하늘과 땅은 고요히 움직이지 않는 듯해도 그 기운은 한순간도 쉬지 않고, 해와 달은 밤낮으로 달려도 그 밝음은 만고에 변하지 않는다. 그러므로 군자는 한가할 때 다급한 일에 대비하는 마음을 지니고, 바쁠 때 여유로운 멋을 지녀야 한다.","c":"전집 제8장(前集 第8)","src":7},{"o":"恩裏由來生害，故快意時，須早回頭；\n敗後或反成功，故拂心處，莫便放手。","e":"은리유래생해, 고쾌의시, 수조회두;\n패후혹반성공, 고불심처, 막변방수.","p":"은혜 속에서 원래 해로움이 생기니 뜻대로 될 때 일찍 돌아보고, 실패한 뒤에 도리어 성공하기도 하니 뜻대로 안 될 때 함부로 손을 놓지 말라.","c":"전집 제10장(前集 第10)","src":9},{"o":"面前的田地要放得寬，使人無不平之歎；\n身後的惠澤要流得長，使人有不匱之思。","e":"면전적전지요방득관, 사인무불평지탄;\n신후적혜택요류득장, 사인유불궤지사.","p":"살아서 내 앞의 터는 넓게 열어 두어 남들이 불평하지 않게 하고, 죽은 뒤의 은덕은 길게 흐르게 하여 남들이 모자람 없이 그리워하게 하라.","c":"전집 제12장(前集 第12)","src":11},{"o":"徑路窄處，留一步與人行；滋味濃的，減三分讓人嗜。此是涉世一極安樂法。","e":"경로착처, 유일보여인행; 자미농적, 감삼분양인기. 차시섭세일극안락법.","p":"좁은 길에서는 한 걸음 물러서서 남이 먼저 지나가게 하고, 맛있는 음식은 삼 할을 덜어 남에게 맛보게 하라. 이것이 세상을 살아가는 가장 편안한 방법이다.","c":"전집 제13장(前集 第13)","src":12},{"o":"交友須帶三分俠氣，做人要存一點素心。","e":"교우수대삼분협기, 주인요존일점소심.","p":"벗을 사귈 때는 의리 있는 기개를 조금 지니고, 사람 노릇을 할 때는 순수한 마음을 한 점 간직하라.","c":"전집 제15장(前集 第15)","src":14},{"o":"寵利毋居人前，德業毋落人後；\n受享毋踰分外，修為毋減分中。","e":"총리무거인전, 덕업무락인후;\n수향무유분외, 수위무감분중.","p":"총애와 이익은 남보다 앞서려 하지 말고, 덕을 쌓는 일은 남보다 뒤지지 말라. 누리는 것은 분수를 넘지 말고, 닦는 것은 분수보다 줄이지 말라.","c":"전집 제16장(前集 第16)","src":15},{"o":"處世讓一步為高，退步即進步的張本；\n待人寬一分是福，利人實利己的根基。","e":"처세양일보위고, 퇴보즉진보적장본;\n대인관일분시복, 이인실리기적근기.","p":"세상을 살 때 한 걸음 양보하는 것이 높은 길이니, 물러서는 것이 곧 나아가는 바탕이다. 사람을 대할 때 조금 너그러운 것이 복이니, 남을 이롭게 하는 것이 실은 나를 이롭게 하는 뿌리다.","c":"전집 제17장(前集 第17)","src":16},{"o":"蓋世功勞，當不得一個矜字；\n彌天罪過，當不得一個悔字。","e":"개세공로, 당부득일개긍자;\n미천죄과, 당부득일개회자.","p":"세상을 덮을 만한 큰 공도 ‘자랑할 긍(矜)’ 한 글자를 당해 내지 못하고, 하늘에 가득한 큰 죄도 ‘뉘우칠 회(悔)’ 한 글자를 당해 내지 못한다.","c":"전집 제18장(前集 第18)","src":17},{"o":"完名美節，不宜獨任，分些與人，可以遠害全身；\n辱行污名，不宜全推，引些歸己，可以韜光養德。","e":"완명미절, 불의독임, 분사여인, 가이원해전신;\n욕행오명, 불의전추, 인사귀기, 가이도광양덕.","p":"온전한 명예와 아름다운 절개는 혼자 차지하지 말고 남에게도 나누어 주어야 해를 멀리하고 몸을 온전히 할 수 있다. 욕된 행실과 더러운 이름은 남에게만 미루지 말고 조금은 내게로 끌어와야 빛을 감추고 덕을 기를 수 있다.","c":"전집 제19장(前集 第19)","src":18},{"o":"攻人之惡，毋太嚴，要思其堪受；\n教人之善，毋過高，當使其可從。","e":"공인지악, 무태엄, 요사기감수;\n교인지선, 무과고, 당사기가종.","p":"남의 잘못을 꾸짖을 때는 너무 엄하게 하지 말고 그가 받아들일 수 있을지 생각하라. 남에게 선을 가르칠 때는 너무 높게 하지 말고 그가 따를 수 있게 하라.","c":"전집 제23장(前集 第23)","src":22},{"o":"糞蟲至穢，變為蟬而飲露於秋風；\n腐草無光，化為螢而耀采於夏月。\n固知潔常自污出，明每從晦生也。","e":"분충지예, 변위선이음로어추풍;\n부초무광, 화위형이요채어하월.\n고지결상자오출, 명매종회생야.","p":"굼벵이는 더없이 더럽지만 매미가 되어 가을바람에 이슬을 마시고, 썩은 풀은 빛이 없지만 반딧불이 되어 여름밤을 밝힌다. 깨끗함은 늘 더러움에서 나오고 밝음은 늘 어둠에서 생긴다는 것을 알겠다.","c":"전집 제24장(前集 第24)","src":23},{"o":"處世不必邀功，無過便是功；\n與人不求感德，無怨便是德。","e":"처세불필요공, 무과변시공;\n여인불구감덕, 무원변시덕.","p":"세상을 살면서 굳이 공을 세우려 하지 말라. 허물이 없는 것이 곧 공이다. 남에게 베풀고 고마워하기를 바라지 말라. 원망이 없는 것이 곧 덕이다.","c":"전집 제28장(前集 第28)","src":27},{"o":"人至事窮勢蹙，宜原其初心；\n士當行滿功成，要觀其末路。","e":"인지사궁세축, 의원기초심;\n사당행만공성, 요관기말로.","p":"일이 막히고 형편이 궁해진 사람은 그 처음 마음을 헤아려 보고, 공을 이루고 뜻을 채운 사람은 그 마지막 길을 지켜보아야 한다.","c":"전집 제30장(前集 第30)","src":29},{"o":"人情反復，世路崎嶇。\n行不去處，須知退一步之法；\n行得去處，務加讓三分之功。","e":"인정반복, 세로기구.\n행불거처, 수지퇴일보지법;\n행득거처, 무가양삼분지공.","p":"인정은 이랬다저랬다 하고 세상길은 험하다. 가기 어려운 곳에서는 한 걸음 물러서는 법을 알아야 하고, 갈 수 있는 곳에서도 삼 할은 양보하는 공을 들여야 한다.","c":"전집 제35장(前集 第35)","src":34},{"o":"待小人，不難於嚴，而難於不惡；\n待君子，不難於恭，而難於有禮。","e":"대소인, 불난어엄, 이난어불오;\n대군자, 불난어공, 이난어유례.","p":"소인을 대할 때 엄하기는 어렵지 않으나 미워하지 않기가 어렵고, 군자를 대할 때 공손하기는 어렵지 않으나 예를 다하기가 어렵다.","c":"전집 제36장(前集 第36)","src":35},{"o":"福莫福於少事，禍莫禍於多心。\n唯苦事者，方知少事之為福；\n唯平心者，始知多心之為禍。","e":"복막복어소사, 화막화어다심.\n유고사자, 방지소사지위복;\n유평심자, 시지다심지위화.","p":"일이 적은 것보다 더 큰 복은 없고, 마음이 많은 것보다 더 큰 화는 없다. 일에 시달려 본 사람이라야 일이 적은 것이 복인 줄 알고, 마음이 평온한 사람이라야 마음 많은 것이 화인 줄 안다.","c":"전집 제50장(前集 第50)","src":49},{"o":"我有功於人不可念，而過則不可不念；\n人有恩於我不可忘，而怨則不可不忘。","e":"아유공어인불가념, 이과즉불가불념;\n인유은어아불가망, 이원즉불가불망.","p":"내가 남에게 베푼 공은 마음에 두지 말되 내 잘못은 마음에 두어야 하고, 남이 내게 베푼 은혜는 잊지 말되 원망은 잊어야 한다.","c":"전집 제52장(前集 第52)","src":51},{"o":"奢者富而不足，何如儉者貧而有餘；\n能者勞而府怨，何如拙者逸而全真。","e":"사자부이부족, 하여검자빈이유여;\n능자로이부원, 하여졸자일이전진.","p":"사치하는 사람은 부유해도 늘 모자라니, 검소한 사람이 가난해도 넉넉한 것만 하겠는가. 재주 있는 사람은 애쓰고도 원망을 사니, 서툰 사람이 편안하게 참된 본성을 지키는 것만 하겠는가.","c":"전집 제56장(前集 第56)","src":55},{"o":"苦心中，常得悅心之趣；\n得意時，須防失意之悲。","e":"고심중, 상득열심지취;\n득의시, 수방실의지비.","p":"괴로운 가운데 늘 마음 기쁜 멋을 얻고, 뜻대로 될 때 뜻을 잃는 슬픔을 미리 막아야 한다.","c":"전집 제59장(前集 第59)","src":58},{"o":"真廉無廉名，圖名者正所以為貪；\n大巧無巧術，用術者乃所以為拙。","e":"진렴무렴명, 도명자정소이위탐;\n대교무교술, 용술자내소이위졸.","p":"참으로 청렴한 사람에게는 청렴하다는 이름이 없으니, 이름을 노리는 것이 바로 탐욕이다. 참으로 솜씨 있는 사람에게는 잔재주가 없으니, 잔재주를 부리는 것이 바로 서툰 것이다.","c":"전집 제63장(前集 第63)","src":62},{"o":"欹器以滿覆，撲滿以空全。故君子寧居無不居有，寧處缺不處完。","e":"의기이만복, 박만이공전. 고군자녕거무불거유, 영처결불처완.","p":"기울어지는 그릇은 가득 차면 엎어지고, 돈 넣는 벙어리 저금통은 비어 있어야 온전하다. 그러므로 군자는 차라리 없는 쪽에 있을지언정 있는 쪽에 있지 않고, 차라리 모자란 쪽에 있을지언정 가득한 쪽에 있지 않는다.","c":"전집 제64장(前集 第64)","src":63},{"o":"心體光明，暗室中有青天；\n念頭暗昧，白日下生厲鬼。","e":"심체광명, 암실중유청천;\n염두암매, 백일하생려귀.","p":"마음이 밝으면 어두운 방 안에도 푸른 하늘이 있고, 생각이 어두우면 대낮에도 사나운 귀신이 생긴다.","c":"전집 제66장(前集 第66)","src":65},{"o":"為惡而畏人知，惡中猶有善路；\n為善而急人知，善處即是惡根。","e":"위악이외인지, 악중유유선로;\n위선이급인지, 선처즉시악근.","p":"나쁜 짓을 하고 남이 알까 두려워하면 그 악 속에도 아직 선으로 가는 길이 있고, 착한 일을 하고 남이 알아주기를 서두르면 그 선이 곧 악의 뿌리가 된다.","c":"전집 제68장(前集 第68)","src":67},{"o":"福不可邀，養喜神，以為召福之本而已；\n禍不可避，去殺機，以為遠禍之方而已。","e":"복불가요, 양희신, 이위소복지본이이;\n화불가피, 거살기, 이위원화지방이이.","p":"복은 억지로 불러올 수 없으니 기쁜 마음을 길러 복을 부르는 근본으로 삼을 뿐이고, 화는 억지로 피할 수 없으니 남을 해치려는 마음을 버려 화를 멀리하는 방법으로 삼을 뿐이다.","c":"전집 제71장(前集 第71)","src":70},{"o":"天地之氣，暖則生，寒則殺。故性氣清冷者，受享亦涼薄。唯和氣熱心之人，其福亦厚，其澤亦長。","e":"천지지기, 난즉생, 한즉살. 고성기청랭자, 수향역량박. 유화기열심지인, 기복역후, 기택역장.","p":"하늘과 땅의 기운은 따뜻하면 살리고 차가우면 죽인다. 그러므로 성품이 차가운 사람은 누리는 복도 박하고, 온화하고 따뜻한 마음을 지닌 사람이라야 복도 두텁고 은택도 길다.","c":"전집 제73장(前集 第73)","src":72},{"o":"天理路上甚寬，稍游心，胸中便覺高明廣大；\n人欲路上甚窄，纔寄跡，眼前俱是荊棘泥塗。","e":"천리로상심관, 초유심, 흉중변각고명광대;\n인욕로상심착, 재기적, 안전구시형극니도.","p":"하늘의 이치를 따르는 길은 매우 넓어서 조금만 마음을 두어도 가슴이 탁 트이고, 사람의 욕심을 따르는 길은 매우 좁아서 발을 들이자마자 눈앞이 온통 가시밭과 진흙탕이다.","c":"전집 제74장(前集 第74)","src":73},{"o":"一苦一樂相磨鍊，鍊極而成福者，其福始久；\n一疑一信相參勘，勘極而成知者，其知始真。","e":"일고일락상마련, 연극이성복자, 기복시구;\n일의일신상참감, 감극이성지자, 기지시진.","p":"괴로움과 즐거움을 번갈아 겪으며 단련하여 얻은 복이라야 그 복이 오래가고, 의심과 믿음을 번갈아 따져 보아 얻은 앎이라야 그 앎이 참되다.","c":"전집 제75장(前集 第75)","src":74},{"o":"心不可不虛，虛則義理來居；\n心不可不實，實則物欲不入。","e":"심불가불허, 허즉의리래거;\n심불가불실, 실즉물욕불입.","p":"마음은 비워 두어야 하니, 비어 있어야 바른 이치가 들어와 산다. 마음은 채워 두어야 하니, 차 있어야 욕심이 들어오지 못한다.","c":"전집 제76장(前集 第76)","src":75},{"o":"地之穢者多生物，水之清者常無魚。故君子當存含垢納污之量，不可持好潔獨行之操。","e":"지지예자다생물, 수지청자상무어. 고군자당존함구납오지량, 불가지호결독행지조.","p":"더러운 땅에는 생물이 많이 자라고, 너무 맑은 물에는 고기가 살지 않는다. 그러므로 군자는 더러움도 받아들이는 도량을 지녀야지, 깨끗한 것만 좋아하여 혼자 고고한 지조를 고집해서는 안 된다.","c":"전집 제77장(前集 第77)","src":76},{"o":"圖未就之功，不如保已成之業；\n悔既往之失，不如防將來之非。","e":"도미취지공, 불여보이성지업;\n회기왕지실, 불여방장래지비.","p":"아직 이루지 못한 공을 꾀하는 것은 이미 이룬 일을 지키는 것만 못하고, 지난 잘못을 뉘우치는 것은 앞으로의 잘못을 막는 것만 못하다.","c":"전집 제81장(前集 第81)","src":80},{"o":"氣象要高曠，而不可疏狂；\n心思要縝密，而不可瑣屑；\n趣味要沖澹，而不可偏枯；\n操守要嚴明，而不可激烈。","e":"기상요고광, 이불가소광;\n심사요진밀, 이불가쇄설;\n취미요충담, 이불가편고;\n조수요엄명, 이불가격렬.","p":"기상은 높고 넓어야 하되 거칠어서는 안 되고, 생각은 꼼꼼해야 하되 자질구레해서는 안 되며, 멋은 담백해야 하되 메말라서는 안 되고, 지조는 엄정해야 하되 과격해서는 안 된다.","c":"전집 제82장(前集 第82)","src":81},{"o":"風來疏竹，風過而竹不留聲；\n雁度寒潭，雁去而潭不留影。\n故君子事來而心始現，事去而心隨空。","e":"풍래소죽, 풍과이죽불류성;\n안도한담, 안거이담불류영.\n고군자사래이심시현, 사거이심수공.","p":"바람이 성긴 대숲을 지나가도 바람이 가고 나면 대숲은 소리를 남기지 않고, 기러기가 차가운 못을 건너가도 기러기가 가고 나면 못은 그림자를 남기지 않는다. 그러므로 군자는 일이 오면 마음이 비로소 드러나고, 일이 가면 마음도 따라서 빈다.","c":"전집 제83장(前集 第83)","src":82},{"o":"閒中不放過，忙處有受用；\n靜中不落空，動處有受用；\n暗中不欺隱，明處有受用。","e":"한중불방과, 망처유수용;\n정중불락공, 동처유수용;\n암중불기은, 명처유수용.","p":"한가할 때 헛되이 보내지 않으면 바쁠 때 쓸모가 있고, 고요할 때 멍하니 있지 않으면 움직일 때 쓸모가 있으며, 남이 안 볼 때 속이지 않으면 드러난 자리에서 쓸모가 있다.","c":"전집 제86장(前集 第86)","src":85},{"o":"平民肯種德施惠，便是無位的公相；\n士夫徒貪權市寵，竟成有爵的乞人。","e":"평민긍종덕시혜, 변시무위적공상;\n사부도탐권시총, 경성유작적걸인.","p":"평범한 백성이라도 덕을 심고 은혜를 베풀면 벼슬 없는 재상이요, 선비와 벼슬아치라도 권세만 탐하고 총애를 사고팔면 벼슬 있는 거지다.","c":"전집 제94장(前集 第94)","src":93},{"o":"君子而詐善，無異小人之肆惡；\n君子而改節，不及小人之自新。","e":"군자이사선, 무이소인지사악;\n군자이개절, 불급소인지자신.","p":"군자가 착한 척 속이는 것은 소인이 함부로 악을 저지르는 것과 다르지 않고, 군자가 지조를 바꾸는 것은 소인이 잘못을 고쳐 새로워지는 것만 못하다.","c":"전집 제96장(前集 第96)","src":95},{"o":"此心常看得圓滿，天下自無缺憾之世界；\n此心常放得寬平，天下自無險側之人情。","e":"차심상간득원만, 천하자무결감지세계;\n차심상방득관평, 천하자무험측지인정.","p":"이 마음을 늘 둥글고 넉넉하게 보면 세상에 저절로 모자란 곳이 없고, 이 마음을 늘 너그럽고 평평하게 두면 세상에 저절로 험한 인정이 없다.","c":"전집 제98장(前集 第98)","src":97},{"o":"居逆境中，周身皆鍼砭藥石，砥節勵行而不覺；\n處順境內，滿前盡兵刃戈矛，銷膏糜骨而不知。","e":"거역경중, 주신개침폄약석, 지절려행이불각;\n처순경내, 만전진병인과모, 소고미골이부지.","p":"역경 속에 있을 때는 몸 둘레가 모두 침과 약이어서 절개와 행실이 갈고 닦이는 줄도 모르고, 순경 속에 있을 때는 눈앞이 온통 칼과 창이어서 기름이 녹고 뼈가 깎이는 줄도 모른다.","c":"전집 제100장(前集 第100)","src":99},{"o":"文章做到極處，無有他奇，只是恰好；\n人品做到極處，無有他異，只是本然。","e":"문장주도극처, 무유타기, 지시흡호;\n인품주도극처, 무유타이, 지시본연.","p":"글이 지극한 경지에 이르면 다른 기이함이 없고 그저 꼭 알맞을 뿐이며, 사람됨이 지극한 경지에 이르면 다른 유별남이 없고 그저 본래 모습 그대로일 뿐이다.","c":"전집 제103장(前集 第103)","src":102},{"o":"爽口之味，皆爛腸腐骨之藥，五分便無殃；\n快心之事，悉敗身喪德之媒，五分便無悔。","e":"상구지미, 개란장부골지약, 오분변무앙;\n쾌심지사, 실패신상덕지매, 오분변무회.","p":"입에 맞는 음식은 모두 창자를 상하게 하고 뼈를 썩게 하는 독약이니 절반만 먹으면 탈이 없고, 마음에 상쾌한 일은 모두 몸을 망치고 덕을 잃게 하는 중매쟁이니 절반만 하면 후회가 없다.","c":"전집 제105장(前集 第105)","src":104},{"o":"不責人小過，不發人陰私，不念人舊惡。三者可以養德，亦可以遠害。","e":"불책인소과, 불발인음사, 불념인구악. 삼자가이양덕, 역가이원해.","p":"남의 작은 허물을 꾸짖지 말고, 남의 숨은 비밀을 들추지 말고, 남의 지난 잘못을 마음에 두지 말라. 이 세 가지로 덕을 기를 수 있고 해를 멀리할 수도 있다.","c":"전집 제106장(前集 第106)","src":105},{"o":"怨因德彰，故使人德我，不若德怨之兩忘；\n仇因恩立，故使人知恩，不若恩仇之俱泯。","e":"원인덕창, 고사인덕아, 불약덕원지량망;\n구인은립, 고사인지은, 불약은구지구민.","p":"원망은 덕 때문에 드러나니, 남이 나를 고마워하게 하는 것은 덕과 원망을 함께 잊는 것만 못하다. 원수는 은혜 때문에 생기니, 남이 은혜를 알게 하는 것은 은혜와 원수를 함께 없애는 것만 못하다.","c":"전집 제109장(前集 第109)","src":108},{"o":"老來疾病，都是壯時招的；\n衰後罪孽，都是盛時作的。\n故持盈履滿，君子尤兢兢焉。","e":"노래질병, 도시장시초적;\n쇠후죄얼, 도시성시작적.\n고지영리만, 군자우긍긍언.","p":"늙어서 생기는 병은 모두 젊을 때 불러들인 것이고, 쇠한 뒤의 죄업은 모두 한창때 지은 것이다. 그러므로 가득 차고 넘칠 때 군자는 더욱 조심하고 또 조심한다.","c":"전집 제110장(前集 第110)","src":109},{"o":"市私恩，不如扶公議；\n結新知，不如敦舊好；\n立榮名，不如種隱德；\n尚奇節，不如謹庸行。","e":"시사은, 불여부공의;\n결신지, 불여돈구호;\n입영명, 불여종은덕;\n상기절, 불여근용행.","p":"사사로운 은혜를 파는 것은 공정한 의논을 돕는 것만 못하고, 새 친구를 사귀는 것은 옛 친구와 두터이 지내는 것만 못하며, 화려한 이름을 세우는 것은 남모르는 덕을 심는 것만 못하고, 기이한 절개를 숭상하는 것은 평범한 행실을 삼가는 것만 못하다.","c":"전집 제111장(前集 第111)","src":110},{"o":"曲意而使人喜，不若直躬而使人忌；\n無善而致人譽，不若無惡而致人毀。","e":"곡의이사인희, 불약직궁이사인기;\n무선이치인예, 불약무악이치인훼.","p":"뜻을 굽혀 남을 기쁘게 하는 것은 몸을 곧게 하여 남의 미움을 사는 것만 못하고, 착한 일도 없이 칭찬을 받는 것은 나쁜 일 없이 헐뜯음을 받는 것만 못하다.","c":"전집 제113장(前集 第113)","src":112},{"o":"處父兄骨肉之變，宜從容，不宜激烈；\n遇朋友交遊之失，宜剴切，不宜優游。","e":"처부형골육지변, 의종용, 불의격렬;\n우붕우교유지실, 의개절, 불의우유.","p":"부모 형제나 가족에게 변고가 생기면 침착해야지 격하게 굴어서는 안 되고, 벗의 잘못을 보면 간곡하게 일러 주어야지 우물쭈물 넘어가서는 안 된다.","c":"전집 제114장(前集 第114)","src":113},{"o":"小處不滲漏，暗處不欺隱，末路不怠荒，纔是個真正英雄。","e":"소처불삼루, 암처불기은, 말로불태황, 재시개진정영웅.","p":"작은 곳에서도 새지 않고, 어두운 곳에서도 속이지 않으며, 끝까지 게을러지지 않아야 비로소 참된 영웅이다.","c":"전집 제115장(前集 第115)","src":114},{"o":"千金難結一時之歡，一飯竟致終身之感。蓋愛重反為仇，薄極反成喜也。","e":"천금난결일시지환, 일반경치종신지감. 개애중반위구, 박극반성희야.","p":"천금으로도 한때의 기쁨을 맺기 어려운데, 밥 한 그릇이 평생의 고마움이 되기도 한다. 사랑이 너무 무거우면 도리어 원수가 되고, 아주 박한 것이 도리어 기쁨이 되기도 하는 것이다.","c":"전집 제116장(前集 第116)","src":115},{"o":"驚奇喜異者，無遠大之識；\n苦節獨行者，非恆久之操。","e":"경기희이자, 무원대지식;\n고절독행자, 비항구지조.","p":"신기한 것을 놀라워하고 별난 것을 좋아하는 사람에게는 원대한 식견이 없고, 지나치게 괴로운 절개로 혼자 고고한 사람은 오래가는 지조가 아니다.","c":"전집 제119장(前集 第119)","src":118},{"o":"毋偏信而為奸所欺，\n毋自任而為氣所使。\n毋以己之長而形人之短，\n毋因己之拙而忌人之能。","e":"무편신이위간소기,\n무자임이위기소사.\n무이기지장이형인지단,\n무인기지졸이기인지능.","p":"한쪽 말만 믿다가 간사한 사람에게 속지 말고, 제멋대로 하다가 기분에 휘둘리지 말라. 나의 장점으로 남의 단점을 드러내지 말고, 나의 서투름 때문에 남의 재능을 시기하지 말라.","c":"전집 제121장(前集 第121)","src":120},{"o":"遇沈沈不語之士，且莫輸心；\n見悻悻自好之人，尤須防口。","e":"우침침불어지사, 차막수심;\n견행행자호지인, 우수방구.","p":"말없이 음침한 사람을 만나면 우선 마음을 털어놓지 말고, 성내며 잘난 체하는 사람을 보면 더욱 말을 조심하라.","c":"전집 제123장(前集 第123)","src":122},{"o":"覺人之詐，不形於言；\n受人之侮，不動於色。\n此中有無窮意味，亦有無窮受用。","e":"각인지사, 불형어언;\n수인지모, 부동어색.\n차중유무궁의미, 역유무궁수용.","p":"남이 속이는 줄 알아도 말로 드러내지 않고, 남에게 업신여김을 당해도 얼굴빛을 바꾸지 않는다. 이 가운데 끝없는 의미가 있고 끝없는 쓰임이 있다.","c":"전집 제127장(前集 第127)","src":126},{"o":"橫逆困窮是煅煉豪傑的一副鑪錘，能受其煅煉，則身心交益，不受其煅煉，則身心交損。","e":"횡역곤궁시단련호걸적일부로추, 능수기단련, 즉신심교익, 불수기단련, 즉신심교손.","p":"뜻밖의 어려움과 곤궁은 호걸을 단련하는 풀무와 망치다. 그 단련을 견디면 몸과 마음이 함께 좋아지고, 견디지 못하면 몸과 마음이 함께 상한다.","c":"전집 제128장(前集 第128)","src":127},{"o":"毋因群疑而阻獨見，\n毋任己意而廢人言，\n毋私小惠而傷大體，\n毋借公論以快私情。","e":"무인군의이조독견,\n무임기의이폐인언,\n무사소혜이상대체,\n무차공론이쾌사정.","p":"여러 사람이 의심한다고 해서 나만의 바른 견해를 막지 말고, 내 뜻만 믿고 남의 말을 버리지 말며, 작은 은혜에 사사로이 얽매여 큰 도리를 해치지 말고, 공론을 빌려 사사로운 감정을 풀지 말라.","c":"전집 제131장(前集 第131)","src":130},{"o":"有妍必有醜為之對，我不誇妍，誰能醜我；\n有潔必有污為之仇，我不好潔，誰能污我。","e":"유연필유추위지대, 아불과연, 수능추아;\n유결필유오위지구, 아불호결, 수능오아.","p":"아름다움이 있으면 반드시 추함이 짝이 되니 내가 아름다움을 자랑하지 않으면 누가 나를 추하다 하겠는가. 깨끗함이 있으면 반드시 더러움이 맞서니 내가 깨끗함을 내세우지 않으면 누가 나를 더럽다 하겠는가.","c":"전집 제135장(前集 第135)","src":134},{"o":"功過不容少混，混則人懷惰墮之心；\n恩仇不可太明，明則人起攜貳之志。","e":"공과불용소혼, 혼즉인회타타지심;\n은구불가태명, 명즉인기휴이지지.","p":"공과 허물은 조금도 뒤섞어서는 안 되니, 섞이면 사람들이 게으른 마음을 품는다. 은혜와 원수는 너무 분명히 갈라서는 안 되니, 너무 분명하면 사람들이 등을 돌릴 마음을 일으킨다.","c":"전집 제137장(前集 第137)","src":136},{"o":"爵位不宜太盛，太盛則危；\n能事不宜盡畢，盡畢則衰；\n行誼不宜過高，過高則謗興而毀來。","e":"작위불의태성, 태성즉위;\n능사불의진필, 진필즉쇠;\n행의불의과고, 과고즉방흥이훼래.","p":"벼슬은 너무 높아서는 안 되니 너무 높으면 위태롭고, 재능은 다 써 버려서는 안 되니 다 쓰면 쇠하며, 행실은 너무 고고해서는 안 되니 너무 고고하면 비방과 헐뜯음이 몰려온다.","c":"전집 제138장(前集 第138)","src":137},{"o":"惡忌陰，善忌陽，故惡之顯者禍淺，而隱者禍深；善之顯者功小，而隱者功大。","e":"악기음, 선기양, 고악지현자화천, 이은자화심; 선지현자공소, 이은자공대.","p":"악은 숨기는 것을 꺼리고 선은 드러내는 것을 꺼린다. 그러므로 드러난 악은 화가 얕고 숨은 악은 화가 깊으며, 드러난 선은 공이 작고 숨은 선은 공이 크다.","c":"전집 제139장(前集 第139)","src":138},{"o":"當與人同過，不當與人同功，同功則相忌；\n可與人共患難，不可與人共安樂，安樂則相仇。","e":"당여인동과, 부당여인동공, 동공즉상기;\n가여인공환난, 불가여인공안락, 안락즉상구.","p":"남과 허물은 함께 나누어도 공은 함께 나누지 말라. 공을 나누면 서로 시기한다. 남과 어려움은 함께할 수 있어도 편안함은 함께하기 어렵다. 편안해지면 서로 원수가 된다.","c":"전집 제142장(前集 第142)","src":141},{"o":"德隨量進，量由識長。故欲厚其德，不可不弘其量；欲弘其量，不可不大其識。","e":"덕수량진, 양유식장. 고욕후기덕, 불가불홍기량; 욕홍기량, 불가부대기식.","p":"덕은 도량을 따라 자라고, 도량은 식견으로 커진다. 그러므로 덕을 두텁게 하려면 도량을 넓혀야 하고, 도량을 넓히려면 식견을 키워야 한다.","c":"전집 제145장(前集 第145)","src":144},{"o":"反己者，觸事皆成藥石；\n尤人者，動念即是戈矛。\n一以闢眾善之路，一以導諸惡之源，相去霄壤矣。","e":"반기자, 촉사개성약석;\n우인자, 동념즉시과모.\n일이벽중선지로, 일이도제악지원, 상거소양의.","p":"나를 돌아보는 사람에게는 부딪히는 일마다 약이 되고, 남을 탓하는 사람에게는 생각마다 창칼이 된다. 하나는 온갖 선으로 가는 길을 열고, 하나는 온갖 악의 근원을 끌어들이니, 그 차이가 하늘과 땅만큼 크다.","c":"전집 제147장(前集 第147)","src":146},{"o":"事業文章隨身銷毀，而精神萬古如新；\n功名富貴逐世轉移，而氣節千載一日。\n君子信不當以彼易此也。","e":"사업문장수신소훼, 이정신만고여신;\n공명부귀축세전이, 이기절천재일일.\n군자신부당이피역차야.","p":"업적과 문장은 몸과 함께 사라지지만 정신은 만고에 새롭고, 공명과 부귀는 세상 따라 옮겨 가지만 기개와 절개는 천 년이 하루 같다. 군자는 결코 저것으로 이것을 바꾸어서는 안 된다.","c":"전집 제148장(前集 第148)","src":147},{"o":"事有急之不白者，寬之或自明，毋躁急以速其忿；\n人有操之不從者，縱之或自化，毋操切以益其頑。","e":"사유급지불백자, 관지혹자명, 무조급이속기분;\n인유조지부종자, 종지혹자화, 무조절이익기완.","p":"일이 급하게 하면 밝혀지지 않다가도 느긋하게 두면 저절로 밝혀지기도 하니, 조급하게 굴어 노여움을 재촉하지 말라. 사람이 다그치면 따르지 않다가도 놓아두면 저절로 바뀌기도 하니, 몰아붙여 고집을 더하게 하지 말라.","c":"전집 제153장(前集 第153)","src":152},{"o":"謝事當謝於正盛之時，\n居身宜居於獨後之地。\n謹德須謹於至微之事，\n施恩務施於不報之人。","e":"사사당사어정성지시,\n거신의거어독후지지.\n근덕수근어지미지사,\n시은무시어불보지인.","p":"일에서 물러날 때는 한창 잘나갈 때 물러나고, 몸을 둘 때는 남보다 뒤처진 자리에 두라. 덕을 삼갈 때는 아주 작은 일에서 삼가고, 은혜를 베풀 때는 갚을 수 없는 사람에게 베풀라.","c":"전집 제155장(前集 第155)","src":154},{"o":"德者事業之基，未有基不固而棟宇堅久者。\n心者後嗣之本，未有本不立而枝葉茂榮者。","e":"덕자사업지기, 미유기불고이동우견구자.\n심자후사지본, 미유본불립이지엽무영자.","p":"덕은 사업의 터전이니, 터가 단단하지 않은데 집이 오래 튼튼한 법은 없다. 마음은 자손의 뿌리이니, 뿌리가 서지 않았는데 가지와 잎이 무성한 법은 없다.","c":"전집 제157장(前集 第157)","src":156},{"o":"信人者，人未必盡誠，己則獨誠矣；\n疑人者，人未必皆詐，己則先詐矣。","e":"신인자, 인미필진성, 기즉독성의;\n의인자, 인미필개사, 기즉선사의.","p":"남을 믿는 사람은 남이 다 진실하지 않더라도 자기만은 진실하고, 남을 의심하는 사람은 남이 다 속이지 않더라도 자기가 먼저 속이는 것이다.","c":"전집 제160장(前集 第160)","src":159},{"o":"念頭寬厚的，如春風煦育，萬物遭之而生；\n念頭忌刻的，如朔雪陰凝，萬物遭之而死。","e":"염두관후적, 여춘풍후육, 만물조지이생;\n염두기각적, 여삭설음응, 만물조지이사.","p":"생각이 너그럽고 후한 사람은 봄바람이 만물을 따뜻하게 기르듯 만나는 것마다 살리고, 생각이 각박한 사람은 북쪽 눈이 얼어붙듯 만나는 것마다 죽인다.","c":"전집 제161장(前集 第161)","src":160},{"o":"為善不見其益，如草裏東瓜，自應暗長；\n為惡不見其損，如庭前春雪，勢必潛消。","e":"위선불견기익, 여초리동과, 자응암장;\n위악불견기손, 여정전춘설, 세필잠소.","p":"착한 일을 해도 당장 이익이 보이지 않지만 풀숲의 동아처럼 모르는 사이에 자라고, 나쁜 일을 해도 당장 손해가 보이지 않지만 뜰 앞의 봄눈처럼 반드시 모르는 사이에 녹아 없어진다.","c":"전집 제162장(前集 第162)","src":161},{"o":"遇故舊之交，意氣要愈新；\n處隱微之地，心迹宜愈顯；\n待衰朽的輩，恩禮當愈隆。","e":"우고구지교, 의기요유신;\n처은미지지, 심적의유현;\n대쇠후적배, 은례당유륭.","p":"오랜 벗을 만나면 마음을 더욱 새롭게 하고, 남이 안 보는 곳에서는 마음가짐을 더욱 떳떳이 하며, 늙고 쇠한 이를 대할 때는 은혜와 예를 더욱 두터이 하라.","c":"전집 제163장(前集 第163)","src":162},{"o":"人之過誤宜恕，而在己則不可恕；\n己之困辱宜忍，而在人則不可忍。","e":"인지과오의서, 이재기즉불가서;\n기지곤욕의인, 이재인즉불가인.","p":"남의 허물은 용서해야 하지만 내 허물은 용서해서는 안 되고, 나의 곤욕은 참아야 하지만 남의 곤욕은 그냥 참고 보아서는 안 된다.","c":"전집 제166장(前集 第166)","src":165},{"o":"能脫俗便是奇，作意尚奇者，不為奇而為異；\n不合污便是清，矯情求清者，不為清而為激。","e":"능탈속변시기, 작의상기자, 불위기이위이;\n불합오변시청, 교정구청자, 불위청이위격.","p":"속됨을 벗어나면 그것이 곧 기이함이니, 일부러 기이함을 좇는 사람은 기이한 것이 아니라 괴이한 것이다. 더러움에 섞이지 않으면 그것이 곧 맑음이니, 억지로 맑음을 구하는 사람은 맑은 것이 아니라 과격한 것이다.","c":"전집 제167장(前集 第167)","src":166},{"o":"恩宜自淡而濃，先濃後淡者，人忘其惠；\n威宜自嚴而寬，先寬後嚴者，人怨其酷。","e":"은의자담이농, 선농후담자, 인망기혜;\n위의자엄이관, 선관후엄자, 인원기혹.","p":"은혜는 엷게 시작해서 짙게 해야 하니, 처음에 짙다가 나중에 엷으면 사람들이 그 은혜를 잊는다. 위엄은 엄하게 시작해서 너그럽게 해야 하니, 처음에 너그럽다가 나중에 엄하면 사람들이 그 가혹함을 원망한다.","c":"전집 제168장(前集 第168)","src":167},{"o":"心虛則性現，不息心而求見性，如撥波覓月；\n意淨則心清，不了意而求明心，如索鏡增塵。","e":"심허즉성현, 불식심이구견성, 여발파멱월;\n의정즉심청, 불료의이구명심, 여색경증진.","p":"마음이 비면 본성이 드러난다. 마음을 쉬지 않고 본성을 보려는 것은 물결을 헤치며 달을 찾는 것과 같다. 뜻이 깨끗하면 마음이 맑아진다. 뜻을 정리하지 않고 마음을 밝히려는 것은 거울을 닦으며 먼지를 더하는 것과 같다.","c":"전집 제169장(前集 第169)","src":168},{"o":"一念慈祥，可以醞釀兩間和氣；\n寸心潔白，可以昭垂百代清芬。","e":"일념자상, 가이온양량간화기;\n촌심결백, 가이소수백대청분.","p":"한 생각이 자비롭고 상서로우면 하늘과 땅 사이에 화기를 빚어낼 수 있고, 한 치 마음이 깨끗하면 백 대에 걸쳐 맑은 향기를 드리울 수 있다.","c":"전집 제178장(前集 第178)","src":177},{"o":"居官有二語，曰：「惟公則生明，惟廉則生威。」\n居家有二語，曰：「惟恕則情平，惟儉則用足。」","e":"거관유이어, 왈: “유공즉생명, 유렴즉생위.”\n거가유이어, 왈: “유서즉정평, 유검즉용족.”","p":"벼슬살이에 두 마디 말이 있으니, “오직 공정하면 밝음이 생기고, 오직 청렴하면 위엄이 생긴다.” 집안살이에도 두 마디 말이 있으니, “오직 너그러우면 마음이 평온하고, 오직 검소하면 쓸 것이 넉넉하다.”","c":"전집 제184장(前集 第184)","src":183},{"o":"處富貴之地，要知貧賤的痛癢；\n當少壯之時，須念衰老的辛酸。","e":"처부귀지지, 요지빈천적통양;\n당소장지시, 수념쇠로적신산.","p":"부귀한 자리에 있을 때는 가난하고 천한 이의 아픔을 알아야 하고, 젊고 힘 있을 때는 늙고 쇠한 이의 쓰라림을 생각해야 한다.","c":"전집 제185장(前集 第185)","src":184},{"o":"持身不可太皎潔，一切污辱垢穢，要茹納些；\n與人不可太分明，一切善惡賢愚，要包容得。","e":"지신불가태교결, 일체오욕구예, 요여납사;\n여인불가태분명, 일체선악현우, 요포용득.","p":"몸가짐을 너무 결백하게 하려 하지 말고 온갖 더러움과 욕됨도 조금은 받아들여라. 사람을 대할 때 너무 분명하게 가르려 하지 말고 선악과 현우를 모두 품어 안아라.","c":"전집 제186장(前集 第186)","src":185},{"o":"休與小人仇讎，小人自有對頭；\n休向君子諂媚，君子原無私惠。","e":"휴여소인구수, 소인자유대두;\n휴향군자첨미, 군자원무사혜.","p":"소인과 원수를 맺지 말라. 소인에게는 저절로 맞상대가 있다. 군자에게 아첨하지 말라. 군자는 원래 사사로운 은혜를 베풀지 않는다.","c":"전집 제187장(前集 第187)","src":186},{"o":"縱欲之病可醫，而執理之病難醫；\n事物之障可除，而義理之障難除。","e":"종욕지병가의, 이집리지병난의;\n사물지장가제, 이의리지장난제.","p":"욕심에 빠진 병은 고칠 수 있어도 이치에 집착하는 병은 고치기 어렵고, 사물의 장애는 없앨 수 있어도 이치에 갇힌 장애는 없애기 어렵다.","c":"전집 제188장(前集 第188)","src":187},{"o":"磨礪當如百煉之金，急就者，必非邃養；\n施為宜似千鈞之弩，輕發者，決無宏功。","e":"마려당여백련지금, 급취자, 필비수양;\n시위의사천균지노, 경발자, 결무굉공.","p":"자신을 갈고 닦기는 백 번 단련한 쇠처럼 해야 하니, 서둘러 이룬 것은 결코 깊은 수양이 아니다. 일을 벌이기는 천 근 쇠뇌처럼 해야 하니, 가볍게 쏜 것에는 결코 큰 공이 없다.","c":"전집 제189장(前集 第189)","src":188},{"o":"寧為小人所忌毀，毋為小人所媚悅；\n寧為君子所責備，毋為君子所包容。","e":"영위소인소기훼, 무위소인소미열;\n영위군자소책비, 무위군자소포용.","p":"차라리 소인에게 미움과 헐뜯음을 받을지언정 소인이 아첨하며 기뻐하는 사람이 되지 말고, 차라리 군자에게 꾸지람을 받을지언정 군자가 눈감아 주는 사람이 되지 말라.","c":"전집 제190장(前集 第190)","src":189},{"o":"好利者，軼出於道義之外，其害顯而淺；\n好名者，竄入於道義之中，其害隱而深。","e":"호리자, 일출어도의지외, 기해현이천;\n호명자, 찬입어도의지중, 기해은이심.","p":"이익을 좋아하는 사람은 도의 밖으로 벗어나니 그 해가 드러나서 얕고, 이름을 좋아하는 사람은 도의 안으로 숨어드니 그 해가 숨어 있어 깊다.","c":"전집 제191장(前集 第191)","src":190},{"o":"讒夫毀士，如寸雲蔽日，不久自明；\n媚子阿人，似隙風侵肌，無疾亦損。","e":"참부훼사, 여촌운폐일, 불구자명;\n미자아인, 사극풍침기, 무질역손.","p":"헐뜯는 사람이 선비를 비방하는 것은 조각구름이 해를 가리는 것과 같아서 오래지 않아 저절로 밝아진다. 아첨하는 사람이 남에게 알랑거리는 것은 틈새 바람이 살갗에 스미는 것과 같아서 병이 없어 보여도 몸이 상한다.","c":"전집 제193장(前集 第193)","src":192},{"o":"建功立業者，多圓融之士；\n僨事失機者，必執拗之人。","e":"건공립업자, 다원융지사;\n분사실기자, 필집요지인.","p":"공을 세우고 일을 이루는 사람은 대개 원만하고 융통성 있는 사람이고, 일을 그르치고 때를 놓치는 사람은 반드시 고집 센 사람이다.","c":"전집 제195장(前集 第195)","src":194},{"o":"處世不必與俗同，亦不宜與俗異；\n作事不必令人喜，亦不可令人憎。","e":"처세불필여속동, 역불의여속이;\n작사불필령인희, 역불가령인증.","p":"세상을 살면서 꼭 세속과 같을 필요는 없지만 세속과 너무 달라서도 안 되고, 일을 할 때 꼭 남을 기쁘게 할 필요는 없지만 남이 미워하게 해서도 안 된다.","c":"전집 제196장(前集 第196)","src":195},{"o":"日既暮而猶煙霞絢爛，歲將晚而更橙橘芳馨。故末路晚年，君子更宜精神百倍。","e":"일기모이유연하현란, 세장만이갱등귤방형. 고말로만년, 군자갱의정신백배.","p":"해가 이미 저물어도 노을은 오히려 찬란하고, 한 해가 저물어 가도 귤과 유자는 더욱 향기롭다. 그러므로 인생의 끝자락, 늘그막에 군자는 더욱 정신을 백 배로 가다듬어야 한다.","c":"전집 제197장(前集 第197)","src":196},{"o":"鷹立如睡，虎行似病，正是他攫鳥噬人法術。故君子要聰明不露，才華不逞，纔有任重道遠的力量。","e":"응립여수, 호행사병, 정시타확조서인법술. 고군자요총명불로, 재화불령, 재유임중도원적력량.","p":"매는 조는 듯이 앉아 있고 범은 병든 듯이 걷는다. 이것이 바로 새를 낚아채고 사람을 무는 그들의 솜씨다. 그러므로 군자는 총명을 드러내지 않고 재주를 뽐내지 않아야 무거운 짐을 지고 먼 길을 가는 힘이 있다.","c":"전집 제198장(前集 第198)","src":197},{"o":"儉，美德也，過儉則為慳吝，為鄙嗇，反傷雅道；\n讓，懿行也，過讓則為足恭，為曲謹，多出機心。","e":"검, 미덕야, 과검즉위간린, 위비색, 반상아도;\n양, 의행야, 과양즉위족공, 위곡근, 다출기심.","p":"검소함은 미덕이지만 지나치면 인색하고 쩨쩨해져서 도리어 바른 도리를 해친다. 양보는 아름다운 행실이지만 지나치면 비굴하고 지나치게 조심스러워져서 꾀가 많아진다.","c":"전집 제199장(前集 第199)","src":198},{"o":"毋憂拂意，毋喜快心，毋恃久安，毋憚初難。","e":"무우불의, 무희쾌심, 무시구안, 무탄초난.","p":"뜻대로 안 된다고 근심하지 말고, 마음이 상쾌하다고 기뻐하지 말며, 오래 편안했다고 믿지 말고, 처음이 어렵다고 꺼리지 말라.","c":"전집 제200장(前集 第200)","src":199},{"o":"宴飲之樂多，不是個好人家；\n聲華之習勝，不是個好士子；\n名位之念重，不是個好臣工。","e":"연음지락다, 불시개호인가;\n성화지습승, 불시개호사자;\n명위지념중, 불시개호신공.","p":"잔치와 술자리의 즐거움이 많으면 좋은 집안이 아니고, 겉치레와 소문을 좇는 버릇이 강하면 좋은 선비가 아니며, 이름과 벼슬에 대한 생각이 무거우면 좋은 신하가 아니다.","c":"전집 제201장(前集 第201)","src":200},{"o":"世人以心愜處為樂，卻被樂心引入苦處；\n達士以心拂處為樂，終由苦心換得樂來。","e":"세인이심협처위락, 각피락심인입고처;\n달사이심불처위락, 종유고심환득락래.","p":"세상 사람은 마음이 흡족한 것을 즐거움으로 여기다가 그 즐거운 마음에 끌려 괴로움에 빠지고, 통달한 사람은 마음이 거슬리는 것을 즐거움으로 여기다가 끝내 그 괴로운 마음으로 즐거움을 얻는다.","c":"전집 제202장(前集 第202)","src":201},{"o":"居盈滿者，如水之將溢未溢，切忌再加一滴；\n處危急者，如木之將折未折，切忌再加一搦。","e":"거영만자, 여수지장일미일, 절기재가일적;\n처위급자, 여목지장절미절, 절기재가일닉.","p":"가득 찬 자리에 있는 사람은 넘칠 듯 말 듯한 물과 같으니 절대로 한 방울도 더하지 말고, 위급한 자리에 있는 사람은 부러질 듯 말 듯한 나무와 같으니 절대로 조금도 더 누르지 말라.","c":"전집 제203장(前集 第203)","src":202},{"o":"冷眼觀人，冷耳聽語，冷情當感，冷心思理。","e":"냉안관인, 냉이청어, 냉정당감, 냉심사리.","p":"차가운 눈으로 사람을 보고, 차가운 귀로 말을 듣고, 차가운 마음으로 느낌을 대하고, 차가운 마음으로 이치를 생각하라.","c":"전집 제204장(前集 第204)","src":203},{"o":"仁人心地寬舒，便福厚而慶長，事事成個寬舒氣象；\n鄙夫念頭迫促，便福薄而澤短，事事得個迫促規模。","e":"인인심지관서, 변복후이경장, 사사성개관서기상;\n비부념두박촉, 변복박이택단, 사사득개박촉규모.","p":"어진 사람은 마음이 너그럽고 느긋하여 복이 두텁고 경사가 길며, 하는 일마다 너그럽고 느긋한 기상을 이룬다. 속 좁은 사람은 생각이 급하고 옹색하여 복이 얇고 은택이 짧으며, 하는 일마다 급하고 옹색한 모양이 된다.","c":"전집 제205장(前集 第205)","src":204},{"o":"聞惡不可就惡，恐為讒夫洩怒；\n聞善不可急親，恐引奸人進身。","e":"문악불가취오, 공위참부설노;\n문선불가급친, 공인간인진신.","p":"남의 나쁜 소문을 듣고 곧바로 미워하지 말라. 헐뜯는 사람이 분풀이하는 것일까 두렵다. 남의 좋은 소문을 듣고 서둘러 가까이하지 말라. 간사한 사람이 출세하려는 길을 열어 줄까 두렵다.","c":"전집 제206장(前集 第206)","src":205},{"o":"性躁心粗者，一事無成；\n心和氣平者，百福自集。","e":"성조심조자, 일사무성;\n심화기평자, 백복자집.","p":"성미가 급하고 마음이 거친 사람은 한 가지 일도 이루지 못하고, 마음이 온화하고 기운이 평온한 사람에게는 온갖 복이 저절로 모인다.","c":"전집 제207장(前集 第207)","src":206},{"o":"用人不宜刻，刻則思效者去；\n交友不宜濫，濫則貢諛者來。","e":"용인불의각, 각즉사효자거;\n교우불의람, 남즉공유자래.","p":"사람을 쓸 때는 각박하게 하지 말라. 각박하면 힘쓰려던 사람도 떠난다. 벗을 사귈 때는 함부로 하지 말라. 함부로 하면 아첨하는 사람이 몰려온다.","c":"전집 제208장(前集 第208)","src":207},{"o":"風斜雨急處，要立得腳定；\n花濃柳豔處，要著得眼高；\n路危徑險處，要回得頭早。","e":"풍사우급처, 요립득각정;\n화농류염처, 요착득안고;\n노위경험처, 요회득두조.","p":"비바람이 비껴 몰아치는 곳에서는 발을 굳게 딛고 서야 하고, 꽃과 버들이 화려한 곳에서는 눈을 높이 두어야 하며, 길이 위태롭고 험한 곳에서는 일찍 발길을 돌려야 한다.","c":"전집 제209장(前集 第209)","src":208},{"o":"節義之人濟以和衷，纔不啟忿爭之路；\n功名之士承以謙德，方不開嫉妒之門。","e":"절의지인제이화충, 재불계분쟁지로;\n공명지사승이겸덕, 방불개질투지문.","p":"절개와 의리가 있는 사람은 온화한 마음으로 보태야 다툼의 길을 열지 않고, 공명을 이룬 사람은 겸손한 덕으로 받쳐야 시기의 문을 열지 않는다.","c":"전집 제210장(前集 第210)","src":209},{"o":"大人不可不畏，畏大人則無放逸之心；\n小民亦不可不畏，畏小民則無豪橫之習。","e":"대인불가불외, 외대인즉무방일지심;\n소민역불가불외, 외소민즉무호횡지습.","p":"높은 사람을 두려워하지 않을 수 없으니, 두려워하면 방자한 마음이 없어진다. 백성도 두려워하지 않을 수 없으니, 두려워하면 횡포한 버릇이 없어진다.","c":"전집 제212장(前集 第212)","src":211},{"o":"事稍拂逆，便思不如我的人，則尤怨自消；\n心稍怠荒，便思勝似我的人，則精神自奮。","e":"사초불역, 변사불여아적인, 즉우원자소;\n심초태황, 변사승사아적인, 즉정신자분.","p":"일이 조금 뜻대로 안 되면 나만 못한 사람을 생각하라. 그러면 원망이 저절로 사라진다. 마음이 조금 게을러지면 나보다 나은 사람을 생각하라. 그러면 정신이 저절로 떨쳐 일어난다.","c":"전집 제213장(前集 第213)","src":212},{"o":"不可乘喜而輕諾，不可因醉而生嗔，不可乘快而多事，不可因倦而鮮終。","e":"불가승희이경낙, 불가인취이생진, 불가승쾌이다사, 불가인권이선종.","p":"기쁘다고 가볍게 약속하지 말고, 취했다고 성내지 말며, 기분이 좋다고 일을 많이 벌이지 말고, 고단하다고 끝맺음을 소홀히 하지 말라.","c":"전집 제214장(前集 第214)","src":213},{"o":"口乃心之門，守口不密，洩盡真機；\n意乃心之足，防意不嚴，走盡邪蹊。","e":"구내심지문, 수구불밀, 설진진기;\n의내심지족, 방의불엄, 주진사혜.","p":"입은 마음의 문이니, 입을 단단히 지키지 않으면 참된 기밀이 다 새어 나간다. 뜻은 마음의 발이니, 뜻을 엄히 막지 않으면 그릇된 길로 다 달려간다.","c":"전집 제218장(前集 第218)","src":217},{"o":"責人者，原無過於有過之中，則情平；\n責己者，求有過於無過之內，則德進。","e":"책인자, 원무과어유과지중, 즉정평;\n책기자, 구유과어무과지내, 즉덕진.","p":"남을 꾸짖을 때는 허물이 있는 가운데서도 허물없는 점을 찾아 주면 마음이 평온해지고, 나를 꾸짖을 때는 허물이 없는 가운데서도 허물을 찾으면 덕이 자란다.","c":"전집 제219장(前集 第219)","src":218},{"o":"桃李雖豔，何如松蒼柏翠之堅貞；\n梨杏雖甘，何如橘綠橙黃之馨冽。\n信乎，濃夭不及淡久，早秀不如晚成也。","e":"도리수염, 하여송창백취지견정;\n이행수감, 하여귤록등황지형렬.\n신호, 농요불급담구, 조수불여만성야.","p":"복숭아와 오얏꽃이 곱다 한들 푸른 소나무와 잣나무의 굳은 절개만 하겠는가. 배와 살구가 달다 한들 노란 유자와 푸른 귤의 맑은 향기만 하겠는가. 참으로 짙고 짧은 것은 담백하고 오래가는 것에 못 미치고, 일찍 핀 꽃은 늦게 이룬 것만 못하다.","c":"전집 제222장(前集 第222)","src":221},{"o":"譚山林之樂者，未必真得山林之趣。\n厭名利之談者，未必盡忘名利之情。","e":"담산림지락자, 미필진득산림지취.\n염명리지담자, 미필진망명리지정.","p":"산림의 즐거움을 말하는 사람이 꼭 산림의 참맛을 아는 것은 아니고, 명예와 이익 이야기를 싫어하는 사람이 꼭 명리의 마음을 다 잊은 것은 아니다.","c":"후집 제1장(後集 第1)","src":222},{"o":"歲月本長，而忙者自促。\n天地本寬，而鄙者自隘。\n風花雪月本閒，而勞攘者自冗。","e":"세월본장, 이망자자촉.\n천지본관, 이비자자애.\n풍화설월본한, 이로양자자용.","p":"세월은 본래 긴데 바쁜 사람이 스스로 줄이고, 천지는 본래 넓은데 속 좁은 사람이 스스로 좁히며, 바람과 꽃과 눈과 달은 본래 한가로운데 분주한 사람이 스스로 번거롭게 한다.","c":"후집 제4장(後集 第4)","src":225},{"o":"得趣不在多。\n盆池拳石間，煙霞具足。\n會景不在遠。\n蓬窗竹屋下，風月自賖。","e":"득취부재다.\n분지권석간, 연하구족.\n회경부재원.\n봉창죽옥하, 풍월자사.","p":"멋을 얻는 것은 많은 데 있지 않으니, 작은 연못과 주먹만 한 돌 사이에도 안개와 노을이 다 갖추어져 있다. 좋은 경치는 먼 데 있지 않으니, 쑥대 창과 대나무 집 아래에도 바람과 달이 넉넉하다.","c":"후집 제5장(後集 第5)","src":226},{"o":"聽靜夜之鐘聲，喚醒夢中之夢，觀澄潭之月影，窺見身外之身。","e":"청정야지종성, 환성몽중지몽, 관징담지월영, 규견신외지신.","p":"고요한 밤의 종소리를 들으면 꿈속의 꿈에서 깨어나고, 맑은 못에 비친 달그림자를 보면 몸 밖의 몸을 엿보게 된다.","c":"후집 제6장(後集 第6)","src":227},{"o":"心無物欲，即是秋空霽海。\n坐有琴書，便成石室丹丘。","e":"심무물욕, 즉시추공제해.\n좌유금서, 변성석실단구.","p":"마음에 물욕이 없으면 그것이 곧 가을 하늘과 갠 바다요, 곁에 거문고와 책이 있으면 그것이 곧 신선이 사는 곳이다.","c":"후집 제9장(後集 第9)","src":230},{"o":"石火光中，爭長競短。\n幾何光陰。\n蝸牛角上，較雌論雄。\n許大世界。","e":"석화광중, 쟁장경단.\n기하광음.\n와우각상, 교자론웅.\n허대세계.","p":"부싯돌 불빛처럼 짧은 인생에서 길고 짧음을 다툰들 그 세월이 얼마나 되겠는가. 달팽이 뿔 위에서 누가 이기고 지는지 겨룬들 그 세상이 얼마나 크겠는가.","c":"후집 제13장(後集 第13)","src":234},{"o":"從冷視熱，然後知熱處之奔馳無益。\n從冗入閒，然後覺閒中之滋味最長。","e":"종랭시열, 연후지열처지분치무익.\n종용입한, 연후각한중지자미최장.","p":"차가운 자리에서 뜨거운 곳을 보아야 뜨거운 곳에서 바삐 달리는 것이 쓸데없음을 알고, 번잡함에서 한가로움으로 들어가 보아야 한가로움의 맛이 가장 길다는 것을 깨닫는다.","c":"후집 제16장(後集 第16)","src":237},{"o":"都來眼前事，知足者仙境，不知足者凡境。\n總出世上因，善用者生機，不善用者殺機。","e":"도래안전사, 지족자선경, 부지족자범경.\n총출세상인, 선용자생기, 불선용자살기.","p":"눈앞의 모든 일이, 만족할 줄 알면 신선의 경지요 만족할 줄 모르면 속된 경지다. 세상의 모든 인연이, 잘 쓰면 살리는 기틀이요 잘못 쓰면 죽이는 기틀이다.","c":"후집 제20장(後集 第20)","src":241},{"o":"趨炎附勢之禍，甚慘亦甚速。\n棲恬守逸之味，最淡亦最長。","e":"추염부세지화, 심참역심속.\n서념수일지미, 최담역최장.","p":"뜨거운 권세에 빌붙는 화는 몹시 참혹하고 몹시 빠르며, 고요하고 한가로움을 지키는 맛은 가장 담백하고 가장 오래간다.","c":"후집 제21장(後集 第21)","src":242},{"o":"爭先的徑路窄，退後一步自寬平一步。\n濃艷的滋味短，清淡一分自悠長一分。","e":"쟁선적경로착, 퇴후일보자관평일보.\n농염적자미단, 청담일분자유장일분.","p":"앞다투는 길은 좁으니 한 걸음 물러서면 한 걸음만큼 넓고 평탄해지고, 진하고 화려한 맛은 짧으니 한 푼 담백해지면 한 푼만큼 길고 오래간다.","c":"후집 제24장(後集 第24)","src":245},{"o":"忙處不亂性，須閒處心神養得清。\n死時不動心，須生時事物看得破。","e":"망처불란성, 수한처심신양득청.\n사시부동심, 수생시사물간득파.","p":"바쁠 때 본성을 어지럽히지 않으려면 한가할 때 마음과 정신을 맑게 길러 두어야 하고, 죽을 때 마음이 흔들리지 않으려면 살아 있을 때 세상일을 꿰뚫어 보아 두어야 한다.","c":"후집 제25장(後集 第25)","src":246},{"o":"隱逸林中無榮辱，道義路上無炎涼。","e":"은일림중무영욕, 도의로상무염량.","p":"숨어 사는 숲속에는 영화도 욕됨도 없고, 도의를 걷는 길 위에는 세상인심의 뜨거움과 차가움이 없다.","c":"후집 제26장(後集 第26)","src":247},{"o":"進步處，便思退步，庶免觸藩之禍。\n着手時，先圖放手，纔脱騎虎之危。","e":"진보처, 변사퇴보, 서면촉번지화.\n착수시, 선도방수, 재탈기호지위.","p":"나아갈 때 곧 물러설 것을 생각하면 울타리에 뿔이 걸린 양 같은 화를 면하고, 손을 댈 때 먼저 손 뗄 것을 꾀하면 범을 탄 위태로움에서 벗어난다.","c":"후집 제28장(後集 第28)","src":249},{"o":"矜名，不若逃名趣。\n練事，何如省事閒。","e":"긍명, 불약도명취.\n연사, 하여생사한.","p":"이름을 자랑하는 것은 이름을 피하는 멋만 못하고, 일에 능숙해지는 것은 일을 줄이는 한가로움만 못하다.","c":"후집 제30장(後集 第30)","src":251},{"o":"孤雲出岫，去留一無所係。\n朗鏡懸空，靜躁兩不相干。","e":"고운출수, 거류일무소계.\n낭경현공, 정조량불상간.","p":"외로운 구름이 산굴에서 나오듯 가고 머무는 데 아무 얽매임이 없고, 밝은 거울이 허공에 걸린 듯 고요함과 시끄러움에 둘 다 상관하지 않는다.","c":"후집 제32장(後集 第32)","src":253},{"o":"水流而境無聲，得處喧見寂之趣。\n山高而雲不礙，悟出有入無之機。","e":"수류이경무성, 득처훤견적지취.\n산고이운불애, 오출유입무지기.","p":"물이 흘러도 주위는 소리가 없으니, 시끄러운 가운데 고요함을 보는 멋을 얻는다. 산이 높아도 구름은 걸리지 않으니, 있음에서 나와 없음으로 드는 이치를 깨닫는다.","c":"후집 제35장(後集 第35)","src":256},{"o":"此身常放在閒處，榮辱得失，誰能差遣我。\n此心常安在靜中，是非利害，誰能瞞昧我。","e":"차신상방재한처, 영욕득실, 수능차견아.\n차심상안재정중, 시비리해, 수능만매아.","p":"이 몸을 늘 한가한 곳에 두면 영욕과 득실이 누가 나를 부릴 수 있으며, 이 마음을 늘 고요한 가운데 두면 시비와 이해가 누가 나를 속일 수 있겠는가.","c":"후집 제41장(後集 第41)","src":262},{"o":"我不希榮，何憂乎利祿之香餌。\n我不競進，何畏乎仕官之危機。","e":"아불희영, 하우호리록지향이.\n아불경진, 하외호사관지위기.","p":"내가 영화를 바라지 않으니 어찌 이익과 녹봉이라는 미끼를 걱정하며, 내가 앞다투어 나아가지 않으니 어찌 벼슬길의 위기를 두려워하겠는가.","c":"후집 제43장(後集 第43)","src":264},{"o":"多藏者厚亡。\n故知富不如貧之無慮。\n高步者疾顛。\n故知貴不如賤之常安。","e":"다장자후망.\n고지부불여빈지무려.\n고보자질전.\n고지귀불여천지상안.","p":"많이 쌓아 둔 사람은 크게 잃으니, 부유함이 가난의 근심 없음만 못하다는 것을 안다. 높이 걷는 사람은 빨리 넘어지니, 귀함이 천함의 늘 편안함만 못하다는 것을 안다.","c":"후집 제52장(後集 第52)","src":273},{"o":"自老視少，可以消奔馳角逐之心。\n自瘁視榮，可以絶紛華靡麗之念。","e":"자로시소, 가이소분치각축지심.\n자췌시영, 가이절분화미려지념.","p":"늙은 눈으로 젊음을 보면 바삐 달리고 다투는 마음을 없앨 수 있고, 시든 처지에서 영화를 보면 화려함을 좇는 생각을 끊을 수 있다.","c":"후집 제56장(後集 第56)","src":277},{"o":"熱鬧中，着一冷眼，便省許多苦心思。\n冷落處，存一熱心，便得許多真趣味。","e":"열료중, 착일랭안, 변생허다고심사.\n냉락처, 존일열심, 변득허다진취미.","p":"떠들썩한 가운데 차가운 눈을 하나 두면 많은 괴로운 생각을 덜고, 쓸쓸한 곳에서 뜨거운 마음을 하나 지니면 많은 참된 멋을 얻는다.","c":"후집 제58장(後集 第58)","src":279},{"o":"知成之必敗，則求成之心，不必太堅。\n知生之必死，則保生之道，不必過勞。","e":"지성지필패, 즉구성지심, 불필태견.\n지생지필사, 즉보생지도, 불필과로.","p":"이룬 것은 반드시 무너짐을 알면 이루려는 마음을 너무 굳게 가질 필요가 없고, 산 것은 반드시 죽음을 알면 삶을 지키는 일에 너무 애쓸 필요가 없다.","c":"후집 제61장(後集 第61)","src":282},{"o":"魚得水逝，而相忘乎水。\n鳥乘風飛，而不知有風。\n識此可以超物累，可以樂天機。","e":"어득수서, 이상망호수.\n조승풍비, 이부지유풍.\n식차가이초물루, 가이락천기.","p":"물고기는 물을 얻어 헤엄치면서도 물을 잊고, 새는 바람을 타고 날면서도 바람이 있는 줄 모른다. 이것을 알면 사물의 얽매임을 벗어나 하늘의 이치를 즐길 수 있다.","c":"후집 제67장(後集 第67)","src":288},{"o":"寵辱不驚，閑看庭前花開花落。\n去留無意，漫隨天外雲卷雲舒。","e":"총욕불경, 한간정전화개화락.\n거류무의, 만수천외운권운서.","p":"총애와 욕됨에 놀라지 않고 뜰 앞에 꽃이 피고 지는 것을 한가로이 바라보며, 가고 머무는 데 뜻을 두지 않고 하늘 밖에 구름이 걷히고 펴지는 것을 무심히 따른다.","c":"후집 제69장(後集 第69)","src":290},{"o":"伏久者，飛必高，開先者，謝獨早。\n知此，可以免蹭蹬之憂，可以消躁急之念。","e":"복구자, 비필고, 개선자, 사독조.\n지차, 가이면층등지우, 가이소조급지념.","p":"오래 엎드려 있던 새는 반드시 높이 날고, 먼저 핀 꽃은 홀로 일찍 진다. 이것을 알면 발을 헛디딜까 하는 근심을 면하고 조급한 마음을 없앨 수 있다.","c":"후집 제76장(後集 第76)","src":297},{"o":"樹木至歸根，而後知華萼枝葉之徒榮。\n人事至蓋棺，而後知子女玉帛之無益。","e":"수목지귀근, 이후지화악지엽지도영.\n인사지개관, 이후지자녀옥백지무익.","p":"나무는 잎이 떨어져 뿌리로 돌아간 뒤에야 꽃과 가지와 잎의 영화가 헛됨을 알고, 사람은 관 뚜껑을 덮을 때에 이르러서야 자녀와 재물이 소용없음을 안다.","c":"후집 제77장(後集 第77)","src":298},{"o":"繩鋸木斷，水滴石穿。\n學道者須加力索。\n水到渠成，瓜熟蔕落。\n得道者一任天機。","e":"승거목단, 수적석천.\n학도자수가력색.\n수도거성, 과숙체락.\n득도자일임천기.","p":"새끼줄 톱으로도 나무를 자르고 물방울로도 돌을 뚫는다. 도를 배우는 사람은 모름지기 힘써 찾아야 한다. 물이 이르면 도랑이 생기고 오이가 익으면 꼭지가 떨어진다. 도를 얻은 사람은 하늘의 흐름에 맡긴다.","c":"후집 제109장(後集 第109)","src":330},{"o":"雨餘觀山色，景象便覺新妍。\n夜靜聽鐘聲，音響尤為清越。","e":"우여관산색, 경상변각신연.\n야정청종성, 음향우위청월.","p":"비 갠 뒤에 산 빛을 보면 경치가 새롭고 곱게 느껴지고, 고요한 밤에 종소리를 들으면 울림이 더욱 맑고 멀리 퍼진다.","c":"후집 제112장(後集 第112)","src":333},{"o":"登高使人心曠，臨流使人意遠。\n讀書於雨雪之夜，使人神清，舒嘯於丘阜之嶺，使人興邁。","e":"등고사인심광, 임류사인의원.\n독서어우설지야, 사인신청, 서소어구부지령, 사인흥매.","p":"높은 곳에 오르면 마음이 탁 트이고, 흐르는 물가에 서면 생각이 멀어진다. 비 오고 눈 내리는 밤에 책을 읽으면 정신이 맑아지고, 언덕 마루에서 휘파람을 불면 흥이 솟는다.","c":"후집 제113장(後集 第113)","src":334},{"o":"心曠則萬鐘如瓦缶，心隘則一髮似車輪。","e":"심광즉만종여와부, 심애즉일발사차륜.","p":"마음이 넓으면 만 종의 녹봉도 질그릇 같고, 마음이 좁으면 머리카락 한 올도 수레바퀴만큼 커 보인다.","c":"후집 제114장(後集 第114)","src":335},{"o":"花看半開，酒飲微醉。\n此中大佳趣。\n若至爛漫酕醄，便成惡境矣。\n履盈滿者，宜思之。","e":"화간반개, 주음미취.\n차중대가취.\n약지란만모도, 변성악경의.\n이영만자, 의사지.","p":"꽃은 반쯤 피었을 때 보고, 술은 살짝 취할 만큼 마신다. 그 안에 큰 멋이 있다. 꽃이 흐드러지고 술에 곤드레가 되면 도리어 나쁜 지경이 된다. 가득 찬 자리에 있는 사람은 이를 깊이 생각해야 한다.","c":"후집 제122장(後集 第122)","src":343},{"o":"清能有容，仁能善斷；明不傷察，直不過矯。是謂蜜餞不甜，海味不鹹，纔是懿德。","e":"청능유용, 인능선단; 명불상찰, 직불과교. 시위밀전불첨, 해미불함, 재시의덕.","p":"청렴하면서도 남을 품을 줄 알고, 어질면서도 결단을 잘하며, 총명하되 살핌이 지나쳐 사람을 상하게 하지 않고, 곧되 바로잡음이 지나치지 않다. 꿀에 절인 음식이 달지 않고 바닷가 음식이 짜지 않은 것과 같으니, 이래야 아름다운 덕이다.","c":"전집 제84장(前集 第84)","src":83},{"o":"勢利紛華，不近者為潔，近之而不染者為尤潔；\n智械機巧，不知者為高，知之而不用者為尤高。","e":"세리분화, 불근자위결, 근지이불염자위우결;\n지계기교, 부지자위고, 지지이불용자위우고.","p":"권세와 이익, 화려한 일에 가까이하지 않는 것도 깨끗하지만, 가까이하면서도 물들지 않는 것이 더욱 깨끗하다. 잔꾀를 모르는 것도 높지만, 알고도 쓰지 않는 것이 더욱 높다.","c":"전집 제4장(前集 第4)","src":3},{"o":"耳中常聞逆耳之言，心中常有拂心之事，纔是進德修行的砥石。\n若言言悅耳，事事快心，便把此生埋在鴆毒中矣。","e":"이중상문역이지언, 심중상유불심지사, 재시진덕수행적지석.\n약언언열이, 사사쾌심, 변파차생매재짐독중의.","p":"귀에 늘 거슬리는 말을 듣고 마음에 늘 뜻대로 되지 않는 일을 두는 것이야말로 덕을 닦는 숫돌이다. 말마다 듣기 좋고 일마다 마음이 시원하면, 이 삶을 독약 속에 묻어 버리는 것이다.","c":"전집 제5장(前集 第5)","src":4},{"o":"夜深人靜，獨坐觀心，始覺妄窮而真獨露，每於此中得大機趣；\n既覺真現而妄難逃，又於此中得大慚忸。","e":"야심인정, 독좌관심, 시각망궁이진독로, 매어차중득대기취;\n기각진현이망난도, 우어차중득대참육.","p":"밤이 깊고 사람이 고요할 때 홀로 앉아 마음을 보면, 거짓이 다하고 참됨만 드러나 큰 기쁨을 얻기도 하고, 참됨이 보여도 거짓을 벗어나지 못해 크게 부끄러워지기도 한다.","c":"전집 제9장(前集 第9)","src":8},{"o":"藜口莧腸者，多冰清玉潔；\n袞衣玉食者，甘婢膝奴顏。\n蓋志以澹泊明，而節從肥甘喪也。","e":"여구현장자, 다빙청옥결;\n곤의옥식자, 감비슬노안.\n개지이담박명, 이절종비감상야.","p":"거친 나물과 푸성귀를 먹는 사람에게 얼음처럼 맑고 옥처럼 깨끗한 이가 많고, 좋은 옷과 기름진 밥을 누리는 사람은 종처럼 엎드리고 종처럼 웃는 일을 달게 여긴다. 뜻은 담박함에서 밝아지고, 절조는 기름진 것에서 무너진다.","c":"전집 제11장(前集 第11)","src":10},{"o":"作人無甚高遠事業，擺脫得俗情，便入名流；\n為學無甚增益工夫，減除得物累，便超聖境。","e":"작인무심고원사업, 파탈득속정, 변입명류;\n위학무심증익공부, 감제득물루, 변초성경.","p":"사람 노릇에 대단한 사업이 따로 있는 것이 아니다. 속된 정을 벗어던지면 곧 이름난 자리에 든다. 공부도 보태는 재주보다, 물건에 끌리는 짐을 덜어 내면 성인의 경계에 오른다.","c":"전집 제14장(前集 第14)","src":13},{"o":"事事留個有餘不盡的意思，便造物不能忌我，鬼神不能損我。\n若業必求滿，功必求盈者，不生內變，必召外憂。","e":"사사류개유여부진적의사, 변조물불능기아, 귀신불능손아.\n약업필구만, 공필구영자, 불생내변, 필소외우.","p":"일마다 남을 여지를 두면 조물도 나를 시기하지 못하고 귀신도 나를 해치지 못한다. 일이 반드시 가득 차기를 바라고 공이 반드시 넘치기를 바라면, 안에서 변고가 생기지 않아도 밖에서 근심이 온다.","c":"전집 제20장(前集 第20)","src":19},{"o":"家庭有個真佛，日用有種真道。\n人能誠心和氣，愉色婉言，使父母兄弟間，形骸兩釋，意氣交流，勝於調息觀心萬倍矣。","e":"가정유개진불, 일용유종진도.\n인능성심화기, 유색완언, 사부모형제간, 형해량석, 의기교류, 승어조식관심만배의.","p":"집안에도 참된 부처가 있고 날마다 쓰는 일에도 참된 도가 있다. 진심으로 화목하고 얼굴과 말을 부드럽게 하여 부모 형제가 몸을 잊고 뜻이 통하게 하면, 숨결을 고르고 마음을 살피는 것보다 만 배 낫다.","c":"전집 제21장(前集 第21)","src":20},{"o":"好動者，雲電風燈；\n嗜寂者，死灰槁木。\n須定雲止水中，有魚躍鳶飛氣象，纔是有道的心體。","e":"호동자, 운전풍등;\n기적자, 사회고목.\n수정운지수중, 유어약연비기상, 재시유도적심체.","p":"움직이기만 좋아하는 사람은 구름·번개·바람·등불 같고, 고요함만 즐기는 사람은 죽은 재와 마른 나무 같다. 고요한 구름과 멈춘 물 가운데 물고기가 뛰고 솔개가 나는 기상이야 있어야 도 있는 마음이다.","c":"전집 제22장(前集 第22)","src":21},{"o":"矜高倨傲，無非客氣，降伏得客氣下，而後正氣伸；\n情欲意識，盡屬妄心，消殺得妄心盡，而後真心現。","e":"긍고거오, 무비객기, 항복득객기하, 이후정기신;\n정욕의식, 진속망심, 소살득망심진, 이후진심현.","p":"잘난 체하고 거만한 것은 다 겉으로 부린 기운이니, 그것을 눌러야 바른 기운이 펴진다. 욕망과 의식은 다 거짓 마음이니, 그것을 없애야 참마음이 나타난다.","c":"전집 제25장(前集 第25)","src":24},{"o":"飽後思味，則濃淡之境都消；\n色後思淫，則男女之見盡絕。\n故人常以事後之悔悟，破臨事之癡迷，則性定而動無不正。","e":"포후사미, 즉농담지경도소;\n색후사음, 즉남녀지견진절.\n고인상이사후지회오, 파임사지치미, 즉성정이동무부정.","p":"배부른 뒤에 맛을 생각하면 진하고 싱거운 경계가 사라지고, 색을 탐한 뒤에 음탕함을 생각하면 남녀의 생각이 끊어진다. 일이 지난 뒤의 뉘우침으로 일에 부딪혔을 때의 미혹을 깨면, 성품이 안정되어 움직여도 바르지 않음이 없다.","c":"전집 제26장(前集 第26)","src":25},{"o":"居軒冕之中，不可無山林的氣味；\n處林泉之下，須要懷廊廟的經綸。","e":"거헌면지중, 불가무산림적기미;\n처림천지하, 수요회랑묘적경륜.","p":"높은 벼슬에 앉아 있어도 산림의 기운을 잃지 말아야 하고, 숲과 샘 아래에 있어도 조정에서 쓸 경륜을 품어야 한다.","c":"전집 제27장(前集 第27)","src":26},{"o":"憂勤是美德，太苦則無以適性怡情；\n澹泊是高風，太枯則無以濟人利物。","e":"우근시미덕, 태고즉무이적성이정;\n담박시고풍, 태고즉무이제인리물.","p":"걱정하고 부지런한 것은 아름다운 덕이지만 너무 괴로우면 성품을 펴고 마음을 즐겁게 하지 못한다. 담박함은 높은 기풍이지만 너무 메마르면 남을 돕고 만물을 이롭게 하지 못한다.","c":"전집 제29장(前集 第29)","src":28},{"o":"富貴家宜寬厚，而反忌刻，是富貴而貧賤其行矣，如何能享？\n聰明人宜斂藏，而反炫耀，是聰明而愚懵其病矣，如何不敗？","e":"부귀가의관후, 이반기각, 시부귀이빈천기행의, 여하능향?\n총명인의렴장, 이반현요, 시총명이우몽기병의, 여하불패?","p":"부귀한 집은 너그러워야 하는데 도리어 시기하고 각박하면, 부귀하면서 행실은 빈천한 것이니 어찌 그 복을 누리겠는가. 똑똑한 사람은 감추어야 하는데 도리어 드러내면, 똑똑하면서 병은 어리석은 것이니 어찌 망하지 않겠는가.","c":"전집 제31장(前集 第31)","src":30},{"o":"居卑而後知登高之為危，處晦而後知向明之太露；\n守靜而後知好動之過勞，養默而後知多言之為躁。","e":"거비이후지등고지위위, 처회이후지향명지태로;\n수정이후지호동지과로, 양묵이후지다언지위조.","p":"낮은 곳에 있어 본 뒤에야 높이 오름이 위험함을 알고, 어두운 곳에 있어 본 뒤에야 밝히 드러냄이 너무 환함을 안다. 고요함을 지킨 뒤에야 움직이기 좋아함이 수고로움을 알고, 침묵을 기른 뒤에야 말이 많음이 조급함임을 안다.","c":"전집 제32장(前集 第32)","src":31},{"o":"放得功名富貴之心下，便可脫凡；\n放得道德仁義之心下，纔可入聖。","e":"방득공명부귀지심하, 변가탈범;\n방득도덕인의지심하, 재가입성.","p":"공명과 부귀의 마음을 내려놓으면 속됨을 벗어날 수 있고, 도덕과 인의의 마음까지 내려놓아야 비로소 성인의 자리에 들어갈 수 있다.","c":"전집 제33장(前集 第33)","src":32},{"o":"利慾未盡害心，意見乃害心之蟊賊；\n聲色未必障道，聰明乃障道之藩屏。","e":"이욕미진해심, 의견내해심지모적;\n성색미필장도, 총명내장도지번병.","p":"이익과 욕심이 마음을 해치기도 하지만, 제 의견을 고집함이 마음을 해치는 좀벌레다. 소리와 색이 도를 막기도 하지만, 제 영리함이 도를 가로막는 울타리다.","c":"전집 제34장(前集 第34)","src":33},{"o":"寧守渾噩而黜聰明，留些正氣還天地；\n寧謝紛華而甘澹泊，遺個清名在乾坤。","e":"영수혼악이출총명, 유사정기환천지;\n영사분화이감담박, 유개청명재건곤.","p":"차라리 어리석음을 지키고 영리함을 물리쳐 바른 기운을 천지에 남길지언정, 화려한 것을 사양하고 담박함을 달게 여겨 맑은 이름을 천지에 남긴다.","c":"전집 제37장(前集 第37)","src":36},{"o":"降魔者，先降自心，心伏，則群魔退聽；\n馭橫者，先馭此氣，氣平，則外橫不侵。","e":"항마자, 선항자심, 심복, 즉군마퇴청;\n어횡자, 선어차기, 기평, 즉외횡불침.","p":"마귀를 항복시키려면 먼저 제 마음을 항복시켜야 하니, 마음이 굴하면 온갖 마귀가 물러나 듣는다. 거센 것을 다루려면 먼저 이 기운을 다루어야 하니, 기운이 평하면 밖의 거셈이 침범하지 못한다.","c":"전집 제38장(前集 第38)","src":37},{"o":"教弟子，如養閨女，最要嚴出入，謹交遊。\n若一接近匪人，是清淨田中，下一不淨種子，便終身難植嘉禾矣。","e":"교제자, 여양규녀, 최요엄출입, 근교유.\n약일접근비인, 시청정전중, 하일부정종자, 변종신난식가화의.","p":"자식을 가르치는 것은 규중 딸을 기르는 것과 같아서, 드나듦을 엄히 하고 사귐을 삼가야 한다. 한 번 못된 사람에게 가까워지면 깨끗한 밭에 더러운 씨를 뿌린 것이라, 평생 좋은 곡식을 심기 어렵다.","c":"전집 제39장(前集 第39)","src":38},{"o":"慾路上事，毋樂其便而姑為染指，一染指便深入萬仞；\n理路上事，無憚其難而稍為退步，一退步便遠隔千山。","e":"욕로상사, 무락기변이고위염지, 일염지변심입만인;\n이로상사, 무탄기난이초위퇴보, 일퇴보변원격천산.","p":"욕심의 길에서는 편하다고 좋아하며 슬쩍 손대지 말라. 한 번 손대면 만 길 깊이 들어간다. 도리의 길에서는 어렵다고 두려워하며 한 걸음 물러서지 말라. 한 걸음 물러서면 천 산 밖처럼 멀어진다.","c":"전집 제40장(前集 第40)","src":39},{"o":"念頭濃者，自待厚，待人亦厚，處處皆濃；\n念頭淡者，自待薄，待人亦薄，處處皆淡。\n故君子居常嗜好，不可太濃豔，亦不宜太枯寂。","e":"염두농자, 자대후, 대인역후, 처처개농;\n염두담자, 자대박, 대인역박, 처처개담.\n고군자거상기호, 불가태농염, 역불의태고적.","p":"생각이 진한 사람은 자기를 후하게 대하고 남도 후하게 대하여 곳곳이 진하다. 생각이 싱거운 사람은 자기를 박하게 대하고 남도 박하게 대하여 곳곳이 싱겁다. 군자의 평소 기호는 너무 짙어도 안 되고 너무 메말라서도 안 된다.","c":"전집 제41장(前集 第41)","src":40},{"o":"彼富我仁，彼爵我義，君子固不為君相所牢籠；\n人定勝天，志壹動氣，君子亦不受造物之陶鑄。","e":"피부아인, 피작아의, 군자고불위군상소뢰롱;\n인정승천, 지일동기, 군자역불수조물지도주.","p":"저는 부요 나는 어짊이요, 저는 벼슬이요 나는 의로움이라, 군자는 임금과 재상의 우리에 갇히지 않는다. 사람이 마음을 정하면 하늘을 이기고 뜻이 한결같으면 기운을 움직이니, 군자는 조물의 틀에 찍히지도 않는다.","c":"전집 제42장(前集 第42)","src":41},{"o":"風恬浪靜中，見人生之真境；\n味淡聲希處，識心體之本然。","e":"풍념랑정중, 견인생지진경;\n미담성희처, 식심체지본연.","p":"바람이 자고 물결이 잔잔할 때 인생의 참 경계를 보고, 맛이 싱겁고 소리가 드물 때 마음 본래의 모습을 안다.","c":"전집 제43장(前集 第43)","src":42},{"o":"立身不高一步立，如塵裏振衣，泥中濯足，如何超達；\n處世不退一步處，如飛蛾投燭，羝羊觸藩，如何安樂。","e":"입신불고일보립, 여진리진의, 이중탁족, 여하초달;\n처세불퇴일보처, 여비아투촉, 저양촉번, 여하안락.","p":"몸을 한 걸음 높이 세우지 못하면 먼지 속에서 옷을 털고 진흙 속에서 발을 씻는 격이라 어찌 초탈하겠는가. 세상을 한 걸음 물러서 처신하지 못하면 불나비가 촛불에 들고 숫양이 울타리에 받는 격이라 어찌 편안하겠는가.","c":"전집 제44장(前集 第44)","src":43},{"o":"學者要收拾精神，併歸一路。\n如修德而留意於事功名譽，必無實詣；\n讀書而寄興於吟詠風雅，定不深心。","e":"학자요수습정신, 병귀일로.\n여수덕이류의어사공명예, 필무실예;\n독서이기흥어음영풍아, 정불심심.","p":"배우는 사람은 정신을 거두어 한길로 모아야 한다. 덕을 닦으면서 공명과 명예에 마음을 두면 참된 조예가 없고, 글을 읽으면서 시와 풍류에 흥을 붙이면 마음이 깊어지지 않는다.","c":"전집 제45장(前集 第45)","src":44},{"o":"人人有個大慈悲，維摩屠劊無二心也；\n處處有種真趣味，金屋茅簷非兩地也。\n只是慾蔽情封，當面錯過，便咫尺千里矣。","e":"인인유개대자비, 유마도괴무이심야;\n처처유종진취미, 금옥모첨비량지야.\n지시욕폐정봉, 당면착과, 변지척천리의.","p":"사람마다 큰 자비심이 있어 유마와 백정의 마음이 둘이 아니고, 곳곳에 참된 재미가 있어 금옥과 초가의 처마가 두 땅이 아니다. 다만 욕심이 가리고 정이 막으면 눈앞에서 놓쳐, 지척이 천 리가 된다.","c":"전집 제46장(前集 第46)","src":45},{"o":"進德修道，要個木石的念頭，若一有欣羨，便趨慾境；\n濟世經邦，要段雲水的趣味，若一有貪著，便墮危機。","e":"진덕수도, 요개목석적념두, 약일유흔선, 변추욕경;\n제세경방, 요단운수적취미, 약일유탐착, 변타위기.","p":"덕에 나아가고 도를 닦는 데는 나무와 돌 같은 마음이 있어야 하니, 한 번 부러워하면 곧 욕심의 경계로 달린다. 세상을 구하고 나라를 경륜하는 데는 구름과 물 같은 재미가 있어야 하니, 한 번 탐내어 붙들면 곧 위태로운 데 떨어진다.","c":"전집 제47장(前集 第47)","src":46},{"o":"吉人無論作用安詳，即夢寐神魂，無非和氣；\n凶人無論行事狠戾，即聲音笑貌，渾是殺機。","e":"길인무론작용안상, 즉몽매신혼, 무비화기;\n흉인무론행사한려, 즉성음소모, 혼시살기.","p":"길한 사람은 하는 일이 편안하고 자세할 뿐 아니라 꿈속의 혼까지 다 화기이다. 흉한 사람은 하는 일이 사납고 거셀 뿐 아니라 소리와 웃음과 얼굴까지 온통 죽일 기운이다.","c":"전집 제48장(前集 第48)","src":47},{"o":"肝受病，則目不能視；\n腎受病，則耳不能聽；\n病受於人所不見，必發於人所共見。\n故君子欲無得罪於昭昭，先無得罪於冥冥。","e":"간수병, 즉목불능시;\n신수병, 즉이불능청;\n병수어인소불견, 필발어인소공견.\n고군자욕무득죄어소소, 선무득죄어명명.","p":"간이 병들면 눈이 보지 못하고, 콩팥이 병들면 귀가 듣지 못한다. 사람이 보이지 않는 데서 받은 병은 반드시 사람이 함께 보는 데서 드러난다. 군자가 밝은 데에서 죄를 얻지 않으려면 먼저 어두운 데에서 죄를 얻지 말아야 한다.","c":"전집 제49장(前集 第49)","src":48},{"o":"處治世宜方，處亂世宜圓，處叔季之世，當方圓並用；\n待善人宜寬，待惡人宜嚴，待庸眾之人，當寬嚴互存。","e":"처치세의방, 처란세의원, 처숙계지세, 당방원병용;\n대선인의관, 대악인의엄, 대용중지인, 당관엄호존.","p":"다스려진 세상에서는 모나게, 어지러운 세상에서는 둥글게, 말세에는 모남과 둥글을 함께 써야 한다. 착한 사람은 너그럽게, 악한 사람은 엄하게, 평범한 사람은 너그러움과 엄함을 아울러 두어야 한다.","c":"전집 제51장(前集 第51)","src":50},{"o":"施恩者，內不見己，外不見人，則斗粟可當萬鍾之惠；\n利物者，計己之施，責人之報，雖百鎰難成一文之功。","e":"시은자, 내불견기, 외불견인, 즉두속가당만종지혜;\n이물자, 계기지시, 책인지보, 수백일난성일문지공.","p":"은혜를 베풀면서 안으로는 나를 보지 않고 밖으로는 남을 보지 않으면, 한 말의 곡식도 만 섬의 은혜가 된다. 남을 이롭게 하면서 제 베풂을 헤아리고 남의 갚음을 재촉하면, 백 일의 금도 한 푼의 공을 이루지 못한다.","c":"전집 제53장(前集 第53)","src":52},{"o":"人之際遇，有齊有不齊，而能使己獨齊乎？\n己之情理，有順有不順，而能使人皆順乎？\n以此相觀對治，亦是一方便法門。","e":"인지제우, 유제유부제, 이능사기독제호?\n기지정리, 유순유불순, 이능사인개순호?\n이차상관대치, 역시일방변법문.","p":"사람의 처지는 고르기도 하고 고르지 않기도 한데, 나 혼자만 고르게 할 수 있겠는가. 내 정리도 순할 때가 있고 순하지 않을 때가 있는데, 남을 모두 순하게 할 수 있겠는가. 이것을 서로 비추어 다스리는 것도 하나의 방편이다.","c":"전집 제54장(前集 第54)","src":53},{"o":"心地清淨，方可讀書學古。\n不然，見一善行，竊以濟私，聞一善言，假以覆短，是又藉寇兵而齎盜糧矣。","e":"심지청정, 방가독서학고.\n불연, 견일선행, 절이제사, 문일선언, 가이복단, 시우자구병이자도량의.","p":"마음이 깨끗해야 글을 읽고 옛것을 배울 수 있다. 그렇지 않으면 착한 행실을 보고도 슬쩍 사사로움을 채우고, 착한 말을 듣고도 거짓으로 단점을 가리니, 이는 도둑에게 무기를 빌려 주고 양식을 대 주는 것이다.","c":"전집 제55장(前集 第55)","src":54},{"o":"讀書不見聖賢，為鉛槧傭；\n居官不愛子民，為衣冠盜；\n講學不尚躬行，為口頭禪；\n立業不思種德，為眼前花。","e":"독서불견성현, 위연참용;\n거관불애자민, 위의관도;\n강학불상궁행, 위구두선;\n입업불사종덕, 위안전화.","p":"글을 읽고도 성현을 보지 못하면 붓과 먹판의 품꾼이요, 벼슬하면서 백성을 사랑하지 않으면 의관의 도둑이요, 학문을 말하면서 몸소 행하지 않으면 입끝의 선이요, 업을 세우면서 덕을 심을 생각을 하지 않으면 눈앞의 꽃이다.","c":"전집 제57장(前集 第57)","src":56},{"o":"人心有一部真文章，都被殘編斷簡封錮了；\n有一部真鼓吹，都被妖姬豔舞湮沒了。\n學者須掃除外物，直覓本來，纔有個真受用。","e":"인심유일부진문장, 도피잔편단간봉고료;\n유일부진고취, 도피요희염무인몰료.\n학자수소제외물, 직멱본래, 재유개진수용.","p":"사람 마음에는 참된 글이 한 부 있으나 찢긴 책과 끊긴 죽간에 갇혀 있고, 참된 풍악이 한 부 있으나 요염한 춤에 파묻혀 있다. 배우는 사람은 바깥 물건을 쓸어 내고 본래를 곧장 찾아야 참으로 쓸 바가 생긴다.","c":"전집 제58장(前集 第58)","src":57},{"o":"富貴名譽，自道德來者，如山林中花，自是舒餘繁衍；\n自功業來者，如盆檻中花，便有遷徙廢興；\n若以權力得者，如瓶鉢中花，其根不值，其萎可立而待矣。","e":"부귀명예, 자도덕래자, 여산림중화, 자시서여번연;\n자공업래자, 여분함중화, 변유천사폐흥;\n약이권력득자, 여병발중화, 기근불치, 기위가립이대의.","p":"부귀와 명예가 도덕에서 온 것은 산속의 꽃처럼 절로 펴서 번성하고, 공업에서 온 것은 화분의 꽃처럼 옮기고 시들며 다시 핀다. 권력으로 얻은 것은 병과 바루의 꽃처럼 뿌리가 보잘것없어 곧 시들 것이다.","c":"전집 제60장(前集 第60)","src":59},{"o":"春至時和，花尚舖一段好色，鳥且囀幾句好音。\n士君子幸值清時，復遇溫飽，不思立好言，行好事，雖是在世百年，恰似未生一日。","e":"춘지시화, 화상포일단호색, 조차전기구호음.\n사군자행치청시, 복우온포, 불사립호언, 행호사, 수시재세백년, 흡사미생일일.","p":"봄이 오면 날씨가 화창하여 꽃도 한 자락 고운 빛을 펴고 새도 몇 마디 좋은 소리를 낸다. 선비가 맑은 때를 만나 따뜻하고 배부른데도 좋은 말을 세우고 좋은 일을 행할 생각이 없으면, 세상에 백 년을 살아도 하루를 나지 않은 것과 같다.","c":"전집 제61장(前集 第61)","src":60},{"o":"學者有段競業的心思，又要有段瀟洒的趣味。\n若一味斂束清苦，是有秋殺，無春生，何以發育萬物。","e":"학자유단경업적심사, 우요유단소쇄적취미.\n약일미렴속청고, 시유추살, 무춘생, 하이발육만물.","p":"배우는 사람에게는 힘써 다투는 마음이 있어야 하고, 또 훌훌 털어 버리는 재미도 있어야 한다. 한갓 움츠리고 맑고 괴롭게만 하면 가을의 죽임만 있고 봄의 살아남은 없으니, 어찌 만물을 기르겠는가.","c":"전집 제62장(前集 第62)","src":61},{"o":"名根未拔者，縱輕千乘甘一瓢，總墮塵情；\n客氣未融者，雖澤四海利萬世，終為賸技。","e":"명근미발자, 종경천승감일표, 총타진정;\n객기미융자, 수택사해리만세, 종위잉기.","p":"이름 낼 뿌리를 뽑지 못한 사람은 제후의 자리를 가볍게 보고 한 바가지를 달게 여겨도 끝내 티끌의 정에 떨어진다. 겉기운이 녹지 않은 사람은 사해를 적시고 만세를 이롭게 해도 끝내 남은 재주에 그친다.","c":"전집 제65장(前集 第65)","src":64},{"o":"人知名位為樂，不知無名無位之樂為最真；\n人知飢寒為憂，那知不飢不寒之憂為更甚。","e":"인지명위위락, 부지무명무위지락위최진;\n인지기한위우, 나지불기불한지우위갱심.","p":"사람은 이름과 자리가 즐거움인 줄은 알아도, 이름도 자리도 없는 즐거움이 가장 참된 줄은 모른다. 배고프고 추운 것을 근심인 줄은 알아도, 배고프지도 춥지도 않은 근심이 더 심한 줄은 알지 못한다.","c":"전집 제67장(前集 第67)","src":66},{"o":"天之機緘不測。\n抑而伸，伸而抑，皆是播弄英雄，顛倒豪傑處。\n君子只是逆來順受，居安思危，天亦無所施其技倆矣。","e":"천지기함불측.\n억이신, 신이억, 개시파롱영웅, 전도호걸처.\n군자지시역래순수, 거안사위, 천역무소시기기량의.","p":"하늘의 기틀은 헤아리기 어렵다. 눌렀다가 펴고 폈다가 누르는 것이 다 영웅을 희롱하고 호걸을 뒤집는 자리다. 군자는 다만 거스르는 것을 순히 받고 편안할 때 위태로움을 생각하니, 하늘도 재주를 쓸 곳이 없다.","c":"전집 제69장(前集 第69)","src":68},{"o":"燥性者火熾，遇物則焚；\n寡恩者冰清，逢物必殺；\n凝滯固執者，如死水腐木，生機已絕。\n俱難建功業而延福祉。","e":"조성자화치, 우물즉분;\n과은자빙청, 봉물필살;\n응체고집자, 여사수부목, 생기이절.\n구난건공업이연복지.","p":"조급한 성미는 불이 성하여 물건을 만나면 태우고, 은혜가 박한 사람은 얼음처럼 차가워 물건을 만나면 죽인다. 막히고 고집하는 사람은 죽은 물과 썩은 나무처럼 살아 있는 기운이 이미 끊겼다. 이들은 다 공업을 세우고 복을 이어 가기 어렵다.","c":"전집 제70장(前集 第70)","src":69},{"o":"十語九中，未必稱奇，一語不中，則愆尤駢集；\n十謀九成，未必歸功，一謀不成，則訾議叢興。\n君子所以寧默毋躁，寧拙毋巧。","e":"십어구중, 미필칭기, 일어부중, 즉건우편집;\n십모구성, 미필귀공, 일모불성, 즉자의총흥.\n군자소이녕묵무조, 영졸무교.","p":"열 마디에 아홉이 맞아도 기이하다 하지 않다가, 한 마디가 어긋나면 허물이 떼로 모인다. 열 가지 꾀에 아홉이 이루어져도 공을 돌리지 않다가, 한 꾀가 이루어지지 않으면 헐뜯음이 무더기로 일어난다. 그래서 군자는 차라리 잠잠하고 조급하지 않으며, 차라리 졸하고 교활하지 않는다.","c":"전집 제72장(前集 第72)","src":71},{"o":"泛駕之馬可就馳驅，躍冶之金終歸型範。\n只一優游不振，便終身無個進步。\n白沙云：「為人多病未足羞，一生無病是吾憂。」真確論也。","e":"범가지마가취치구, 약야지금종귀형범.\n지일우유부진, 변종신무개진보.\n백사운: “위인다병미족수, 일생무병시오우.\n”진확론야.","p":"고삐를 벗어나려는 말도 부려 달릴 수 있고, 풀무에서 튀어 나온 쇠도 끝내 틀로 돌아간다. 다만 한가로이 놀며 떨치지 못하면 평생 나아감이 없다. 백사가 이르되, 사람에게 병이 많음은 부끄러울 것이 못 되고, 한평생 병이 없음이 나의 걱정이라 하니, 참으로 맞는 말이다.","c":"전집 제78장(前集 第78)","src":77},{"o":"人只一會貪私，便銷剛為柔，塞智為昏，變恩為慘，染潔為污，壞了一生人品。\n故古人以不貪為寶，所以度越一世。","e":"인지일회탐사, 변소강위유, 색지위혼, 변은위참, 염결위오, 괴료일생인품.\n고고인이불탐위보, 소이도월일세.","p":"사람이 한 번 사사로운 탐욕을 품으면 굳셈이 부드러움으로 녹고, 지혜가 막혀 어두워지며, 은혜가 참혹함으로 변하고, 깨끗함이 더러움으로 물들어 한평생 인품이 무너진다. 옛사람이 탐하지 않음을 보배로 삼아 한 세상을 뛰어넘은 까닭이다.","c":"전집 제79장(前集 第79)","src":78},{"o":"耳目聞見為外賊，情欲意識為內賊。\n只是主人翁惺惺不昧，獨坐中堂，賊便化為家人矣。","e":"이목문견위외적, 정욕의식위내적.\n지시주인옹성성불매, 독좌중당, 적변화위가인의.","p":"귀와 눈이 보고 듣는 것은 바깥 도둑이고, 욕정과 의식은 안의 도둑이다. 다만 주인장이 또렷이 어둡지 않아 홀로 대청에 앉아 있으면, 도둑도 집안사람으로 변한다.","c":"전집 제80장(前集 第80)","src":79},{"o":"貧家淨掃地，貧女淨梳頭，景花雖不豔麗，氣度自是風雅。\n士君子一當窮愁寥落，奈何輒自廢弛哉。","e":"빈가정소지, 빈녀정소두, 경화수불염려, 기도자시풍아.\n사군자일당궁수료락, 내하첩자폐이재.","p":"가난한 집도 마당을 깨끗이 쓸고 가난한 처녀도 머리를 깨끗이 빗으면, 꽃은 화려하지 않아도 기품은 절로 풍아하다. 선비가 한 번 궁하고 쓸쓸해졌다고 어찌 곧바로 스스로를 버리고 풀어지겠는가.","c":"전집 제85장(前集 第85)","src":84},{"o":"念頭起處，纔覺向慾路上去，便挽從理路上來。\n一起便覺，一覺便轉，此是轉禍為福，起死回生的關頭，切莫輕易放過。","e":"염두기처, 재각향욕로상거, 변만종리로상래.\n일기변각, 일각변전, 차시전화위복, 기사회생적관두, 절막경역방과.","p":"생각이 일어나는 자리에서 욕심의 길로 가는 것을 깨닫는 즉시 도리의 길로 끌어와야 한다. 일어나자마자 깨닫고, 깨닫자마자 돌이키는 것이 화를 복으로 돌리고 죽은 것을 살리는 고비이니, 결코 가볍게 지나치지 말라.","c":"전집 제87장(前集 第87)","src":86},{"o":"靜中念慮澄澈，見心之真體；\n閒中氣象從容，識心之真機；\n淡中意趣沖夷，得心之真味。\n觀心證道，無如此三者。","e":"정중념려징철, 견심지진체;\n한중기상종용, 식심지진기;\n담중의취충이, 득심지진미.\n관심증도, 무여차삼자.","p":"고요함 속에서 생각이 맑으면 마음 참 몸을 보고, 한가함 속에서 기상이 너그러우면 마음의 참 기틀을 알며, 싱거움 속에서 뜻이 온화하면 마음의 참 맛을 얻는다. 마음을 보아 도를 증험함에 이 세 가지 같은 것이 없다.","c":"전집 제88장(前集 第88)","src":87},{"o":"靜中靜非真靜，動處靜得來，纔是性天之真境；\n樂纔樂非真樂，苦中樂得來，纔見心體之真機。","e":"정중정비진정, 동처정득래, 재시성천지진경;\n낙재락비진락, 고중락득래, 재견심체지진기.","p":"고요함 속의 고요는 참고요가 아니요, 움직이는 데서 얻어 온 고요라야 성품과 하늘의 참 경계이다. 즐거움 끝의 즐거움은 참즐거움이 아니요, 괴로움 속에서 얻어 온 즐거움이라야 마음 본체의 참 기틀을 본다.","c":"전집 제89장(前集 第89)","src":88},{"o":"捨己毋處其疑，處其疑，即所舍之志多愧矣；\n施人無責其報，責其報，並所施之心俱非矣。","e":"사기무처기의, 처기의, 즉소사지지다괴의;\n시인무책기보, 책기보, 병소시지심구비의.","p":"나를 버릴 때 의심하는 자리에 두지 말라. 의심하면 버린 뜻도 부끄러움이 많다. 남에게 베풀고 그 갚음을 책하지 말라. 갚음을 책하면 베푼 마음까지 다 그르다.","c":"전집 제90장(前集 第90)","src":89},{"o":"天薄我以福，吾厚吾德以迓之；\n天勞我以形，吾逸吾心以補之；\n天阨我以遇，吾亨吾道以通之。\n天且奈我何哉。","e":"천박아이복, 오후오덕이아지;\n천로아이형, 오일오심이보지;\n천액아이우, 오형오도이통지.\n천차내아하재.","p":"하늘이 복을 박하게 주면 나는 덕을 두터이 하여 맞이하고, 하늘이 몸을 수고롭게 하면 나는 마음을 편안하게 하여 보태며, 하늘이 처지를 막으면 나는 도를 형통하게 하여 뚫는다. 하늘인들 나를 어찌하겠는가.","c":"전집 제91장(前集 第91)","src":90},{"o":"貞士無心徼福，天即就無心處牖其衷；\n憸人著意避禍，天即就著意中奪其魄。\n可見天之機權最神，人之智巧何益。","e":"정사무심요복, 천즉취무심처유기충;\n섬인착의피화, 천즉취착의중탈기백.\n가견천지기권최신, 인지지교하익.","p":"곧은 선비는 복을 빌 마음이 없으니, 하늘은 그 마음 없는 자리에서 속마음을 열어 준다. 간사한 사람은 일부러 화를 피하니, 하늘은 그 일부러 하는 속에서 넋을 빼앗는다. 하늘의 기틀이 가장 신묘하니, 사람의 잔꾀가 무슨 보탬이 되겠는가.","c":"전집 제92장(前集 第92)","src":91},{"o":"聲妓晚歲從良，一世之烟花無礙；\n貞婦白頭失守，半生之消苦俱非。\n語云：「看人只看後半截。」真名言也。","e":"성기만세종양, 일세지연화무애;\n정부백두실수, 반생지소고구비.\n어운: “간인지간후반절.\n”진명언야.","p":"기생이 늘그막에 착한 길로 들면 한평생의 풍진이 거리끼지 않고, 정절 있는 부인이 백발이 되어 절개를 잃으면 반평생의 괴로움이 다 헛되다. 말이 이르되 사람은 뒷부분만 보라 하니, 참으로 이름난 말이다.","c":"전집 제93장(前集 第93)","src":92},{"o":"問祖宗之德澤，吾身所享者是，當念其積累之難；\n問子孫之福祉，吾身所貽者是，要思其傾覆之易。","e":"문조종지덕택, 오신소향자시, 당념기적루지난;\n문자손지복지, 오신소이자시, 요사기경복지역.","p":"조상의 덕택을 물으면 내 몸이 누리는 것이 그것이니, 쌓기가 어려웠음을 생각해야 한다. 자손의 복을 물으면 내 몸이 물려주는 것이 그것이니, 엎어지기가 쉬움을 생각해야 한다.","c":"전집 제95장(前集 第95)","src":94},{"o":"家人有過，不宜暴怒，不宜輕棄。\n此事難言，借他事隱諷之；\n今日不悟，俟來日再警之。\n如春風解凍，如和氣消冰，纔是家庭的型範。","e":"가인유과, 불의포노, 불의경기.\n차사난언, 차타사은풍지;\n금일불오, 사래일재경지.\n여춘풍해동, 여화기소빙, 재시가정적형범.","p":"집안사람에게 허물이 있으면 벌컥 노해서도 안 되고 가볍게 버려서도 안 된다. 그 일을 말하기 어려우면 다른 일로 빗대어 타이르고, 오늘 깨닫지 못하면 오는 날을 기다려 다시 깨우친다. 봄바람이 언 것을 풀고 따뜻한 기운이 얼음을 녹이듯 해야 집안의 본보기가 된다.","c":"전집 제97장(前集 第97)","src":96},{"o":"澹泊之士，必為濃豔者所疑；\n檢飾之人，多為放肆者所忌。\n君子處此，固不可少變其操履，亦不可露其鋒芒。","e":"담박지사, 필위농염자소의;\n검식지인, 다위방사자소기.\n군자처차, 고불가소변기조리, 역불가로기봉망.","p":"담박한 선비는 반드시 화려한 사람에게 의심을 받고, 몸을 단속하는 사람은 흔히 제멋대로인 사람에게 미움을 받는다. 군자가 여기에 처해서는 지조를 조금도 바꾸지 말되, 날카로운 끝을 드러내서도 안 된다.","c":"전집 제99장(前集 第99)","src":98},{"o":"生長富貴叢中的，嗜慾如猛火，權勢如烈燄。\n若不帶些清冷氣味，其火燄若不焚人，必將自爍矣。","e":"생장부귀총중적, 기욕여맹화, 권세여렬염.\n약부대사청랭기미, 기화염약불분인, 필장자삭의.","p":"부귀의 덤불 속에서 자란 사람은 욕심이 맹화 같고 권세가 거센 불길 같다. 맑고 찬 기운을 조금 지니지 않으면, 그 불길은 남을 태우지 않아도 반드시 스스로를 태울 것이다.","c":"전집 제101장(前集 第101)","src":100},{"o":"人心一真，便霜可飛，城可摧，金石可貫。\n若偽妄之人，行骸徒具，真己已亡，對人則面目可憎，獨居則形影自媿。","e":"인심일진, 변상가비, 성가최, 금석가관.\n약위망지인, 행해도구, 진기이망, 대인즉면목가증, 독거즉형영자괴.","p":"사람의 마음이 한 번 참되면 서리도 날게 하고 성도 무너뜨리며 쇠와 돌도 뚫는다. 거짓되고 망령된 사람은 몸뚱이만 있을 뿐 참된 자기는 이미 죽었으니, 사람을 대하면 얼굴이 미웁고 홀로 있으면 그림자에게 부끄럽다.","c":"전집 제102장(前集 第102)","src":101},{"o":"以幻迹言，無論功名富貴，即肢體亦屬委形；\n以真境言，無論父母兄弟，即萬物皆吾一體。\n人能看得破，認得真，纔可以任天下之負擔，亦可脫世間之韁鎖。","e":"이환적언, 무론공명부귀, 즉지체역속위형;\n이진경언, 무론부모형제, 즉만물개오일체.\n인능간득파, 인득진, 재가이임천하지부담, 역가탈세간지강쇄.","p":"허깨비의 자취로 말하면 공명과 부귀뿐 아니라 사지까지 잠시 붙은 형체이다. 참된 경계로 말하면 부모 형제뿐 아니라 만물이 다 나와 한 몸이다. 사람이 꿰뚫어 보고 참으로 알면, 비로소 천하의 짐을 질 수 있고 세상의 고삐와 자물쇠도 벗을 수 있다.","c":"전집 제104장(前集 第104)","src":103},{"o":"士君子持身不可輕，輕則物能撓我，而無悠閑鎮定之趣；\n用意不可重，重則我為物泥，而無瀟灑活潑之機。","e":"사군자지신불가경, 경즉물능요아, 이무유한진정지취;\n용의불가중, 중즉아위물니, 이무소쇄활발지기.","p":"선비가 몸을 지님에 너무 가벼워서는 안 된다. 가벼우면 물건이 나를 흔들어 한가하고 침착한 맛이 없다. 뜻을 씀에 너무 무거워서는 안 된다. 무거우면 내가 물건에 빠져 활달하고 생동하는 기틀이 없다.","c":"전집 제107장(前集 第107)","src":106},{"o":"天地有萬古，此身不再得；\n人生只百年，此日最易過。\n幸生其間者，不可不知有生之樂，亦不可不懷虛生之憂。","e":"천지유만고, 차신부재득;\n인생지백년, 차일최이과.\n행생기간자, 불가부지유생지락, 역불가불회허생지우.","p":"천지는 만고가 있으나 이 몸은 다시 얻지 못하고, 인생은 백 년뿐인데 이날이 가장 지나가기 쉽다. 그 사이에 태어난 사람은 삶이 있는 즐거움을 몰라서는 안 되고, 헛되이 사는 근심을 품지 않아서도 안 된다.","c":"전집 제108장(前集 第108)","src":107},{"o":"公道正論，不可犯手，一犯，則貽羞萬世；\n權門私竇，不可著腳，一著，則點汗終身。","e":"공도정론, 불가범수, 일범, 즉이수만세;\n권문사두, 불가착각, 일착, 즉점한종신.","p":"공도와 바른 논의에는 손을 대서는 안 되니, 한 번 범하면 만세에 부끄러움을 남긴다. 권세의 문과 사사로운 구멍에는 발을 들여서는 안 되니, 한 번 디디면 평생에 더러움을 찍는다.","c":"전집 제112장(前集 第112)","src":111},{"o":"藏巧於拙，用晦而明，寓清之濁，以屈為伸，真涉世之一壺，藏身之三窟也。","e":"장교어졸, 용회이명, 우청지탁, 이굴위신, 진섭세지일호, 장신지삼굴야.","p":"교묘함을 졸함 속에 감추고, 어둠을 써서 밝히며, 맑음을 흐림에 담고, 굽힘으로 폄을 삼는 것이야말로 세상을 건널 때 쓰는 표주박 하나와 몸을 숨길 굴 셋이다.","c":"전집 제117장(前集 第117)","src":116},{"o":"衰颯的景象，就在盛滿中；\n發生的機緘，即在零落內。\n故君子居安，宜操一心以慮患；\n處變，當堅百忍以圖成。","e":"쇠삽적경상, 취재성만중;\n발생적기함, 즉재령락내.\n고군자거안, 의조일심이려환;\n처변, 당견백인이도성.","p":"시들하고 쓸쓸한 모습은 가득 찬 한가운데 있고, 피어나는 기틀은 바로 떨어진 속에도 있다. 그러므로 군자는 편안할 때 한마음을 잡아 환난을 생각하고, 변고를 만나면 백 번 참음을 굳혀 이룸을 도모해야 한다.","c":"전집 제118장(前集 第118)","src":117},{"o":"當怒火慾水正騰沸處，明明知得，又明明犯著。\n知的是誰，犯的又是誰，此處能猛然轉念，邪魔便為真君矣。","e":"당노화욕수정등비처, 명명지득, 우명명범착.\n지적시수, 범적우시수, 차처능맹연전념, 사마변위진군의.","p":"노여움의 불과 욕심의 물이 끓어오를 때, 분명히 알면서도 또 분명히 저지른다. 아는 자는 누구이고 저지르는 자는 또 누구인가. 여기서 문득 생각을 돌리면 삿된 마귀가 곧 참된 임금이 된다.","c":"전집 제120장(前集 第120)","src":119},{"o":"人之短處，要曲為彌縫，如暴而揚之，是以短攻短；\n人有頑的，要善為化誨，如忿而疾之，是以頑濟頑。","e":"인지단처, 요곡위미봉, 여포이양지, 시이단공단;\n인유완적, 요선위화회, 여분이질지, 시이완제완.","p":"남의 단점은 굽혀서 감싸 주어야 하니, 드러내어 퍼뜨리면 단점으로 단점을 치는 것이다. 남의 완고함은 잘 타일러 바꿔야 하니, 성내어 미워하면 완고함으로 완고함을 돕는 것이다.","c":"전집 제122장(前集 第122)","src":121},{"o":"念頭昏散處，要知提醒；\n念頭喫緊時，要知放下。\n不然恐去昏昏之病，又來憧憧之擾矣。","e":"염두혼산처, 요지제성;\n염두끽긴시, 요지방하.\n불연공거혼혼지병, 우래충충지요의.","p":"생각이 어둡고 흩어질 때는 깨우쳐 일으킬 줄 알고, 생각이 바짝 조일 때는 내려놓을 줄 알아야 한다. 그렇지 않으면 어두운 병은 갔다가 다시 들뜬 시끄러움이 온다.","c":"전집 제124장(前集 第124)","src":123},{"o":"霽日青天，倏變為迅雷震電；\n疾風怒雨，倏轉為朗月晴空。\n氣機何嘗有一毫凝滯，太虛何嘗有一毫障塞，人之心體，亦當如是。","e":"제일청천, 숙변위신뢰진전;\n질풍노우, 숙전위낭월청공.\n기기하상유일호응체, 태허하상유일호장색, 인지심체, 역당여시.","p":"개인 하늘이 문득 벼락과 번개로 변하고, 거센 비바람이 문득 밝은 달과 갠 하늘로 돌아선다. 기운의 기틀에 어찌 털끝만 한 막힘이 있으며, 빈 하늘에 어찌 털끝만 한 막힘이 있으랴. 사람의 마음도 마땅히 이와 같아야 한다.","c":"전집 제125장(前集 第125)","src":124},{"o":"勝私制慾之功，有曰識不早，力不易者，有曰識得破，忍不過者。\n蓋識是一顆照魔的明珠，力是一把斬魔的慧劍，兩不可少也。","e":"승사제욕지공, 유왈식부조, 역불역자, 유왈식득파, 인불과자.\n개식시일과조마적명주, 역시일파참마적혜검, 양불가소야.","p":"사사로움을 이기고 욕심을 누르는 공부에는, 알아챔이 이르지 못하고 힘이 쉽지 않은 이가 있고, 꿰뚫어 알아도 참지 못하는 이가 있다. 알아챔은 마귀를 비추는 명주요, 힘은 마귀를 베는 지혜의 칼이니, 둘 다 없어서는 안 된다.","c":"전집 제126장(前集 第126)","src":125},{"o":"吾身一小天地也，使喜怒不愆，好惡有則，便是燮理的工夫；\n天地一大父母也，使民無怨咨，物無氛疹，亦是敦睦的氣象。","e":"오신일소천지야, 사희노불건, 호오유즉, 변시섭리적공부;\n천지일대부모야, 사민무원자, 물무분진, 역시돈목적기상.","p":"내 몸은 하나의 작은 천지이니, 기쁨과 노여움이 지나치지 않고 좋고 미움에 법도가 있으면 그것이 천지를 고르게 하는 공부이다. 천지는 하나의 큰 부모이니, 백성에게 원망이 없고 만물에 병기가 없으면 그것 또한 두터이 화목한 기상이다.","c":"전집 제129장(前集 第129)","src":128},{"o":"害人之心不可有，防人之心不可無，此戒疏於慮也；\n寧受人之欺，毋逆人之詐，此儆傷於察也；\n二語並存，精明而渾厚矣。","e":"해인지심불가유, 방인지심불가무, 차계소어려야;\n영수인지기, 무역인지사, 차경상어찰야;\n이어병존, 정명이혼후의.","p":"남을 해칠 마음은 가져서는 안 되고, 남을 막을 마음은 없어서는 안 되니, 이는 생각이 소홀함을 경계한 말이다. 차라리 남의 속임을 받을지언정 남의 거짓을 먼저 맞이하지 말라는 것은, 살핌이 지나쳐 사람을 상하게 함을 경계한 말이다. 두 말을 함께 두면 밝으면서도 도탑다.","c":"전집 제130장(前集 第130)","src":129},{"o":"善人未能急親，不宜預揚，恐來讒譖之奸；\n惡人未能輕去，不宜先發，恐遭媒孽之禍。","e":"선인미능급친, 불의예양, 공래참참지간;\n악인미능경거, 불의선발, 공조매얼지화.","p":"착한 사람에게 빨리 가까이하지 못했다 하여 미리 칭찬하지 말라. 참소하는 간사함이 올까 두렵다. 악한 사람을 가볍게 물리치지 못했다 하여 먼저 드러내지 말라. 죄를 엮는 화가 닥칠까 두렵다.","c":"전집 제132장(前集 第132)","src":131},{"o":"青天白日的節義，自暗室屋漏中培來；\n旋乾轉坤的經綸，自臨深履薄處繅出。","e":"청천백일적절의, 자암실옥루중배래;\n선건전곤적경륜, 자임심리박처소출.","p":"푸른 하늘 대낮 같은 절의는 어두운 방과 새는 지붕 아래에서 길러 온 것이고, 하늘을 돌리고 땅을 뒤집는 경륜은 깊은 데 임하고 얇은 데를 밟듯 삼가는 자리에서 뽑아 낸 것이다.","c":"전집 제133장(前集 第133)","src":132},{"o":"父慈子孝，兄友弟恭，縱做到極處，俱是合當如此，著不得一毫感激的念頭。\n如施者任德，受者懷恩，便是路人，便成市道矣。","e":"부자자효, 형우제공, 종주도극처, 구시합당여차, 착부득일호감격적념두.\n여시자임덕, 수자회은, 변시로인, 변성시도의.","p":"아버지가 자애롭고 자식이 효도하며, 형이 우애롭고 아우가 공손한 것은 아무리 지극해도 다 마땅히 그러해야 하는 것이니, 털끝만 한 감사의 생각도 붙여서는 안 된다. 베푸는 이가 덕을 내세우고 받는 이가 은혜를 품으면 곧 길 가는 사람이요, 곧 시장의 거래가 된다.","c":"전집 제134장(前集 第134)","src":133},{"o":"炎涼之態，富貴更甚於貧賤；\n妒忌之心，骨肉尤狠於外人。\n此處若不當以冷腸，御以平氣，鮮不日坐煩惱障中矣。","e":"염량지태, 부귀갱심어빈천;\n투기지심, 골육우한어외인.\n차처약부당이랭장, 어이평기, 선불일좌번뇌장중의.","p":"덥다 차다 하는 태도는 빈천한 이보다 부귀한 이에게 더 심하고, 시기하는 마음은 남보다 피붙이에게 더욱 모질다. 여기를 차가운 마음으로 당하고 고른 기운으로 다루지 않으면, 날마다 번뇌의 장애 속에 앉아 있지 않는 이가 드물다.","c":"전집 제136장(前集 第136)","src":135},{"o":"德者才之主，才者德之奴。\n有才無德，如家無主而奴用事矣，幾何不魍魎猖狂。","e":"덕자재지주, 재자덕지노.\n유재무덕, 여가무주이노용사의, 기하불망량창광.","p":"덕은 재주의 주인이요, 재주는 덕의 종이다. 재주만 있고 덕이 없으면 집에 주인이 없어 종이 일을 부리는 것과 같으니, 도깨비가 날뛰지 않을 리가 없다.","c":"전집 제140장(前集 第140)","src":139},{"o":"鋤奸杜倖，要放他一條去路。\n若使之一無所容，譬如塞鼠穴者，一切去路都塞盡，則一切好物俱咬破矣。","e":"서간두행, 요방타일조거로.\n약사지일무소용, 비여색서혈자, 일체거로도색진, 즉일체호물구교파의.","p":"간사한 자를 제거하고 요행을 막는 데도 그에게 빠져나갈 길을 하나 열어 주어야 한다. 한 곳도 용납하지 않으면, 쥐구멍을 막는 사람이 나가는 길을 다 막아 좋은 물건까지 죄다 갉히게 하는 것과 같다.","c":"전집 제141장(前集 第141)","src":140},{"o":"士君子，貧不能濟物者，遇人癡迷處，出一言提醒之；\n遇人急難處，出一言解救之，亦是無量功德。","e":"사군자, 빈불능제물자, 우인치미처, 출일언제성지;
