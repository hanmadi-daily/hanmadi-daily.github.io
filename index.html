hat which is remembered.","ko":"모든 것은 하루살이다. 기억하는 사람도, 기억되는 사람도.","c":"제4권 35절 (Book IV, 35)","src":"4.35"},{"b":"가난한 리처드의 달력","en":"Diligence is the mother of good luck.","ko":"부지런함은 행운의 어머니다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#112"},{"b":"잠언","en":"Hatred stirreth up strifes: but love covereth all sins.","ko":"미움은 다툼을 일으키지만, 사랑은 모든 허물을 덮는다.","c":"10장 12절 (Proverbs 10:12, KJV)","src":"10:12"},{"b":"명상록","en":"Time is like a river made up of the events which happen, and a violent stream; for as soon as a thing has been seen, it is carried away, and another comes in its place, and this will be carried away too.","ko":"세월은 일어나는 일들로 이루어진 강, 거센 물살과 같다. 무엇이든 눈에 띄자마자 떠내려가고 다른 것이 그 자리에 오며, 그것도 곧 떠내려간다.","c":"제4권 43절 (Book IV, 43)","src":"4.43"},{"b":"가난한 리처드의 달력","en":"Hunger is the best pickle.","ko":"시장이 반찬이다. (배고픔이 가장 좋은 장아찌다.)","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#254"},{"b":"잠언","en":"In the multitude of words there wanteth not sin: but he that refraineth his lips is wise.","ko":"말이 많으면 허물을 면하기 어렵다. 입술을 다스리는 사람이 지혜롭다.","c":"10장 19절 (Proverbs 10:19, KJV)","src":"10:19"},{"b":"명상록","en":"Everything which happens is as familiar and well known as the rose in spring and the fruit in summer; for such is disease, and death, and calumny, and treachery, and whatever else delights fools or vexes them.","ko":"일어나는 모든 일은 봄의 장미, 여름의 열매처럼 늘 있고 익숙한 것이다. 병도, 죽음도, 헐뜯음도, 배신도, 어리석은 이를 기쁘게 하거나 괴롭히는 그 밖의 모든 것도 그렇다.","c":"제4권 44절 (Book IV, 44)","src":"4.44"},{"b":"가난한 리처드의 달력","en":"Speak little, do much.","ko":"말은 적게, 일은 많이.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#457"},{"b":"잠언","en":"When pride cometh, then cometh shame: but with the lowly is wisdom.","ko":"교만이 오면 부끄러움도 온다. 그러나 겸손한 사람에게는 지혜가 있다.","c":"11장 2절 (Proverbs 11:2, KJV)","src":"11:2"},{"b":"명상록","en":"Always run to the short way; and the short way is the natural: accordingly say and do everything in conformity with the soundest reason. For such a purpose frees a man from trouble, and warfare, and all artifice and ostentatious display.","ko":"늘 지름길로 달려라. 지름길은 자연스러운 길이다. 그러니 가장 건전한 이성에 맞게 말하고 행동하라. 그런 마음가짐은 사람을 근심과 다툼과 온갖 꾸밈과 겉치레에서 벗어나게 한다.","c":"제4권 51절 (Book IV, 51)","src":"4.51"},{"b":"가난한 리처드의 달력","en":"Glass, china, and reputation are easily crack'd, and never well mended.","ko":"유리와 도자기와 평판은 쉽게 금이 가고, 한번 금이 가면 다시 붙이기 어렵다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#160"},{"b":"잠언","en":"The liberal soul shall be made fat: and he that watereth shall be watered also himself.","ko":"너그럽게 베푸는 사람은 넉넉해지고, 남에게 물을 주는 사람은 자기도 물을 얻는다.","c":"11장 25절 (Proverbs 11:25, KJV)","src":"11:25"},{"b":"명상록","en":"Does another do me wrong? Let him look to it. He has his own disposition, his own activity. I now have what the universal nature now wills me to have; and I do what my nature now wills me to do.","ko":"누가 나에게 잘못하는가? 그것은 그 사람이 알아서 할 일이다. 그에게는 그의 성품과 행동이 있다. 나는 지금 우주의 본성이 내게 주려는 것을 가졌고, 나의 본성이 내게 하라는 일을 한다.","c":"제5권 25절 (Book V, 25)","src":"5.25"},{"b":"가난한 리처드의 달력","en":"Content makes poor men rich; discontent makes rich men poor.","ko":"만족하는 마음은 가난한 사람을 부자로 만들고, 불만은 부자를 가난하게 만든다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#100"},{"b":"잠언","en":"The way of a fool is right in his own eyes: but he that hearkeneth unto counsel is wise.","ko":"어리석은 자는 제 길이 옳다고 여기지만, 남의 조언에 귀 기울이는 사람은 지혜롭다.","c":"12장 15절 (Proverbs 12:15, KJV)","src":"12:15"},{"b":"명상록","en":"The best way of avenging thyself is not to become like [the wrong-doer].","ko":"가장 좋은 복수는 잘못한 사람과 똑같이 되지 않는 것이다.","c":"제6권 6절 (Book VI, 6)","src":"6.6"},{"b":"가난한 리처드의 달력","en":"He that lies down with dogs, shall rise up with fleas.","ko":"개와 함께 누운 사람은 벼룩과 함께 일어난다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#225"},{"b":"잠언","en":"Heaviness in the heart of man maketh it stoop: but a good word maketh it glad.","ko":"마음의 근심은 사람을 짓누르지만, 따뜻한 말 한마디는 마음을 기쁘게 한다.","c":"12장 25절 (Proverbs 12:25, KJV)","src":"12:25"},{"b":"명상록","en":"When thou hast been compelled by circumstances to be disturbed in a manner, quickly return to thyself, and do not continue out of tune longer than the compulsion lasts; for thou wilt have more mastery over the harmony by continually recurring to it.","ko":"어쩔 수 없는 일로 마음이 흔들렸거든 얼른 자신에게로 돌아오라. 꼭 필요한 동안보다 더 오래 가락을 잃고 있지 말라. 자꾸 제자리로 돌아오다 보면 마음의 조화를 더 잘 다스리게 된다.","c":"제6권 11절 (Book VI, 11)","src":"6.11"},{"b":"가난한 리처드의 달력","en":"Have you somewhat to do to-morrow; do it to-day.","ko":"내일 할 일이 있는가? 오늘 하라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#186"},{"b":"잠언","en":"He that walketh with wise men shall be wise: but a companion of fools shall be destroyed.","ko":"지혜로운 사람과 함께 걸으면 지혜로워지고, 어리석은 자와 벗하면 해를 입는다.","c":"13장 20절 (Proverbs 13:20, KJV)","src":"13:20"},{"b":"명상록","en":"If a thing is difficult to be accomplished by thyself, do not think that it is impossible for man: but if anything is possible for man and conformable to his nature, think that this can be attained by thyself too.","ko":"어떤 일이 네게 어렵다고 해서 사람이 할 수 없는 일이라 여기지 말라. 사람이 할 수 있고 사람의 본성에 맞는 일이라면, 너도 해낼 수 있다고 생각하라.","c":"제6권 19절 (Book VI, 19)","src":"6.19"},{"b":"가난한 리처드의 달력","en":"To-morrow every fault is to be amended; but that to-morrow never comes.","ko":"모든 잘못은 내일 고치겠다고 하지만, 그 내일은 끝내 오지 않는다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#585"},{"b":"잠언","en":"He that is slow to wrath is of great understanding: but he that is hasty of spirit exalteth folly.","ko":"노하기를 더디 하는 사람은 슬기가 크고, 성미가 급한 사람은 어리석음을 드러낸다.","c":"14장 29절 (Proverbs 14:29, KJV)","src":"14:29"},{"b":"명상록","en":"If any man is able to convince me and show me that I do not think or act right, I will gladly change; for I seek the truth, by which no man was ever injured. But he is injured who abides in his error and ignorance.","ko":"누군가 내 생각이나 행동이 옳지 않다고 깨우쳐 준다면 나는 기꺼이 고치겠다. 나는 진리를 구하며, 진리 때문에 해를 입은 사람은 아무도 없다. 해를 입는 것은 잘못과 무지에 머무는 사람이다.","c":"제6권 21절 (Book VI, 21)","src":"6.21"},{"b":"가난한 리처드의 달력","en":"The heart of the fool is in his mouth, but the mouth of the wise man is in his heart.","ko":"어리석은 사람의 마음은 입에 있고, 지혜로운 사람의 입은 마음에 있다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#495"},{"b":"잠언","en":"A sound heart is the life of the flesh: but envy the rottenness of the bones.","ko":"평온한 마음은 몸의 생명이요, 시기는 뼈를 썩게 한다.","c":"14장 30절 (Proverbs 14:30, KJV)","src":"14:30"},{"b":"명상록","en":"It is a shame for the soul to be first to give way in this life, when thy body does not give way.","ko":"몸은 아직 버티는데 마음이 먼저 주저앉는 것은 부끄러운 일이다.","c":"제6권 29절 (Book VI, 29)","src":"6.29"},{"b":"가난한 리처드의 달력","en":"The wise man draws more advantage from his enemies, than the fool from his friends.","ko":"지혜로운 사람은 원수에게서 얻는 것이, 어리석은 사람이 벗에게서 얻는 것보다 많다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#547"},{"b":"잠언","en":"A soft answer turneth away wrath: but grievous words stir up anger.","ko":"부드러운 대답은 노여움을 가라앉히고, 모진 말은 화를 돋운다.","c":"15장 1절 (Proverbs 15:1, KJV)","src":"15:1"},{"b":"명상록","en":"Adapt thyself to the things with which thy lot has been cast: and the men among whom thou hast received thy portion, love them, but do it truly [sincerely].","ko":"네 몫으로 주어진 처지에 너를 맞추라. 함께 살도록 정해진 사람들을 사랑하되, 진심으로 사랑하라.","c":"제6권 39절 (Book VI, 39)","src":"6.39"},{"b":"가난한 리처드의 달력","en":"Love your neighbor; yet don't pull down your hedge.","ko":"이웃을 사랑하라. 그러나 울타리는 허물지 말라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#339"},{"b":"잠언","en":"A merry heart maketh a cheerful countenance: but by sorrow of the heart the spirit is broken.","ko":"즐거운 마음은 얼굴을 밝게 하고, 마음이 슬프면 기운이 꺾인다.","c":"15장 13절 (Proverbs 15:13, KJV)","src":"15:13"},{"b":"명상록","en":"It is in our power to have no opinion about a thing, and not to be disturbed in our soul; for things themselves have no natural power to form our judgments.","ko":"어떤 일에 대해 판단을 내리지 않고 마음을 어지럽히지 않는 것은 우리 힘으로 할 수 있다. 사물 자체에는 우리의 판단을 만들어 낼 힘이 없기 때문이다.","c":"제6권 52절 (Book VI, 52)","src":"6.52"},{"b":"가난한 리처드의 달력","en":"No gains without pains.","ko":"수고 없이는 얻는 것도 없다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#381"},{"b":"잠언","en":"Better is little with the fear of the LORD than great treasure and trouble therewith.","ko":"주를 경외하며 적게 가진 것이, 많은 재물을 두고 근심하는 것보다 낫다.","c":"15장 16절 (Proverbs 15:16, KJV)","src":"15:16"},{"b":"명상록","en":"Accustom thyself to attend carefully to what is said by another, and as much as it is possible, be in the speaker's mind.","ko":"남이 하는 말을 귀 기울여 듣는 버릇을 들이고, 될 수 있는 대로 말하는 사람의 마음속에 들어가 보라.","c":"제6권 53절 (Book VI, 53)","src":"6.53"},{"b":"가난한 리처드의 달력","en":"Search others for their virtues, thyself for thy vices.","ko":"남에게서는 덕을 찾고, 나에게서는 허물을 찾아라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#441"},{"b":"잠언","en":"Better is a dinner of herbs where love is, than a stalled ox and hatred therewith.","ko":"사랑이 있는 곳에서 먹는 나물 한 접시가, 미워하며 먹는 살진 소고기보다 낫다.","c":"15장 17절 (Proverbs 15:17, KJV)","src":"15:17"},{"b":"명상록","en":"That which is not good for the swarm, neither is it good for the bee.","ko":"벌 떼에 이롭지 않은 것은 벌 한 마리에게도 이롭지 않다.","c":"제6권 54절 (Book VI, 54)","src":"6.54"},{"b":"가난한 리처드의 달력","en":"Wish not so much to live long as to live well.","ko":"오래 살기를 바라기보다 잘 살기를 바라라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#642"},{"b":"잠언","en":"Commit thy works unto the LORD, and thy thoughts shall be established.","ko":"네가 하는 일을 주께 맡겨라. 그리하면 네 계획이 이루어지리라.","c":"16장 3절 (Proverbs 16:3, KJV)","src":"16:3"},{"b":"명상록","en":"How many together with whom I came into the world are already gone out of it.","ko":"나와 함께 세상에 태어난 사람 중 얼마나 많은 이가 이미 세상을 떠났는가.","c":"제6권 56절 (Book VI, 56)","src":"6.56"},{"b":"가난한 리처드의 달력","en":"Drive thy business, or it will drive thee.","ko":"일을 몰고 가라. 그렇지 않으면 일이 너를 몰고 간다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#129"},{"b":"잠언","en":"A man’s heart deviseth his way: but the LORD directeth his steps.","ko":"사람이 마음으로 제 길을 계획하여도, 그 걸음을 이끄시는 분은 주시다.","c":"16장 9절 (Proverbs 16:9, KJV)","src":"16:9"},{"b":"명상록","en":"Let not future things disturb thee, for thou wilt come to them, if it shall be necessary, having with thee the same reason which now thou usest for present things.","ko":"앞날의 일로 마음을 어지럽히지 말라. 때가 되면 너는 지금 오늘 일을 다루는 바로 그 이성을 지니고 그 일을 맞을 것이다.","c":"제7권 8절 (Book VII, 8)","src":"7.8"},{"b":"가난한 리처드의 달력","en":"Trust thyself, and another shall not betray thee.","ko":"너 자신을 믿어라. 그러면 남이 너를 배신하지 못한다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#592"},{"b":"잠언","en":"Pride goeth before destruction, and an haughty spirit before a fall.","ko":"교만은 멸망에 앞서고, 거만한 마음은 넘어짐에 앞선다.","c":"16장 18절 (Proverbs 16:18, KJV)","src":"16:18"},{"b":"명상록","en":"Whatever any one does or says, I must be good; just as if the gold, or the emerald, or the purple, were always saying this. Whatever any one does or says, I must be emerald and keep my color.","ko":"누가 무슨 말을 하든 무슨 일을 하든 나는 선해야 한다. 금이나 에메랄드나 자줏빛 염료가 늘 이렇게 말하듯이. ‘누가 무엇을 하든 나는 에메랄드로서 내 빛깔을 지키리라.’","c":"제7권 15절 (Book VII, 15)","src":"7.15"},{"b":"가난한 리처드의 달력","en":"He that can have patience can have what he will.","ko":"참을 줄 아는 사람은 원하는 것을 얻는다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#210"},{"b":"잠언","en":"Pleasant words are as an honeycomb, sweet to the soul, and health to the bones.","ko":"다정한 말은 꿀송이 같아서 마음에 달고 뼈에 약이 된다.","c":"16장 24절 (Proverbs 16:24, KJV)","src":"16:24"},{"b":"명상록","en":"Near is thy forgetfulness of all things; and near the forgetfulness of thee by all.","ko":"네가 모든 것을 잊을 날이 가깝고, 모든 이가 너를 잊을 날도 가깝다.","c":"제7권 21절 (Book VII, 21)","src":"7.21"},{"b":"가난한 리처드의 달력","en":"Anger is never without a reason, but seldom with a good one.","ko":"화에는 이유가 없을 때가 없지만, 좋은 이유가 있을 때는 드물다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#41"},{"b":"잠언","en":"He that is slow to anger is better than the mighty; and he that ruleth his spirit than he that taketh a city.","ko":"노하기를 더디 하는 사람은 용사보다 낫고, 제 마음을 다스리는 사람은 성을 빼앗는 사람보다 낫다.","c":"16장 32절 (Proverbs 16:32, KJV)","src":"16:32"},{"b":"명상록","en":"Retire into thyself. The rational principle which rules has this nature, that it is content with itself when it does what is just, and so secures tranquillity.","ko":"자신 안으로 물러나라. 우리를 다스리는 이성은 옳은 일을 할 때 스스로 만족하고, 그리하여 마음의 평안을 얻는 본성을 지녔다.","c":"제7권 28절 (Book VII, 28)","src":"7.28"},{"b":"가난한 리처드의 달력","en":"Who is wise? He that learns from every one.","ko":"누가 지혜로운가? 모든 사람에게서 배우는 사람이다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#651"},{"b":"잠언","en":"Better is a dry morsel, and quietness therewith, than an house full of sacrifices with strife.","ko":"마른 빵 한 조각을 먹으며 화목한 것이, 잔칫상이 가득한 집에서 다투는 것보다 낫다.","c":"17장 1절 (Proverbs 17:1, KJV)","src":"17:1"},{"b":"명상록","en":"Adorn thyself with simplicity and modesty, and with indifference towards the things which lie between virtue and vice. Love mankind. Follow God.","ko":"소박함과 겸손으로 너를 꾸미고, 선도 악도 아닌 것들에는 마음을 쓰지 말라. 사람을 사랑하라. 신을 따르라.","c":"제7권 31절 (Book VII, 31)","src":"7.31"},{"b":"가난한 리처드의 달력","en":"Industry pays debts, despair increases them.","ko":"부지런함은 빚을 갚고, 절망은 빚을 늘린다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#292"},{"b":"잠언","en":"A friend loveth at all times, and a brother is born for adversity.","ko":"벗은 언제나 사랑하고, 형제는 어려울 때를 위해 태어난다.","c":"17장 17절 (Proverbs 17:17, KJV)","src":"17:17"},{"b":"명상록","en":"From Antisthenes: It is royal to do good and to be abused.","ko":"안티스테네스의 말. ‘선을 행하고도 욕을 먹는 것, 그것이 왕다운 일이다.’","c":"제7권 36절 (Book VII, 36)","src":"7.36"},{"b":"가난한 리처드의 달력","en":"The sleeping fox catches no poultry. Up! up!","ko":"잠자는 여우는 닭을 잡지 못한다. 일어나라, 일어나라!","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#537"},{"b":"잠언","en":"A merry heart doeth good like a medicine: but a broken spirit drieth the bones.","ko":"즐거운 마음은 약처럼 몸을 이롭게 하고, 꺾인 마음은 뼈를 마르게 한다.","c":"17장 22절 (Proverbs 17:22, KJV)","src":"17:22"},{"b":"명상록","en":"Love that only which happens to thee and is spun with the thread of thy destiny. For what is more suitable?","ko":"너에게 일어나는 일, 네 운명의 실로 짜인 것만을 사랑하라. 그보다 더 알맞은 것이 무엇이겠는가?","c":"제7권 57절 (Book VII, 57)","src":"7.57"},{"b":"가난한 리처드의 달력","en":"Plough deep, while sluggards sleep.","ko":"게으른 자가 잠잘 때 깊이 갈아라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#412"},{"b":"잠언","en":"Death and life are in the power of the tongue: and they that love it shall eat the fruit thereof.","ko":"죽고 사는 것이 혀에 달렸으니, 혀를 즐겨 쓰는 사람은 그 열매를 먹게 된다.","c":"18장 21절 (Proverbs 18:21, KJV)","src":"18:21"},{"b":"명상록","en":"Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig.","ko":"안을 들여다보라. 안에 선의 샘이 있으니, 늘 파 내려가면 늘 솟아날 것이다.","c":"제7권 59절 (Book VII, 59)","src":"7.59"},{"b":"가난한 리처드의 달력","en":"A father's a treasure; a brother's a comfort; a friend is both.","ko":"아버지는 보배요, 형제는 위안이요, 벗은 그 둘 다다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#7"},{"b":"잠언","en":"A man that hath friends must shew himself friendly: and there is a friend that sticketh closer than a brother.","ko":"벗을 얻으려는 사람은 먼저 다정해야 한다. 형제보다 더 가까이 붙어 있는 벗도 있다.","c":"18장 24절 (Proverbs 18:24, KJV)","src":"18:24"},{"b":"명상록","en":"The art of life is more like the wrestler's art than the dancer's, in respect of this, that it should stand ready and firm to meet onsets which are sudden and unexpected.","ko":"삶의 기술은 춤꾼의 기술보다 씨름꾼의 기술에 더 가깝다. 갑자기 뜻밖에 덮쳐 오는 공격에 맞서 늘 굳건히 버티고 서 있어야 한다는 점에서 그렇다.","c":"제7권 61절 (Book VII, 61)","src":"7.61"},{"b":"가난한 리처드의 달력","en":"Be slow in choosing a friend, slower in changing.","ko":"벗을 고를 때는 천천히, 바꿀 때는 더 천천히.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#79"},{"b":"잠언","en":"The discretion of a man deferreth his anger; and it is his glory to pass over a transgression.","ko":"슬기로운 사람은 노여움을 늦추고, 허물을 덮어 주는 것을 영광으로 여긴다.","c":"19장 11절 (Proverbs 19:11, KJV)","src":"19:11"},{"b":"명상록","en":"The perfection of moral character consists in this, in passing every day as the last, and in being neither violently excited nor torpid nor playing the hypocrite.","ko":"인격의 완성은 하루하루를 마지막 날처럼 보내되, 들뜨지도 늘어지지도 않고 겉꾸미지도 않는 데 있다.","c":"제7권 69절 (Book VII, 69)","src":"7.69"},{"b":"가난한 리처드의 달력","en":"Do good to thy friend to keep him, to thy enemy to gain him.","ko":"벗에게 잘해 주어 벗을 지키고, 원수에게 잘해 주어 원수를 얻어라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#115"},{"b":"잠언","en":"Even a child is known by his doings, whether his work be pure, and whether it be right.","ko":"아이라도 그 하는 일을 보면, 행실이 깨끗한지 바른지 알 수 있다.","c":"20장 11절 (Proverbs 20:11, KJV)","src":"20:11"},{"b":"명상록","en":"It is a ridiculous thing for a man not to fly from his own badness, which is indeed possible, but to fly from other men's badness, which is impossible.","ko":"제 안의 악은 피할 수 있는데도 피하지 않고, 남의 악은 피할 수 없는데도 피하려 하는 것은 우스운 일이다.","c":"제7권 71절 (Book VII, 71)","src":"7.71"},{"b":"가난한 리처드의 달력","en":"When befriended, remember it; when you befriend, forget it.","ko":"도움을 받았거든 기억하고, 도움을 주었거든 잊어라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#619"},{"b":"잠언","en":"Whoso keepeth his mouth and his tongue keepeth his soul from troubles.","ko":"입과 혀를 지키는 사람은 제 영혼을 환난에서 지킨다.","c":"21장 23절 (Proverbs 21:23, KJV)","src":"21:23"},{"b":"명상록","en":"When thou hast done a good act and another has received it, why dost thou still look for a third thing besides these, as fools do, either to have the reputation of having done a good act or to obtain a return?","ko":"좋은 일을 했고 남이 그 덕을 보았다면 됐다. 그런데 어찌하여 어리석은 사람처럼 좋은 일을 했다는 평판이나 보답까지, 세 번째 것을 또 바라는가?","c":"제7권 73절 (Book VII, 73)","src":"7.73"},{"b":"가난한 리처드의 달력","en":"Dost thou love life? Then do not squander time; for that's the stuff life is made of.","ko":"삶을 사랑하는가? 그렇다면 시간을 낭비하지 말라. 시간이야말로 삶을 이루는 재료이니까.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#126"},{"b":"잠언","en":"A good name is rather to be chosen than great riches, and loving favour rather than silver and gold.","ko":"좋은 이름은 큰 재물보다 택할 만하고, 사람들의 은혜로운 사랑은 은과 금보다 낫다.","c":"22장 1절 (Proverbs 22:1, KJV)","src":"22:1"},{"b":"명상록","en":"No man is tired of receiving what is useful. But it is useful to act according to nature. Do not then be tired of receiving what is useful by doing it to others.","ko":"이로운 것을 받는 데 싫증 내는 사람은 없다. 그런데 본성에 따라 행하는 것이 이롭다. 그러니 남에게 이로운 일을 하여 너도 이로움을 얻는 데 싫증 내지 말라.","c":"제7권 74절 (Book VII, 74)","src":"7.74"},{"b":"가난한 리처드의 달력","en":"You may delay, but time will not.","ko":"너는 미룰 수 있어도, 시간은 미루지 않는다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#665"},{"b":"잠언","en":"Train up a child in the way he should go: and when he is old, he will not depart from it.","ko":"아이를 마땅히 가야 할 길로 가르쳐라. 그리하면 늙어서도 그 길을 떠나지 않는다.","c":"22장 6절 (Proverbs 22:6, KJV)","src":"22:6"},{"b":"명상록","en":"Attend to the matter which is before thee, whether it is an opinion or an act or a word. Thou sufferest this justly: for thou choosest rather to become good to-morrow than to be good to-day.","ko":"눈앞의 일에 마음을 쏟아라. 생각이든 행동이든 말이든. 네가 이런 꼴을 당하는 것도 당연하다. 오늘 선해지기보다 내일 선해지기를 택하고 있으니 말이다.","c":"제8권 22절 (Book VIII, 22)","src":"8.22"},{"b":"가난한 리처드의 달력","en":"Experience keeps a dear school, yet fools will learn in no other.","ko":"경험은 수업료가 비싼 학교지만, 어리석은 사람은 다른 데서는 배우지 못한다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#137"},{"b":"잠언","en":"For a just man falleth seven times, and riseth up again: but the wicked shall fall into mischief.","ko":"의로운 사람은 일곱 번 넘어져도 다시 일어나지만, 악한 자는 재앙에 빠진다.","c":"24장 16절 (Proverbs 24:16, KJV)","src":"24:16"},{"b":"명상록","en":"Speak both in the senate and to every man, whoever he may be, appropriately, not with any affectation: use plain discourse.","ko":"원로원에서든 누구에게든 꾸밈없이 알맞게 말하라. 쉬운 말을 써라.","c":"제8권 30절 (Book VIII, 30)","src":"8.30"},{"b":"가난한 리처드의 달력","en":"At the working man's house hunger looks in but dares not enter.","ko":"부지런히 일하는 사람의 집에는 배고픔이 들여다보기만 할 뿐 감히 들어오지 못한다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#68"},{"b":"잠언","en":"A word fitly spoken is like apples of gold in pictures of silver.","ko":"때에 맞게 한 말은 은쟁반에 담긴 금사과와 같다.","c":"25장 11절 (Proverbs 25:11, KJV)","src":"25:11"},{"b":"명상록","en":"Receive [wealth or prosperity] without arrogance; and be ready to let it go.","ko":"재물이나 번영을 받을 때는 교만하지 말고, 놓아 보낼 때는 기꺼이 놓아라.","c":"제8권 33절 (Book VIII, 33)","src":"8.33"},{"b":"가난한 리처드의 달력","en":"Beware of little expenses, a small leak will sink a great ship.","ko":"작은 지출을 조심하라. 작은 구멍이 큰 배를 가라앉힌다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#84"},{"b":"잠언","en":"If thine enemy be hungry, give him bread to eat; and if he be thirsty, give him water to drink: For thou shalt heap coals of fire upon his head, and the LORD shall reward thee.","ko":"원수가 배고파하거든 먹을 것을 주고, 목말라하거든 마실 물을 주어라. 그리하면 그의 머리에 숯불을 쌓는 셈이요, 주께서 너에게 갚아 주시리라.","c":"25장 21–22절 (Proverbs 25:21–22, KJV)","src":"25:21–22"},{"b":"명상록","en":"Men exist for the sake of one another. Teach them then, or bear with them.","ko":"사람은 서로를 위해 존재한다. 그러니 가르치든지, 아니면 참아 주어라.","c":"제8권 59절 (Book VIII, 59)","src":"8.59"},{"b":"가난한 리처드의 달력","en":"Keep thy shop, and thy shop will keep thee.","ko":"가게를 지켜라. 그러면 가게가 너를 지켜 준다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#308"},{"b":"잠언","en":"Where no wood is, there the fire goeth out: so where there is no talebearer, the strife ceaseth.","ko":"땔감이 없으면 불이 꺼지듯, 말을 옮기는 사람이 없으면 다툼이 그친다.","c":"26장 20절 (Proverbs 26:20, KJV)","src":"26:20"},{"b":"명상록","en":"He who does wrong does wrong against himself. He who acts unjustly acts unjustly to himself, because he makes himself bad.","ko":"잘못을 저지르는 사람은 자신에게 잘못하는 것이다. 불의를 행하는 사람은 자신을 나쁘게 만드니, 자신에게 불의를 행하는 것이다.","c":"제9권 4절 (Book IX, 4)","src":"9.4"},{"b":"가난한 리처드의 달력","en":"A cypher and humility make the other figures and virtues of tenfold value.","ko":"숫자 0과 겸손은 다른 숫자와 덕의 값을 열 배로 만든다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#5"},{"b":"잠언","en":"Boast not thyself of to morrow; for thou knowest not what a day may bring forth.","ko":"내일 일을 자랑하지 말라. 하루가 무엇을 가져올지 너는 알지 못한다.","c":"27장 1절 (Proverbs 27:1, KJV)","src":"27:1"},{"b":"명상록","en":"Wipe out imagination; check desire: extinguish appetite: keep the ruling faculty in its own power.","ko":"헛된 상상을 지우고, 욕망을 누르고, 탐욕을 끄고, 마음의 주인 자리를 네 손에 쥐고 있으라.","c":"제9권 7절 (Book IX, 7)","src":"9.7"},{"b":"가난한 리처드의 달력","en":"Wealth is not his that has it, but his that enjoys it.","ko":"재물은 가진 사람의 것이 아니라 누리는 사람의 것이다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#606"},{"b":"잠언","en":"Let another man praise thee, and not thine own mouth; a stranger, and not thine own lips.","ko":"남이 너를 칭찬하게 하고, 네 입으로는 하지 말라. 낯선 사람이 칭찬하게 하고, 네 입술로는 하지 말라.","c":"27장 2절 (Proverbs 27:2, KJV)","src":"27:2"},{"b":"명상록","en":"To-day I have got out of all trouble, or rather I have cast out all trouble, for it was not outside, but within and in my opinions.","ko":"오늘 나는 모든 근심에서 벗어났다. 아니, 모든 근심을 내던졌다. 근심은 밖에 있지 않고 내 안에, 내 생각 속에 있었기 때문이다.","c":"제9권 13절 (Book IX, 13)","src":"9.13"},{"b":"가난한 리처드의 달력","en":"Half the truth is often a great lie.","ko":"반쪽 진실은 흔히 큰 거짓말이다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#179"},{"b":"잠언","en":"Faithful are the wounds of a friend; but the kisses of an enemy are deceitful.","ko":"벗이 주는 상처는 진실하지만, 원수의 입맞춤은 거짓이다.","c":"27장 6절 (Proverbs 27:6, KJV)","src":"27:6"},{"b":"명상록","en":"If a man has done wrong the harm is his own. But perhaps he has not done wrong.","ko":"누가 잘못했다면 그 해는 그 사람의 몫이다. 그런데 어쩌면 그는 잘못하지 않았을지도 모른다.","c":"제9권 38절 (Book IX, 38)","src":"9.38"},{"b":"가난한 리처드의 달력","en":"Doing an injury puts you below your enemy; revenging one makes you but even with him; forgiving, it sets you above him.","ko":"남에게 해를 입히면 원수보다 낮아지고, 앙갚음하면 겨우 원수와 같아지며, 용서하면 원수보다 높아진다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#116"},{"b":"잠언","en":"Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.","ko":"쇠는 쇠로 날카로워지듯, 사람은 벗을 통해 다듬어진다.","c":"27장 17절 (Proverbs 27:17, KJV)","src":"27:17"},{"b":"명상록","en":"If a man is mistaken, instruct him kindly and show him his error. But if thou art not able, blame thyself, or blame not even thyself.","ko":"누가 잘못 알고 있거든 친절하게 가르쳐 주고 그 잘못을 보여 주라. 그럴 수 없거든 너 자신을 탓하라. 아니, 너 자신조차 탓하지 말라.","c":"제10권 4절 (Book X, 4)","src":"10.4"},{"b":"가난한 리처드의 달력","en":"If you would be reveng'd of your enemy, govern yourself.","ko":"원수에게 앙갚음하고 싶거든 너 자신을 다스려라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#282"},{"b":"잠언","en":"He that covereth his sins shall not prosper: but whoso confesseth and forsaketh them shall have mercy.","ko":"제 허물을 감추는 사람은 잘되지 못하고, 고백하고 버리는 사람은 자비를 얻는다.","c":"28장 13절 (Proverbs 28:13, KJV)","src":"28:13"},{"b":"명상록","en":"No longer talk at all about the kind of man that a good man ought to be, but be such.","ko":"선한 사람이 어떠해야 하는지 더는 말하지 말고, 그런 사람이 되어라.","c":"제10권 16절 (Book X, 16)","src":"10.16"},{"b":"가난한 리처드의 달력","en":"Sloth (like rust) consumes faster than labor wears. The used key is always bright.","ko":"게으름은 녹처럼 일보다 더 빨리 사람을 갉아먹는다. 늘 쓰는 열쇠는 늘 반짝인다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#449"},{"b":"잠언","en":"A fool uttereth all his mind: but a wise man keepeth it in till afterwards.","ko":"어리석은 자는 속엣말을 다 쏟아 내지만, 지혜로운 사람은 나중을 위해 간직해 둔다.","c":"29장 11절 (Proverbs 29:11, KJV)","src":"29:11"},{"b":"명상록","en":"Practise thyself even in the things which thou despairest of accomplishing. For even the left hand, which is ineffectual for all other things for want of practice, holds the bridle more vigorously than the right hand; for it has been practised in this.","ko":"이룰 수 없을 것 같은 일도 연습하라. 왼손은 연습이 모자라 다른 일에는 서툴러도 고삐만은 오른손보다 단단히 잡는다. 그 일을 늘 연습해 왔기 때문이다.","c":"제12권 6절 (Book XII, 6)","src":"12.6"},{"b":"가난한 리처드의 달력","en":"Laziness travels so slowly, that poverty soon overtakes him.","ko":"게으름은 너무 느리게 걸어서 가난이 곧 따라잡는다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#316"},{"b":"잠언","en":"Who can find a virtuous woman? for her price is far above rubies.","ko":"누가 현숙한 여인을 얻겠는가? 그 값은 루비보다 훨씬 귀하다.","c":"31장 10절 (Proverbs 31:10, KJV)","src":"31:10"},{"b":"명상록","en":"If it is not right, do not do it: if it is not true, do not say it.","ko":"옳지 않거든 하지 말고, 참이 아니거든 말하지 말라.","c":"제12권 17절 (Book XII, 17)","src":"12.17"},{"b":"가난한 리처드의 달력","en":"When the well's dry, we know the worth of water.","ko":"우물이 마르고 나서야 물의 귀함을 안다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#627"},{"b":"잠언","en":"Favour is deceitful, and beauty is vain: but a woman that feareth the LORD, she shall be praised.","ko":"고운 맵시는 거짓되고 아름다움은 덧없다. 오직 주를 경외하는 여인이 칭찬을 받는다.","c":"31장 30절 (Proverbs 31:30, KJV)","src":"31:30"}]};
const START=[2026,11,5];
const WD=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
function dayIndex(y,m,d){return Math.round((Date.UTC(y,m-1,d)-Date.UTC(START[0],START[1]-1,START[2]))/86400000);}
function mod(a,n){return ((a%n)+n)%n;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let cur=null;
function todayYMD(){const t=new Date();return [t.getFullYear(),t.getMonth()+1,t.getDate()];}
function shift(ymd,k){const t=new Date(Date.UTC(ymd[0],ymd[1]-1,ymd[2]+k));return [t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()];}
function eastCard(name,hz,list,i){const x=list[i];const k={"명심보감":"mx","채근담":"cg","증광현문":"zg"}[name]||"";return `<section class="card ${k}"><div class="head"><div class="book">${name}<span class="hz">${hz}</span></div><div class="no">${i+1} / ${list.length}</div></div><div class="chap">${esc(x.c)}</div><div class="orig">${esc(x.o)}</div><div class="eum"><span class="lab">음</span>${esc(x.e)}</div><div class="pul"><span class="lab">풀이</span>${esc(x.p)}</div></section>`;}
function westCard(list,i){const x=list[i];const hz={'명상록':'Meditations · 마르쿠스 아우렐리우스','가난한 리처드의 달력':"Poor Richard's Almanack · 프랭클린",'잠언':'Book of Proverbs'}[x.b];return `<section class="card we"><div class="head"><div class="book">${x.b}<span class="hz"></span></div><div class="no">서양 ${i+1} / ${list.length}</div></div><div class="chap">${esc(hz)} · ${esc(x.c)}</div><div class="en">${esc(x.en)}</div><div class="pul"><span class="lab">번역</span>${esc(x.ko)}</div></section>`;}
const MEMO=`<section class="card memo"><div class="head"><div class="book">쌤의 메모<span class="hz">2026년 11월 5일</span></div></div>
<div class="item"><div class="orig">天有不測風雨　人有朝夕禍福</div><div class="eum"><span class="lab">음</span>천유불측풍우 인유조석화복</div><div class="pul"><span class="lab">풀이</span>하늘에는 헤아릴 수 없는 비바람이 있고, 사람에게는 아침저녁으로 바뀌는 화와 복이 있다.</div><div class="src">명심보감 성심편(省心篇)</div></div>
<div class="item"><div class="orig">禍兮福之所倚　福兮禍之所伏</div><div class="eum"><span class="lab">음</span>화혜복지소의 복혜화지소복</div><div class="pul"><span class="lab">풀이</span>화 속에는 복이 기대어 있고, 복 속에는 화가 엎드려 있다.</div><div class="src">노자(老子) 『도덕경』 제58장</div></div>
<div class="item"><div class="pul" style="border:0;padding:0;margin:0;font-size:calc(20px*var(--fz))">“화는 복의 옷을 입고 오고, 복은 화를 깔고 온다.”</div><div class="src">쌤의 메모 — 사마의(司馬懿), 『삼국지』</div></div></section>`;
function render(ymd){
  cur=ymd;const [y,m,d]=ymd;const n=dayIndex(y,m,d);
  const wd=WD[new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  document.getElementById('date').textContent=`${y}년 ${m}월 ${d}일 (${wd})`;
  const isMemo=(y===2026&&m===11&&d===5);
  document.getElementById('memoTop').innerHTML=isMemo?MEMO:'';
  document.getElementById('memoBottom').innerHTML=isMemo?'':MEMO;
  document.getElementById('memoBtn').classList.toggle('hidden',isMemo);
  document.getElementById('cards').innerHTML=
    eastCard('명심보감','明心寶鑑',D.mx,mod(n,D.mx.length))+
    eastCard('채근담','菜根譚',D.cg,mod(n,D.cg.length))+
    eastCard('증광현문','增廣賢文',D.zg,mod(n,D.zg.length))+
    westCard(D.w,mod(n,D.w.length));
  const t=todayYMD();document.getElementById('today').disabled=(t[0]===y&&t[1]===m&&t[2]===d);
  try{history.replaceState(null,'','#'+y+'-'+pad(m)+'-'+pad(d));}catch(e){}
  window.scrollTo(0,0);
}
function parseHash(){const h=(location.hash||'').match(/^#(\d{4})-(\d{2})-(\d{2})$/);return h?[+h[1],+h[2],+h[3]]:null;}
document.getElementById('prev').onclick=()=>render(shift(cur,-1));
document.getElementById('next').onclick=()=>render(shift(cur,1));
document.getElementById('today').onclick=()=>render(todayYMD());
document.getElementById('memoBtn').onclick=()=>document.getElementById('memoBottom').classList.toggle('hidden');
let fz=1;try{fz=parseFloat(localStorage.getItem('hanmadi_fz'))||1;}catch(e){}
function setFz(v){fz=Math.min(1.6,Math.max(0.8,Math.round(v*10)/10));document.documentElement.style.setProperty('--fz',fz);try{localStorage.setItem('hanmadi_fz',fz);}catch(e){}}
setFz(fz);
document.getElementById('bigger').onclick=()=>setFz(fz+0.1);
document.getElementById('smaller').onclick=()=>setFz(fz-0.1);
document.getElementById('foot').innerHTML=`명심보감 ${D.mx.length} · 채근담 ${D.cg.length} · 증광현문 ${D.zg.length} · 서양 ${D.w.length}구절<br>원문은 옛 공개 판본(위키문헌 明心寶鑑·菜根譚 明刻本·增廣昔時賢文, George Long 역 『명상록』, 프랭클린 원문, KJV 잠언)에서, 음과 풀이는 새로 썼습니다.<br>시작일 2026-11-05 · 같은 날짜는 언제나 같은 구절`;
render(parseHash()||todayYMD());
</script>
