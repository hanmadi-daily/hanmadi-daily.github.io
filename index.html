棉。","e":"끽진미미환시염, 천진릉라환시면.","p":"온갖 맛난 음식을 다 먹어 보아도 결국 소금 맛이요, 온갖 비단옷을 다 입어 보아도 결국 무명옷이다.","c":"하집(下集)","src":666,"local":232,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":666,"lower_collection_no":232},{"o":"一夫不耕，全家餓飯，一女不織，全家受寒。","e":"일부불경, 전가아반, 일녀부직, 전가수한.","p":"한 사내가 밭을 갈지 않으면 온 집안이 굶고, 한 아낙이 베를 짜지 않으면 온 집안이 추위에 떤다.","c":"하집(下集)","src":667,"local":233,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":667,"lower_collection_no":233},{"o":"金銀到手非容易，用時方知來時難。","e":"금은도수비용이, 용시방지래시난.","p":"금은이 손에 들어오기란 쉽지 않으니, 쓸 때가 되어서야 벌 때의 어려움을 안다.","c":"하집(下集)","src":668,"local":234,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":668,"lower_collection_no":234},{"o":"聽人勸，得一半。","e":"청인권, 득일반.","p":"남의 권고를 들으면, 절반은 얻는다.","c":"하집(下集)","src":670,"local":236,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":670,"lower_collection_no":236},{"o":"不怕慢，只怕站。","e":"불파만, 지파참.","p":"느린 것은 두렵지 않고, 멈춰 서는 것이 두려울 뿐이다.","c":"하집(下集)","src":671,"local":237,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":671,"lower_collection_no":237},{"o":"自己無運至，卻怨世界難。","e":"자기무운지, 각원세계난.","p":"제게 운이 닿지 않은 것인데, 도리어 세상살이가 어렵다고 원망한다.","c":"하집(下集)","src":678,"local":244,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":678,"lower_collection_no":244},{"o":"膽大不如膽小，心寛甚如屋寛。","e":"담대불여담소, 심관심여옥관.","p":"대담한 것은 조심스러운 것만 못하고, 마음이 넓은 것이 집이 넓은 것보다 낫다.","c":"하집(下集)","src":679,"local":245,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":679,"lower_collection_no":245},{"o":"結交一人難上難，得罪一人一時間。","e":"결교일인난상난, 득죄일인일시간.","p":"사람 하나와 사귀기는 어렵고도 어렵지만, 사람 하나에게 미움을 사는 것은 한순간이다.","c":"하집(下集)","src":684,"local":250,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":684,"lower_collection_no":250},{"o":"借債經商，賣田還債；賒錢起屋，賣屋還錢。","e":"차채경상, 매전환채; 사전기옥, 매옥환전.","p":"빚을 내어 장사하면 밭을 팔아 빚을 갚게 되고, 외상으로 집을 지으면 집을 팔아 빚을 갚게 된다.","c":"하집(下集)","src":685,"local":251,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":685,"lower_collection_no":251,"src_all":[685,686],"lower_collection_nos":[251,252]},{"o":"修起廟來鬼都老，拾得秤來薑賣完。","e":"수기묘래귀도로, 습득칭래강매완.","p":"사당을 다 지어 놓으니 귀신은 이미 늙었고, 저울을 구해 오니 생강은 다 팔렸다. (때를 놓치면 소용없다.)","c":"하집(下集)","src":687,"local":253,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":687,"lower_collection_no":253},{"o":"節食以去病，少食以延年。","e":"절식이거병, 소식이연년.","p":"먹는 것을 절제하여 병을 물리치고, 적게 먹어 수명을 늘린다.","c":"하집(下集)","src":689,"local":255,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":689,"lower_collection_no":255},{"o":"不會鳧水怨河灣，不會犂田怨枷擔。","e":"불회부수원하만, 불회리전원가담.","p":"헤엄칠 줄 모르면서 강굽이를 탓하고, 밭 갈 줄 모르면서 멍에를 탓한다.","c":"하집(下集)","src":693,"local":259,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":693,"lower_collection_no":259},{"o":"他馬莫騎，他弓莫挽。","e":"타마막기, 타궁막만.","p":"남의 말은 타지 말고, 남의 활은 당기지 말라.","c":"하집(下集)","src":694,"local":260,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":694,"lower_collection_no":260},{"o":"要知心腹事，但聽口中言。","e":"요지심복사, 단청구중언.","p":"속마음을 알고 싶거든, 그 사람 입에서 나오는 말을 들어 보라.","c":"하집(下集)","src":695,"local":261,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":695,"lower_collection_no":261},{"o":"寧在人前全不會，莫在人前會不全。","e":"영재인전전불회, 막재인전회부전.","p":"차라리 남 앞에서 아예 못 하는 편이 낫지, 남 앞에서 어설픈 솜씨를 드러내지 말라.","c":"하집(下集)","src":696,"local":262,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":696,"lower_collection_no":262},{"o":"事非親見，切莫亂談。","e":"사비친견, 절막란담.","p":"몸소 보지 않은 일은, 절대로 함부로 말하지 말라.","c":"하집(下集)","src":697,"local":263,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":697,"lower_collection_no":263},{"o":"打人莫打臉，駡人莫駡短。","e":"타인막타검, 매인막매단.","p":"사람을 때려도 얼굴은 때리지 말고, 사람을 꾸짖어도 약점은 들추지 말라.","c":"하집(下集)","src":698,"local":264,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":698,"lower_collection_no":264},{"o":"好言一句三冬暖，話不投機六月寒。","e":"호언일구삼동난, 화불투기륙월한.","p":"좋은 말 한마디는 겨울 석 달을 따뜻하게 하고, 뜻이 맞지 않는 말은 유월에도 싸늘하게 한다.","c":"하집(下集)","src":699,"local":265,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":699,"lower_collection_no":265},{"o":"放債如施，收債如討。","e":"방채여시, 수채여토.","p":"빚을 놓을 때는 베풀듯 선뜻 내주지만, 빚을 받을 때는 구걸하듯 사정해야 한다.","c":"하집(下集)","src":701,"local":267,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":701,"lower_collection_no":267},{"o":"髙人求低易，低人求髙難。","e":"고인구저이, 저인구고난.","p":"높은 사람이 낮은 사람에게 구하기는 쉽고, 낮은 사람이 높은 사람에게 구하기는 어렵다.","c":"하집(下集)","src":709,"local":275,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":709,"lower_collection_no":275},{"o":"人上一百，手藝齊全。","e":"인상일백, 수예제전.","p":"사람이 백 명만 모이면, 온갖 재주가 다 갖추어진다.","c":"하집(下集)","src":711,"local":277,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":711,"lower_collection_no":277},{"o":"難者不會，會者不難。","e":"난자불회, 회자불난.","p":"어렵다는 사람은 할 줄 모르는 사람이요, 할 줄 아는 사람에게는 어렵지 않다.","c":"하집(下集)","src":712,"local":278,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":712,"lower_collection_no":278},{"o":"心不得滿，事不得全。","e":"심부득만, 사부득전.","p":"마음은 다 채울 수 없고, 일은 다 온전할 수 없다.","c":"하집(下集)","src":714,"local":280,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":714,"lower_collection_no":280},{"o":"人無喜色休開店，事不遂心莫怨天。","e":"인무희색휴개점, 사불수심막원천.","p":"얼굴에 웃음기가 없으면 가게를 열지 말고, 일이 뜻대로 되지 않아도 하늘을 원망하지 말라.","c":"하집(下集)","src":716,"local":282,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":716,"lower_collection_no":282},{"o":"選婿莫選田園，選女莫選嫁奩。","e":"선서막선전원, 선녀막선가렴.","p":"사위를 고를 때는 논밭을 보지 말고, 며느릿감을 고를 때는 혼수를 보지 말라.","c":"하집(下集)","src":717,"local":283,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":717,"lower_collection_no":283},{"o":"人將禮義爲先，樹將花果爲園。","e":"인장례의위선, 수장화과위원.","p":"사람은 예의를 으뜸으로 삼고, 나무는 꽃과 열매로 동산을 이룬다.","c":"하집(下集)","src":719,"local":285,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":719,"lower_collection_no":285},{"o":"臨危許行善，過後心又變。","e":"임위허행선, 과후심우변.","p":"위태로울 때는 선을 행하겠다고 다짐하더니, 지나고 나면 마음이 또 변한다.","c":"하집(下集)","src":720,"local":286,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":720,"lower_collection_no":286},{"o":"天意違可以人回，命早定可以心挽。","e":"천의위가이인회, 명조정가이심만.","p":"하늘의 뜻이 어긋나도 사람의 힘으로 돌릴 수 있고, 운명이 일찍 정해졌어도 마음으로 되돌릴 수 있다.","c":"하집(下集)","src":721,"local":287,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":721,"lower_collection_no":287},{"o":"貴人語少，貧子話多。","e":"귀인어소, 빈자화다.","p":"귀한 사람은 말이 적고, 가난한 사람은 말이 많다.","c":"하집(下集)","src":723,"local":289,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":723,"lower_collection_no":289},{"o":"東屋未補西屋破，前帳未還後又拖。","e":"동옥미보서옥파, 전장미환후우타.","p":"동쪽 채를 미처 고치기도 전에 서쪽 채가 허물어지고, 앞의 외상값을 갚기도 전에 뒤의 외상이 또 밀린다.","c":"하집(下集)","src":726,"local":292,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":726,"lower_collection_no":292},{"o":"志不同己，不必強合。","e":"지부동기, 불필강합.","p":"뜻이 나와 같지 않으면, 굳이 억지로 맞출 필요가 없다.","c":"하집(下集)","src":728,"local":294,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":728,"lower_collection_no":294},{"o":"莫道坐中安樂少，須知世上苦情多。","e":"막도좌중안락소, 수지세상고정다.","p":"앉은 자리에 즐거움이 적다고 말하지 말라. 세상에는 괴로운 사정이 많다는 것을 알아야 한다.","c":"하집(下集)","src":729,"local":295,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":729,"lower_collection_no":295},{"o":"本少利微強如坐，屋檐水也滴得多。","e":"본소리미강여좌, 옥첨수야적득다.","p":"밑천이 적고 이문이 박해도 놀고 앉아 있는 것보다 낫다. 처마 끝 낙숫물도 떨어지고 떨어지면 많아진다.","c":"하집(下集)","src":730,"local":296,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":730,"lower_collection_no":296},{"o":"勤儉持家富，謙恭受益多。","e":"근검지가부, 겸공수익다.","p":"부지런하고 검소하게 집안을 꾸리면 넉넉해지고, 겸손하고 공손하면 얻는 것이 많다.","c":"하집(下集)","src":731,"local":297,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":731,"lower_collection_no":297},{"o":"見錢起意便是賊，順手牽羊乃爲盜。","e":"견전기의변시적, 순수견양내위도.","p":"돈을 보고 딴마음을 품으면 곧 도둑이요, 손에 닿는 대로 슬쩍 가져가도 도둑질이다.","c":"하집(下集)","src":733,"local":299,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":733,"lower_collection_no":299},{"o":"要做快活人，切莫尋煩惱。","e":"요주쾌활인, 절막심번뇌.","p":"즐겁게 살고 싶거든, 절대로 스스로 번뇌를 찾지 말라.","c":"하집(下集)","src":734,"local":300,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":734,"lower_collection_no":300},{"o":"要做長壽人，莫做短命事。要做有後人，莫做無後事。","e":"요주장수인, 막주단명사. 요주유후인, 막주무후사.","p":"오래 살고 싶거든 목숨을 줄이는 일을 하지 말고, 후손이 잘되기를 바라거든 후손을 끊는 일을 하지 말라.","c":"하집(下集)","src":735,"local":301,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":735,"lower_collection_no":301,"src_all":[735,736],"lower_collection_nos":[301,302]},{"o":"寧可無錢使，不可無行止。","e":"영가무전사, 불가무행지.","p":"차라리 쓸 돈이 없을지언정, 바른 행실이 없어서는 안 된다.","c":"하집(下集)","src":738,"local":304,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":738,"lower_collection_no":304},{"o":"栽樹要栽松柏，結交要結君子。","e":"재수요재송백, 결교요결군자.","p":"나무를 심으려면 소나무와 잣나무를 심고, 사람을 사귀려면 군자를 사귀어라.","c":"하집(下集)","src":739,"local":305,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":739,"lower_collection_no":305},{"o":"秀才不出門，能知天下事。","e":"수재불출문, 능지천하사.","p":"선비는 문밖에 나가지 않아도, 천하의 일을 알 수 있다.","c":"하집(下集)","src":740,"local":306,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":740,"lower_collection_no":306},{"o":"百歳無多日，光陰能幾時？","e":"백세무다일, 광음능기시?","p":"백 년이라 해도 많은 날이 아니니, 세월이 얼마나 되겠는가?","c":"하집(下集)","src":746,"local":312,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":746,"lower_collection_no":312},{"o":"父母養其身，自己立其志。","e":"부모양기신, 자기립기지.","p":"부모는 내 몸을 길러 주시고, 뜻은 스스로 세워야 한다.","c":"하집(下集)","src":747,"local":313,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":747,"lower_collection_no":313},{"o":"待有餘而濟人，終無濟人之日；待有閑而讀書，終無讀書之時。","e":"대유여이제인, 종무제인지일; 대유한이독서, 종무독서지시.","p":"넉넉해지기를 기다렸다가 남을 도우려 하면 끝내 도울 날이 없고, 한가해지기를 기다렸다가 책을 읽으려 하면 끝내 읽을 때가 없다.","c":"하집(下集)","src":748,"local":314,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":748,"lower_collection_no":314,"src_all":[748,749],"lower_collection_nos":[314,315]}],"w":[{"b":"명상록","en":"Through not observing what is in the mind of another a man has seldom been seen to be unhappy; but those who do not observe the movements of their own minds must of necessity be unhappy.","ko":"남의 마음속을 살피지 않는다고 불행해진 사람은 거의 없다. 그러나 제 마음의 움직임을 살피지 않는 사람은 반드시 불행해진다.","c":"제2권 8절 (Book II, 8)","src":"2.8"},{"b":"가난한 리처드의 달력","en":"Early to bed and early to rise, makes a man healthy, wealthy, and wise.","ko":"일찍 자고 일찍 일어나면 몸이 건강하고 살림이 넉넉하고 지혜로워진다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#131"},{"b":"잠언","en":"The fear of the LORD is the beginning of knowledge: but fools despise wisdom and instruction.","ko":"주를 경외하는 것이 지식의 시작이다. 그러나 어리석은 자는 지혜와 훈계를 업신여긴다.","c":"1장 7절 (Proverbs 1:7, KJV)","src":"1:7"},{"b":"명상록","en":"Take away thy opinion, and then there is taken away the complaint, \"I have been harmed.\" Take away the complaint, \"I have been harmed,\" and the harm is taken away.","ko":"생각을 버려라. 그러면 ‘나는 해를 입었다’는 불평이 사라진다. ‘나는 해를 입었다’는 불평을 버려라. 그러면 해 자체가 사라진다.","c":"제4권 7절 (Book IV, 7)","src":"4.7"},{"b":"가난한 리처드의 달력","en":"Lost time is never found again.","ko":"잃어버린 시간은 다시 찾을 수 없다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#332"},{"b":"잠언","en":"Trust in the LORD with all thine heart; and lean not unto thine own understanding.","ko":"마음을 다하여 주를 믿고, 네 슬기에만 기대지 말라.","c":"3장 5절 (Proverbs 3:5, KJV)","src":"3:5"},{"b":"명상록","en":"That which does not make a man worse than he was, also does not make his life worse, nor does it harm him either from without or from within.","ko":"사람을 전보다 나쁘게 만들지 않는 것은 그의 삶도 나쁘게 만들지 않으며, 밖으로나 안으로나 그를 해치지 않는다.","c":"제4권 8절 (Book IV, 8)","src":"4.8"},{"b":"가난한 리처드의 달력","en":"God helps them that help themselves.","ko":"하늘은 스스로 돕는 자를 돕는다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#163"},{"b":"잠언","en":"In all thy ways acknowledge him, and he shall direct thy paths.","ko":"네가 가는 모든 길에서 그분을 인정하라. 그리하면 그분이 네 길을 곧게 이끄시리라.","c":"3장 6절 (Proverbs 3:6, KJV)","src":"3:6"},{"b":"명상록","en":"Do not have such an opinion of things as he has who does thee wrong, or such as he wishes thee to have, but look at them as they are in truth.","ko":"너에게 잘못한 사람이 보는 대로, 또는 그가 네가 보아 주기를 바라는 대로 사물을 보지 말고, 있는 그대로의 참모습을 보라.","c":"제4권 11절 (Book IV, 11)","src":"4.11"},{"b":"가난한 리처드의 달력","en":"Well done is better than well said.","ko":"잘 해낸 것이 잘 말한 것보다 낫다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#609"},{"b":"잠언","en":"Withhold not good from them to whom it is due, when it is in the power of thine hand to do it.","ko":"베풀어야 할 사람에게 선을 아끼지 말라. 네 손에 그럴 힘이 있을 때에.","c":"3장 27절 (Proverbs 3:27, KJV)","src":"3:27"},{"b":"명상록","en":"Hast thou reason? I have.--Why then dost not thou use it? For if this does its own work, what else dost thou wish?","ko":"너에게 이성이 있는가? 있다. 그렇다면 왜 쓰지 않는가? 이성이 제 할 일을 한다면 그 밖에 무엇을 더 바라는가?","c":"제4권 13절 (Book IV, 13)","src":"4.13"},{"b":"가난한 리처드의 달력","en":"Little strokes fell great oaks.","ko":"작은 도끼질이 큰 참나무를 쓰러뜨린다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#330"},{"b":"잠언","en":"Wisdom is the principal thing; therefore get wisdom: and with all thy getting get understanding.","ko":"지혜가 으뜸이니 지혜를 얻어라. 무엇을 얻든 슬기를 얻어라.","c":"4장 7절 (Proverbs 4:7, KJV)","src":"4:7"},{"b":"명상록","en":"Do not act as if thou wert going to live ten thousand years. Death hangs over thee. While thou livest, while it is in thy power, be good.","ko":"만 년이나 살 것처럼 행동하지 말라. 죽음이 머리 위에 걸려 있다. 살아 있는 동안, 할 수 있는 동안 선하게 살라.","c":"제4권 17절 (Book IV, 17)","src":"4.17"},{"b":"가난한 리처드의 달력","en":"Haste makes waste.","ko":"서두르면 일을 망친다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#184"},{"b":"잠언","en":"Keep thy heart with all diligence; for out of it are the issues of life.","ko":"무엇보다 네 마음을 힘써 지켜라. 생명의 샘이 거기서 흘러나온다.","c":"4장 23절 (Proverbs 4:23, KJV)","src":"4:23"},{"b":"명상록","en":"Love the art, poor as it may be, which thou hast learned, and be content with it; and pass through the rest of life like one who has intrusted to the gods with his whole soul all that he has, making thyself neither the tyrant nor the slave of any man.","ko":"네가 배운 일이 아무리 보잘것없어도 그 일을 사랑하고 만족하라. 그리고 가진 모든 것을 온 마음으로 하늘에 맡긴 사람처럼 남은 생을 지나가라. 누구의 폭군도, 누구의 노예도 되지 말라.","c":"제4권 31절 (Book IV, 31)","src":"4.31"},{"b":"가난한 리처드의 달력","en":"Fish and visitors stink in three days.","ko":"생선과 손님은 사흘이 지나면 냄새가 난다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#143"},{"b":"잠언","en":"Go to the ant, thou sluggard; consider her ways, and be wise: Which having no guide, overseer, or ruler, Provideth her meat in the summer, and gathereth her food in the harvest.","ko":"게으른 자여, 개미에게 가서 그 하는 일을 보고 지혜를 얻어라. 개미는 우두머리도 감독도 다스리는 이도 없으나, 여름에 먹을 것을 마련하고 추수 때 양식을 모은다.","c":"6장 6–8절 (Proverbs 6:6–8, KJV)","src":"6:6–8"},{"b":"명상록","en":"Everything is only for a day, both that which remembers and that which is remembered.","ko":"모든 것은 하루살이다. 기억하는 사람도, 기억되는 사람도.","c":"제4권 35절 (Book IV, 35)","src":"4.35"},{"b":"가난한 리처드의 달력","en":"Diligence is the mother of good luck.","ko":"부지런함은 행운의 어머니다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#112"},{"b":"잠언","en":"Hatred stirreth up strifes: but love covereth all sins.","ko":"미움은 다툼을 일으키지만, 사랑은 모든 허물을 덮는다.","c":"10장 12절 (Proverbs 10:12, KJV)","src":"10:12"},{"b":"명상록","en":"Time is like a river made up of the events which happen, and a violent stream; for as soon as a thing has been seen, it is carried away, and another comes in its place, and this will be carried away too.","ko":"세월은 일어나는 일들로 이루어진 강, 거센 물살과 같다. 무엇이든 눈에 띄자마자 떠내려가고 다른 것이 그 자리에 오며, 그것도 곧 떠내려간다.","c":"제4권 43절 (Book IV, 43)","src":"4.43"},{"b":"가난한 리처드의 달력","en":"Hunger is the best pickle.","ko":"시장이 반찬이다. (배고픔이 가장 좋은 장아찌다.)","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#254"},{"b":"잠언","en":"In the multitude of words there wanteth not sin: but he that refraineth his lips is wise.","ko":"말이 많으면 허물을 면하기 어렵다. 입술을 다스리는 사람이 지혜롭다.","c":"10장 19절 (Proverbs 10:19, KJV)","src":"10:19"},{"b":"명상록","en":"Everything which happens is as familiar and well known as the rose in spring and the fruit in summer; for such is disease, and death, and calumny, and treachery, and whatever else delights fools or vexes them.","ko":"일어나는 모든 일은 봄의 장미, 여름의 열매처럼 늘 있고 익숙한 것이다. 병도, 죽음도, 헐뜯음도, 배신도, 어리석은 이를 기쁘게 하거나 괴롭히는 그 밖의 모든 것도 그렇다.","c":"제4권 44절 (Book IV, 44)","src":"4.44"},{"b":"가난한 리처드의 달력","en":"Speak little, do much.","ko":"말은 적게, 일은 많이.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#457"},{"b":"잠언","en":"When pride cometh, then cometh shame: but with the lowly is wisdom.","ko":"교만이 오면 부끄러움도 온다. 그러나 겸손한 사람에게는 지혜가 있다.","c":"11장 2절 (Proverbs 11:2, KJV)","src":"11:2"},{"b":"명상록","en":"Always run to the short way; and the short way is the natural: accordingly say and do everything in conformity with the soundest reason. For such a purpose frees a man from trouble, and warfare, and all artifice and ostentatious display.","ko":"늘 지름길로 달려라. 지름길은 자연스러운 길이다. 그러니 가장 건전한 이성에 맞게 말하고 행동하라. 그런 마음가짐은 사람을 근심과 다툼과 온갖 꾸밈과 겉치레에서 벗어나게 한다.","c":"제4권 51절 (Book IV, 51)","src":"4.51"},{"b":"가난한 리처드의 달력","en":"Glass, china, and reputation are easily crack'd, and never well mended.","ko":"유리와 도자기와 평판은 쉽게 금이 가고, 한번 금이 가면 다시 붙이기 어렵다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#160"},{"b":"잠언","en":"The liberal soul shall be made fat: and he that watereth shall be watered also himself.","ko":"너그럽게 베푸는 사람은 넉넉해지고, 남에게 물을 주는 사람은 자기도 물을 얻는다.","c":"11장 25절 (Proverbs 11:25, KJV)","src":"11:25"},{"b":"명상록","en":"Does another do me wrong? Let him look to it. He has his own disposition, his own activity. I now have what the universal nature now wills me to have; and I do what my nature now wills me to do.","ko":"누가 나에게 잘못하는가? 그것은 그 사람이 알아서 할 일이다. 그에게는 그의 성품과 행동이 있다. 나는 지금 우주의 본성이 내게 주려는 것을 가졌고, 나의 본성이 내게 하라는 일을 한다.","c":"제5권 25절 (Book V, 25)","src":"5.25"},{"b":"가난한 리처드의 달력","en":"Content makes poor men rich; discontent makes rich men poor.","ko":"만족하는 마음은 가난한 사람을 부자로 만들고, 불만은 부자를 가난하게 만든다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#100"},{"b":"잠언","en":"The way of a fool is right in his own eyes: but he that hearkeneth unto counsel is wise.","ko":"어리석은 자는 제 길이 옳다고 여기지만, 남의 조언에 귀 기울이는 사람은 지혜롭다.","c":"12장 15절 (Proverbs 12:15, KJV)","src":"12:15"},{"b":"명상록","en":"The best way of avenging thyself is not to become like [the wrong-doer].","ko":"가장 좋은 복수는 잘못한 사람과 똑같이 되지 않는 것이다.","c":"제6권 6절 (Book VI, 6)","src":"6.6"},{"b":"가난한 리처드의 달력","en":"He that lies down with dogs, shall rise up with fleas.","ko":"개와 함께 누운 사람은 벼룩과 함께 일어난다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#225"},{"b":"잠언","en":"Heaviness in the heart of man maketh it stoop: but a good word maketh it glad.","ko":"마음의 근심은 사람을 짓누르지만, 따뜻한 말 한마디는 마음을 기쁘게 한다.","c":"12장 25절 (Proverbs 12:25, KJV)","src":"12:25"},{"b":"명상록","en":"When thou hast been compelled by circumstances to be disturbed in a manner, quickly return to thyself, and do not continue out of tune longer than the compulsion lasts; for thou wilt have more mastery over the harmony by continually recurring to it.","ko":"어쩔 수 없는 일로 마음이 흔들렸거든 얼른 자신에게로 돌아오라. 꼭 필요한 동안보다 더 오래 가락을 잃고 있지 말라. 자꾸 제자리로 돌아오다 보면 마음의 조화를 더 잘 다스리게 된다.","c":"제6권 11절 (Book VI, 11)","src":"6.11"},{"b":"가난한 리처드의 달력","en":"Have you somewhat to do to-morrow; do it to-day.","ko":"내일 할 일이 있는가? 오늘 하라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#186"},{"b":"잠언","en":"He that walketh with wise men shall be wise: but a companion of fools shall be destroyed.","ko":"지혜로운 사람과 함께 걸으면 지혜로워지고, 어리석은 자와 벗하면 해를 입는다.","c":"13장 20절 (Proverbs 13:20, KJV)","src":"13:20"},{"b":"명상록","en":"If a thing is difficult to be accomplished by thyself, do not think that it is impossible for man: but if anything is possible for man and conformable to his nature, think that this can be attained by thyself too.","ko":"어떤 일이 네게 어렵다고 해서 사람이 할 수 없는 일이라 여기지 말라. 사람이 할 수 있고 사람의 본성에 맞는 일이라면, 너도 해낼 수 있다고 생각하라.","c":"제6권 19절 (Book VI, 19)","src":"6.19"},{"b":"가난한 리처드의 달력","en":"To-morrow every fault is to be amended; but that to-morrow never comes.","ko":"모든 잘못은 내일 고치겠다고 하지만, 그 내일은 끝내 오지 않는다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#585"},{"b":"잠언","en":"He that is slow to wrath is of great understanding: but he that is hasty of spirit exalteth folly.","ko":"노하기를 더디 하는 사람은 슬기가 크고, 성미가 급한 사람은 어리석음을 드러낸다.","c":"14장 29절 (Proverbs 14:29, KJV)","src":"14:29"},{"b":"명상록","en":"If any man is able to convince me and show me that I do not think or act right, I will gladly change; for I seek the truth, by which no man was ever injured. But he is injured who abides in his error and ignorance.","ko":"누군가 내 생각이나 행동이 옳지 않다고 깨우쳐 준다면 나는 기꺼이 고치겠다. 나는 진리를 구하며, 진리 때문에 해를 입은 사람은 아무도 없다. 해를 입는 것은 잘못과 무지에 머무는 사람이다.","c":"제6권 21절 (Book VI, 21)","src":"6.21"},{"b":"가난한 리처드의 달력","en":"The heart of the fool is in his mouth, but the mouth of the wise man is in his heart.","ko":"어리석은 사람의 마음은 입에 있고, 지혜로운 사람의 입은 마음에 있다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#495"},{"b":"잠언","en":"A sound heart is the life of the flesh: but envy the rottenness of the bones.","ko":"평온한 마음은 몸의 생명이요, 시기는 뼈를 썩게 한다.","c":"14장 30절 (Proverbs 14:30, KJV)","src":"14:30"},{"b":"명상록","en":"It is a shame for the soul to be first to give way in this life, when thy body does not give way.","ko":"몸은 아직 버티는데 마음이 먼저 주저앉는 것은 부끄러운 일이다.","c":"제6권 29절 (Book VI, 29)","src":"6.29"},{"b":"가난한 리처드의 달력","en":"The wise man draws more advantage from his enemies, than the fool from his friends.","ko":"지혜로운 사람은 원수에게서 얻는 것이, 어리석은 사람이 벗에게서 얻는 것보다 많다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#547"},{"b":"잠언","en":"A soft answer turneth away wrath: but grievous words stir up anger.","ko":"부드러운 대답은 노여움을 가라앉히고, 모진 말은 화를 돋운다.","c":"15장 1절 (Proverbs 15:1, KJV)","src":"15:1"},{"b":"명상록","en":"Adapt thyself to the things with which thy lot has been cast: and the men among whom thou hast received thy portion, love them, but do it truly [sincerely].","ko":"네 몫으로 주어진 처지에 너를 맞추라. 함께 살도록 정해진 사람들을 사랑하되, 진심으로 사랑하라.","c":"제6권 39절 (Book VI, 39)","src":"6.39"},{"b":"가난한 리처드의 달력","en":"Love your neighbor; yet don't pull down your hedge.","ko":"이웃을 사랑하라. 그러나 울타리는 허물지 말라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#339"},{"b":"잠언","en":"A merry heart maketh a cheerful countenance: but by sorrow of the heart the spirit is broken.","ko":"즐거운 마음은 얼굴을 밝게 하고, 마음이 슬프면 기운이 꺾인다.","c":"15장 13절 (Proverbs 15:13, KJV)","src":"15:13"},{"b":"명상록","en":"It is in our power to have no opinion about a thing, and not to be disturbed in our soul; for things themselves have no natural power to form our judgments.","ko":"어떤 일에 대해 판단을 내리지 않고 마음을 어지럽히지 않는 것은 우리 힘으로 할 수 있다. 사물 자체에는 우리의 판단을 만들어 낼 힘이 없기 때문이다.","c":"제6권 52절 (Book VI, 52)","src":"6.52"},{"b":"가난한 리처드의 달력","en":"No gains without pains.","ko":"수고 없이는 얻는 것도 없다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#381"},{"b":"잠언","en":"Better is little with the fear of the LORD than great treasure and trouble therewith.","ko":"주를 경외하며 적게 가진 것이, 많은 재물을 두고 근심하는 것보다 낫다.","c":"15장 16절 (Proverbs 15:16, KJV)","src":"15:16"},{"b":"명상록","en":"Accustom thyself to attend carefully to what is said by another, and as much as it is possible, be in the speaker's mind.","ko":"남이 하는 말을 귀 기울여 듣는 버릇을 들이고, 될 수 있는 대로 말하는 사람의 마음속에 들어가 보라.","c":"제6권 53절 (Book VI, 53)","src":"6.53"},{"b":"가난한 리처드의 달력","en":"Search others for their virtues, thyself for thy vices.","ko":"남에게서는 덕을 찾고, 나에게서는 허물을 찾아라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#441"},{"b":"잠언","en":"Better is a dinner of herbs where love is, than a stalled ox and hatred therewith.","ko":"사랑이 있는 곳에서 먹는 나물 한 접시가, 미워하며 먹는 살진 소고기보다 낫다.","c":"15장 17절 (Proverbs 15:17, KJV)","src":"15:17"},{"b":"명상록","en":"That which is not good for the swarm, neither is it good for the bee.","ko":"벌 떼에 이롭지 않은 것은 벌 한 마리에게도 이롭지 않다.","c":"제6권 54절 (Book VI, 54)","src":"6.54"},{"b":"가난한 리처드의 달력","en":"Wish not so much to live long as to live well.","ko":"오래 살기를 바라기보다 잘 살기를 바라라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#642"},{"b":"잠언","en":"Commit thy works unto the LORD, and thy thoughts shall be established.","ko":"네가 하는 일을 주께 맡겨라. 그리하면 네 계획이 이루어지리라.","c":"16장 3절 (Proverbs 16:3, KJV)","src":"16:3"},{"b":"명상록","en":"How many together with whom I came into the world are already gone out of it.","ko":"나와 함께 세상에 태어난 사람 중 얼마나 많은 이가 이미 세상을 떠났는가.","c":"제6권 56절 (Book VI, 56)","src":"6.56"},{"b":"가난한 리처드의 달력","en":"Drive thy business, or it will drive thee.","ko":"일을 몰고 가라. 그렇지 않으면 일이 너를 몰고 간다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#129"},{"b":"잠언","en":"A man’s heart deviseth his way: but the LORD directeth his steps.","ko":"사람이 마음으로 제 길을 계획하여도, 그 걸음을 이끄시는 분은 주시다.","c":"16장 9절 (Proverbs 16:9, KJV)","src":"16:9"},{"b":"명상록","en":"Let not future things disturb thee, for thou wilt come to them, if it shall be necessary, having with thee the same reason which now thou usest for present things.","ko":"앞날의 일로 마음을 어지럽히지 말라. 때가 되면 너는 지금 오늘 일을 다루는 바로 그 이성을 지니고 그 일을 맞을 것이다.","c":"제7권 8절 (Book VII, 8)","src":"7.8"},{"b":"가난한 리처드의 달력","en":"Trust thyself, and another shall not betray thee.","ko":"너 자신을 믿어라. 그러면 남이 너를 배신하지 못한다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#592"},{"b":"잠언","en":"Pride goeth before destruction, and an haughty spirit before a fall.","ko":"교만은 멸망에 앞서고, 거만한 마음은 넘어짐에 앞선다.","c":"16장 18절 (Proverbs 16:18, KJV)","src":"16:18"},{"b":"명상록","en":"Whatever any one does or says, I must be good; just as if the gold, or the emerald, or the purple, were always saying this. Whatever any one does or says, I must be emerald and keep my color.","ko":"누가 무슨 말을 하든 무슨 일을 하든 나는 선해야 한다. 금이나 에메랄드나 자줏빛 염료가 늘 이렇게 말하듯이. ‘누가 무엇을 하든 나는 에메랄드로서 내 빛깔을 지키리라.’","c":"제7권 15절 (Book VII, 15)","src":"7.15"},{"b":"가난한 리처드의 달력","en":"He that can have patience can have what he will.","ko":"참을 줄 아는 사람은 원하는 것을 얻는다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#210"},{"b":"잠언","en":"Pleasant words are as an honeycomb, sweet to the soul, and health to the bones.","ko":"다정한 말은 꿀송이 같아서 마음에 달고 뼈에 약이 된다.","c":"16장 24절 (Proverbs 16:24, KJV)","src":"16:24"},{"b":"명상록","en":"Near is thy forgetfulness of all things; and near the forgetfulness of thee by all.","ko":"네가 모든 것을 잊을 날이 가깝고, 모든 이가 너를 잊을 날도 가깝다.","c":"제7권 21절 (Book VII, 21)","src":"7.21"},{"b":"가난한 리처드의 달력","en":"Anger is never without a reason, but seldom with a good one.","ko":"화에는 이유가 없을 때가 없지만, 좋은 이유가 있을 때는 드물다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#41"},{"b":"잠언","en":"He that is slow to anger is better than the mighty; and he that ruleth his spirit than he that taketh a city.","ko":"노하기를 더디 하는 사람은 용사보다 낫고, 제 마음을 다스리는 사람은 성을 빼앗는 사람보다 낫다.","c":"16장 32절 (Proverbs 16:32, KJV)","src":"16:32"},{"b":"명상록","en":"Retire into thyself. The rational principle which rules has this nature, that it is content with itself when it does what is just, and so secures tranquillity.","ko":"자신 안으로 물러나라. 우리를 다스리는 이성은 옳은 일을 할 때 스스로 만족하고, 그리하여 마음의 평안을 얻는 본성을 지녔다.","c":"제7권 28절 (Book VII, 28)","src":"7.28"},{"b":"가난한 리처드의 달력","en":"Who is wise? He that learns from every one.","ko":"누가 지혜로운가? 모든 사람에게서 배우는 사람이다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#651"},{"b":"잠언","en":"Better is a dry morsel, and quietness therewith, than an house full of sacrifices with strife.","ko":"마른 빵 한 조각을 먹으며 화목한 것이, 잔칫상이 가득한 집에서 다투는 것보다 낫다.","c":"17장 1절 (Proverbs 17:1, KJV)","src":"17:1"},{"b":"명상록","en":"Adorn thyself with simplicity and modesty, and with indifference towards the things which lie between virtue and vice. Love mankind. Follow God.","ko":"소박함과 겸손으로 너를 꾸미고, 선도 악도 아닌 것들에는 마음을 쓰지 말라. 사람을 사랑하라. 신을 따르라.","c":"제7권 31절 (Book VII, 31)","src":"7.31"},{"b":"가난한 리처드의 달력","en":"Industry pays debts, despair increases them.","ko":"부지런함은 빚을 갚고, 절망은 빚을 늘린다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#292"},{"b":"잠언","en":"A friend loveth at all times, and a brother is born for adversity.","ko":"벗은 언제나 사랑하고, 형제는 어려울 때를 위해 태어난다.","c":"17장 17절 (Proverbs 17:17, KJV)","src":"17:17"},{"b":"명상록","en":"From Antisthenes: It is royal to do good and to be abused.","ko":"안티스테네스의 말. ‘선을 행하고도 욕을 먹는 것, 그것이 왕다운 일이다.’","c":"제7권 36절 (Book VII, 36)","src":"7.36"},{"b":"가난한 리처드의 달력","en":"The sleeping fox catches no poultry. Up! up!","ko":"잠자는 여우는 닭을 잡지 못한다. 일어나라, 일어나라!","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#537"},{"b":"잠언","en":"A merry heart doeth good like a medicine: but a broken spirit drieth the bones.","ko":"즐거운 마음은 약처럼 몸을 이롭게 하고, 꺾인 마음은 뼈를 마르게 한다.","c":"17장 22절 (Proverbs 17:22, KJV)","src":"17:22"},{"b":"명상록","en":"Love that only which happens to thee and is spun with the thread of thy destiny. For what is more suitable?","ko":"너에게 일어나는 일, 네 운명의 실로 짜인 것만을 사랑하라. 그보다 더 알맞은 것이 무엇이겠는가?","c":"제7권 57절 (Book VII, 57)","src":"7.57"},{"b":"가난한 리처드의 달력","en":"Plough deep, while sluggards sleep.","ko":"게으른 자가 잠잘 때 깊이 갈아라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#412"},{"b":"잠언","en":"Death and life are in the power of the tongue: and they that love it shall eat the fruit thereof.","ko":"죽고 사는 것이 혀에 달렸으니, 혀를 즐겨 쓰는 사람은 그 열매를 먹게 된다.","c":"18장 21절 (Proverbs 18:21, KJV)","src":"18:21"},{"b":"명상록","en":"Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig.","ko":"안을 들여다보라. 안에 선의 샘이 있으니, 늘 파 내려가면 늘 솟아날 것이다.","c":"제7권 59절 (Book VII, 59)","src":"7.59"},{"b":"가난한 리처드의 달력","en":"A father's a treasure; a brother's a comfort; a friend is both.","ko":"아버지는 보배요, 형제는 위안이요, 벗은 그 둘 다다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#7"},{"b":"잠언","en":"A man that hath friends must shew himself friendly: and there is a friend that sticketh closer than a brother.","ko":"벗을 얻으려는 사람은 먼저 다정해야 한다. 형제보다 더 가까이 붙어 있는 벗도 있다.","c":"18장 24절 (Proverbs 18:24, KJV)","src":"18:24"},{"b":"명상록","en":"The art of life is more like the wrestler's art than the dancer's, in respect of this, that it should stand ready and firm to meet onsets which are sudden and unexpected.","ko":"삶의 기술은 춤꾼의 기술보다 씨름꾼의 기술에 더 가깝다. 갑자기 뜻밖에 덮쳐 오는 공격에 맞서 늘 굳건히 버티고 서 있어야 한다는 점에서 그렇다.","c":"제7권 61절 (Book VII, 61)","src":"7.61"},{"b":"가난한 리처드의 달력","en":"Be slow in choosing a friend, slower in changing.","ko":"벗을 고를 때는 천천히, 바꿀 때는 더 천천히.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#79"},{"b":"잠언","en":"The discretion of a man deferreth his anger; and it is his glory to pass over a transgression.","ko":"슬기로운 사람은 노여움을 늦추고, 허물을 덮어 주는 것을 영광으로 여긴다.","c":"19장 11절 (Proverbs 19:11, KJV)","src":"19:11"},{"b":"명상록","en":"The perfection of moral character consists in this, in passing every day as the last, and in being neither violently excited nor torpid nor playing the hypocrite.","ko":"인격의 완성은 하루하루를 마지막 날처럼 보내되, 들뜨지도 늘어지지도 않고 겉꾸미지도 않는 데 있다.","c":"제7권 69절 (Book VII, 69)","src":"7.69"},{"b":"가난한 리처드의 달력","en":"Do good to thy friend to keep him, to thy enemy to gain him.","ko":"벗에게 잘해 주어 벗을 지키고, 원수에게 잘해 주어 원수를 얻어라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#115"},{"b":"잠언","en":"Even a child is known by his doings, whether his work be pure, and whether it be right.","ko":"아이라도 그 하는 일을 보면, 행실이 깨끗한지 바른지 알 수 있다.","c":"20장 11절 (Proverbs 20:11, KJV)","src":"20:11"},{"b":"명상록","en":"It is a ridiculous thing for a man not to fly from his own badness, which is indeed possible, but to fly from other men's badness, which is impossible.","ko":"제 안의 악은 피할 수 있는데도 피하지 않고, 남의 악은 피할 수 없는데도 피하려 하는 것은 우스운 일이다.","c":"제7권 71절 (Book VII, 71)","src":"7.71"},{"b":"가난한 리처드의 달력","en":"When befriended, remember it; when you befriend, forget it.","ko":"도움을 받았거든 기억하고, 도움을 주었거든 잊어라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#619"},{"b":"잠언","en":"Whoso keepeth his mouth and his tongue keepeth his soul from troubles.","ko":"입과 혀를 지키는 사람은 제 영혼을 환난에서 지킨다.","c":"21장 23절 (Proverbs 21:23, KJV)","src":"21:23"},{"b":"명상록","en":"When thou hast done a good act and another has received it, why dost thou still look for a third thing besides these, as fools do, either to have the reputation of having done a good act or to obtain a return?","ko":"좋은 일을 했고 남이 그 덕을 보았다면 됐다. 그런데 어찌하여 어리석은 사람처럼 좋은 일을 했다는 평판이나 보답까지, 세 번째 것을 또 바라는가?","c":"제7권 73절 (Book VII, 73)","src":"7.73"},{"b":"가난한 리처드의 달력","en":"Dost thou love life? Then do not squander time; for that's the stuff life is made of.","ko":"삶을 사랑하는가? 그렇다면 시간을 낭비하지 말라. 시간이야말로 삶을 이루는 재료이니까.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#126"},{"b":"잠언","en":"A good name is rather to be chosen than great riches, and loving favour rather than silver and gold.","ko":"좋은 이름은 큰 재물보다 택할 만하고, 사람들의 은혜로운 사랑은 은과 금보다 낫다.","c":"22장 1절 (Proverbs 22:1, KJV)","src":"22:1"},{"b":"명상록","en":"No man is tired of receiving what is useful. But it is useful to act according to nature. Do not then be tired of receiving what is useful by doing it to others.","ko":"이로운 것을 받는 데 싫증 내는 사람은 없다. 그런데 본성에 따라 행하는 것이 이롭다. 그러니 남에게 이로운 일을 하여 너도 이로움을 얻는 데 싫증 내지 말라.","c":"제7권 74절 (Book VII, 74)","src":"7.74"},{"b":"가난한 리처드의 달력","en":"You may delay, but time will not.","ko":"너는 미룰 수 있어도, 시간은 미루지 않는다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#665"},{"b":"잠언","en":"Train up a child in the way he should go: and when he is old, he will not depart from it.","ko":"아이를 마땅히 가야 할 길로 가르쳐라. 그리하면 늙어서도 그 길을 떠나지 않는다.","c":"22장 6절 (Proverbs 22:6, KJV)","src":"22:6"},{"b":"명상록","en":"Attend to the matter which is before thee, whether it is an opinion or an act or a word. Thou sufferest this justly: for thou choosest rather to become good to-morrow than to be good to-day.","ko":"눈앞의 일에 마음을 쏟아라. 생각이든 행동이든 말이든. 네가 이런 꼴을 당하는 것도 당연하다. 오늘 선해지기보다 내일 선해지기를 택하고 있으니 말이다.","c":"제8권 22절 (Book VIII, 22)","src":"8.22"},{"b":"가난한 리처드의 달력","en":"Experience keeps a dear school, yet fools will learn in no other.","ko":"경험은 수업료가 비싼 학교지만, 어리석은 사람은 다른 데서는 배우지 못한다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#137"},{"b":"잠언","en":"For a just man falleth seven times, and riseth up again: but the wicked shall fall into mischief.","ko":"의로운 사람은 일곱 번 넘어져도 다시 일어나지만, 악한 자는 재앙에 빠진다.","c":"24장 16절 (Proverbs 24:16, KJV)","src":"24:16"},{"b":"명상록","en":"Speak both in the senate and to every man, whoever he may be, appropriately, not with any affectation: use plain discourse.","ko":"원로원에서든 누구에게든 꾸밈없이 알맞게 말하라. 쉬운 말을 써라.","c":"제8권 30절 (Book VIII, 30)","src":"8.30"},{"b":"가난한 리처드의 달력","en":"At the working man's house hunger looks in but dares not enter.","ko":"부지런히 일하는 사람의 집에는 배고픔이 들여다보기만 할 뿐 감히 들어오지 못한다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#68"},{"b":"잠언","en":"A word fitly spoken is like apples of gold in pictures of silver.","ko":"때에 맞게 한 말은 은쟁반에 담긴 금사과와 같다.","c":"25장 11절 (Proverbs 25:11, KJV)","src":"25:11"},{"b":"명상록","en":"Receive [wealth or prosperity] without arrogance; and be ready to let it go.","ko":"재물이나 번영을 받을 때는 교만하지 말고, 놓아 보낼 때는 기꺼이 놓아라.","c":"제8권 33절 (Book VIII, 33)","src":"8.33"},{"b":"가난한 리처드의 달력","en":"Beware of little expenses, a small leak will sink a great ship.","ko":"작은 지출을 조심하라. 작은 구멍이 큰 배를 가라앉힌다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#84"},{"b":"잠언","en":"If thine enemy be hungry, give him bread to eat; and if he be thirsty, give him water to drink: For thou shalt heap coals of fire upon his head, and the LORD shall reward thee.","ko":"원수가 배고파하거든 먹을 것을 주고, 목말라하거든 마실 물을 주어라. 그리하면 그의 머리에 숯불을 쌓는 셈이요, 주께서 너에게 갚아 주시리라.","c":"25장 21–22절 (Proverbs 25:21–22, KJV)","src":"25:21–22"},{"b":"명상록","en":"Men exist for the sake of one another. Teach them then, or bear with them.","ko":"사람은 서로를 위해 존재한다. 그러니 가르치든지, 아니면 참아 주어라.","c":"제8권 59절 (Book VIII, 59)","src":"8.59"},{"b":"가난한 리처드의 달력","en":"Keep thy shop, and thy shop will keep thee.","ko":"가게를 지켜라. 그러면 가게가 너를 지켜 준다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#308"},{"b":"잠언","en":"Where no wood is, there the fire goeth out: so where there is no talebearer, the strife ceaseth.","ko":"땔감이 없으면 불이 꺼지듯, 말을 옮기는 사람이 없으면 다툼이 그친다.","c":"26장 20절 (Proverbs 26:20, KJV)","src":"26:20"},{"b":"명상록","en":"He who does wrong does wrong against himself. He who acts unjustly acts unjustly to himself, because he makes himself bad.","ko":"잘못을 저지르는 사람은 자신에게 잘못하는 것이다. 불의를 행하는 사람은 자신을 나쁘게 만드니, 자신에게 불의를 행하는 것이다.","c":"제9권 4절 (Book IX, 4)","src":"9.4"},{"b":"가난한 리처드의 달력","en":"A cypher and humility make the other figures and virtues of tenfold value.","ko":"숫자 0과 겸손은 다른 숫자와 덕의 값을 열 배로 만든다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#5"},{"b":"잠언","en":"Boast not thyself of to morrow; for thou knowest not what a day may bring forth.","ko":"내일 일을 자랑하지 말라. 하루가 무엇을 가져올지 너는 알지 못한다.","c":"27장 1절 (Proverbs 27:1, KJV)","src":"27:1"},{"b":"명상록","en":"Wipe out imagination; check desire: extinguish appetite: keep the ruling faculty in its own power.","ko":"헛된 상상을 지우고, 욕망을 누르고, 탐욕을 끄고, 마음의 주인 자리를 네 손에 쥐고 있으라.","c":"제9권 7절 (Book IX, 7)","src":"9.7"},{"b":"가난한 리처드의 달력","en":"Wealth is not his that has it, but his that enjoys it.","ko":"재물은 가진 사람의 것이 아니라 누리는 사람의 것이다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#606"},{"b":"잠언","en":"Let another man praise thee, and not thine own mouth; a stranger, and not thine own lips.","ko":"남이 너를 칭찬하게 하고, 네 입으로는 하지 말라. 낯선 사람이 칭찬하게 하고, 네 입술로는 하지 말라.","c":"27장 2절 (Proverbs 27:2, KJV)","src":"27:2"},{"b":"명상록","en":"To-day I have got out of all trouble, or rather I have cast out all trouble, for it was not outside, but within and in my opinions.","ko":"오늘 나는 모든 근심에서 벗어났다. 아니, 모든 근심을 내던졌다. 근심은 밖에 있지 않고 내 안에, 내 생각 속에 있었기 때문이다.","c":"제9권 13절 (Book IX, 13)","src":"9.13"},{"b":"가난한 리처드의 달력","en":"Half the truth is often a great lie.","ko":"반쪽 진실은 흔히 큰 거짓말이다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#179"},{"b":"잠언","en":"Faithful are the wounds of a friend; but the kisses of an enemy are deceitful.","ko":"벗이 주는 상처는 진실하지만, 원수의 입맞춤은 거짓이다.","c":"27장 6절 (Proverbs 27:6, KJV)","src":"27:6"},{"b":"명상록","en":"If a man has done wrong the harm is his own. But perhaps he has not done wrong.","ko":"누가 잘못했다면 그 해는 그 사람의 몫이다. 그런데 어쩌면 그는 잘못하지 않았을지도 모른다.","c":"제9권 38절 (Book IX, 38)","src":"9.38"},{"b":"가난한 리처드의 달력","en":"Doing an injury puts you below your enemy; revenging one makes you but even with him; forgiving, it sets you above him.","ko":"남에게 해를 입히면 원수보다 낮아지고, 앙갚음하면 겨우 원수와 같아지며, 용서하면 원수보다 높아진다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#116"},{"b":"잠언","en":"Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.","ko":"쇠는 쇠로 날카로워지듯, 사람은 벗을 통해 다듬어진다.","c":"27장 17절 (Proverbs 27:17, KJV)","src":"27:17"},{"b":"명상록","en":"If a man is mistaken, instruct him kindly and show him his error. But if thou art not able, blame thyself, or blame not even thyself.","ko":"누가 잘못 알고 있거든 친절하게 가르쳐 주고 그 잘못을 보여 주라. 그럴 수 없거든 너 자신을 탓하라. 아니, 너 자신조차 탓하지 말라.","c":"제10권 4절 (Book X, 4)","src":"10.4"},{"b":"가난한 리처드의 달력","en":"If you would be reveng'd of your enemy, govern yourself.","ko":"원수에게 앙갚음하고 싶거든 너 자신을 다스려라.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#282"},{"b":"잠언","en":"He that covereth his sins shall not prosper: but whoso confesseth and forsaketh them shall have mercy.","ko":"제 허물을 감추는 사람은 잘되지 못하고, 고백하고 버리는 사람은 자비를 얻는다.","c":"28장 13절 (Proverbs 28:13, KJV)","src":"28:13"},{"b":"명상록","en":"No longer talk at all about the kind of man that a good man ought to be, but be such.","ko":"선한 사람이 어떠해야 하는지 더는 말하지 말고, 그런 사람이 되어라.","c":"제10권 16절 (Book X, 16)","src":"10.16"},{"b":"가난한 리처드의 달력","en":"Sloth (like rust) consumes faster than labor wears. The used key is always bright.","ko":"게으름은 녹처럼 일보다 더 빨리 사람을 갉아먹는다. 늘 쓰는 열쇠는 늘 반짝인다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#449"},{"b":"잠언","en":"A fool uttereth all his mind: but a wise man keepeth it in till afterwards.","ko":"어리석은 자는 속엣말을 다 쏟아 내지만, 지혜로운 사람은 나중을 위해 간직해 둔다.","c":"29장 11절 (Proverbs 29:11, KJV)","src":"29:11"},{"b":"명상록","en":"Practise thyself even in the things which thou despairest of accomplishing. For even the left hand, which is ineffectual for all other things for want of practice, holds the bridle more vigorously than the right hand; for it has been practised in this.","ko":"이룰 수 없을 것 같은 일도 연습하라. 왼손은 연습이 모자라 다른 일에는 서툴러도 고삐만은 오른손보다 단단히 잡는다. 그 일을 늘 연습해 왔기 때문이다.","c":"제12권 6절 (Book XII, 6)","src":"12.6"},{"b":"가난한 리처드의 달력","en":"Laziness travels so slowly, that poverty soon overtakes him.","ko":"게으름은 너무 느리게 걸어서 가난이 곧 따라잡는다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#316"},{"b":"잠언","en":"Who can find a virtuous woman? for her price is far above rubies.","ko":"누가 현숙한 여인을 얻겠는가? 그 값은 루비보다 훨씬 귀하다.","c":"31장 10절 (Proverbs 31:10, KJV)","src":"31:10"},{"b":"명상록","en":"If it is not right, do not do it: if it is not true, do not say it.","ko":"옳지 않거든 하지 말고, 참이 아니거든 말하지 말라.","c":"제12권 17절 (Book XII, 17)","src":"12.17"},{"b":"가난한 리처드의 달력","en":"When the well's dry, we know the worth of water.","ko":"우물이 마르고 나서야 물의 귀함을 안다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#627"},{"b":"잠언","en":"Favour is deceitful, and beauty is vain: but a woman that feareth the LORD, she shall be praised.","ko":"고운 맵시는 거짓되고 아름다움은 덧없다. 오직 주를 경외하는 여인이 칭찬을 받는다.","c":"31장 30절 (Proverbs 31:30, KJV)","src":"31:30"}]};
const START=[2026,11,5];
const WD=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
function dayIndex(y,m,d){return Math.round((Date.UTC(y,m-1,d)-Date.UTC(START[0],START[1]-1,START[2]))/86400000);}
function mod(a,n){return ((a%n)+n)%n;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let cur=null;
function ymdInSeoul(t){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(t);const g=ty=>+p.find(x=>x.type===ty).value;return [g('year'),g('month'),g('day')];}
function todayYMD(){return ymdInSeoul(new Date());}
function shift(ymd,k){const t=new Date(Date.UTC(ymd[0],ymd[1]-1,ymd[2]+k));return [t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()];}
function eastCard(name,hz,list,i){const x=list[i];const k={"명심보감":"mx","채근담":"cg","증광현문":"zg"}[name]||"";return `<section class="card ${k}"><div class="head"><div class="book">${name}<span class="hz">${hz}</span></div><div class="no">${i+1} / ${list.length}</div></div><div class="chap">${esc(x.c)}</div><div class="orig">${esc(x.o)}</div><div class="eum"><span class="lab">음</span>${esc(x.e)}</div><div class="pul"><span class="lab">풀이</span>${esc(x.p)}</div></section>`;}
function westCard(list,i){const x=list[i];const hz={'명상록':'Meditations · 마르쿠스 아우렐리우스','가난한 리처드의 달력':"Poor Richard's Almanack · 프랭클린",'잠언':'Book of Proverbs'}[x.b];return `<section class="card we"><div class="head"><div class="book">${x.b}<span class="hz"></span></div><div class="no">서양 ${i+1} / ${list.length}</div></div><div class="chap">${esc(hz)} · ${esc(x.c)}</div><div class="en">${esc(x.en)}</div><div class="pul"><span class="lab">번역</span>${esc(x.ko)}</div></section>`;}
const MEMO=`<section class="card memo"><div class="head"><div class="book">쌤의 메모<span class="hz">2026년 11월 5일</span></div></div>
<div class="item"><div class="orig">天有不測風雨　人有朝夕禍福</div><div class="eum"><span class="lab">음</span>천유불측풍우 인유조석화복</div><div class="pul"><span class="lab">풀이</span>하늘에는 헤아릴 수 없는 비바람이 있고, 사람에게는 아침저녁으로 바뀌는 화와 복이 있다.</div><div class="src">명심보감 성심편(省心篇)</div></div>
<div class="item"><div class="orig">禍兮福之所倚　福兮禍之所伏</div><div class="eum"><span class="lab">음</span>화혜복지소의 복혜화지소복</div><div class="pul"><span class="lab">풀이</span>화 속에는 복이 기대어 있고, 복 속에는 화가 엎드려 있다.</div><div class="src">노자(老子) 『도덕경』 제58장</div></div>
<div class="item"><div class="pul" style="border:0;padding:0;margin:0;font-size:calc(20px*var(--fz))">“화는 복의 옷을 입고 오고, 복은 화를 깔고 온다.”</div><div class="src">쌤의 메모 — 사마의(司馬懿), 『삼국지』</div></div></section>`;
function render(ymd){
  cur=ymd;const [y,m,d]=ymd;const n=dayIndex(y,m,d);
  const wd=WD[new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  document.getElementById('date').textContent=`${y}년 ${m}월 ${d}일 (${wd})`;
  const isMemo=(y===2026&&m===11&&d===5);
  document.getElementById('memoTop').innerHTML=isMemo?MEMO:'';
  document.getElementById('memoBottom').innerHTML=isMemo?'':MEMO;
  document.getElementById('memoBtn').classList.toggle('hidden',isMemo);
  document.getElementById('cards').innerHTML=
    eastCard('명심보감','明心寶鑑',D.mx,mod(n,D.mx.length))+
    eastCard('채근담','菜根譚',D.cg,mod(n,D.cg.length))+
    eastCard('증광현문','增廣賢文',D.zg,mod(n,D.zg.length))+
    westCard(D.w,mod(n,D.w.length));
  const t=todayYMD();document.getElementById('today').disabled=(t[0]===y&&t[1]===m&&t[2]===d);
  try{history.replaceState(null,'','#'+y+'-'+pad(m)+'-'+pad(d));}catch(e){}
  window.scrollTo(0,0);
}
function parseHash(){const h=(location.hash||'').match(/^#(\d{4})-(\d{2})-(\d{2})$/);return h?[+h[1],+h[2],+h[3]]:null;}
document.getElementById('prev').onclick=()=>render(shift(cur,-1));
document.getElementById('next').onclick=()=>render(shift(cur,1));
document.getElementById('today').onclick=()=>render(todayYMD());
document.getElementById('memoBtn').onclick=()=>document.getElementById('memoBottom').classList.toggle('hidden');
let fz=1;try{fz=parseFloat(localStorage.getItem('hanmadi_fz'))||1;}catch(e){}
function setFz(v){fz=Math.min(1.6,Math.max(0.8,Math.round(v*10)/10));document.documentElement.style.setProperty('--fz',fz);try{localStorage.setItem('hanmadi_fz',fz);}catch(e){}}
setFz(fz);
document.getElementById('bigger').onclick=()=>setFz(fz+0.1);
document.getElementById('smaller').onclick=()=>setFz(fz-0.1);
document.getElementById('foot').innerHTML=`명심보감 ${D.mx.length} · 채근담 ${D.cg.length} · 증광현문 ${D.zg.length} · 서양 ${D.w.length}구절<br>원문은 옛 공개 판본(위키문헌 明心寶鑑·菜根譚 明刻本·增廣昔時賢文, George Long 역 『명상록』, 프랭클린 원문, KJV 잠언)에서, 음과 풀이는 새로 썼습니다.<br>시작일 2026-11-05 · 같은 날짜는 언제나 같은 구절`;
render(parseHash()||todayYMD());
</script>
