\n우인급난처, 출일언해구지, 역시무량공덕.","p":"선비가 가난하여 물건으로 남을 구제하지 못하더라도, 사람이 미혹한 곳에서 한마디로 깨우치고, 사람이 위급한 곳에서 한마디로 건져 주면, 그것도 한량없는 공덕이다.","c":"전집 제143장(前集 第143)","src":142},{"o":"飢則附，飽則颺；\n燠則趨，寒則棄，人情通患也。\n君子宜淨拭冷眼，慎毋輕動剛腸。","e":"기즉부, 포즉양;\n욱즉추, 한즉기, 인정통환야.\n군자의정식랭안, 신무경동강장.","p":"배고프면 붙고 배부르면 날아가며, 따뜻하면 달려오고 추우면 버린다. 이것이 인정의 공통된 병이다. 군자는 차가운 눈을 깨끗이 닦아, 굳은 창자를 가볍게 움직이지 말아야 한다.","c":"전집 제144장(前集 第144)","src":143},{"o":"一鐙熒然，萬籟無聲，此吾人初入宴寂時也；\n曉夢初醒，群動未起，此吾人初出混沌處也。\n乘此而一念迴光，炯然返照，始知耳目口鼻皆桎梏，而情慾嗜好悉機械矣。","e":"일등형연, 만뢰무성, 차오인초입연적시야;\n효몽초성, 군동미기, 차오인초출혼돈처야.\n승차이일념회광, 형연반조, 시지이목구비개질곡, 이정욕기호실기계의.","p":"등잔 하나 가물거리고 온갖 소리가 없는 때, 이것이 사람이 처음으로 고요한 잔치에 드는 때이다. 새벽꿈이 막 깨고 뭇 움직임이 아직 일어나지 않은 때, 이것이 사람이 처음으로 혼돈에서 나오는 곳이다. 이 틈에 한 생각이 빛을 돌이켜 밝게 비추면, 비로소 귀·눈·입·코가 다 족쇄이고 욕정과 기호가 다 기계임을 안다.","c":"전집 제146장(前集 第146)","src":145},{"o":"魚網之設，鴻則罹其中；\n螳螂之貪，雀又乘其後。\n機裏藏機，變外生變，智巧何足恃哉。","e":"어망지설, 홍즉리기중;\n당랑지탐, 작우승기후.\n기리장기, 변외생변, 지교하족시재.","p":"고기 그물을 쳐 두면 기러기가 그 속에 걸리고, 사마귀가 탐하면 참새가 또 그 뒤를 탄다. 기틀 속에 기틀이 숨고 변고 밖에 변고가 나니, 잔꾀를 어찌 믿을 만하겠는가.","c":"전집 제149장(前集 第149)","src":148},{"o":"作人無點真懇念頭，便成個花子，事事皆虛；\n涉世無段圓活機趣，便是個木人，處處有礙。","e":"작인무점진간념두, 변성개화자, 사사개허;\n섭세무단원활기취, 변시개목인, 처처유애.","p":"사람에게 참되고 간절한 생각이 조금도 없으면 곧 거지가 되어 일마다 헛되고, 세상을 건널 때 둥글고 활발한 맛이 한 토막 없으면 곧 나무 인형이 되어 곳곳마다 걸림이 있다.","c":"전집 제150장(前集 第150)","src":149},{"o":"水不波則自定，鑑不翳則自明，故心無可清，去其混之者，而清自現；\n樂不必尋，去其苦之者，而樂自存。","e":"수불파즉자정, 감불예즉자명, 고심무가청, 거기혼지자, 이청자현;\n낙불필심, 거기고지자, 이락자존.","p":"물이 파도를 일으키지 않으면 절로 고요하고, 거울에 티가 없으면 절로 밝다. 그러므로 마음은 맑힐 것이 따로 없고 흐리게 하는 것을 걷어 내면 맑음이 절로 나타나며, 즐거움은 찾을 필요가 없고 괴롭히는 것을 걷어 내면 즐거움이 절로 남는다.","c":"전집 제151장(前集 第151)","src":150},{"o":"有一念犯鬼神之禁，一言而傷天地之和，一事而釀子孫之禍者，最宜切戒。","e":"유일념범귀신지금, 일언이상천지지화, 일사이양자손지화자, 최의절계.","p":"한 생각이 귀신의 금기를 범하고, 한 마디 말이 천지의 조화를 상하게 하며, 한 가지 일이 자손의 화를 빚는 것이 있으니, 가장 마땅히 엄히 경계해야 한다.","c":"전집 제152장(前集 第152)","src":151},{"o":"節義傲青雲，文章高白雪，若不以性情陶鎔之，終為血氣之私，技能之末。","e":"절의오청운, 문장고백설, 약불이성정도용지, 종위혈기지사, 기능지말.","p":"절의가 푸른 구름을 거만히 보고 문장이 흰 눈보다 높아도, 성정으로 녹여 내지 않으면 끝내 혈기의 사사로움과 재주의 끄트머리에 그친다.","c":"전집 제154장(前集 第154)","src":153},{"o":"交市人，不如友山翁；\n謁朱門，不如親白屋；\n聽街談巷語，不如聞牧唱樵歌；\n談今人失德過差，不如述古人嘉言懿行。","e":"교시인, 불여우산옹;\n알주문, 불여친백옥;\n청가담항어, 불여문목창초가;\n담금인실덕과차, 불여술고인가언의행.","p":"저잣거리 사람과 사귀느니 산속 늙은이를 벗하고, 붉은 대문을 찾아가느니 흰 집을 가까이하며, 길거리 이야기를 듣느니 목동의 노래와 나무꾼의 노래를 듣고, 지금 사람의 허물과 실수를 말하느니 옛사람의 좋은 말과 아름다운 행실을 이야기하는 것이 낫다.","c":"전집 제156장(前集 第156)","src":155},{"o":"前人云：「拋卻自家無盡藏，沿門持鉢效貧兒。」又云：「暴富貧兒休說夢，誰家灶裏火無煙？」一箴自昧所有，一箴自誇所有，可為學人切戒。","e":"전인운: “포각자가무진장, 연문지발효빈아.\n”우운: “포부빈아휴설몽, 수가조리화무연?\n”일잠자매소유, 일잠자과소유, 가위학인절계.","p":"옛사람이 이르되, 제 집의 다함없는 곳간을 내던지고 문마다 바루를 들고 가난한 아이를 흉내 낸다 하였고, 또 이르되, 갑자기 부자가 된 가난한 아이는 꿈을 늘어놓지 말라, 누구 집 부엌의 불에 연기가 없겠는가 하였다. 하나는 가진 것을 스스로 속이는 경계요, 하나는 가진 것을 스스로 자랑하는 경계이니, 배우는 사람이 마땅히 엄히 삼갈 일이다.","c":"전집 제158장(前集 第158)","src":157},{"o":"道是一重公眾物事，當隨人而接引。\n學是一個尋常家飯，當隨事而講求。","e":"도시일중공중물사, 당수인이접인.\n학시일개심상가반, 당수사이강구.","p":"도는 여러 사람의 것이니 사람을 따라 이끌어 주어야 하고, 배움은 집의 평범한 밥이니 일을 따라 강구해야 한다.","c":"전집 제159장(前集 第159)","src":158},{"o":"勤者敏於德義，而世人借勤以濟其貧；\n儉者淡於貨利，而世人假儉以飾其吝。\n君子持身之符，反為小人營私之具矣。\n惜哉。","e":"근자민어덕의, 이세인차근이제기빈;\n검자담어화리, 이세인가검이식기린.\n군자지신지부, 반위소인영사지구의.\n석재.","p":"부지런한 사람은 덕과 의에 민첩한데, 세상 사람은 부지런함을 빌려 가난을 메운다. 검소한 사람은 재물에 담담한데, 세상 사람은 검소함을 거짓으로 써서 인색함을 꾸민다. 군자가 몸을 지키는 부적이 도리어 소인이 사사로움을 경영하는 도구가 되니, 애석하다.","c":"전집 제164장(前集 第164)","src":163},{"o":"憑意興作為者，隨作則隨止，豈是不退之車輪；\n從情識解悟者，有悟則有迷，終非常明之燈燭。","e":"빙의흥작위자, 수작즉수지, 기시불퇴지차륜;\n종정식해오자, 유오즉유미, 종비상명지등촉.","p":"흥에 기대어 하는 일은 하자마자 곧 그치니, 어찌 물러서지 않는 수레바퀴이겠는가. 감정과 알음알이로 깨치는 것은 깨침이 있으면 미혹도 있으니, 끝내 늘 밝은 등불이 아니다.","c":"전집 제165장(前集 第165)","src":164},{"o":"我貴而人奉之，奉此峨冠大帶也；\n我賤而人侮之，侮此布衣草履也。\n然則原非奉我，我胡為喜？\n原非侮我，我胡為怒？","e":"아귀이인봉지, 봉차아관대대야;\n아천이인모지, 모차포의초리야.\n연즉원비봉아, 아호위희?\n원비모아, 아호위노?","p":"내가 귀하다고 남이 받드는 것은 이 높은 관과 큰 띠를 받드는 것이고, 내가 천하다고 남이 업신여기는 것은 이 베옷과 짚신을 업신여기는 것이다. 그렇다면 본디 나를 받든 것이 아닌데 내가 어찌 기뻐하며, 본디 나를 업신여긴 것이 아닌데 내가 어찌 성내겠는가.","c":"전집 제170장(前集 第170)","src":169},{"o":"「為鼠常留飯，憐蛾不點燈」，古人此等念頭，今人學之，便是一點生生之機。\n無此，便所謂土木形骸而已。","e":"“위서상류반, 연아부점등”, 고인차등념두, 금인학지, 변시일점생생지기.\n무차, 변소위토목형해이이.","p":"쥐를 위해 늘 밥을 남기고, 나방을 가엾이 여겨 등불을 켜지 않는다. 옛사람의 이런 생각을 지금 사람이 배우면 그것이 곧 살아 있는 기운의 한 점이다. 이것이 없으면 이른바 흙과 나무로 된 몸뚱이일 뿐이다.","c":"전집 제171장(前集 第171)","src":170},{"o":"心體便是天體，一念之喜，景星慶雲；\n一念之怒，震雷暴雨；\n一念之慈，和風甘露；\n一念之嚴，烈日秋霜；\n何者所感，只要隨起隨滅，廓然無礙，便與太虛同體。","e":"심체변시천체, 일념지희, 경성경운;\n일념지노, 진뢰포우;\n일념지자, 화풍감로;\n일념지엄, 열일추상;\n하자소감, 지요수기수멸, 곽연무애, 변여태허동체.","p":"마음의 본체가 곧 하늘의 본체이다. 한 생각의 기쁨은 경성과 상서로운 구름이요, 한 생각의 노여움은 벼락과 폭우요, 한 생각의 자비는 따뜻한 바람과 단이슬이요, 한 생각의 엄함은 뜨거운 해와 가을 서리다. 무엇이 감응하든지 일어나자마자 사라지게 하여 탁 트여 걸림이 없으면, 곧 빈 하늘과 한 몸이 된다.","c":"전집 제172장(前集 第172)","src":171},{"o":"無事時，心易昏冥，宜寂寂而照以惺惺；\n有事時，心易奔逸，宜惺惺而主以寂寂。","e":"무사시, 심이혼명, 의적적이조이성성;\n유사시, 심이분일, 의성성이주이적적.","p":"일이 없을 때는 마음이 쉽사리 어두워지니, 고요함으로 또렷함을 비추어야 한다. 일이 있을 때는 마음이 쉽사리 달리기 쉬우니, 또렷함으로 고요함을 주장해야 한다.","c":"전집 제173장(前集 第173)","src":172},{"o":"議事者，身在事外，宜悉利害之情；\n任事者，身居事中，當絕利害之慮。","e":"의사자, 신재사외, 의실리해지정;\n임사자, 신거사중, 당절리해지려.","p":"일을 의논하는 사람은 일 밖에 있으니 이해의 실정을 두루 알아야 하고, 일을 맡은 사람은 일 가운데 있으니 이해의 걱정을 끊어야 한다.","c":"전집 제174장(前集 第174)","src":173},{"o":"士君子處權門要路，操履要嚴明，心氣要和易，毋詭隨而陷腥羶之黨，亦毋矯激而忘蜂蠆之危。","e":"사군자처권문요로, 조리요엄명, 심기요화역, 무궤수이함성전지당, 역무교격이망봉채지위.","p":"선비가 권세의 요로에 있으면 행실은 엄명해야 하고 마음의 기운은 온화해야 한다. 남의 비위를 따라 비리고 노린내의 패거리에 빠지지도 말고, 억지로 세차게 굴어 벌과 전갈의 위험을 잊지도 말라.","c":"전집 제175장(前集 第175)","src":174},{"o":"標節義者，必以節義受謗；\n榜道學者，常因道學招尤；\n故君子不近惡事，亦不立善名，只要和氣渾然，纔是居身之寶。","e":"표절의자, 필이절의수방;\n방도학자, 상인도학초우;\n고군자불근악사, 역불립선명, 지요화기혼연, 재시거신지보.","p":"절의를 표방하는 사람은 반드시 그 절의 때문에 비방을 받고, 도학을 내세우는 사람은 늘 그 도학 때문에 허물을 산다. 그러므로 군자는 악한 일에 가까이하지도 않고 착한 이름을 세우지도 않으며, 다만 화기가 온전히 어울려야 비로소 몸을 두는 보배이다.","c":"전집 제176장(前集 第176)","src":175},{"o":"遇欺詐的人，以誠心感動之；\n遇暴戾的人，以和氣薰蒸之；\n遇傾邪私曲的人，以名義氣節激礪之；\n天下之人，無不入我陶冶中矣。","e":"우기사적인, 이성심감동지;\n우포려적인, 이화기훈증지;\n우경사사곡적인, 이명의기절격려지;\n천하지인, 무불입아도야중의.","p":"속이는 사람을 만나면 참마음으로 감동시키고, 사납고 거센 사람을 만나면 화기로 훈훈하게 찌며, 기울고 사사로이 굽은 사람을 만나면 명분과 의리와 기절로 갈고 닦게 하라. 그러면 천하의 사람이 내 도가니에 들지 않는 이가 없다.","c":"전집 제177장(前集 第177)","src":176},{"o":"陰謀怪習，異行奇能，俱是涉世的禍胎。\n殺身的利器，只一個庸德庸行，便可以完混沌而召和平。","e":"음모괴습, 이행기능, 구시섭세적화태.\n살신적리기, 지일개용덕용행, 변가이완혼돈이소화평.","p":"음모와 괴이한 익힘, 이상한 행실과 기이한 재주는 다 세상을 건널 때 생기는 재앙의 싹이요 몸을 죽이는 날카로운 도구이다. 다만 평범한 덕과 평범한 행실 하나면 혼돈을 온전히 하고 평화를 부를 수 있다.","c":"전집 제179장(前集 第179)","src":178},{"o":"語云：「登山耐側路，踏雪耐危橋。」一耐字極有意味。\n如傾險之人情，坎坷之世道，若不得一耐字撐持過去，幾何不墮入榛莽坑塹哉。","e":"어운: “등산내측로, 답설내위교.\n”일내자극유의미.\n여경험지인정, 감가지세도, 약부득일내자탱지과거, 기하불타입진망갱참재.","p":"말이 이르되, 산에 오르면 비탈길을 견디고 눈을 밟으면 위태로운 다리를 견딘다 하였다. 견딘다는 한 글자가 매우 뜻이 있다. 기울고 험한 인정과 울퉁불퉁한 세도를, 이 견딤 한 자로 버텨 지나가지 못하면 덤불과 구덩이에 떨어지지 않을 리가 없다.","c":"전집 제180장(前集 第180)","src":179},{"o":"誇逞功業，炫耀文章，皆是靠外物做人。\n不知心體瑩然，本來不失，即無寸功隻字，亦自有堂堂正正做人處。","e":"과령공업, 현요문장, 개시고외물주인.\n부지심체형연, 본래불실, 즉무촌공척자, 역자유당당정정주인처.","p":"공업을 자랑하고 문장을 뽐내는 것은 다 바깥 물건에 기대어 사람 노릇을 하는 것이다. 마음의 본체가 맑아 본래를 잃지 않으면, 한 치의 공과 한 글자가 없어도 당당하고 바르게 사람 노릇 할 자리가 절로 있다.","c":"전집 제181장(前集 第181)","src":180},{"o":"忙裏要偷閑，須先向閑時討個把柄；\n鬧中要取靜，須先從靜裏立個根基；\n不然，未有不因境而遷，隨時而靡者。","e":"망리요투한, 수선향한시토개파병;\n요중요취정, 수선종정리립개근기;\n불연, 미유불인경이천, 수시이미자.","p":"바쁠 때 한가함을 훔치려면 먼저 한가할 때 잡을 자루를 구해 두어야 하고, 시끄러움 속에서 고요함을 취하려면 먼저 고요함 속에서 터를 세워야 한다. 그렇지 않으면 경계 때문에 옮기고 때를 따라 쓰러지지 않는 이가 없다.","c":"전집 제182장(前集 第182)","src":181},{"o":"不昧己心，不盡人情，不竭物力；\n三者可以為天地立心，為生民立命，為子孫造福。","e":"불매기심, 부진인정, 불갈물력;\n삼자가이위천지립심, 위생민립명, 위자손조복.","p":"제 마음을 속이지 않고, 인정을 다 긁어내지 않으며, 물건의 힘을 다 짜내지 않는다. 이 세 가지로 천지를 위해 마음을 세우고, 백성을 위해 목숨을 세우며, 자손을 위해 복을 지을 수 있다.","c":"전집 제183장(前集 第183)","src":182},{"o":"受人之恩，雖深不報，怨則淺亦報之；\n聞人之惡，雖隱不疑，善則顯亦疑之。\n此刻之極，薄之尤也，宜切戒之。","e":"수인지은, 수심불보, 원즉천역보지;\n문인지악, 수은불의, 선즉현역의지.\n차각지극, 박지우야, 의절계지.","p":"남의 은혜는 깊어도 갚지 않으면서 원망은 얕아도 갚고, 남의 악은 숨어 있어도 의심하면서 선은 드러나도 의심한다. 이것은 각박함의 극이요 박함의 으뜸이니, 마땅히 엄히 경계해야 한다.","c":"전집 제192장(前集 第192)","src":191},{"o":"山之高峻處無木，而谿谷迴環則草木叢生；\n水之湍急處無魚，而淵潭停蓄則魚鼈聚集。\n此高絕之行，褊急之衷，君子重有戒焉。","e":"산지고준처무목, 이계곡회환즉초목총생;\n수지단급처무어, 이연담정축즉어별취집.\n차고절지행, 편급지충, 군자중유계언.","p":"산의 높고 가파른 곳에는 나무가 없고, 시내와 골짜기가 감아 돌면 풀과 나무가 무더기로 자란다. 물이 세차게 흐르는 곳에는 고기가 없고, 깊은 못이 고여 있으면 고기와 자라가 모인다. 너무 높은 행실과 너무 조급한 속마음을 군자는 거듭 경계한다.","c":"전집 제194장(前集 第194)","src":193},{"o":"士大夫居官，不可竿牘無節，要使人難見，以杜倖端；\n居鄉不可崖岸太高，要使人易見，以敦舊好。","e":"사대부거관, 불가간독무절, 요사인난견, 이두행단;\n거향불가애안태고, 요사인이견, 이돈구호.","p":"사대부가 벼슬에 있으면 편지와 글이 절도 없이 많아서는 안 되고, 사람을 만나기 어렵게 하여 요행의 실마리를 막아야 한다. 시골에 있으면 벼랑이 너무 높아서는 안 되고, 사람을 만나기 쉽게 하여 옛 정을 두터이 해야 한다.","c":"전집 제211장(前集 第211)","src":210},{"o":"善讀書者，要讀到手舞足蹈處，方不落筌蹄；\n善觀物者，要觀到心融神洽時，方不泥迹象。","e":"선독서자, 요독도수무족도처, 방불락전제;\n선관물자, 요관도심융신흡시, 방불니적상.","p":"글을 잘 읽는 사람은 손이 춤추고 발이 뛰는 데까지 읽어야 통발과 올가미에 떨어지지 않고, 물건을 잘 보는 사람은 마음이 녹아 신이 어우러지는 데까지 보아야 자취와 형상에 빠지지 않는다.","c":"전집 제215장(前集 第215)","src":214},{"o":"天賢一人，以誨眾人之愚，而世反逞其所長，以形人之短；\n天富一人，以濟眾人之困，而世反挾其所有，以凌人之貧。\n真天之戮民哉。","e":"천현일인, 이회중인지우, 이세반령기소장, 이형인지단;\n천부일인, 이제중인지곤, 이세반협기소유, 이릉인지빈.\n진천지륙민재.","p":"하늘이 한 사람을 어질게 한 것은 뭇사람의 어리석음을 가르치라는 것인데, 세상은 도리어 그 장점을 뽐내어 남의 단점을 드러낸다. 하늘이 한 사람을 부유하게 한 것은 뭇사람의 곤궁을 구제하라는 것인데, 세상은 도리어 가진 것을 끼고 남의 가난을 업신여긴다. 참으로 하늘이 벌할 백성이다.","c":"전집 제216장(前集 第216)","src":215},{"o":"至人何思何慮，愚人不識不知，可與論學亦可與建功。\n唯中材的人，多一番思慮知識，便多一番臆度猜疑，事事難與下手。","e":"지인하사하려, 우인불식부지, 가여론학역가여건공.\n유중재적인, 다일번사려지식, 변다일번억도채의, 사사난여하수.","p":"지극한 사람은 무엇을 생각하며 무엇을 근심하고, 어리석은 사람은 알지도 깨닫지도 못하니, 더불어 학문을 논할 수도 있고 공을 세울 수도 있다. 오직 중간 재주의 사람은 생각과 지식이 한 겹 더하면 억측과 의심도 한 겹 더하여, 일마다 함께 손쓰기 어렵다.","c":"전집 제217장(前集 第217)","src":216},{"o":"赤子者，大人之胚胎；\n秀才者，宰相之基礎。\n此時若火力不到，陶鑄不純，他日涉世立朝，終難成個令器。","e":"적자자, 대인지배태;\n수재자, 재상지기초.\n차시약화력부도, 도주불순, 타일섭세립조, 종난성개령기.","p":"어린아이는 큰 사람의 배아이고, 수재는 재상의 터이다. 이때 불의 힘이 미치지 못하고 도가니의 주조가 순수하지 못하면, 후일 세상을 건너고 조정에 서도 끝내 훌륭한 그릇이 되기 어렵다.","c":"전집 제220장(前集 第220)","src":219},{"o":"君子處患難而不憂，當宴遊而益加惕慮；\n遇權豪而不懼，對惸獨而反若驚心。","e":"군자처환난이불우, 당연유이익가척려;\n우권호이불구, 대경독이반약경심.","p":"군자는 환난에 있으면서도 근심하지 않고, 잔치와 노님을 만나면 도리어 더 삼가 걱정한다. 권세 있는 호걸을 만나도 두려워하지 않고, 외롭고 홀로인 사람을 대하면 도리어 마음이 놀라는 듯하다.","c":"전집 제221장(前集 第221)","src":220},{"o":"釣水逸事也，尚持生殺之柄。\n奕棋清戲也，且動戰爭之心。","e":"조수일사야, 상지생살지병.\n혁기청희야, 차동전쟁지심.","p":"낚시질은 한가한 일이면서도 오히려 살리고 죽이는 자루를 잡고, 바둑은 맑은 놀이면서도 또한 전쟁의 마음을 움직인다.","c":"후집 제2장(後集 第2)","src":223},{"o":"鶯花茂而山濃谷豔，總是乾坤之幻境。\n水木落而石瘦崖枯，纔見天地之真吾。","e":"앵화무이산농곡염, 총시건곤지환경.\n수목락이석수애고, 재견천지지진오.","p":"꾀꼬리와 꽃이 무성하고 산이 짙으며 골짜기가 고운 것은 다 천지의 허깨비 경계이고, 물이 마르고 나무가 지며 돌이 야위고 벼랑이 마른 뒤에야 비로소 천지의 참된 나를 본다.","c":"후집 제3장(後集 第3)","src":224},{"o":"鳥語蟲聲，總是傳心之訣。\n花英草色，無非見道之文。\n學者，要天機清徹，胸次玲瓏，觸物皆有會心處。","e":"조어충성, 총시전심지결.\n화영초색, 무비견도지문.\n학자, 요천기청철, 흉차령롱, 촉물개유회심처.","p":"새소리와 벌레 소리는 다 마음을 전하는 비결이고, 꽃잎과 풀빛은 도를 보는 글이 아닌 것이 없다. 배우는 사람은 하늘의 기틀이 맑고 가슴이 영롱해야, 물건을 건드릴 때마다 마음이 만나는 곳이 있다.","c":"후집 제7장(後集 第7)","src":228},{"o":"人解讀有字書，不解讀無字書。\n知彈有絃琴，不知彈無絃琴。\n以迹用，不以神用，何以得琴書之趣。","e":"인해독유자서, 불해독무자서.\n지탄유현금, 부지탄무현금.\n이적용, 불이신용, 하이득금서지취.","p":"사람은 글자 있는 책은 읽을 줄 알아도 글자 없는 책은 읽을 줄 모르고, 줄 있는 거문고는 탈 줄 알아도 줄 없는 거문고는 탈 줄 모른다. 자취로만 쓰고 신으로 쓰지 않으면 어찌 거문고와 책의 맛을 얻겠는가.","c":"후집 제8장(後集 第8)","src":229},{"o":"賓朋雲集，劇飲淋漓樂矣。\n俄而漏盡燭殘，香銷茗冷，不覺反成嘔咽，令人索然無味。\n天下事率類此，人奈何不早回頭也。","e":"빈붕운집, 극음림리락의.\n아이루진촉잔, 향소명랭, 불각반성구열, 영인색연무미.\n천하사솔류차, 인내하부조회두야.","p":"손님이 구름처럼 모여 술을 흥건히 마시면 즐겁다. 이윽고 물시계가 다하고 촛불이 꺼지며 향이 사라지고 차가 식으면, 도리어 구역질이 되어 사람에게 쓸쓸하고 맛없게 한다. 천하의 일이 대개 이와 같으니, 사람은 어찌하여 일찍 고개를 돌리지 않는가.","c":"후집 제10장(後集 第10)","src":231},{"o":"會得個中趣，五湖之煙月，盡入寸裡。\n破得眼前機，千古之英雄，盡歸掌握。","e":"회득개중취, 오호지연월, 진입촌리.\n파득안전기, 천고지영웅, 진귀장악.","p":"그 속의 재미를 깨치면 오호의 안개와 달이 다 한 치 마음 안으로 들어오고, 눈앞의 기틀을 부수면 천고의 영웅이 다 손아귀로 돌아온다.","c":"후집 제11장(後集 第11)","src":232},{"o":"山河大地，已屬微塵。\n而況塵中之塵。\n血肉身軀，且歸泡影。\n而況影外之影。\n非上上智，無了了心。","e":"산하대지, 이속미진.\n이황진중지진.\n혈육신구, 차귀포영.\n이황영외지영.\n비상상지, 무료료심.","p":"산하와 대지도 이미 미세한 먼지인데, 하물며 먼지 속의 먼지이겠는가. 피와 살의 몸뚱이도 장차 거품 그림자로 돌아가는데, 하물며 그림자 밖의 그림자이겠는가. 가장 높은 지혜가 아니면 또렷이 깨친 마음이 없다.","c":"후집 제12장(後集 第12)","src":233},{"o":"寒燈無焰，敝裘無溫，總是播弄光景。\n身如槁木，心似死灰，不免墮落頑空。","e":"한등무염, 폐구무온, 총시파롱광경.\n신여고목, 심사사회, 불면타락완공.","p":"찬 등잔에 불꽃이 없고 해진 갖옷에 따뜻함이 없는 것은 다 빛을 희롱하는 일이요, 몸이 마른 나무 같고 마음이 죽은 재 같으면 완고한 공에 떨어짐을 면하지 못한다.","c":"후집 제14장(後集 第14)","src":235},{"o":"人肯當下休，便當下了。\n若要尋個歇處，則婚嫁未完，事亦不少。\n僧道雖好，心亦不了。\n前人云：如今休去便休去，若覓了時無了時。\n見之卓矣。","e":"인긍당하휴, 변당하료.\n약요심개헐처, 즉혼가미완, 사역불소.\n승도수호, 심역불료.\n전인운: 여금휴거변휴거, 약멱료시무료시.\n견지탁의.","p":"사람이 당장 쉴 수 있으면 당장 끝난다. 쉴 곳을 따로 찾으려 하면 혼인도 다하지 않았고 일도 적지 않으며, 중이 되는 것이 좋아도 마음은 끝나지 않는다. 옛사람이 이르되, 지금 쉬려면 곧 쉬고, 끝날 때를 찾으면 끝날 때가 없다 하니, 보는 바가 뛰어나다.","c":"후집 제15장(後集 第15)","src":236},{"o":"有浮雲富貴之風。\n而不必巖棲穴處。\n無膏肓泉石之癖。\n而常自醉酒耽詩。\n競逐聽人，而不嫌盡醉。\n恬淡適己，而不誇獨醒。\n此釋氏所謂，不為法纏，不為空纏，身心兩自在者","e":"유부운부귀지풍.\n이불필암서혈처.\n무고황천석지벽.\n이상자취주탐시.\n경축청인, 이불혐진취.\n염담적기, 이불과독성.\n차석씨소위, 불위법전, 불위공전, 신심량자재자","p":"뜬구름 같은 부귀를 바람에 맡기는 기풍이 있으면서 반드시 바위 굴에 살 필요는 없고, 물과 돌에 골수까지 빠진 버릇이 없으면서도 늘 술에 취하고 시를 즐긴다. 다툼은 남에게 맡기고 실컷 취하는 것을 꺼리지 않으며, 담담함은 나에게 맞고 혼자 깨어 있음을 자랑하지 않는다. 이것이 부처가 말한, 법에 얽히지도 않고 공에 얽히지도 않아 몸과 마음이 둘 다 자유로운 것이다.","c":"후집 제17장(後集 第17)","src":238},{"o":"延促由於一念，寬窄係之寸心。\n故機閒者，一日遙於千古，意廣者，斗室寬若兩閒。","e":"연촉유어일념, 관착계지촌심.\n고기한자, 일일요어천고, 의광자, 두실관약량한.","p":"늘어남과 줄어듦은 한 생각에서 나오고, 너비와 좁음은 한 치 마음에 매여 있다. 그러므로 기틀이 한가한 사람에게는 하루가 천고보다 멀고, 뜻이 넓은 사람에게는 한 칸 방이 하늘과 땅처럼 넓다.","c":"후집 제18장(後集 第18)","src":239},{"o":"損之又損，栽花種竹，儘交還烏有先生。\n忘無可忘，焚香煮茗，總不問白衣童子。","e":"손지우손, 재화종죽, 진교환오유선생.\n망무가망, 분향자명, 총불문백의동자.","p":"덜고 또 덜어 꽃을 심고 대를 심은 뒤, 있는 것을 다 돌려 허무 선생에게 맡긴다. 잊을 만큼 잊어 향을 피우고 차를 달이면서, 아예 흰옷 동자가 누구인지 묻지 않는다.","c":"후집 제19장(後集 第19)","src":240},{"o":"松澗邊，携杖獨行，立處雲生破衲。\n竹窗下，枕書高臥，覺時月侵寒氈。","e":"송간변, 휴장독행, 입처운생파납.\n죽창하, 침서고와, 각시월침한전.","p":"소나무 시냇가에서 지팡이를 짚고 홀로 걸으면, 선 자리에 구름이 해진 가사에 인다. 대나무 창 아래에서 책을 베고 높이 누우면, 깨어날 때 달이 찬 담요를 파고든다.","c":"후집 제22장(後集 第22)","src":243},{"o":"色慾火熾，而一念及病時，便興似寒灰。\n名利飴甘，而一想到死地，便味如嚼蠟。\n故人常憂死慮病，亦可消幻業而長道心。","e":"색욕화치, 이일념급병시, 변흥사한회.\n명리이감, 이일상도사지, 변미여작랍.\n고인상우사려병, 역가소환업이장도심.","p":"색욕의 불이 성해도 병든 때를 한 번 생각하면 흥이 곧 찬 재와 같고, 명리의 엿이 달아도 죽을 자리를 한 번 생각하면 맛이 곧 밀랍을 씹는 듯하다. 그러므로 사람이 늘 죽음을 근심하고 병을 생각하면, 헛된 업도 없애고 도의 마음도 기를 수 있다.","c":"후집 제23장(後集 第23)","src":244},{"o":"熱不必除，而除此熱惱，身常在清涼台上。\n窮不可遣，而遣此窮愁，心常居安樂窩中。","e":"열불필제, 이제차열뇌, 신상재청량태상.\n궁불가견, 이견차궁수, 심상거안락와중.","p":"더위를 없앨 필요는 없고 이 뜨거운 번뇌만 없애면 몸은 늘 서늘한 대 위에 있다. 가난을 쫓아낼 수는 없고 이 궁한 시름만 쫓으면 마음은 늘 편안하고 즐거운 집에 있다.","c":"후집 제27장(後集 第27)","src":248},{"o":"貪得者，分金恨不得玉，封公怨不受侯，權豪自甘乞丐。\n知足者，藜羹旨於膏梁，布袍煖於狐貉，編民不讓王公。","e":"탐득자, 분금한부득옥, 봉공원불수후, 권호자감걸걸.\n지족자, 여갱지어고량, 포포난어호학, 편민불양왕공.","p":"탐내어 얻으려는 사람은 금을 나누고도 옥을 얻지 못함을 한하고, 공을 봉하고도 제후가 되지 못함을 원망하여, 권세 있는 호걸이 스스로 거지 노릇을 달게 여긴다. 족함을 아는 사람은 명아주국이 기름진 밥보다 맛있고 베옷이 여우털보다 따뜻하여, 평범한 백성이 왕공에게 양보하지 않는다.","c":"후집 제29장(後集 第29)","src":250},{"o":"嗜寂者，觀白雲幽石而通玄，趨榮者，見清歌妙舞而忘倦。\n唯自得之士，無喧寂，無榮枯，無往非自適之天。","e":"기적자, 관백운유석이통현, 추영자, 견청가묘무이망권.\n유자득지사, 무훤적, 무영고, 무왕비자적지천.","p":"고요함을 즐기는 사람은 흰 구름과 그윽한 돌을 보고 현묘함에 통하고, 영화로 달리는 사람은 맑은 노래와 묘한 춤을 보고 피곤함을 잊는다. 오직 스스로 얻은 선비는 시끄러움도 고요함도 없고 영화도 시듦도 없어, 가는 곳마다 스스로 맞는 하늘이 아닌 곳이 없다.","c":"후집 제31장(後集 第31)","src":252},{"o":"悠長之趣，不得於醲釅，而得於啜菽飲水。\n惆悵之懷，不生於枯寂，而生於品竹調絲。\n固知濃所味常短，淡中趣獨真也。","e":"유장지취, 부득어농엄, 이득어철숙음수.\n추창지회, 불생어고적, 이생어품죽조사.\n고지농소미상단, 담중취독진야.","p":"길고 느긋한 재미는 진한 술에서 얻지 못하고 콩을 홀짝이고 물을 마시는 데서 얻으며, 서글픈 회포는 메마른 고요에서 생기지 않고 대를 품고 실을 고르는 데서 생긴다. 그러므로 진한 곳의 맛은 늘 짧고, 싱거운 가운데의 재미만이 참되다.","c":"후집 제33장(後集 第33)","src":254},{"o":"禪宗曰：饑來喫飯倦來眠。\n詩旨曰，眼前景致口頭語。\n蓋極高寓於極平，至難出於至易，有意者反遠，無心者自近也。","e":"선종왈: 기래끽반권래면.\n시지왈, 안전경치구두어.\n개극고우어극평, 지난출어지역, 유의자반원, 무심자자근야.","p":"선종에서는 배고프면 밥 먹고 피곤하면 잔다 하고, 시의 뜻은 눈앞의 경치와 입 안의 말이라 한다. 지극히 높은 것이 지극히 평범한 데 담겨 있고, 지극히 어려운 것이 지극히 쉬운 데서 나오니, 의도하는 사람은 도리어 멀고 마음 없는 사람이 절로 가깝다.","c":"후집 제34장(後集 第34)","src":255},{"o":"山林是勝地，一營戀便成市朝。\n書畫是雅事，一貪癡便成商賈。\n蓋心無染着，欲界是仙都。\n心有係戀，樂境成苦海矣。","e":"산림시승지, 일영련변성시조.\n서화시아사, 일탐치변성상고.\n개심무염착, 욕계시선도.\n심유계련, 낙경성고해의.","p":"산림은 뛰어난 땅인데 한 번 경영하여 연연하면 곧 저자가 되고, 서화는 아담한 일인데 한 번 탐하고 미혹하면 곧 장사치가 된다. 마음에 물듦이 없으면 욕망의 세계도 신선 마을이요, 마음에 매임이 있으면 즐거운 경계도 고통의 바다가 된다.","c":"후집 제36장(後集 第36)","src":257},{"o":"時當喧雜，則平日所記憶者，皆漫然忘去。\n境在清寧，則夙昔所遺忘者，又恍爾現前。\n可見靜躁稍分，昏明頓異也。","e":"시당훤잡, 즉평일소기억자, 개만연망거.\n경재청녕, 즉숙석소유망자, 우황이현전.\n가견정조초분, 혼명돈이야.","p":"때가 시끄럽고 어수선하면 평소 기억하던 것도 다 흐릿하게 잊히고, 경계가 맑고 편안하면 예전에 잊었던 것도 또 문득 눈앞에 나타난다. 고요함과 들뜸이 조금 나뉘면 어두움과 밝음이 곧바로 달라짐을 알 수 있다.","c":"후집 제37장(後集 第37)","src":258},{"o":"蘆花被下，臥雪眠雲，保全得一窩夜氣。\n竹葉杯中，吟風弄月，躱離了萬丈紅塵。","e":"노화피하, 와설면운, 보전득일와야기.\n죽엽배중, 음풍롱월, 타리료만장홍진.","p":"갈대꽃 이불 아래에서 눈을 베고 구름을 덮고 자면 한 보금자리의 밤 기운을 보전하고, 대나무 잎 잔 속에서 바람을 읊고 달을 희롱하면 만 길 붉은 먼지를 벗어난다.","c":"후집 제38장(後集 第38)","src":259},{"o":"袞冕行中，着一藜杖的山人，便增一段高風。\n漁樵路上，著一袞衣的朝士，轉添許多俗氣。\n固知濃不勝淡，俗不如雅也。","e":"곤면행중, 착일려장적산인, 변증일단고풍.\n어초로상, 착일곤의적조사, 전첨허다속기.\n고지농불승담, 속불여아야.","p":"예복과 면류관의 행렬 속에 명아주 지팡이를 든 산사람이 하나 있으면 높은 기풍이 한 자락 더하고, 고기 잡고 나무하는 길에 예복을 입은 조정의 선비가 하나 있으면 도리어 속기가 많이 보태진다. 그러므로 진한 것이 싱거움을 이기지 못하고, 속이 아담함만 못함을 안다.","c":"후집 제39장(後集 第39)","src":260},{"o":"出世之道，即在渉世中，不必絶人以逃世。\n了心之功，即在盡心內，不必絶欲以灰心。","e":"출세지도, 즉재섭세중, 불필절인이도세.\n요심지공, 즉재진심내, 불필절욕이회심.","p":"세상을 벗어나는 도는 바로 세상을 건너는 가운데 있으니, 반드시 사람을 끊고 세상을 도망할 필요가 없다. 마음을 끝내는 공은 바로 마음을 다하는 안에 있으니, 반드시 욕심을 끊고 마음을 재로 만들 필요가 없다.","c":"후집 제40장(後集 第40)","src":261},{"o":"竹籬下，忽聞犬吠鷄鳴，恍似雲中世界。\n芸窗中，雅聽蟬吟鴉噪，方知靜裡乾坤。","e":"죽리하, 홀문견폐계명, 황사운중세계.\n운창중, 아청선음아조, 방지정리건곤.","p":"대나무 울 아래에서 문득 개 짖고 닭 우는 소리를 들으면 구름 속 세계인 듯하고, 책 창 안에서 매미 울고 까마귀 지저귀는 소리를 들으면 비로소 고요함 속의 천지를 안다.","c":"후집 제42장(後集 第42)","src":263},{"o":"徜徉於山林泉石之閒，而塵心漸息。\n夷猶於詩書圖畫之內，而俗氣潛消。\n故，君子雖不玩物喪志，亦常借境調心。","e":"상양어산림천석지한, 이진심점식.\n이유어시서도화지내, 이속기잠소.\n고, 군자수불완물상지, 역상차경조심.","p":"산림과 샘과 돌 사이를 거닐면 티끌 마음이 점점 사라지고, 시와 글과 그림 사이에서 노닐면 속기가 몰래 없어진다. 그러므로 군자는 물건을 희롱하여 뜻을 잃지는 않더라도, 늘 경계를 빌려 마음을 고른다.","c":"후집 제44장(後集 第44)","src":265},{"o":"春日氣象繁華，令人心神駘蕩。\n不若秋日雲白風清，蘭芳桂馥，水天一色，上下空明，使人神骨俱清也。","e":"춘일기상번화, 영인심신태탕.\n불약추일운백풍청, 난방계복, 수천일색, 상하공명, 사인신골구청야.","p":"봄날의 기상은 번화하여 사람의 마음을 나른하게 한다. 가을날 구름이 희고 바람이 맑으며 난초가 향기롭고 계수나무가 그윽하며, 물과 하늘이 한 빛이고 위아래가 환히 빈 것만 못하니, 그것이 사람의 정신과 뼈를 함께 맑게 한다.","c":"후집 제45장(後集 第45)","src":266},{"o":"一字不識，而有詩意者，得詩家真趣。\n一偈不參，而有禪味者，悟禪教玄機。","e":"일자불식, 이유시의자, 득시가진취.\n일게불참, 이유선미자, 오선교현기.","p":"한 글자도 모르면서 시의 뜻이 있는 사람이 시인의 참 재미를 얻고, 게송 하나도 참구하지 않으면서 선의 맛이 있는 사람이 선교의 현묘한 기틀을 깨닫는다.","c":"후집 제46장(後集 第46)","src":267},{"o":"機動的，弓影疑為蛇蝎，寢石視為伏虎。\n此中渾是殺氣。\n念息的，石虎可作海鷗，蛙聲可當鼓吹，觸機俱見真機。","e":"기동적, 궁영의위사갈, 침석시위복호.\n차중혼시살기.\n염식적, 석호가작해구, 와성가당고취, 촉기구견진기.","p":"기틀이 움직이는 사람은 활의 그림자를 뱀과 전갈로 의심하고 잠든 돌을 엎드린 호랑이로 보아, 그 속이 온통 죽일 기운이다. 생각이 잦아든 사람은 돌 호랑이를 갈매기로 만들고 개구리 소리를 풍악으로 삼아, 기틀을 건드릴 때마다 다 참 기틀을 본다.","c":"후집 제47장(後集 第47)","src":268},{"o":"身如不繫之舟，一任流行坎止。\n心似既灰之木，何妨刀割香塗。","e":"신여불계지주, 일임류행감지.\n심사기회지목, 하방도할향도.","p":"몸이 매이지 않은 배와 같으면 흐르든 멈추든 한결같이 맡기고, 마음이 이미 재가 된 나무와 같으면 칼로 베든 향으로 바르든 무슨 방해가 되겠는가.","c":"후집 제48장(後集 第48)","src":269},{"o":"人情聽鷽啼則喜，聞蛙鳴則厭。\n見花則思培之，遇草則欲去之。\n俱是以形氣用事。\n若以性天視之，何者非自鳴其天機，非自暢其生意也。","e":"인정청학제즉희, 문와명즉염.\n견화즉사배지, 우초즉욕거지.\n구시이형기용사.\n약이성천시지, 하자비자명기천기, 비자창기생의야.","p":"사람의 정은 그 새가 울면 기뻐하고 개구리가 울면 싫어하며, 꽃을 보면 가꿀 생각을 하고 풀을 만나면 없애고 싶어 한다. 이것은 다 형체와 기운으로 일을 삼는 것이다. 성품과 하늘의 눈으로 보면, 어느 것이 제 하늘의 기틀을 울지 않으며 제 살아 있는 뜻을 펴지 않겠는가.","c":"후집 제49장(後集 第49)","src":270},{"o":"髮落齒疏，任幻形之彫謝，鳥吟花笑，識自性之真如。","e":"발락치소, 임환형지조사, 조음화소, 식자성지진여.","p":"머리털이 지고 이가 성기어도 헛된 형체의 시듦은 맡겨 두고, 새가 읊고 꽃이 웃는 데서 자기 성품의 진여를 안다.","c":"후집 제50장(後集 第50)","src":271},{"o":"欲其中者，波沸寒潭，山林不見其寂。\n虛其中者，涼生酷暑，朝市不知其喧。","e":"욕기중자, 파비한담, 산림불견기적.\n허기중자, 양생혹서, 조시부지기훤.","p":"속이 욕심으로 가득하면 찬 못에도 파도가 끓어 산림에서도 그 고요함을 보지 못하고, 속이 비어 있으면 심한 더위에도 서늘함이 생겨 저자에서도 그 시끄러움을 알지 못한다.","c":"후집 제51장(後集 第51)","src":272},{"o":"讀易曉窗，丹砂研松間之露。\n譚經午案，寶磬宣竹下之風。","e":"독역효창, 단사연송간지로.\n담경오안, 보경선죽하지풍.","p":"새벽 창에서 주역을 읽으며 솔 사이의 이슬로 단사를 갈고, 한낮 책상에서 경전을 이야기하며 대나무 아래 바람으로 보배 경쇠를 울린다.","c":"후집 제53장(後集 第53)","src":274},{"o":"花居盆內，終乏生機，鳥入籠中，便減天趣。\n不若山間花鳥，錯雜成文，翺翔自若，自是悠然會心。","e":"화거분내, 종핍생기, 조입롱중, 변감천취.\n불약산간화조, 착잡성문, 고상자약, 자시유연회심.","p":"화분에 있는 꽃은 끝내 살아 있는 기운이 모자라고, 새장에 든 새는 곧 하늘의 재미가 줄어든다. 산속의 꽃과 새처럼 어수선히 어울려 무늬를 이루고 제멋대로 나는 것만 못하니, 그것이 절로 느긋하게 마음에 맞는다.","c":"후집 제54장(後集 第54)","src":275},{"o":"世人只緣認得我字太真。\n故多種種嗜好，種種煩惱。\n前人云：不復知有我，安知物為貴。\n又云：知身不是我，煩惱更何侵。\n真破的之言也。","e":"세인지연인득아자태진.\n고다종종기호, 종종번뇌.\n전인운: 불복지유아, 안지물위귀.\n우운: 지신불시아, 번뇌갱하침.\n진파적지언야.","p":"세상 사람은 다만 나라는 글자를 너무 참되다고 여기기 때문에 온갖 기호와 온갖 번뇌가 많다. 옛사람이 이르되, 다시 내가 있는 줄 모르면 어찌 물건이 귀함을 알며, 또 이르되, 몸이 내가 아닌 줄 알면 번뇌가 다시 어찌 침범하겠는가 하니, 참으로 과녁을 뚫는 말이다.","c":"후집 제55장(後集 第55)","src":276},{"o":"人情世態，倐忽萬端，不宜認得太真。\n堯夫云：昔日所云我，而今卻是伊。\n不知今日我又屬後來誰。\n人常作是觀，便可解卻胸中罥矣。","e":"인정세태, 숙홀만단, 불의인득태진.\n요부운: 석일소운아, 이금각시이.\n부지금일아우속후래수.\n인상작시관, 변가해각흉중견의.","p":"인정과 세태는 잠깐 사이에 만 가지로 바뀌니, 너무 참되다고 여겨서는 안 된다. 요부가 이르되, 어제 나라 하던 것이 지금은 오히려 저것이고, 오늘의 나는 또 뒤에 올 누구의 것인지 모른다 하였다. 사람이 늘 이렇게 보면 가슴에 얽힌 것을 풀 수 있다.","c":"후집 제57장(後集 第57)","src":278},{"o":"有一樂境界，就有一不樂的相對待。\n有一好光景，就有一不好的相乘除。\n只是尋常家飯，素位風光，纔是個安樂的窩巢。","e":"유일락경계, 취유일불락적상대대.\n유일호광경, 취유일불호적상승제.\n지시심상가반, 소위풍광, 재시개안락적와소.","p":"즐거운 경계가 하나 있으면 즐겁지 않은 것이 하나 맞서서 기다리고, 좋은 경치가 하나 있으면 좋지 않은 것이 하나 서로 곱하고 나누어 기다린다. 다만 평범한 집밥과 제 자리에 있는 풍광이라야 편안하고 즐거운 보금자리다.","c":"후집 제59장(後集 第59)","src":280},{"o":"簾櫳高敞，看青山綠水呑吐雲煙，識乾坤之自在。\n竹樹扶疏，任乳燕鳴鳩送迎時序，知物我之兩忘。","e":"염롱고창, 간청산록수탄토운연, 식건곤지자재.\n죽수부소, 임유연명구송영시서, 지물아지량망.","p":"발을 높이 걷어 푸른 산과 푸른 물이 구름과 연기를 삼키고 토하는 것을 보면 천지가 자유로움을 알고, 대나무와 나무가 성기게 늘어선 채로 어린 제비와 우는 비둘기가 시절을 보내고 맞이함을 맡기면 물건과 내가 둘 다 잊힘을 안다.","c":"후집 제60장(後集 第60)","src":281},{"o":"古德云：竹影掃堦塵不動。\n月輪穿沼水無痕。\n吾儒云：水流任急境常靜。\n花落雖頻意自閒。","e":"고덕운: 죽영소계진부동.\n월륜천소수무흔.\n오유운: 수류임급경상정.\n화락수빈의자한.","p":"옛 덕이 있는 이가 이르되, 대나무 그림자가 섬돌을 쓸어도 먼지는 움직이지 않고, 달그림자가 못을 뚫어도 물에는 흔적이 없다 하였다. 우리 유가에서는 이르되, 물이 급히 흘러도 경계는 늘 고요하고, 꽃이 자주 져도 뜻은 절로 한가하다 하였다.","c":"후집 제62장(後集 第62)","src":283},{"o":"林間松韻，石上泉聲，靜裡聽來，識天地自然鳴佩。\n草際煙光，水心雲影，閑中觀去，見乾坤最上文章。","e":"임간송운, 석상천성, 정리청래, 식천지자연명패.\n초제연광, 수심운영, 한중관거, 견건곤최상문장.","p":"숲 사이의 솔 소리와 돌 위의 샘소리를 고요함 속에서 들으면 천지가 저절로 울리는 패옥임을 알고, 풀가의 연기 빛과 물 속의 구름 그림자를 한가함 속에서 보면 천지의 가장 높은 글임을 본다.","c":"후집 제63장(後集 第63)","src":284},{"o":"眼看西晉之荊榛，猶矜白刃。\n身屬北邙之狐兎，尚惜黃金。\n語云：猛獸易伏，人心難降。\n谿壑易塡，人心難滿。\n信哉。","e":"안간서진지형진, 유긍백인.\n신속북망지호토, 상석황금.\n어운: 맹수역복, 인심난항.\n계학역전, 인심난만.\n신재.","p":"서진의 가시덤불을 눈앞에 보면서도 오히려 흰 칼을 자랑하고, 몸이 북망의 여우와 토끼에게 속하면서도 오히려 황금을 아낀다. 말이 이르되, 사나운 짐승은 굴복시키기 쉬워도 사람 마음은 항복시키기 어렵고, 시내와 골짜기는 메우기 쉬워도 사람 마음은 채우기 어렵다 하니, 참으로 그렇다.","c":"후집 제64장(後集 第64)","src":285},{"o":"心地上無風濤，隨在皆青山綠樹。\n性天中有化育，觸處見魚躍鳶飛。","e":"심지상무풍도, 수재개청산록수.\n성천중유화육, 촉처견어약연비.","p":"마음 땅에 바람과 물결이 없으면 어디를 가나 다 푸른 산과 푸른 나무이고, 성품의 하늘에 기르고 변화하는 힘이 있으면 닿는 곳마다 물고기가 뛰고 솔개가 나는 것을 본다.","c":"후집 제65장(後集 第65)","src":286},{"o":"峨冠大帶帶之士，一旦睹輕蓑小笠飄飄然逸也，未必不動其咨嗟。\n長筵廣席之豪，一旦遇疏簾淨几悠悠焉靜也，未必不增其綣戀。\n人奈何驅以火牛，誘以風馬，而不思自適其性哉。","e":"아관대대대지사, 일단도경사소립표표연일야, 미필부동기자차.\n장연광석지호, 일단우소렴정기유유언정야, 미필부증기권련.\n인내하구이화우, 유이풍마, 이불사자적기성재.","p":"높은 관과 큰 띠를 한 선비가 한순간에 가벼운 도롱이와 작은 삿갓이 훌훌 벗어난 것을 보면, 탄식하지 않을 수 없다. 긴 잔치와 넓은 자리의 호걸이 한순간에 성긴 발과 깨끗한 책상이 유유히 고요한 것을 만나면, 그리움이 더하지 않을 수 없다. 사람은 어찌하여 불 붙은 소로 몰고 바람 난 말로 꾀면서, 제 성품에 스스로 맞출 생각은 하지 않는가.","c":"후집 제66장(後集 第66)","src":287},{"o":"狐眠敗砌，兎走荒台，盡是當年歌舞之地。\n露冷黃花，煙迷衰草，悉屬舊時爭戰之場。\n盛衰何常，强弱安在。\n念此令人心灰。","e":"호면패체, 토주황태, 진시당년가무지지.\n노랭황화, 연미쇠초, 실속구시쟁전지장.\n성쇠하상, 강약안재.\n염차령인심회.","p":"여우가 무너진 섬돌에서 잠들고 토끼가 거친 대를 달리는 곳이 다 그해의 노래와 춤 자리이고, 이슬이 찬 국화와 연기에 잠긴 시든 풀이 다 옛적 전쟁의 마당이다. 성하고 쇠함이 어찌 일정하며, 강하고 약함이 어디에 있는가. 이것을 생각하면 사람의 마음이 재가 된다.","c":"후집 제68장(後集 第68)","src":289},{"o":"晴空朗月，何天不可翺翔，而飛蛾獨投夜燭。\n清泉綠卉，何物不可飲啄，而鴟鴞偏嗜腐鼠。\n噫，世之不為飛蛾鴟鴞，幾何人哉。","e":"청공낭월, 하천불가고상, 이비아독투야촉.\n청천록훼, 하물불가음탁, 이치효편기부서.\n희, 세지불위비아치효, 기하인재.","p":"갠 하늘의 밝은 달 아래 어느 하늘인들 날지 못하랴마는 불나비만 홀로 밤 촛불에 들고, 맑은 샘과 푸른 풀은 어느 것인들 마시고 쪼지 못하랴마는 올빼미만 홀로 썩은 쥐를 즐긴다. 아, 세상에 불나비와 올빼미가 되지 않는 사람이 몇이나 되겠는가.","c":"후집 제70장(後集 第70)","src":291},{"o":"纔就筏便思捨筏。\n方是無事道人。\n若騎驢又復覓驢，終為不了禪師。","e":"재취벌변사사벌.\n방시무사도인.\n약기려우복멱려, 종위불료선사.","p":"뗏목을 타자마자 뗏목을 버릴 생각을 해야 비로소 일이 없는 도인이고, 나귀를 타고 또 나귀를 찾으면 끝내 끝내지 못한 선사이다.","c":"후집 제71장(後集 第71)","src":292},{"o":"權貴龍驤，英雄虎戰。\n以冷眼視之，如蟻聚羶，如蠅競血。\n是非蜂起，得失蝟興。\n以冷情當之，如冶化金，如湯消雪。","e":"권귀룡양, 영웅호전.\n이랭안시지, 여의취전, 여승경혈.\n시비봉기, 득실위흥.\n이랭정당지, 여야화금, 여탕소설.","p":"권세 있는 이는 용처럼 날뛰고 영웅은 호랑이처럼 싸운다. 차가운 눈으로 보면 개미가 노린내에 모이고 파리가 피를 다투는 것과 같다. 시비가 벌떼처럼 일고, 얻고 잃음이 고슴도치 털처럼 일어난다. 차가운 마음으로 당하면 풀무가 쇠를 녹이고 끓는 물이 눈을 없애는 것과 같다.","c":"후집 제72장(後集 第72)","src":293},{"o":"羈鎖於物欲，覺吾生之可哀。\n夷猶於性真，覺吾生之可樂。\n知其可哀，則塵情立破，知其可樂，則聖境自臻。","e":"기쇄어물욕, 각오생지가애.\n이유어성진, 각오생지가락.\n지기가애, 즉진정립파, 지기가락, 즉성경자진.","p":"물건의 욕심에 얽히면 내 삶이 가엾음을 느끼고, 참된 성품에서 노닐면 내 삶이 즐거움을 느낀다. 가엾음을 알면 티끌의 정이 곧 부서지고, 즐거움을 알면 성인의 경계가 절로 이른다.","c":"후집 제73장(後集 第73)","src":294},{"o":"胸中既無半點物欲，已如雪消鑪焰冰消日。\n眼前自有一段空明，時見月在青天影在波。","e":"흉중기무반점물욕, 이여설소로염빙소일.\n안전자유일단공명, 시견월재청천영재파.","p":"가슴에 이미 물건 욕심이 반 점도 없으면, 눈이 화로 불에 사라지고 얼음이 햇살에 사라지듯 하다. 눈앞에 절로 한 자락 빈 밝음이 있어, 때로 달이 푸른 하늘에 있고 그림자가 물결에 있음을 본다.","c":"후집 제74장(後集 第74)","src":295},{"o":"詩思在灞陵橋上，微吟就，林岫便已浩然。\n野興在鏡湖曲邊，獨往時，山川自相映發。","e":"시사재파릉교상, 미음취, 임수변이호연.\n야흥재경호곡변, 독왕시, 산천자상영발.","p":"시의 생각은 파릉 다리 위에 있어, 나직이 읊조리면 숲과 산봉우리가 이미 넓고 호탕하다. 들판의 흥은 거울 호수의 굽은 가에 있어, 홀로 갈 때 산과 내가 절로 서로 비추며 드러난다.","c":"후집 제75장(後集 第75)","src":296},{"o":"真空不空。\n執相非真。\n破相亦非真。\n問：世尊如何發付。\n在世出世，徇欲是苦，絶欲亦是苦。\n聽，吾儕善自修持。","e":"진공불공.\n집상비진.\n파상역비진.\n문: 세존여하발부.\n재세출세, 순욕시고, 절욕역시고.\n청, 오제선자수지.","p":"참된 공은 공이 아니고, 상을 집착해도 참이 아니며 상을 깨뜨려도 참이 아니다. 묻노니, 세존은 이것을 어떻게 처리하셨는가. 세상에 있거나 세상을 나가거나, 욕심을 따르면 괴로움이고 욕심을 끊어도 괴로움이다. 들으라, 우리 무리는 스스로 잘 닦아야 한다.","c":"후집 제78장(後集 第78)","src":299},{"o":"烈士讓千乘，貪夫爭一文。\n人品星淵也，而好名，不殊好利。\n天子營家國，乞人號饔飧。\n位分霄壤也，而焦思，何異焦聲。","e":"열사양천승, 탐부쟁일문.\n인품성연야, 이호명, 불수호리.\n천자영가국, 걸인호옹손.\n위분소양야, 이초사, 하이초성.","p":"열사는 천 승의 나라를 사양하고 탐하는 사내는 한 푼을 다툰다. 인품은 별과 못처럼 다르지만, 이름을 좋아함은 이익을 좋아함과 다르지 않다. 천자는 집과 나라를 경영하고 거지은 아침저녁 밥을 외친다. 자리는 하늘과 땅처럼 다르지만, 마음을 태우는 걱정이 소리를 태우는 것과 어찌 다르겠는가.","c":"후집 제79장(後集 第79)","src":300},{"o":"飽諳世味，一任覆雨翻雲，總慵開眼。\n會盡人情，隨教呼牛喚馬，只是點頭。","e":"포암세미, 일임복우번운, 총용개안.\n회진인정, 수교호우환마, 지시점두.","p":"세상 맛을 실컷 알면 비가 뒤집히고 구름이 뒤집혀도 아예 눈을 뜨기 게으르고, 인정을 다 깨치면 소라 부르든 말이라 부르든 다만 고개를 끄덕일 뿐이다.","c":"후집 제80장(後集 第80)","src":301},{"o":"今人專求無念，而終不可無。\n只是前念不滯，後念不迎，但將現在的隨緣，打發得去，自然漸漸入無。","e":"금인전구무념, 이종불가무.\n지시전념불체, 후념불영, 단장현재적수연, 타발득거, 자연점점입무.","p":"지금 사람은 한갓 생각이 없기를 구하지만 끝내 없을 수 없다. 다만 앞 생각에 막히지 않고 뒷생각을 맞이하지 않으며, 지금의 것을 인연 따라 잘 보내면, 저절로 점점 없음에 들어간다.","c":"후집 제81장(後集 第81)","src":302},{"o":"意所偶會，便成佳境，物出天然，纔見真機。\n若加一分調停布置，趣味便減矣。\n白氏云：意隨無事適，風逐自然清。\n有味哉，其言之也。","e":"의소우회, 변성가경, 물출천연, 재견진기.\n약가일분조정포치, 취미변감의.\n백씨운: 의수무사적, 풍축자연청.\n유미재, 기언지야.","p":"뜻이 우연히 만나면 곧 좋은 경계가 되고, 물건이 천연으로 나와야 비로소 참 기틀을 본다. 한 푼이라도 고르고 배치를 더하면 재미가 곧 줄어든다. 백씨가 이르되, 뜻은 일이 없음을 따라 맞고 바람은 자연을 따라 맑다 하니, 그 말에 맛이 있다.","c":"후집 제82장(後集 第82)","src":303},{"o":"性天澄徹，即饑喫渴飲，無非康濟身心。\n心地沈迷，縱譚談禪演偈，總是播弄精魂。","e":"성천징철, 즉기끽갈음, 무비강제신심.\n심지침미, 종담담선연게, 총시파롱정혼.","p":"성품의 하늘이 맑으면 배고파 먹고 목말라 마시는 것도 몸과 마음을 편하게 구제함이 아닌 것이 없다. 마음 땅이 빠지면 선을 이야기하고 게송을 늘어놓아도 다 넋을 희롱하는 것이다.","c":"후집 제83장(後集 第83)","src":304},{"o":"人心有個真境，非絲非竹，而自恬愉。\n不煙不茗，而自清芬。\n須念淨境空，慮忘形釋。\n纔得以游衍其中。","e":"인심유개진경, 비사비죽, 이자념유.\n불연불명, 이자청분.\n수념정경공, 여망형석.\n재득이유연기중.","p":"사람 마음에는 참된 경계가 있어, 실도 아니고 대도 아닌데 절로 편안하고 즐겁다. 연기도 아니고 차도 아닌데 절로 맑은 향이 난다. 생각이 깨끗하고 경계가 비며, 근심을 잊고 형체를 놓아야, 비로소 그 속에서 노닐 수 있다.","c":"후집 제84장(後集 第84)","src":305},{"o":"金自鑛出，玉從石生。\n非幻無以求真。\n道得酒中，仙遇花裡。\n雖雅不能離俗。","e":"금자광출, 옥종석생.\n비환무이구진.\n도득주중, 선우화리.\n수아불능리속.","p":"금은 광석에서 나오고 옥은 돌에서 나니, 허깨비가 아니면 참됨을 구할 수 없다. 도는 술 가운데서 얻고 신선은 꽃 속에서 만나니, 아담해도 속을 떠날 수 없다.","c":"후집 제85장(後集 第85)","src":306},{"o":"天地中萬物，人倫萬情，世界中萬事。\n以俗眼觀，紛紛各異，以道眼觀，種種是常。\n何煩分別，何用取捨。","e":"천지중만물, 인륜만정, 세계중만사.\n이속안관, 분분각이, 이도안관, 종종시상.\n하번분별, 하용취사.","p":"천지 가운데 만물, 인륜의 만 가지 정, 세계 가운데 만 가지 일이 있다. 속된 눈으로 보면 어수선하게 각기 다르고, 도의 눈으로 보면 가지가지가 다 항상이다. 어찌 분별할 것이며, 어찌 취하고 버릴 것인가.","c":"후집 제86장(後集 第86)","src":307},{"o":"神酣，布被窩中，得天地冲和之氣。\n味足，藜羹飯後，識人生澹泊之真。","e":"신감, 포피와중, 득천지충화지기.\n미족, 여갱반후, 식인생담박지진.","p":"신이 흡족하면 베이불 속에서 천지의 충화한 기운을 얻고, 맛이 족하면 명아주국 밥 뒤에 인생이 담박함의 참됨을 안다.","c":"후집 제87장(後集 第87)","src":308},{"o":"纏脫只在自心。\n心了，則屠肆糟廛，居然淨土。\n不然，縱一琴一鶴，一花一卉，嗜好雖清，魔障終在。\n語云：能休塵境為真境，未了僧家是俗家。\n信夫。","e":"전탈지재자심.\n심료, 즉도사조전, 거연정토.\n불연, 종일금일학, 일화일훼, 기호수청, 마장종재.\n어운: 능휴진경위진경, 미료승가시속가.\n신부.","p":"얽힘과 벗어남은 오직 제 마음에 있다. 마음이 끝나면 백정집과 술도가도 그대로 정토가 된다. 그렇지 않으면 거문고 하나와 학 하나, 꽃 하나와 풀 하나가 있어도 기호는 맑아도 마귀의 장애가 끝내 있다. 말이 이르되, 티끌 경계를 쉴 수 있어야 참 경계요, 끝내지 못한 중은 속한 집이라 하니, 참으로 그렇다.","c":"후집 제88장(後集 第88)","src":309},{"o":"斗室中，萬慮都捐，說甚畫棟飛雲，珠簾捲雨。\n三杯後，一真自得，唯知素琴橫月，短笛吟風。","e":"두실중, 만려도연, 설심화동비운, 주렴권우.\n삼배후, 일진자득, 유지소금횡월, 단적음풍.","p":"한 칸 방에서 만 가지 생각이 다 버려지면, 그림 기둥에 구름이 날고 구슬 발에 비가 말린다는 것이 무슨 말이겠는가. 석 잔 뒤에는 한 참됨을 스스로 얻어, 오직 소박한 거문고가 달을 가로지르고 짧은 피리가 바람을 읊는 것만 안다.","c":"후집 제89장(後集 第89)","src":310},{"o":"萬籟寂寥中，忽聞一鳥弄聲，便喚起許多幽趣。\n萬卉摧剝後，忽見一枝擢秀，便觸動無限生機。\n可見，性天未常枯槁，機神最宜觸發。","e":"만뢰적료중, 홀문일조롱성, 변환기허다유취.\n만훼최박후, 홀견일지탁수, 변촉동무한생기.\n가견, 성천미상고고, 기신최의촉발.","p":"온갖 소리가 고요한 가운데 문득 새 한 마리가 소리를 내면 많은 그윽한 재미가 깨어나고, 온갖 풀이 꺾이고 벗겨진 뒤에 문득 가지 하나가 빼어나게 솟으면 끝없는 살아 있는 기운이 움직인다. 성품의 하늘이 언제나 마른 것은 아니요, 신의 기틀은 건드려 일으키기 가장 좋음을 알 수 있다.","c":"후집 제90장(後集 第90)","src":311},{"o":"白氏云：不如放身心冥然任天造。\n晁氏云：不如收身心凝然歸寂定。\n放者流為猖狂，收者入於枯寂。\n唯善操身心的，欛柄在手，收放自如。","e":"백씨운: 불여방신심명연임천조.\n조씨운: 불여수신심응연귀적정.\n방자류위창광, 수자입어고적.\n유선조신심적, 파병재수, 수방자여.","p":"백씨가 이르되, 몸과 마음을 놓아 아득히 하늘이 만드는 대로 맡기는 것만 못하다 하고, 조씨가 이르되, 몸과 마음을 거두어 고요히 적막한 선정으로 돌아가는 것만 못하다 하였다. 놓는 사람은 날뜀으로 흐르고, 거두는 사람은 메마른 고요에 들어간다. 오직 몸과 마음을 잘 다루는 사람만이 자루가 손에 있어 거두고 놓음이 자유롭다.","c":"후집 제91장(後集 第91)","src":312},{"o":"當雪夜月天，心境便爾澄徹，遇春風和氣，意界亦自沖融。\n造化人心，混合無間。","e":"당설야월천, 심경변이징철, 우춘풍화기, 의계역자충융.\n조화인심, 혼합무간.","p":"눈 오는 밤과 달 밝은 하늘을 만나면 마음의 경계가 곧 맑아지고, 봄바람과 따뜻한 기운을 만나면 뜻의 세계도 절로 어울려 녹는다. 조물과 사람 마음이 섞여 간격이 없다.","c":"후집 제92장(後集 第92)","src":313},{"o":"文以拙進，道以拙成。\n一拙字有無限意味。\n如桃源犬吠，桑間鷄鳴，何等淳龐。\n至於寒潭之月，古木之鴉，工巧中便覺有衰颯氣象矣。","e":"문이졸진, 도이졸성.\n일졸자유무한의미.\n여도원견폐, 상간계명, 하등순방.\n지어한담지월, 고목지아, 공교중변각유쇠삽기상의.","p":"글은 졸함으로 나아가고 도는 졸함으로 이루어지니, 졸하다는 한 글자에 끝없는 맛이 있다. 복숭아 마을의 개 짖음과 뽕나무 사이의 닭 울음이 얼마나 순박한가. 찬 못의 달과 옛 나무의 까마귀에 이르면, 공교함 가운데 이미 시든 기상이 느껴진다.","c":"후집 제93장(後集 第93)","src":314},{"o":"以我轉物者，得固不喜，失亦不憂，大地盡屬逍遙。\n以物役我者，逆固生憎，順亦生愛，一毛便生纏縛。","e":"이아전물자, 득고불희, 실역불우, 대지진속소요.\n이물역아자, 역고생증, 순역생애, 일모변생전박.","p":"내가 물건을 굴리는 사람은 얻어도 기뻐하지 않고 잃어도 근심하지 않아, 대지가 다 소요하는 곳이다. 물건이 나를 부리는 사람은 거슬리면 미움이 생기고 순해도 사랑이 생겨, 털 하나에도 얽매임이 생긴다.","c":"후집 제94장(後集 第94)","src":315},{"o":"理寂則事寂。\n遺事執理者，以去影留形。\n心空則境空。\n去境在心者，如聚羶卻蚋。","e":"이적즉사적.\n유사집리자, 이거영류형.\n심공즉경공.\n거경재심자, 여취전각예.","p":"이치가 고요하면 일도 고요하다. 일을 버리고 이치만 잡는 사람은 그림자는 없애고 형상은 남겨 두는 격이다. 마음이 비면 경계도 빈다. 경계를 버리면서도 마음에 남겨 두는 사람은 노린내를 모아 놓고 모기를 쫓는 것과 같다.","c":"후집 제95장(後集 第95)","src":316},{"o":"幽人清事總在自適。\n故酒以不勸為歡，棋以不淨為勝。\n笛以無腔為適，琴以無絃為高。\n會以不期約為真率，客以不迎送為坦夷。\n若一牽文泥迹，便落塵世苦海矣。","e":"유인청사총재자적.\n고주이불권위환, 기이부정위승.\n적이무강위적, 금이무현위고.\n회이불기약위진솔, 객이불영송위탄이.\n약일견문니적, 변락진세고해의.","p":"그윽한 사람의 맑은 일은 다 스스로 맞음에 있다. 그러므로 술은 권하지 않음을 즐거움으로 하고, 바둑은 다투지 않음을 이김으로 하며, 피리는 곡조 없음을 맞음으로 하고, 거문고는 줄 없음을 높음으로 한다. 모임은 기약하지 않음을 참되고 솔직함으로 하고, 손님은 맞고 보내지 않음을 평탄함으로 한다. 한 번 글과 자취에 끌리면 곧 속세의 고통의 바다에 떨어진다.","c":"후집 제96장(後集 第96)","src":317},{"o":"試思未生之前有何象貌，又思既死之後作何景色，則萬念灰冷，一性寂然，自可超物外遊象先。","e":"시사미생지전유하상모, 우사기사지후작하경색, 즉만념회랭, 일성적연, 자가초물외유상선.","p":"태어나기 전에 어떤 모습이었는지 생각해 보고, 또 죽은 뒤에 어떤 경치가 될지 생각해 보면, 만 가지 생각이 재처럼 식고 한 성품이 고요하여, 절로 물건 밖을 넘어 형상보다 앞을 노닐 수 있다.","c":"후집 제97장(後集 第97)","src":318},{"o":"遇病而後思强之為寶，處亂而後思平之為福，非蚤智也。\n倖福而知其為禍之本，貪生而先知其為死之因，其卓見乎。","e":"우병이후사강지위보, 처란이후사평지위복, 비조지야.\n행복이지기위화지본, 탐생이선지기위사지인, 기탁견호.","p":"병에 걸린 뒤에야 강함이 보배임을 생각하고, 어지러움에 처한 뒤에야 평안이 복임을 생각하는 것은 이른 지혜가 아니다. 요행의 복이 화의 뿌리임을 알고, 삶을 탐하면서 미리 그것이 죽음의 원인임을 아는 것, 그것이 뛰어난 봄이 아니겠는가.","c":"후집 제98장(後集 第98)","src":319},{"o":"優人傅粉調硃，效妍醜於毫端，俄而歌殘場罷，妍醜何在。\n弈者爭先競後，較雌雄於着子，俄而局盡子收，雌雄安在。","e":"우인부분조주, 효연추어호단, 아이가잔장파, 연추하재.\n혁자쟁선경후, 교자웅어착자, 아이국진자수, 자웅안재.","p":"광대는 분을 바르고 주사를 섞어 붓끝으로 아름답고 추함을 흉내 내다가, 이윽고 노래가 끝나고 무대가 파하면 아름답고 추함이 어디에 있는가. 바둑 두는 이는 앞뒤를 다투며 바둑돌로 암수를 겨루다가, 이윽고 판이 끝나고 돌을 거두면 암수가 어디에 있는가.","c":"후집 제99장(後集 第99)","src":320},{"o":"風花之瀟洒，雪月之空清，唯靜者為之主。\n水木之榮枯，竹石之消長，獨閒者操其權。","e":"풍화지소쇄, 설월지공청, 유정자위지주.\n수목지영고, 죽석지소장, 독한자조기권.","p":"바람과 꽃의 맑고 털림, 눈과 달의 비고 맑음은 오직 고요한 사람이 그 주인이 된다. 물과 나무의 영화와 시듦, 대나무와 돌의 줄고 자람은 홀로 한가한 사람이 그 권한을 잡는다.","c":"후집 제100장(後集 第100)","src":321},{"o":"田父野叟，語以黃雞白酒，則欣然喜，問以鼎食，則不知。\n語以藥袍裋褐，則油然樂，問以袞服，則不識。\n其天全，故其欲淡，此是人生第一個境界。","e":"전부야수, 어이황계백주, 즉흔연희, 문이정식, 즉부지.\n어이약포수갈, 즉유연락, 문이곤복, 즉불식.\n기천전, 고기욕담, 차시인생제일개경계.","p":"밭가는 아비와 들판의 늙은이에게 누런 닭과 흰 술을 말하면 기뻐하고, 솥에 올린 귀한 밥을 물으면 알지 못한다. 약으로 물들인 도포와 굵은 베옷을 말하면 기름하게 즐거워하고, 예복을 물으면 알지 못한다. 하늘이 온전하므로 욕심이 싱거우니, 이것이 인생의 첫째 경계이다.","c":"후집 제101장(後集 第101)","src":322},{"o":"心無其心，何有於觀。\n釋氏曰：觀心者，重增其障。\n物本一物，何待於齊。\n莊生曰：齊物者，自剖其同。","e":"심무기심, 하유어관.\n석씨왈: 관심자, 중증기장.\n물본일물, 하대어제.\n장생왈: 제물자, 자부기동.","p":"마음에 그 마음이 없으면 무엇을 관하겠는가. 부처가 이르되, 마음을 관하는 사람은 그 장애를 거듭 보탠다 하였다. 물건은 본디 한 물건인데 무엇을 가지런히 하겠는가. 장자가 이르되, 만물을 가지런히 하는 사람은 스스로 그 같음을 쪼갠다 하였다.","c":"후집 제102장(後集 第102)","src":323},{"o":"笙歌正濃處，便自拂衣長往，羨達人撒手懸崖。\n更漏已殘時，猶然夜行不休，笑俗士沈身苦海。","e":"생가정농처, 변자불의장왕, 선달인살수현애.\n갱루이잔시, 유연야행불휴, 소속사침신고해.","p":"생황과 노래가 한창인 곳에서 옷을 털고 멀리 떠나면, 통달한 사람이 손을 놓고 벼랑에 매달린 것이 부럽다. 밤 물시계가 이미 남은 때에도 오히려 밤길을 쉬지 않으면, 속된 선비가 몸을 고통의 바다에 빠뜨린 것이 웃긴다.","c":"후집 제103장(後集 第103)","src":324},{"o":"把握未定，宜絶迹塵囂。\n使此心不見可欲而不亂，以澄吾靜體。\n操持既堅，又當混迹風塵。\n使此心見可欲而亦不亂，以養吾圓機。","e":"파악미정, 의절적진효.\n사차심불견가욕이불란, 이징오정체.\n조지기견, 우당혼적풍진.\n사차심견가욕이역불란, 이양오원기.","p":"붙잡음이 아직 정해지지 않았으면 마땅히 시끄러운 티끌의 자취를 끊고, 이 마음이 탐낼 것을 보지 않아 어지럽지 않게 하여 나의 고요한 본체를 맑혀야 한다. 지킴이 이미 굳어졌으면 또 마땅히 풍진에 자취를 섞어, 이 마음이 탐낼 것을 보고도 어지럽지 않게 하여 나의 둥근 기틀을 길러야 한다.","c":"후집 제104장(後集 第104)","src":325},{"o":"喜寂厭喧者，往往避人以求靜。\n不知，意在無人便成我相，心着於靜便是動根。\n如何到得人我一視，動靜兩忘的境界。","e":"희적염훤자, 왕왕피인이구정.\n부지, 의재무인변성아상, 심착어정변시동근.\n여하도득인아일시, 동정량망적경계.","p":"고요함을 좋아하고 시끄러움을 싫어하는 사람은 흔히 사람을 피해 고요함을 구한다. 사람이 없기를 바라는 뜻이 곧 나의 상이 되고, 마음이 고요함에 붙으면 곧 움직임의 뿌리임을 알지 못한다. 어찌 남과 나를 하나로 보고 움직임과 고요함을 둘 다 잊는 경계에 이르겠는가.","c":"후집 제105장(後集 第105)","src":326},{"o":"山居胸次清洒，觸物皆有佳思。\n見孤雲野鶴，而起超絶之想，遇石澗流泉，而動澡雪之思。\n撫老檜寒梅，而勁節挺立，侶沙鷗麋鹿，而機心頓忘。\n若一走入塵寰，無論物不相關，即此身亦屬贅旒矣。","e":"산거흉차청쇄, 촉물개유가사.\n견고운야학, 이기초절지상, 우석간류천, 이동조설지사.\n무로회한매, 이경절정립, 여사구미록, 이기심돈망.\n약일주입진환, 무론물불상관, 즉차신역속췌류의.","p":"산에 살면 가슴이 맑고 털려 물건을 건드릴 때마다 좋은 생각이 있다. 외로운 구름과 들 학을 보면 뛰어넘을 생각이 일어나고, 돌 시내와 흐르는 샘을 만나면 씻어 눈처럼 맑히려는 생각이 움직인다. 늙은 전나무와 찬 매화를 어루만지면 곧은 절개가 우뚝 서고, 모래 갈매기와 큰사슴을 벗하면 기계 마음이 문득 잊힌다. 한 번 티끌 세상으로 들어가면, 물건이 나와 상관없는 것은 말할 것도 없고 이 몸도 군더더기 깃발에 속할 뿐이다.","c":"후집 제106장(後集 第106)","src":327},{"o":"興逐時來，芳草中撒履閒行，野鳥忘機時作伴。\n景與心會，落花下披襟兀坐，白雲無語漫相留。","e":"흥축시래, 방초중살리한행, 야조망기시작반.\n경여심회, 낙화하피금올좌, 백운무어만상류.","p":"흥이 때를 따라 오면 향기로운 풀 속에서 신을 벗고 한가히 걸으며, 들새가 기틀을 잊고 때로 짝이 된다. 경치가 마음과 만나면 지는 꽃 아래 옷깃을 열고 우뚝 앉아, 흰 구름이 말없이 느긋이 함께 머문다.","c":"후집 제107장(後集 第107)","src":328},{"o":"人生福境禍區，皆念想造成。\n故釋氏云：利欲熾然，即是火坑，貪愛沈溺，便為苦海。\n一念清淨，烈焰成池，一念警覺，船登彼岸。\n念頭稍異，境界頓殊。\n可不慎哉。","e":"인생복경화구, 개념상조성.\n고석씨운: 이욕치연, 즉시화갱, 탐애침익, 변위고해.\n일념청정, 열염성지, 일념경각, 선등피안.\n염두초이, 경계돈수.\n가불신재.","p":"인생의 복된 경계와 화의 구역은 다 생각이 만들어 낸 것이다. 그러므로 부처가 이르되, 이익과 욕심이 불타면 그것이 곧 불구덩이요, 탐내고 사랑하여 빠지면 곧 고통의 바다가 된다. 한 생각이 깨끗하면 거센 불길이 못이 되고, 한 생각이 깨으면 배가 저쪽에 오른다. 생각이 조금 달라도 경계가 곧바로 달라지니, 삼가지 않을 수 있겠는가.","c":"후집 제108장(後集 第108)","src":329},{"o":"機息時，便有月到風來，不必苦海人世。\n心遠處，自無車塵馬迹，何須痼疾丘山。","e":"기식시, 변유월도풍래, 불필고해인세.\n심원처, 자무차진마적, 하수고질구산.","p":"기틀이 쉴 때면 달이 이르고 바람이 오는 일이 있어, 반드시 세상을 고통의 바다로 만들 필요가 없다. 마음이 먼 곳이면 수레 먼지와 말 자취가 절로 없으니, 어찌 언덕과 산을 고질병처럼 그리워할 필요가 있겠는가.","c":"후집 제110장(後集 第110)","src":331},{"o":"草木纔零落，便露萌穎於根底。\n時序雖凝寒，終回陽氣於飛灰。\n肅殺之中，生生之意，常為之主。\n即是可以見天地之心。","e":"초목재령락, 변로맹영어근저.\n시서수응한, 종회양기어비회.\n숙살지중, 생생지의, 상위지주.\n즉시가이견천지지심.","p":"풀과 나무가 막 시들면 뿌리 아래에 싹이 드러나고, 시절이 비록 찬 데 얼어 있어도 끝내 날아가는 재 속에서 양기가 돌아온다. 숙살의 기세 가운데도 살아 내려는 뜻이 늘 주인이 되니, 이것이 곧 천지의 마음을 볼 수 있는 자리다.","c":"후집 제111장(後集 第111)","src":332},{"o":"無風月花柳，不成造化。\n無情欲嗜好，不成心體。\n只以我轉物，不以物役我，則嗜慾莫非天機，塵情即是理境矣。","e":"무풍월화류, 불성조화.\n무정욕기호, 불성심체.\n지이아전물, 불이물역아, 즉기욕막비천기, 진정즉시리경의.","p":"바람·달·꽃·버들이 없으면 조화가 이루어지지 않고, 욕정과 기호가 없으면 마음의 본체가 이루어지지 않는다. 다만 내가 물건을 굴리고 물건이 나를 부리지 않으면, 욕심도 하늘의 기틀이 아닌 것이 없고 티끌의 정도 곧 이치의 경계이다.","c":"후집 제115장(後集 第115)","src":336},{"o":"就一身了一身者，方能以萬物付萬物。\n還天下於天下者，方能出世間於世間。","e":"취일신료일신자, 방능이만물부만물.\n환천하어천하자, 방능출세간어세간.","p":"한 몸으로 한 몸을 끝낸 사람이라야 만물을 만물에게 맡길 수 있고, 천하를 천하에게 돌려준 사람이라야 세간의 세상에서 세간 밖으로 나갈 수 있다.","c":"후집 제116장(後集 第116)","src":337},{"o":"人生太閑，則別念竊生，太忙則真性不現。\n故士君子不可不抱身心之憂，亦不可不耽風月之趣。","e":"인생태한, 즉별념절생, 태망즉진성불현.\n고사군자불가불포신심지우, 역불가불탐풍월지취.","p":"인생이 너무 한가하면 다른 생각이 몰래 생기고, 너무 바쁘면 참 성품이 나타나지 않는다. 그러므로 선비는 몸과 마음의 근심을 품지 않을 수 없고, 바람과 달의 재미에 빠지지 않을 수도 없다.","c":"후집 제117장(後集 第117)","src":338},{"o":"人心多從動處失真。\n若一念不生，澄然靜坐，雲興而悠然共逝，雨滴而冷然俱清，鳥啼而欣然有會，花落而瀟然自得。\n何地非真境，何物無真機。","e":"인심다종동처실진.\n약일념불생, 징연정좌, 운흥이유연공서, 우적이랭연구청, 조제이흔연유회, 화락이소연자득.\n하지비진경, 하물무진기.","p":"사람 마음은 흔히 움직이는 곳에서 참됨을 잃는다. 한 생각이 나지 않고 맑게 고요히 앉아 있으면, 구름이 일어 유연히 함께 사라지고, 빗방울이 차갑게 함께 맑으며, 새가 울어 기쁘게 마음이 맞고, 꽃이 져 훌훌 스스로 얻는다. 어느 땅이 참 경계가 아니며, 어느 물건에 참 기틀이 없겠는가.","c":"후집 제118장(後集 第118)","src":339},{"o":"子生而母危，鏹積而盜窺，何喜非憂也。\n貧可以節用，病可以保身，何憂非喜也。\n故達人當順逆一視而欣戚兩忘。","e":"자생이모위, 강적이도규, 하희비우야.\n빈가이절용, 병가이보신, 하우비희야.\n고달인당순역일시이흔척량망.","p":"자식이 나면서 어미가 위태롭고, 돈이 쌓이면 도둑이 엿보니, 기쁨 가운데 근심 아닌 것이 어디 있는가. 가난하면 씀씀이를 줄일 수 있고 병이면 몸을 보전할 수 있으니, 근심 가운데 기쁨 아닌 것이 어디 있는가. 그러므로 통달한 사람은 순함과 거스름을 하나로 보고 기쁨과 슬픔을 둘 다 잊어야 한다.","c":"후집 제119장(後集 第119)","src":340},{"o":"耳根似颷谷投響，過而不留，則是非俱謝。\n心境如月池浸色，空而不着，則物我兩忘。","e":"이근사표곡투향, 과이불류, 즉시비구사.\n심경여월지침색, 공이불착, 즉물아량망.","p":"귀의 뿌리가 회오리 골짜기에 소리가 드는 듯하여 지나가도 머물지 않으면 시비가 다 사그라지고, 마음의 경계가 달 뜬 못에 빛이 잠긴 듯하여 비어 붙지 않으면 물건과 내가 둘 다 잊힌다.","c":"후집 제120장(後集 第120)","src":341},{"o":"世人為榮利纏縛，動曰塵世苦海。\n不知雲白山青，川行石立，花迎鳥笑，谷答樵謳。\n世亦不塵，海亦不苦，彼自塵苦其心爾。","e":"세인위영리전박, 동왈진세고해.\n부지운백산청, 천행석립, 화영조소, 곡답초구.\n세역부진, 해역불고, 피자진고기심이.","p":"세상 사람은 영화와 이익에 얽혀, 걸핏하면 세상은 먼지요 고통의 바다라 한다. 구름이 희고 산이 푸르며, 내가 흐르고 돌이 서 있으며, 꽃이 새를 맞이하고 새가 웃으며, 골짜기가 나무꾼의 노래에 답함을 알지 못한다. 세상도 먼지가 아니고 바다도 괴롭지 않으니, 저 스스로 마음을 먼지와 괴로움으로 만들 뿐이다.","c":"후집 제121장(後集 第121)","src":342},{"o":"山肴不受世間灌漑，野禽不受世間豢養，其味皆香而且冽。\n吾人能不為世法所點染，其臭味不迥然別乎。","e":"산효불수세간관개, 야금불수세간환양, 기미개향이차렬.\n오인능불위세법소점염, 기취미불형연별호.","p":"산나물은 세상의 물 대기를 받지 않고 들새는 세상에서 길러 먹이는 것을 받지 않아도, 그 맛이 다 향기롭고 또 맑다. 우리가 세상의 법에 물들지 않을 수 있다면, 그 냄새와 맛이 확연히 다르지 않겠는가.","c":"후집 제123장(後集 第123)","src":344},{"o":"栽花種竹，玩鶴觀魚，亦要有段自得處。\n若徒留連光景，玩弄物華，亦吾儒之口耳，釋氏之頑空而已。\n有何佳趣。","e":"재화종죽, 완학관어, 역요유단자득처.\n약도류련광경, 완롱물화, 역오유지구이, 석씨지완공이이.\n유하가취.","p":"꽃을 심고 대를 심으며 학을 희롱하고 고기를 보는 것도 스스로 얻은 한 토막이 있어야 한다. 한갓 빛과 경치에 머물고 물건의 꽃을 희롱하기만 하면, 우리 유가의 입과 귀요 부처의 완고한 공일 뿐이니, 무슨 좋은 재미가 있겠는가.","c":"후집 제124장(後集 第124)","src":345},{"o":"山林之士，清苦而逸趣自饒，農野之夫，鄙略而天真渾具。\n若一矢身市井駔儈，不若轉死溝壑神骨猶清。","e":"산림지사, 청고이일취자요, 농야지부, 비략이천진혼구.\n약일시신시정장회, 불약전사구학신골유청.","p":"산림의 선비는 맑고 괴로워도 벗어난 재미가 넉넉하고, 들판의 농부는 거칠어도 하늘이 준 참됨이 온전히 있다. 한 번 몸을 저자의 거간에게 던지면, 도랑과 골짜기에서 죽는 것만 못하니 그쪽의 정신과 뼈가 오히려 맑다.","c":"후집 제125장(後集 第125)","src":346},{"o":"非分之福，無故之獲，非造物之釣餌，即人世之機阱。\n此處着眼不高，鮮不墮彼術中矣。","e":"비분지복, 무고지획, 비조물지조이, 즉인세지기정.\n차처착안불고, 선불타피술중의.","p":"분수 밖의 복과 까닭 없는 얻음은, 조물이 던진 낚시밥이 아니면 세상의 기계와 함정이다. 여기서 보는 눈이 높지 않으면 그 술수에 떨어지지 않는 이가 드물다.","c":"후집 제126장(後集 第126)","src":347},{"o":"人生原是一傀儡。\n只要根蒂在手。\n一線不亂，卷舒自由，行止在我。\n一毫不受他人提掇，便超出此場中矣。","e":"인생원시일괴뢰.\n지요근체재수.\n일선불란, 권서자유, 행지재아.\n일호불수타인제철, 변초출차장중의.","p":"인생은 본디 하나의 꼭두각시다. 다만 뿌리가 손에 있어야 한다. 한 줄이 어지럽지 않아 말고 풂이 자유롭고 가고 멈춤이 나에게 있으며, 털끝만 한 것도 남의 조종을 받지 않으면, 곧 이 마당을 벗어난다.","c":"후집 제127장(後集 第127)","src":348},{"o":"一事起則一害生。\n故天下常以無事為福。\n讀前人詩云：勸君莫話封侯事，一將功成萬骨枯。\n又云：天下常令萬事平，匣中不惜千年死。\n雖有雄心猛氣，不覺化為冰霰矣。","e":"일사기즉일해생.\n고천하상이무사위복.\n독전인시운: 권군막화봉후사, 일장공성만골고.\n우운: 천하상령만사평, 갑중불석천년사.\n수유웅심맹기, 불각화위빙산의.","p":"일이 하나 일어나면 해가 하나 생긴다. 그러므로 천하는 늘 일이 없음을 복으로 삼는다. 옛사람의 시를 읽어 보니, 그대에게 제후를 봉하는 일을 말하지 말라, 장수 하나의 공이 이루어지면 만 뼈가 마른다 하였고, 또 이르되, 천하는 늘 만사를 평안케 하라, 칼집 속의 칼은 천 년의 죽음을 아끼지 않는다 하였다. 웅장한 마음과 사나운 기운이 있어도 깨닫지 못하는 사이에 얼음과 싸락눈으로 변한다.","c":"후집 제128장(後集 第128)","src":349},{"o":"淫奔之婦，矯而為尼，熱中之人，激而入道。\n清淨之門，常為淫邪之淵藪也如此。","e":"음분지부, 교이위니, 열중지인, 격이입도.\n청정지문, 상위음사지연수야여차.","p":"음탕하게 달아난 부인이 억지로 중이 되고, 뜨겁게 달아오른 사람이 격하여 도에 들어간다. 맑고 깨끗한 문이 늘 음탕하고 삿된 것의 소굴이 됨이 이와 같다.","c":"후집 제129장(後集 第129)","src":350},{"o":"波浪兼天，舟中不知懼，而舟外者寒心。\n猖狂罵坐，席上不知警，而席外者咋舌。\n故君子身雖在事中，心要超事外也。","e":"파랑겸천, 주중부지구, 이주외자한심.\n창광매좌, 석상부지경, 이석외자책설.\n고군자신수재사중, 심요초사외야.","p":"물결이 하늘에 겹쳐도 배 안의 사람은 두려움을 모르고 배 밖의 사람이 마음이 차갑다. 날뛰어 자리 위에서 욕해도 자리 위의 사람은 경계하지 못하고 자리 밖의 사람이 혀를 찬다. 그러므로 군자는 몸은 비록 일 가운데 있어도 마음은 일 밖에 뛰어나야 한다.","c":"후집 제130장(後集 第130)","src":351},{"o":"人生減省一分，便超脫一分。\n如交遊減便免紛擾，言語減便寡愆尤，思慮減則精神不耗，聰明減則混沌可完。\n彼不求日減而求日增者，真桎梏此生哉。","e":"인생감생일분, 변초탈일분.\n여교유감변면분요, 언어감변과건우, 사려감즉정신불모, 총명감즉혼돈가완.\n피불구일감이구일증자, 진질곡차생재.","p":"인생은 한 분을 덜면 한 분 초탈한다. 사귐을 덜면 어지러운 시달림을 면하고, 말을 덜면 허물이 적으며, 생각을 덜면 정신이 소모되지 않고, 총명을 덜면 혼돈을 온전히 할 수 있다. 날마다 덜기를 구하지 않고 날마다 보태기를 구하는 사람은, 참으로 이 삶을 족쇄에 묶는 것이다.","c":"후집 제131장(後集 第131)","src":352},{"o":"天運之寒暑易避，人世之炎涼難除。\n人世之炎涼易除，吾心之冰炭難去。\n去得此中之冰炭，則滿腔皆和氣，自隨地有春風矣。","e":"천운지한서역피, 인세지염량난제.\n인세지염량역제, 오심지빙탄난거.\n거득차중지빙탄, 즉만강개화기, 자수지유춘풍의.","p":"하늘의 운행인 추위와 더위는 피하기 쉽고, 세상의 덥고 찬 인심은 없애기 어렵다. 세상의 덥고 찬 인심은 없애기 쉬워도, 내 마음의 얼음과 숯은 가기 어렵다. 이 속의 얼음과 숯을 없애면 가슴이 다 화기요, 가는 곳마다 봄바람이 있다.","c":"후집 제132장(後集 第132)","src":353},{"o":"茶不求精而壺亦不燥。\n酒不求冽而樽亦不空。\n素琴無絃而常調，短笛無腔而自適。\n縱難超越羲皇，亦可匹儔荊嵆阮。","e":"다불구정이호역부조.\n주불구렬이준역불공.\n소금무현이상조, 단적무강이자적.\n종난초월희황, 역가필주형혜완.","p":"차는 정묘함을 구하지 않아도 주전자가 마르지 않고, 술은 맑음을 구하지 않아도 동이 비지 않는다. 줄 없는 소박한 거문고도 늘 고르고, 곡조 없는 짧은 피리도 절로 맞는다. 비록 희황을 뛰어넘기는 어려워도, 형경과 혜강과 완적에는 짝할 수 있다.","c":"후집 제133장(後集 第133)","src":354},{"o":"釋氏隨緣，吾儒素位。\n四字是渡海的浮囊。\n蓋世路茫茫，一念求全，則萬緒紛起。\n隨寓而安，則無入不得矣。","e":"석씨수연, 오유소위.\n사자시도해적부낭.\n개세로망망, 일념구전, 즉만서분기.\n수우이안, 즉무입부득의.","p":"부처의 인연을 따름과 우리 유가의 제 자리에 있음, 이 네 글자가 바다를 건너는 부낭이다. 세상길이 아득하여 한 생각이 온전함을 구하면 만 가닥이 어수선히 일어난다. 머무는 곳에 따라 편안하면 들어가지 못하는 곳이 없다.","c":"후집 제134장(後集 第134)","src":355}],"zg":[{"o":"觀今宜鑒古，無古不成今。","e":"관금의감고, 무고불성금.","p":"오늘을 보려면 마땅히 옛일을 거울삼아야 하니, 옛날 없이는 오늘도 없다.","c":"상집(上集)","src":1},{"o":"知己知彼，將心比心。","e":"지기지피, 장심비심.","p":"나를 알고 남을 알며, 내 마음에 비추어 남의 마음을 헤아려라.","c":"상집(上集)","src":2},{"o":"酒逢知己飲，詩向會人吟。相識滿天下，知心能幾人？","e":"주봉지기음, 시향회인음. 상식만천하, 지심능기인?","p":"술은 마음 아는 벗을 만나야 마시고, 시는 알아주는 사람을 향해 읊는다. 얼굴 아는 이는 세상에 가득해도 마음 아는 이는 몇이나 될까?","c":"상집(上集)","src":3},{"o":"近水知魚性，近山識鳥音。","e":"근수지어성, 근산식조음.","p":"물 가까이 살면 물고기의 성질을 알고, 산 가까이 살면 새소리를 알아듣는다.","c":"상집(上集)","src":5},{"o":"易漲易退山溪水，易反易覆小人心。","e":"이창이퇴산계수, 이반이복소인심.","p":"쉽게 불었다 쉽게 빠지는 것은 산골 개울물이요, 쉽게 뒤집고 쉽게 엎는 것은 소인의 마음이다.","c":"상집(上集)","src":6},{"o":"運去金成鐵，時來鐵似金。","e":"운거금성철, 시래철사금.","p":"운이 가면 금도 쇠가 되고, 때가 오면 쇠도 금처럼 된다.","c":"상집(上集)","src":7},{"o":"讀書須用意，一字値千金。","e":"독서수용의, 일자치천금.","p":"책을 읽을 때는 마음을 기울여야 한다. 한 글자가 천금의 값어치가 있다.","c":"상집(上集)","src":8},{"o":"有意栽花花不發，無心插柳柳成蔭。","e":"유의재화화불발, 무심삽류류성음.","p":"애써 꽃을 심어도 꽃은 피지 않고, 무심코 꽂은 버들가지는 그늘을 이룬다.","c":"상집(上集)","src":10},{"o":"流水下灘非有意，白雲出岫本無心。","e":"유수하탄비유의, 백운출수본무심.","p":"흐르는 물이 여울을 내려가는 것은 뜻이 있어서가 아니고, 흰 구름이 산굴에서 나오는 것도 본래 무심해서다.","c":"상집(上集)","src":13},{"o":"路遙知馬力，日久見人心。","e":"노요지마력, 일구견인심.","p":"길이 멀어야 말의 힘을 알고, 날이 오래되어야 사람의 마음을 안다.","c":"상집(上集)","src":15},{"o":"兩人一般心，無錢堪買金；一人一般心，有錢難買針。","e":"양인일반심, 무전감매금; 일인일반심, 유전난매침.","p":"두 사람이 한마음이면 돈이 없어도 금을 살 수 있고, 저마다 딴마음이면 돈이 있어도 바늘 하나 사기 어렵다.","c":"상집(上集)","src":16},{"o":"馬行無力皆因瘦，人不風流只爲貧。","e":"마행무력개인수, 인불풍류지위빈.","p":"말이 힘없이 걷는 것은 다 여위었기 때문이고, 사람이 멋을 못 부리는 것은 다만 가난하기 때문이다.","c":"상집(上集)","src":18},{"o":"美不美，鄕中水；親不親，故鄕人。","e":"미불미, 향중수; 친불친, 고향인.","p":"맛이 좋든 나쁘든 고향의 물이요, 친하든 안 친하든 고향 사람이다.","c":"상집(上集)","src":21},{"o":"貧居鬧市無人問，富在深山有遠親。","e":"빈거뇨시무인문, 부재심산유원친.","p":"가난하면 번화한 저잣거리에 살아도 찾는 이가 없고, 부유하면 깊은 산속에 살아도 먼 친척이 찾아온다.","c":"상집(上集)","src":28},{"o":"長江後浪推前浪，世上新人趕舊人。","e":"장강후랑추전랑, 세상신인간구인.","p":"장강의 뒷물결이 앞물결을 밀어내듯, 세상에서는 새 사람이 옛사람을 쫓아낸다.","c":"상집(上集)","src":34},{"o":"近水樓臺先得月，向陽花木早逢春。","e":"근수루대선득월, 향양화목조봉춘.","p":"물가의 누대가 먼저 달을 맞고, 볕 바른 곳의 꽃나무가 먼저 봄을 만난다.","c":"상집(上集)","src":35},{"o":"古人不見今時月，今月曾經照古人。","e":"고인불견금시월, 금월증경조고인.","p":"옛사람은 오늘의 달을 보지 못했지만, 오늘의 달은 일찍이 옛사람을 비추었다.","c":"상집(上集)","src":36},{"o":"莫道君行早，更有早行人。","e":"막도군행조, 갱유조행인.","p":"그대가 일찍 길을 나섰다고 말하지 말라. 더 일찍 길을 나선 사람이 있다.","c":"상집(上集)","src":38},{"o":"自恨枝無葉，莫怨太陽偏。","e":"자한지무엽, 막원태양편.","p":"가지에 잎이 없음을 스스로 한탄할 일이지, 해가 고르게 비추지 않는다고 원망하지 말라.","c":"상집(上集)","src":41},{"o":"一年之計在於春，一日之計在於晨；一家之計在於和，一生之計在於勤。","e":"일년지계재어춘, 일일지계재어신; 일가지계재어화, 일생지계재어근.","p":"한 해의 계획은 봄에 있고, 하루의 계획은 새벽에 있다. 한 집안의 계획은 화목에 있고, 한평생의 계획은 부지런함에 있다.","c":"상집(上集)","src":43},{"o":"責人之心責己，恕己之心恕人。","e":"책인지심책기, 서기지심서인.","p":"남을 꾸짖는 마음으로 나를 꾸짖고, 나를 용서하는 마음으로 남을 용서하라.","c":"상집(上集)","src":44},{"o":"寧可人負我，切莫我負人。","e":"영가인부아, 절막아부인.","p":"차라리 남이 나를 저버릴지언정, 절대로 내가 남을 저버리지는 말라.","c":"상집(上集)","src":46},{"o":"人情似紙張張薄，世事如棋局局新。","e":"인정사지장장박, 세사여기국국신.","p":"인정은 종이처럼 장마다 얇고, 세상일은 바둑처럼 판마다 새롭다.","c":"상집(上集)","src":52},{"o":"山中也有千年樹，世上難逢百歳人。","e":"산중야유천년수, 세상난봉백세인.","p":"산속에는 천 년 묵은 나무도 있지만, 세상에서는 백 살 사람을 만나기 어렵다.","c":"상집(上集)","src":53},{"o":"力微休負重，言輕莫勸人。","e":"역미휴부중, 언경막권인.","p":"힘이 약하면 무거운 짐을 지지 말고, 말발이 약하면 남을 타이르지 말라.","c":"상집(上集)","src":54},{"o":"平生不做皺眉事，世上應無切齒人。","e":"평생부주추미사, 세상응무절치인.","p":"평생 남의 눈살 찌푸릴 일을 하지 않으면, 세상에 나를 이 갈며 미워할 사람이 없다.","c":"상집(上集)","src":56},{"o":"求人須求大丈夫，濟人須濟急時無。","e":"구인수구대장부, 제인수제급시무.","p":"남에게 도움을 청하려거든 대장부에게 청하고, 남을 도우려거든 급할 때 없는 이를 도와라.","c":"상집(上集)","src":59},{"o":"渇時一滴如甘露，醉後添杯不如無。","e":"갈시일적여감로, 취후첨배불여무.","p":"목마를 때 물 한 방울은 단 이슬 같지만, 취한 뒤에 더하는 술잔은 없느니만 못하다.","c":"상집(上集)","src":60},{"o":"有田不耕倉廩虚，有書不讀子孫愚。","e":"유전불경창름허, 유서부독자손우.","p":"밭이 있어도 갈지 않으면 곳간이 비고, 책이 있어도 읽지 않으면 자손이 어리석어진다.","c":"상집(上集)","src":67},{"o":"聽君一席話，勝讀十年書。","e":"청군일석화, 승독십년서.","p":"그대와 나눈 한자리 이야기가 십 년 동안 책 읽은 것보다 낫다.","c":"상집(上集)","src":69},{"o":"救人一命，勝造七級浮屠。","e":"구인일명, 승조칠급부도.","p":"사람 목숨 하나를 구하는 것이 칠 층 탑을 쌓는 것보다 낫다.","c":"상집(上集)","src":73},{"o":"城門失火，殃及池魚。","e":"성문실화, 앙급지어.","p":"성문에 불이 나면 그 재앙이 연못의 물고기에게까지 미친다.","c":"상집(上集)","src":74},{"o":"欲求生富貴，須下死工夫。","e":"욕구생부귀, 수하사공부.","p":"살아서 부귀를 얻고 싶거든 죽을 각오로 공부하라.","c":"상집(上集)","src":76},{"o":"百年成之不足，一旦敗之有餘。","e":"백년성지부족, 일단패지유여.","p":"백 년 걸려 이루어도 모자라고, 하루아침에 무너뜨리기는 남는다.","c":"상집(上集)","src":77},{"o":"寧可信其有，不可信其無。","e":"영가신기유, 불가신기무.","p":"차라리 있다고 믿을지언정, 없다고 믿지는 말라.","c":"상집(上集)","src":86},{"o":"竹籬茅舍風光好，道院僧堂終不如。","e":"죽리모사풍광호, 도원승당종불여.","p":"대울타리 초가집의 풍광이 좋으니, 도관이나 절집도 끝내 이만 못하다.","c":"상집(上集)","src":87},{"o":"人情似水分髙下，世事如雲任巻舒。","e":"인정사수분고하, 세사여운임권서.","p":"인정은 물과 같아서 높고 낮음이 나뉘고, 세상일은 구름과 같아서 걷히고 펴지는 대로 맡겨 둔다.","c":"상집(上集)","src":93},{"o":"磨刀恨不利，刀利傷人指。","e":"마도한불리, 도리상인지.","p":"칼을 갈 때는 잘 들지 않는다고 한탄하다가, 칼이 잘 들면 사람 손가락을 벤다.","c":"상집(上集)","src":95},{"o":"求財恨不得，財多害自己。","e":"구재한부득, 재다해자기.","p":"재물을 구할 때는 얻지 못해 한탄하다가, 재물이 많아지면 제 몸을 해친다.","c":"상집(上集)","src":96},{"o":"若登髙必自卑，若渉遠必自邇。","e":"약등고필자비, 약섭원필자이.","p":"높이 오르려면 반드시 낮은 데서 시작하고, 멀리 가려면 반드시 가까운 데서 시작한다.","c":"상집(上集)","src":101},{"o":"三思而行，再思可矣。","e":"삼사이행, 재사가의.","p":"세 번 생각하고 행하라 하지만, 두 번 생각하면 충분하다.","c":"상집(上集)","src":102},{"o":"使口不如親爲，求人不如求己。","e":"사구불여친위, 구인불여구기.","p":"남의 입을 부리는 것은 내가 몸소 하는 것만 못하고, 남에게 구하는 것은 나에게 구하는 것만 못하다.","c":"상집(上集)","src":103},{"o":"人見白頭嗔，我見白頭喜。","e":"인견백두진, 아견백두희.","p":"남들은 흰머리를 보면 성을 내지만, 나는 흰머리를 보면 기쁘다. (늙도록 살아 있음이 복이기 때문이다.)","c":"상집(上集)","src":106},{"o":"好事不出門，惡事傳千里。","e":"호사불출문, 악사전천리.","p":"좋은 일은 문밖을 나가지 않고, 나쁜 일은 천 리 밖까지 퍼진다.","c":"상집(上集)","src":109},{"o":"若要人不知，除非己莫爲。","e":"약요인부지, 제비기막위.","p":"남이 모르게 하려거든 애초에 하지 않는 수밖에 없다.","c":"상집(上集)","src":110},{"o":"爲人不做虧心事，半夜敲門心不驚。","e":"위인부주휴심사, 반야고문심불경.","p":"평생 양심에 어긋난 일을 하지 않으면, 한밤중에 누가 문을 두드려도 놀라지 않는다.","c":"상집(上集)","src":111},{"o":"貧窮自在，富貴多憂。","e":"빈궁자재, 부귀다우.","p":"가난하고 궁해도 마음은 자유롭고, 부귀하면 근심이 많다.","c":"상집(上集)","src":114},{"o":"寧向直中取，不可曲中求。","e":"영향직중취, 불가곡중구.","p":"차라리 곧은 길에서 얻을지언정, 굽은 길에서 구하지 말라.","c":"상집(上集)","src":116},{"o":"人無遠慮，必有近憂。","e":"인무원려, 필유근우.","p":"사람이 멀리 내다보는 생각이 없으면 반드시 가까운 근심이 생긴다.","c":"상집(上集)","src":117},{"o":"成事莫説，覆水難收。","e":"성사막설, 복수난수.","p":"이미 이루어진 일은 말하지 말라. 엎지른 물은 다시 담기 어렵다.","c":"상집(上集)","src":120},{"o":"人生一世，草生一春。","e":"인생일세, 초생일춘.","p":"사람의 한평생은 풀의 한 해 봄과 같다.","c":"상집(上集)","src":125},{"o":"黑髮不知勤學早，白首方悔讀書遲。","e":"흑발부지근학조, 백수방회독서지.","p":"검은 머리 때는 일찍 부지런히 배울 줄 모르다가, 흰머리가 되어서야 책 읽기 늦었음을 뉘우친다.","c":"상집(上集)","src":126},{"o":"月過十五光明少，人到中年萬事休。","e":"월과십오광명소, 인도중년만사휴.","p":"보름이 지나면 달빛이 줄고, 사람도 중년에 이르면 만사가 시들해진다.","c":"상집(上集)","src":127},{"o":"人生不滿百，常懷千歳憂。","e":"인생불만백, 상회천세우.","p":"인생은 백 년도 채우지 못하면서, 늘 천 년 근심을 품고 산다.","c":"상집(上集)","src":130},{"o":"今朝有酒今朝醉，明日愁來明日憂。","e":"금조유주금조취, 명일수래명일우.","p":"오늘 술이 있으면 오늘 취하고, 내일 근심이 오면 내일 걱정하리라.","c":"상집(上集)","src":131},{"o":"人貧不語，水平不流。","e":"인빈불어, 수평불류.","p":"사람은 가난하면 말이 없어지고, 물은 평평하면 흐르지 않는다.","c":"상집(上集)","src":134},{"o":"三杯通大道，一醉解千愁。","e":"삼배통대도, 일취해천수.","p":"석 잔 술에 큰 도에 통하고, 한 번 취하면 천 가지 근심이 풀린다.","c":"상집(上集)","src":137},{"o":"深山畢竟藏猛虎，大海終須納細流。","e":"심산필경장맹호, 대해종수납세류.","p":"깊은 산은 끝내 사나운 범을 품고, 큰 바다는 끝내 가는 물줄기를 받아들인다.","c":"상집(上集)","src":138},{"o":"受恩深處宜先退，得意濃時便可休。","e":"수은심처의선퇴, 득의농시변가휴.","p":"은혜를 깊이 입은 곳에서는 먼저 물러나야 하고, 뜻이 무르익었을 때 곧 그칠 줄 알아야 한다.","c":"상집(上集)","src":141},{"o":"忍一句，息一怒，饒一著，退一歩。","e":"인일구, 식일노, 요일착, 퇴일보.","p":"한마디 참고, 한 번의 노여움을 가라앉히고, 한 수 양보하고, 한 걸음 물러서라.","c":"상집(上集)","src":146},{"o":"一寸光陰一寸金，寸金難買寸光陰。","e":"일촌광음일촌금, 촌금난매촌광음.","p":"한 치의 시간은 한 치의 금이지만, 한 치의 금으로도 한 치의 시간은 사기 어렵다.","c":"상집(上集)","src":149},{"o":"人生似鳥同林宿，大限來時各自飛。","e":"인생사조동림숙, 대한래시각자비.","p":"인생은 한 숲에서 자는 새들과 같아서, 마지막 때가 오면 저마다 날아간다.","c":"상집(上集)","src":151},{"o":"人善被人欺，馬善被人騎。","e":"인선피인기, 마선피인기.","p":"사람이 착하면 남에게 업신여김을 당하고, 말이 순하면 남이 올라탄다.","c":"상집(上集)","src":152},{"o":"善惡到頭終有報，只爭來早與來遲。","e":"선악도두종유보, 지쟁래조여래지.","p":"선과 악은 끝내 갚음이 있으니, 다만 빨리 오느냐 늦게 오느냐의 차이다.","c":"상집(上集)","src":155},{"o":"黃河尙有澄淸日，豈可人無得運時。","e":"황하상유징청일, 기가인무득운시.","p":"누런 황하도 맑아지는 날이 있는데, 어찌 사람에게 운이 트일 때가 없겠는가.","c":"상집(上集)","src":156},{"o":"人情莫道春光好，只怕秋來有冷時。","e":"인정막도춘광호, 지파추래유랭시.","p":"인정이 봄볕처럼 좋다고 말하지 말라. 가을이 오면 차가워질 때가 있을까 두렵다.","c":"상집(上集)","src":160},{"o":"送君千里，終須一別。","e":"송군천리, 종수일별.","p":"그대를 천 리까지 배웅해도 끝내는 한 번 헤어져야 한다.","c":"상집(上集)","src":161},{"o":"但將冷眼看螃蟹，看你橫行到幾時。","e":"단장랭안간방해, 간니횡행도기시.","p":"차가운 눈으로 저 게를 지켜보라. 네가 옆으로 설치고 다니는 것이 언제까지 가나 보자.","c":"상집(上集)","src":162},{"o":"許人一物，千金不移。","e":"허인일물, 천금불이.","p":"남에게 주겠다고 약속한 물건은 천금을 준대도 바꾸지 않는다.","c":"상집(上集)","src":167},{"o":"龍游淺水遭蝦戲，虎落平陽被犬欺。","e":"용유천수조하희, 호락평양피견기.","p":"용도 얕은 물에서 놀면 새우에게 놀림을 당하고, 범도 평지로 내려오면 개에게 업신여김을 당한다.","c":"상집(上集)","src":169},{"o":"十年窗下無人問，一舉成名天下知。","e":"십년창하무인문, 일거성명천하지.","p":"십 년 동안 창 아래서 공부할 때는 묻는 이가 없더니, 한 번 급제하여 이름을 이루니 온 세상이 안다.","c":"상집(上集)","src":171},{"o":"酒債尋常行處有，人生七十古來稀。","e":"주채심상행처유, 인생칠십고래희.","p":"술빚은 가는 곳마다 흔히 있지만, 사람이 일흔까지 사는 것은 예부터 드물다.","c":"상집(上集)","src":172},{"o":"當家纔知鹽米貴，養子方知父母恩。","e":"당가재지염미귀, 양자방지부모은.","p":"살림을 맡아 봐야 소금과 쌀이 귀한 줄 알고, 자식을 길러 봐야 부모의 은혜를 안다.","c":"상집(上集)","src":175},{"o":"樹欲靜而風不止，子欲養而親不待。","e":"수욕정이풍부지, 자욕양이친부대.","p":"나무는 고요하고자 하나 바람이 그치지 않고, 자식은 봉양하고자 하나 어버이는 기다려 주지 않는다.","c":"상집(上集)","src":177},{"o":"少壯不努力，老大徒傷悲。","e":"소장불노력, 노대도상비.","p":"젊어서 힘쓰지 않으면, 늙어서 부질없이 슬퍼한다.","c":"상집(上集)","src":189},{"o":"種麻得麻，種豆得豆。","e":"종마득마, 종두득두.","p":"삼을 심으면 삼을 거두고, 콩을 심으면 콩을 거둔다.","c":"상집(上集)","src":193},{"o":"螳螂捕蟬，豈知黃雀在後。","e":"당랑포선, 기지황작재후.","p":"사마귀가 매미를 노리지만, 그 뒤에서 참새가 자기를 노리는 줄 어찌 알겠는가.","c":"상집(上集)","src":197},{"o":"不求金玉重重貴，但願兒孫箇箇賢。","e":"불구금옥중중귀, 단원아손개개현.","p":"금과 옥이 겹겹이 귀하기를 바라지 않고, 다만 자손이 하나하나 어질기를 바란다.","c":"상집(上集)","src":198},{"o":"百世修來同船渡，千世修來共枕眠。","e":"백세수래동선도, 천세수래공침면.","p":"백 대를 닦아야 한배를 타고 강을 건너고, 천 대를 닦아야 한 베개를 베고 잔다. (부부의 인연은 그만큼 귀하다.)","c":"상집(上集)","src":200},{"o":"枯木逢春猶再發，人無兩度再少年。","e":"고목봉춘유재발, 인무량도재소년.","p":"마른 나무도 봄을 만나면 다시 싹이 트지만, 사람은 두 번 다시 젊어지지 않는다.","c":"상집(上集)","src":203},{"o":"撃石原有火，不撃乃無煙。","e":"격석원유화, 불격내무연.","p":"돌을 치면 본래 불이 있지만, 치지 않으면 연기조차 없다.","c":"상집(上集)","src":209},{"o":"爲學始知道，不學亦徒然。","e":"위학시지도, 불학역도연.","p":"배워야 비로소 도리를 알고, 배우지 않으면 모든 것이 헛되다.","c":"상집(上集)","src":210},{"o":"和得鄰里好，猶如拾片寶。","e":"화득린리호, 유여습편보.","p":"이웃과 사이좋게 지내는 것은 보물 한 조각을 줍는 것과 같다.","c":"상집(上集)","src":212},{"o":"但能依本分，終須無煩惱。","e":"단능의본분, 종수무번뇌.","p":"다만 제 분수를 지킬 수 있다면 끝내 번뇌가 없으리라.","c":"상집(上集)","src":213},{"o":"凡事要好，須問三老。","e":"범사요호, 수문삼로.","p":"무슨 일이든 잘하려면 경험 많은 어른 세 분에게 물어라.","c":"상집(上集)","src":223},{"o":"因風吹火，用力不多。","e":"인풍취화, 용력부다.","p":"바람을 따라 불을 붙이면 힘이 많이 들지 않는다.","c":"상집(上集)","src":230},{"o":"無求到處人情好，不飲從他酒價髙。","e":"무구도처인정호, 불음종타주가고.","p":"남에게 바라는 것이 없으면 가는 곳마다 인정이 좋고, 술을 마시지 않으면 술값이 오르든 말든 상관없다.","c":"상집(上集)","src":232},{"o":"入山不怕傷人虎，只怕人情兩面刀。","e":"입산불파상인호, 지파인정량면도.","p":"산에 들어가서 사람 해치는 범은 두렵지 않으나, 다만 인정의 양날 칼이 두렵다.","c":"상집(上集)","src":234},{"o":"強中更有強中手，惡人須用惡人磨。","e":"강중갱유강중수, 악인수용악인마.","p":"강한 자 위에 더 강한 자가 있고, 악한 사람은 악한 사람이 갈아 놓는다.","c":"상집(上集)","src":235},{"o":"光陰似箭，日月如梭。","e":"광음사전, 일월여사.","p":"세월은 화살 같고, 해와 달은 베틀의 북처럼 빨리 오간다.","c":"상집(上集)","src":237},{"o":"世上萬般皆下品，思量唯有讀書髙。","e":"세상만반개하품, 사량유유독서고.","p":"세상 모든 일이 다 낮은 등급이고, 생각해 보면 오직 책 읽는 것만이 높다.","c":"상집(上集)","src":240},{"o":"羊有跪乳之恩，鴉有反哺之義。","e":"양유궤유지은, 아유반포지의.","p":"어린 양은 무릎 꿇고 젖을 먹는 은혜를 알고, 까마귀는 늙은 어미에게 먹이를 물어다 주는 의리가 있다.","c":"상집(上集)","src":243},{"o":"你急他未急，人閒心不閒。","e":"이급타미급, 인한심불한.","p":"너는 급해도 그는 급하지 않고, 몸은 한가해도 마음은 한가하지 않다.","c":"상집(上集)","src":246},{"o":"人生知足何時足，人老偸閒且是閒。","e":"인생지족하시족, 인로투한차시한.","p":"인생에서 만족을 안다면 언제인들 넉넉하지 않으랴. 늙어서 짬을 내어 쉬면 그것이 바로 한가로움이다.","c":"상집(上集)","src":251},{"o":"見者易，學者難。莫將容易得，便作等閒看。","e":"견자이, 학자난. 막장용이득, 변작등한간.","p":"보기는 쉬워도 배우기는 어렵다. 쉽게 얻었다고 해서 대수롭지 않게 보지 말라.","c":"상집(上集)","src":253},{"o":"厭靜還思喧，嫌喧又憶山。","e":"염정환사훤, 혐훤우억산.","p":"고요하면 다시 시끄러운 데가 그립고, 시끄러우면 또 산이 생각난다.","c":"상집(上集)","src":254},{"o":"自從心定後，無處不安然。","e":"자종심정후, 무처불안연.","p":"마음이 자리 잡은 뒤로는 어디서나 편안하다.","c":"상집(上集)","src":255},{"o":"用心計較般般錯，退歩思量事事難。","e":"용심계교반반착, 퇴보사량사사난.","p":"마음을 써서 따지고 재면 하나하나 어긋나고, 한 걸음 물러나 생각해 보면 일마다 어려움을 안다.","c":"상집(上集)","src":256},{"o":"從儉入奢易，從奢入儉難。","e":"종검입사이, 종사입검난.","p":"검소하다가 사치하기는 쉬워도, 사치하다가 검소해지기는 어렵다.","c":"상집(上集)","src":258},{"o":"知音説與知音聽，不是知音莫與彈。","e":"지음설여지음청, 불시지음막여탄.","p":"마음 아는 벗에게는 마음을 털어놓되, 마음 아는 벗이 아니면 거문고를 타 주지 말라.","c":"상집(上集)","src":259},{"o":"誰人不愛子孫賢，誰人不愛千鍾粟。","e":"수인불애자손현, 수인불애천종속.","p":"누군들 자손이 어질기를 바라지 않으며, 누군들 천 섬 곡식을 바라지 않겠는가.","c":"상집(上集)","src":264},{"o":"書到用時方恨少，事非經過不知難。","e":"서도용시방한소, 사비경과부지난.","p":"책은 쓸 때가 되어서야 적게 읽은 것을 한탄하고, 일은 겪어 보지 않으면 그 어려움을 모른다.","c":"상집(上集)","src":267},{"o":"但行好事，莫問前程。","e":"단행호사, 막문전정.","p":"다만 좋은 일을 행할 뿐, 앞날을 묻지 말라.","c":"상집(上集)","src":270},{"o":"河狹水激，人急計生。","e":"하협수격, 인급계생.","p":"강이 좁으면 물살이 세지고, 사람이 급하면 꾀가 생긴다.","c":"상집(上集)","src":271},{"o":"明知山有虎，莫向虎山行。","e":"명지산유호, 막향호산행.","p":"산에 범이 있는 줄 뻔히 알면서 범이 있는 산으로 가지 말라.","c":"상집(上集)","src":272},{"o":"路不行不到，事不爲不成。","e":"노불행부도, 사불위불성.","p":"길은 가지 않으면 이르지 못하고, 일은 하지 않으면 이루지 못한다.","c":"상집(上集)","src":273},{"o":"人不勸不善，鐘不打不鳴。","e":"인불권불선, 종불타불명.","p":"사람은 권하지 않으면 착해지지 않고, 종은 치지 않으면 울리지 않는다.","c":"상집(上集)","src":274},{"o":"滅卻心頭火，剔起佛前燈。","e":"멸각심두화, 척기불전등.","p":"마음속의 불을 끄고, 부처님 앞의 등불을 돋우어라.","c":"상집(上集)","src":280},{"o":"衆星朗朗，不如孤月獨明。","e":"중성랑랑, 불여고월독명.","p":"뭇별이 아무리 반짝여도 외로운 달 하나의 밝음만 못하다.","c":"상집(上集)","src":282},{"o":"牡丹花好空入目，棗花雖小結實成。","e":"모란화호공입목, 조화수소결실성.","p":"모란꽃은 고와도 눈만 즐겁게 할 뿐이고, 대추꽃은 작아도 열매를 맺는다.","c":"상집(上集)","src":285},{"o":"人老心未老，人窮志莫窮。","e":"인로심미로, 인궁지막궁.","p":"몸은 늙어도 마음은 늙지 말고, 처지는 궁해도 뜻은 궁하지 말라.","c":"상집(上集)","src":292},{"o":"人無千日好，花無百日紅。","e":"인무천일호, 화무백일홍.","p":"사람은 천 날을 내리 좋을 수 없고, 꽃은 백 날을 내리 붉을 수 없다.","c":"상집(上集)","src":293},{"o":"乍富不知新受用，乍貧難改舊家風。","e":"사부부지신수용, 사빈난개구가풍.","p":"갑자기 부자가 되면 새로 누리는 법을 모르고, 갑자기 가난해지면 옛 집안 버릇을 고치기 어렵다.","c":"상집(上集)","src":297},{"o":"屋漏更遭連夜雨，行船又遇打頭風。","e":"옥루갱조련야우, 행선우우타두풍.","p":"지붕이 새는데 밤새 비까지 내리고, 배를 모는데 맞바람까지 만난다.","c":"상집(上集)","src":299},{"o":"筍因落籜方成竹，魚爲奔波始化龍。","e":"순인락탁방성죽, 어위분파시화룡.","p":"죽순은 껍질을 벗어야 대나무가 되고, 물고기는 거센 물살을 거슬러야 용이 된다.","c":"상집(上集)","src":300},{"o":"記得少年騎竹馬，看看又是白頭翁。","e":"기득소년기죽마, 간간우시백두옹.","p":"어릴 적 죽마 타던 일이 기억나는데, 어느새 또 흰머리 노인이 되었구나.","c":"상집(上集)","src":301},{"o":"天上衆星皆拱北，世間無水不朝東。","e":"천상중성개공북, 세간무수부조동.","p":"하늘의 뭇별은 다 북극성을 향하고, 세상의 물은 동쪽으로 흐르지 않는 것이 없다.","c":"상집(上集)","src":303},{"o":"有縁千里來相會，無縁對面不相逢。","e":"유연천리래상회, 무연대면불상봉.","p":"인연이 있으면 천 리 밖에서도 와서 만나고, 인연이 없으면 얼굴을 마주하고도 만나지 못한다.","c":"상집(上集)","src":309},{"o":"爽口食多偏作藥，快心事過恐生殃。","e":"상구식다편작약, 쾌심사과공생앙.","p":"입에 맞는 음식도 많이 먹으면 도리어 약을 먹게 되고, 마음 시원한 일도 지나치면 재앙이 생길까 두렵다.","c":"상집(上集)","src":316},{"o":"貪他一斗米，失卻半年糧。","e":"탐타일두미, 실각반년량.","p":"남의 쌀 한 말을 탐내다가 반년 양식을 잃는다.","c":"상집(上集)","src":319},{"o":"平生只會量人短，何不回頭把自量。","e":"평생지회량인단, 하불회두파자량.","p":"평생 남의 단점만 잴 줄 알았지, 어찌하여 고개를 돌려 자신을 재어 보지 않는가.","c":"상집(上集)","src":322},{"o":"自家心裏急，他人未知忙。","e":"자가심리급, 타인미지망.","p":"내 마음은 급해도, 남은 바쁜 줄을 모른다.","c":"상집(上集)","src":325},{"o":"秋至滿山多秀色，春來無處不花香。","e":"추지만산다수색, 춘래무처불화향.","p":"가을이 오니 온 산에 고운 빛이 가득하고, 봄이 오니 꽃향기 없는 곳이 없다.","c":"상집(上集)","src":328},{"o":"蒿草之下，或有蘭香。茅茨之屋，或有侯王。","e":"호초지하, 혹유란향. 모자지옥, 혹유후왕.","p":"쑥대 풀 아래에도 난초 향기가 있을 수 있고, 띠풀 지붕 집에서도 제후와 왕이 날 수 있다.","c":"상집(上集)","src":331},{"o":"醉裏乾坤大，壺中日月長。","e":"취리건곤대, 호중일월장.","p":"취한 속에서는 하늘과 땅이 크고, 술병 속에서는 세월이 길다.","c":"상집(上集)","src":333},{"o":"千里送毫毛，禮輕仁義重。","e":"천리송호모, 예경인의중.","p":"천 리 밖에서 터럭 하나를 보내도, 선물은 가벼우나 정의는 무겁다.","c":"상집(上集)","src":336},{"o":"萬金良藥，不如無疾。","e":"만금량약, 불여무질.","p":"만금짜리 좋은 약도 병이 없는 것만 못하다.","c":"상집(上集)","src":340},{"o":"世事明如鏡，前程暗似漆。","e":"세사명여경, 전정암사칠.","p":"지난 세상일은 거울처럼 밝지만, 앞날은 옻칠처럼 어둡다.","c":"상집(上集)","src":342},{"o":"一夫當關，萬夫莫開。","e":"일부당관, 만부막개.","p":"한 사람이 관문을 지키면 만 사람도 열지 못한다.","c":"상집(上集)","src":357},{"o":"白雲本是無心物，卻被淸風引出來。","e":"백운본시무심물, 각피청풍인출래.","p":"흰 구름은 본래 무심한 것인데, 맑은 바람에 이끌려 나온다.","c":"상집(上集)","src":359},{"o":"人各有心，心各有見。","e":"인각유심, 심각유견.","p":"사람마다 마음이 있고, 마음마다 제 생각이 있다.","c":"상집(上集)","src":367},{"o":"口説不如身逢，耳聞不如目見。","e":"구설불여신봉, 이문불여목견.","p":"입으로 듣는 것은 몸소 겪는 것만 못하고, 귀로 듣는 것은 눈으로 보는 것만 못하다.","c":"상집(上集)","src":368},{"o":"養軍千日，用在一朝。","e":"양군천일, 용재일조.","p":"군사를 천 날 기르는 것은 하루아침에 쓰기 위해서다.","c":"상집(上集)","src":370},{"o":"利刀割體痕易合，惡語傷人恨不消。","e":"이도할체흔이합, 악어상인한불소.","p":"날카로운 칼에 베인 상처는 쉽게 아물지만, 모진 말로 입은 상처는 한이 사라지지 않는다.","c":"상집(上集)","src":372},{"o":"苗從地發，樹向枝分。","e":"묘종지발, 수향지분.","p":"싹은 땅에서 나오고, 나무는 가지로 갈라진다.","c":"상집(上集)","src":376},{"o":"父子和而家不退，兄弟和而家不分。","e":"부자화이가불퇴, 형제화이가불분.","p":"아버지와 아들이 화목하면 집안이 기울지 않고, 형과 아우가 화목하면 집안이 갈라지지 않는다.","c":"상집(上集)","src":380},{"o":"根深不怕風搖動，樹正無愁月影斜。","e":"근심불파풍요동, 수정무수월영사.","p":"뿌리가 깊으면 바람에 흔들릴까 두렵지 않고, 나무가 곧으면 달그림자가 비뚤어질까 근심하지 않는다.","c":"상집(上集)","src":387},{"o":"愚者千慮，必有一得，智者千慮，必有一失。","e":"우자천려, 필유일득, 지자천려, 필유일실.","p":"어리석은 사람도 천 번 생각하면 반드시 하나는 얻고, 지혜로운 사람도 천 번 생각하면 반드시 하나는 잃는다.","c":"상집(上集)","src":389},{"o":"珠沉淵而川媚，玉韞石而山輝。","e":"주침연이천미, 옥온석이산휘.","p":"구슬이 못에 잠겨 있으면 냇물이 곱고, 옥이 돌 속에 감춰져 있으면 산이 빛난다.","c":"상집(上集)","src":393},{"o":"夕陽無限好，只恐不多時。","e":"석양무한호, 지공부다시.","p":"저녁노을은 한없이 좋지만, 다만 남은 시간이 많지 않을까 걱정이다.","c":"상집(上集)","src":394},{"o":"久旱逢甘霖，他鄕遇故知；洞房花燭夜，金榜題名時。","e":"구한봉감림, 타향우고지; 동방화촉야, 금방제명시.","p":"오랜 가뭄 끝에 단비를 만나고, 타향에서 옛 친구를 만나고, 신방에 촛불 밝힌 밤, 과거 급제 명단에 이름이 오른 때. (인생의 네 가지 기쁨)","c":"상집(上集)","src":395},{"o":"惜花春起早，愛月夜眠遲。","e":"석화춘기조, 애월야면지.","p":"꽃을 아끼니 봄에는 일찍 일어나고, 달을 사랑하니 밤에는 늦게 잔다.","c":"상집(上集)","src":396},{"o":"掬水月在手，弄花香滿衣。","e":"국수월재수, 농화향만의.","p":"물을 두 손으로 뜨니 달이 손안에 있고, 꽃을 만지니 향기가 옷에 가득하다.","c":"상집(上集)","src":397},{"o":"世上無難事，只怕不專心。","e":"세상무난사, 지파부전심.","p":"세상에 어려운 일은 없다. 다만 마음을 한데 모으지 않을까 걱정일 뿐이다.","c":"하집(下集)","src":437,"local":3,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":437,"lower_collection_no":3},{"o":"成人不自在，自在不成人；","e":"성인부자재, 자재불성인;","p":"사람 구실을 하려면 마음대로 편히 지낼 수 없고, 편히 지내려 하면 사람 구실을 하지 못한다.","c":"하집(下集)","src":438,"local":4,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":438,"lower_collection_no":4},{"o":"金憑火煉方知色，與人交財便知心。","e":"금빙화련방지색, 여인교재변지심.","p":"금은 불에 달궈 보아야 제 빛깔을 알고, 사람은 재물을 주고받아 보아야 속마음을 안다.","c":"하집(下集)","src":439,"local":5,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":439,"lower_collection_no":5},{"o":"乞丐無糧，懶惰而成。","e":"걸개무량, 나태이성.","p":"거지가 먹을 양식이 없는 것은 게으름에서 비롯된 것이다.","c":"하집(下集)","src":440,"local":6,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":440,"lower_collection_no":6},{"o":"勤儉爲無價之寶，節糧乃衆妙之門。","e":"근검위무가지보, 절량내중묘지문.","p":"부지런하고 검소함은 값을 매길 수 없는 보배요, 양식을 아끼는 것은 온갖 좋은 일로 들어가는 문이다.","c":"하집(下集)","src":441,"local":7,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":441,"lower_collection_no":7},{"o":"省事儉用，免得求人。","e":"생사검용, 면득구인.","p":"일을 덜고 씀씀이를 아끼면, 남에게 아쉬운 소리를 하지 않아도 된다.","c":"하집(下集)","src":442,"local":8,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":442,"lower_collection_no":8},{"o":"量大禍不在，機深禍亦深。","e":"양대화부재, 기심화역심.","p":"도량이 크면 화가 머물지 않고, 꾀가 깊으면 화도 그만큼 깊다.","c":"하집(下集)","src":443,"local":9,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":443,"lower_collection_no":9},{"o":"善爲至寶深深用，心作良田世世耕。","e":"선위지보심심용, 심작량전세세경.","p":"선은 더없는 보배이니 깊이 아껴 쓰고, 마음은 좋은 밭이니 대대로 갈고 가꾸어라.","c":"하집(下集)","src":444,"local":10,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":444,"lower_collection_no":10},{"o":"群居防口，獨坐防心。","e":"군거방구, 독좌방심.","p":"여럿이 함께 있을 때는 입을 조심하고, 홀로 앉아 있을 때는 마음을 조심하라.","c":"하집(下集)","src":445,"local":11,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":445,"lower_collection_no":11},{"o":"體無病爲富貴，身平安莫怨貧。","e":"체무병위부귀, 신평안막원빈.","p":"몸에 병이 없으면 그것이 곧 부귀요, 몸이 평안하거든 가난을 원망하지 말라.","c":"하집(下集)","src":446,"local":12,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":446,"lower_collection_no":12},{"o":"敗家子弟揮金如土，貧家子弟積土成金。","e":"패가자제휘금여토, 빈가자제적토성금.","p":"집안을 망치는 자식은 금을 흙처럼 뿌리고, 가난한 집 자식은 흙을 모아 금을 만든다.","c":"하집(下集)","src":447,"local":13,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":447,"lower_collection_no":13},{"o":"富貴非關天地，禍福不是鬼神。","e":"부귀비관천지, 화복불시귀신.","p":"부귀는 하늘과 땅에 달린 것이 아니고, 화와 복은 귀신이 내리는 것이 아니다.","c":"하집(下集)","src":448,"local":14,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":448,"lower_collection_no":14},{"o":"安分貧一時，本分終不貧。","e":"안분빈일시, 본분종불빈.","p":"분수를 지키면 가난은 한때뿐이요, 제 본분을 다하면 끝내 가난하지 않다.","c":"하집(下集)","src":449,"local":15,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":449,"lower_collection_no":15},{"o":"人過留名，鴈過留聲。","e":"인과유명, 안과유성.","p":"사람은 지나간 자리에 이름을 남기고, 기러기는 날아간 자리에 소리를 남긴다.","c":"하집(下集)","src":451,"local":17,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":451,"lower_collection_no":17},{"o":"禍與福同門，利與害同城。","e":"화여복동문, 이여해동성.","p":"화와 복은 한 문으로 드나들고, 이로움과 해로움은 한 성 안에 함께 산다.","c":"하집(下集)","src":455,"local":21,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":455,"lower_collection_no":21},{"o":"淸酒紅人臉，財帛動人心！","e":"청주홍인검, 재백동인심!","p":"맑은 술은 사람의 얼굴을 붉게 하고, 재물은 사람의 마음을 흔든다!","c":"하집(下集)","src":456,"local":22,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":456,"lower_collection_no":22},{"o":"寧可葷口念佛，不可素口駡人。","e":"영가훈구념불, 불가소구매인.","p":"차라리 고기 먹은 입으로 염불을 할지언정, 채식한 입으로 남을 욕해서는 안 된다.","c":"하집(下集)","src":457,"local":23,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":457,"lower_collection_no":23},{"o":"有錢能説話，無錢話不靈。","e":"유전능설화, 무전화불령.","p":"돈이 있으면 말발이 서고, 돈이 없으면 말해도 먹히지 않는다.","c":"하집(下集)","src":458,"local":24,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":458,"lower_collection_no":24},{"o":"豈能盡如人意？但求不愧吾心。","e":"기능진여인의? 단구불괴오심.","p":"어찌 모든 일이 남의 뜻에 다 맞을 수 있으랴? 다만 내 마음에 부끄럽지 않기를 바랄 뿐이다.","c":"하집(下集)","src":459,"local":25,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":459,"lower_collection_no":25},{"o":"不説自己井繩短，反説他人箍井深。","e":"불설자기정승단, 반설타인고정심.","p":"제 두레박줄이 짧은 것은 말하지 않고, 도리어 남이 판 우물이 깊다고 탓한다.","c":"하집(下集)","src":460,"local":26,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":460,"lower_collection_no":26},{"o":"孝莫假意，轉眼便爲人父母。善休望報，回頭只看汝兒孫！","e":"효막가의, 전안변위인부모. 선휴망보, 회두지간여아손!","p":"효도는 거짓 마음으로 하지 말라. 눈 깜짝할 사이에 너도 부모가 된다. 선을 행하고 보답을 바라지 말라. 돌아보면 네 자손에게서 그 보답을 보게 되리라!","c":"하집(下集)","src":463,"local":29,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":463,"lower_collection_no":29,"src_all":[463,464],"lower_collection_nos":[29,30]},{"o":"口開神氣散，舌出是非生！","e":"구개신기산, 설출시비생!","p":"입을 열면 정신과 기운이 흩어지고, 혀를 놀리면 시비가 생긴다!","c":"하집(下集)","src":465,"local":31,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":465,"lower_collection_no":31},{"o":"彈琴費指甲，説話費精神。","e":"탄금비지갑, 설화비정신.","p":"거문고를 타면 손톱이 닳고, 말을 하면 정신이 닳는다.","c":"하집(下集)","src":466,"local":32,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":466,"lower_collection_no":32},{"o":"千貫買田，萬貫結鄰。","e":"천관매전, 만관결린.","p":"밭은 천 관이면 사지만, 이웃을 사귀는 데는 만 관을 들인다. (좋은 이웃이 밭보다 귀하다.)","c":"하집(下集)","src":467,"local":33,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":467,"lower_collection_no":33},{"o":"隔壁豈無耳，窗外豈無人？","e":"격벽기무이, 창외기무인?","p":"벽 너머라고 어찌 귀가 없겠으며, 창밖이라고 어찌 사람이 없겠는가?","c":"하집(下集)","src":469,"local":35,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":469,"lower_collection_no":35},{"o":"酒不護賢，色不護病；財不護親，氣不護命！","e":"주불호현, 색불호병; 재불호친, 기불호명!","p":"술은 어진 사람이라고 봐주지 않고, 여색은 병든 몸이라고 봐주지 않으며, 재물은 친척이라고 감싸 주지 않고, 성냄은 목숨을 지켜 주지 않는다!","c":"하집(下集)","src":471,"local":37,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":471,"lower_collection_no":37,"src_all":[471,472],"lower_collection_nos":[37,38]},{"o":"一日不可無常業，安閑便易起邪心！","e":"일일불가무상업, 안한변이기사심!","p":"하루라도 늘 하는 일이 없어서는 안 된다. 편히 놀고 지내면 사악한 마음이 일어나기 쉽다!","c":"하집(下集)","src":473,"local":39,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":473,"lower_collection_no":39},{"o":"炎涼世態，富貴更甚於貧賤；嫉妬人心，骨肉更甚於外人！","e":"염량세태, 부귀갱심어빈천; 질투인심, 골육갱심어외인!","p":"형편 따라 붙었다 떨어졌다 하는 세태는 가난한 이들보다 부귀한 이들 사이에서 더 심하고, 시기하는 사람 마음은 남보다 피붙이 사이에서 더 심하다!","c":"하집(下集)","src":474,"local":40,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":474,"lower_collection_no":40,"src_all":[474,475],"lower_collection_nos":[40,41]},{"o":"瓜熟蔕落，水到渠成。","e":"과숙체락, 수도거성.","p":"참외가 익으면 꼭지가 절로 떨어지고, 물이 이르면 도랑이 절로 생긴다. (때가 되면 일은 저절로 이루어진다.)","c":"하집(下集)","src":476,"local":42,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":476,"lower_collection_no":42},{"o":"人情送匹馬，買賣不饒針！","e":"인정송필마, 매매불요침!","p":"인정으로는 말 한 필도 선뜻 내주지만, 장사에서는 바늘 하나도 깎아 주지 않는다!","c":"하집(下集)","src":477,"local":43,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":477,"lower_collection_no":43},{"o":"過頭飯好喫，過頭話難聽！","e":"과두반호끽, 과두화난청!","p":"넘치게 담은 밥은 먹기 좋아도, 도를 넘은 말은 듣기 거북하다!","c":"하집(下集)","src":478,"local":44,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":478,"lower_collection_no":44},{"o":"怕事忍事不生事自然無事；平心靜心不欺心何等放心！","e":"파사인사불생사자연무사; 평심정심불기심하등방심!","p":"일을 두려워하고 참으며 일을 만들지 않으면 저절로 탈이 없고, 마음을 고르고 고요히 하며 스스로 속이지 않으면 얼마나 마음이 놓이겠는가!","c":"하집(下集)","src":480,"local":46,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":480,"lower_collection_no":46,"src_all":[480,481],"lower_collection_nos":[46,47]},{"o":"天子至尊不過於理，在理良心天下通行。","e":"천자지존불과어리, 재리량심천하통행.","p":"천자가 지극히 높아도 이치를 넘어설 수는 없으니, 이치에 맞고 양심에 따르면 천하 어디서나 통한다.","c":"하집(下集)","src":482,"local":48,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":482,"lower_collection_no":48},{"o":"好話不在多説，有理不在髙聲！","e":"호화부재다설, 유리부재고성!","p":"좋은 말은 많이 하는 데 있지 않고, 옳은 이치는 목소리 큰 데 있지 않다!","c":"하집(下集)","src":483,"local":49,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":483,"lower_collection_no":49},{"o":"甘草味甜人可食，巧言妄語不可聽。","e":"감초미첨인가식, 교언망어불가청.","p":"감초는 맛이 달아 사람이 먹을 만하지만, 교묘한 말과 허튼소리는 귀담아들어서는 안 된다.","c":"하집(下集)","src":485,"local":51,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":485,"lower_collection_no":51},{"o":"父子竭力山成玉，弟兄同心土變金。","e":"부자갈력산성옥, 제형동심토변금.","p":"아버지와 아들이 힘을 다하면 산도 옥이 되고, 형제가 마음을 합치면 흙도 금으로 변한다.","c":"하집(下集)","src":490,"local":56,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":490,"lower_collection_no":56},{"o":"當事者迷，旁觀者淸。","e":"당사자미, 방관자청.","p":"일을 맡은 사람은 헷갈리고, 곁에서 보는 사람은 환히 본다.","c":"하집(下集)","src":491,"local":57,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":491,"lower_collection_no":57},{"o":"怪人不知理，知理不怪人。","e":"괴인부지리, 지리불괴인.","p":"남을 탓하는 사람은 이치를 모르는 것이요, 이치를 아는 사람은 남을 탓하지 않는다.","c":"하집(下集)","src":492,"local":58,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":492,"lower_collection_no":58},{"o":"未富先富終不富，未貧先貧終不貧。","e":"미부선부종불부, 미빈선빈종불빈.","p":"부자가 되기도 전에 부자 행세를 하면 끝내 부자가 못 되고, 가난해지기 전에 가난한 듯 아끼면 끝내 가난하지 않다.","c":"하집(下集)","src":493,"local":59,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":493,"lower_collection_no":59},{"o":"慾多傷神，財多累心！","e":"욕다상신, 재다루심!","p":"욕심이 많으면 정신이 상하고, 재물이 많으면 마음이 고달프다!","c":"하집(下集)","src":497,"local":63,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":497,"lower_collection_no":63},{"o":"家貧出孝子，國亂顯忠臣！","e":"가빈출효자, 국란현충신!","p":"집이 가난할 때 효자가 나오고, 나라가 어지러울 때 충신이 드러난다!","c":"하집(下集)","src":499,"local":65,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":499,"lower_collection_no":65},{"o":"寧做太平犬，莫做離亂人！","e":"영주태평견, 막주리란인!","p":"차라리 태평한 세상의 개가 될지언정, 난리 통의 사람은 되지 말라!","c":"하집(下集)","src":500,"local":66,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":500,"lower_collection_no":66},{"o":"自重者然後人重，人輕者便是自輕。","e":"자중자연후인중, 인경자변시자경.","p":"스스로를 소중히 여기는 사람이라야 남도 그를 소중히 여기니, 남에게 가볍게 여겨지는 것은 곧 스스로를 가벼이 한 탓이다.","c":"하집(下集)","src":503,"local":69,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":503,"lower_collection_no":69},{"o":"傷身事莫做，傷心話莫説。","e":"상신사막주, 상심화막설.","p":"몸을 해치는 일은 하지 말고, 마음을 아프게 하는 말은 하지 말라.","c":"하집(下集)","src":506,"local":72,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":506,"lower_collection_no":72},{"o":"地不生無名之輩，天不生無路之人。","e":"지불생무명지배, 천불생무로지인.","p":"땅은 이름 없는 무리를 내지 않고, 하늘은 살길 없는 사람을 내지 않는다. (누구에게나 제 몫과 길이 있다.)","c":"하집(下集)","src":508,"local":74,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":508,"lower_collection_no":74},{"o":"讀未見書如逢良友，見已讀書如逢故人。","e":"독미견서여봉량우, 견이독서여봉고인.","p":"아직 보지 못한 책을 읽으면 좋은 벗을 만난 듯하고, 이미 읽은 책을 다시 보면 옛 친구를 만난 듯하다.","c":"하집(下集)","src":510,"local":76,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":510,"lower_collection_no":76},{"o":"不怕三十而死，只怕死後無名。","e":"불파삼십이사, 지파사후무명.","p":"서른에 죽는 것은 두렵지 않으나, 죽은 뒤에 이름이 남지 않을까 두렵다.","c":"하집(下集)","src":512,"local":78,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":512,"lower_collection_no":78},{"o":"説長説短，寧説人長莫説短；施恩施怨，寧施人恩莫施怨。","e":"설장설단, 영설인장막설단; 시은시원, 영시인은막시원.","p":"남의 장단점을 말할 바에는 차라리 장점을 말하고 단점은 말하지 말며, 은혜와 원한을 베풀 바에는 차라리 은혜를 베풀고 원한은 짓지 말라.","c":"하집(下集)","src":515,"local":81,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":515,"lower_collection_no":81,"src_all":[515,516],"lower_collection_nos":[81,82]},{"o":"育林養虎，虎大傷人。","e":"육림양호, 호대상인.","p":"숲을 가꾸어 범을 기르면, 범이 자라 사람을 해친다. (화근은 키우지 말라.)","c":"하집(下集)","src":517,"local":83,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":517,"lower_collection_no":83},{"o":"愛鼠常留飯，憐蛾燈罩紗。","e":"애서상류반, 연아등조사.","p":"쥐를 아껴 늘 밥을 남겨 두고, 나방이 가여워 등불에 깁 덮개를 씌운다. (작은 생명까지 아끼는 마음)","c":"하집(下集)","src":520,"local":86,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":520,"lower_collection_no":86},{"o":"治國信讒必殺忠臣，治家信讒必疎其親。","e":"치국신참필살충신, 치가신참필소기친.","p":"나라를 다스리며 헐뜯는 말을 믿으면 반드시 충신을 죽이게 되고, 집안을 다스리며 헐뜯는 말을 믿으면 반드시 가족과 멀어진다.","c":"하집(下集)","src":524,"local":90,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":524,"lower_collection_no":90},{"o":"兒不嫌母醜，狗不嫌家貧。","e":"아불혐모추, 구불혐가빈.","p":"자식은 어머니가 못생겼다고 꺼리지 않고, 개는 집이 가난하다고 꺼리지 않는다.","c":"하집(下集)","src":528,"local":94,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":528,"lower_collection_no":94},{"o":"君子千錢不計較，小人一錢惱人心。","e":"군자천전불계교, 소인일전뇌인심.","p":"군자는 천 냥에도 따지지 않고, 소인은 한 푼에도 사람 속을 태운다.","c":"하집(下集)","src":529,"local":95,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":529,"lower_collection_no":95},{"o":"家無生活計，坐喫如山崩。","e":"가무생활계, 좌끽여산붕.","p":"집에 살아갈 방도가 없이 앉아서 먹기만 하면, 산 같은 재산도 무너진다.","c":"하집(下集)","src":535,"local":101,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":535,"lower_collection_no":101},{"o":"家有良田萬頃，不如薄藝在身；","e":"가유량전만경, 불여박예재신;","p":"집에 좋은 밭이 만 경이나 있어도, 몸에 지닌 작은 재주 하나만 못하다.","c":"하집(下集)","src":536,"local":102,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":536,"lower_collection_no":102},{"o":"命中只有八合米，走遍天下不滿升。","e":"명중지유팔합미, 주편천하불만승.","p":"타고난 몫이 쌀 여덟 홉뿐이면, 천하를 다 돌아다녀도 한 되를 채우지 못한다.","c":"하집(下集)","src":538,"local":104,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":538,"lower_collection_no":104},{"o":"使心用心，反害自身。","e":"사심용심, 반해자신.","p":"잔꾀를 부리고 속셈을 쓰면, 도리어 제 몸을 해친다.","c":"하집(下集)","src":539,"local":105,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":539,"lower_collection_no":105},{"o":"耽誤一年春，十年補不淸；","e":"탐오일년춘, 십년보불청;","p":"한 해 봄을 놓치면, 십 년을 두고 메워도 다 채우지 못한다.","c":"하집(下集)","src":542,"local":108,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":542,"lower_collection_no":108},{"o":"人不走不親，水不打不渾。","e":"인부주불친, 수불타불혼.","p":"사람은 오가지 않으면 가까워지지 않고, 물은 휘젓지 않으면 흐려지지 않는다.","c":"하집(下集)","src":545,"local":111,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":545,"lower_collection_no":111},{"o":"窮莫失志，富莫癲狂。","e":"궁막실지, 부막전광.","p":"가난해도 뜻을 잃지 말고, 부유해도 미친 듯 날뛰지 말라.","c":"하집(下集)","src":554,"local":120,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":554,"lower_collection_no":120},{"o":"隔行莫貪利，久煉必成鋼。","e":"격항막탐리, 구련필성강.","p":"남의 업종에서 이익을 탐하지 말라. 한 길을 오래 단련하면 반드시 강철이 된다.","c":"하집(下集)","src":557,"local":123,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":557,"lower_collection_no":123},{"o":"甁花雖好艷，相看不耐長。","e":"병화수호염, 상간불내장.","p":"꽃병에 꽂은 꽃은 곱고 화사해도, 오래 두고 볼 수는 없다.","c":"하집(下集)","src":558,"local":124,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":558,"lower_collection_no":124},{"o":"未來休指望，過去莫思量；","e":"미래휴지망, 과거막사량;","p":"오지 않은 일에 기대를 걸지 말고, 지나간 일에 마음을 쓰지 말라.","c":"하집(下集)","src":560,"local":126,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":560,"lower_collection_no":126},{"o":"晴帶雨傘，飽帶飢糧。","e":"청대우산, 포대기량.","p":"날이 개어도 우산을 챙기고, 배가 불러도 주릴 때의 양식을 챙겨라.","c":"하집(下集)","src":563,"local":129,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":563,"lower_collection_no":129},{"o":"滿壺全不響，半壺響叮當。","e":"만호전불향, 반호향정당.","p":"가득 찬 병은 소리가 나지 않고, 반쯤 찬 병이 찰랑찰랑 요란한 소리를 낸다.","c":"하집(下集)","src":564,"local":130,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":564,"lower_collection_no":130},{"o":"久利之事莫爲，衆爭之地莫往。","e":"구리지사막위, 중쟁지지막왕.","p":"오래 이익만 보려는 일은 하지 말고, 여럿이 다투는 자리에는 가지 말라.","c":"하집(下集)","src":565,"local":131,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":565,"lower_collection_no":131},{"o":"捨財不如少取，施藥不如傳方。","e":"사재불여소취, 시약불여전방.","p":"재물을 베푸는 것은 덜 가져가는 것만 못하고, 약을 나누어 주는 것은 처방을 전해 주는 것만 못하다.","c":"하집(下集)","src":568,"local":134,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":568,"lower_collection_no":134},{"o":"蒼蠅不叮無縫蛋，謡言不找謹愼人。","e":"창승부정무봉단, 요언부조근신인.","p":"파리는 금 가지 않은 달걀에 꾀지 않고, 헛소문은 몸가짐을 삼가는 사람을 찾아가지 않는다.","c":"하집(下集)","src":571,"local":137,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":571,"lower_collection_no":137},{"o":"一人捨死，萬人難當。","e":"일인사사, 만인난당.","p":"한 사람이 목숨을 내던지면, 만 사람도 당해 내기 어렵다.","c":"하집(下集)","src":572,"local":138,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":572,"lower_collection_no":138},{"o":"硬弩絃先斷，鋼刀刃自傷。","e":"경노현선단, 강도인자상.","p":"센 쇠뇌는 시위가 먼저 끊어지고, 강철 칼은 날이 먼저 상한다. (지나치게 굳센 것이 먼저 다친다.)","c":"하집(下集)","src":576,"local":142,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":576,"lower_collection_no":142},{"o":"好事他人未見講，錯處他偏説得長。","e":"호사타인미견강, 착처타편설득장.","p":"잘한 일은 남이 말해 주지 않고, 잘못한 데는 남이 굳이 길게 떠든다.","c":"하집(下集)","src":578,"local":144,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":578,"lower_collection_no":144},{"o":"財交者密，財盡者疎。","e":"재교자밀, 재진자소.","p":"재물로 사귄 사이는 친밀하다가도, 재물이 다하면 멀어진다.","c":"하집(下集)","src":585,"local":151,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":585,"lower_collection_no":151},{"o":"少實勝虚，巧不如拙。","e":"소실승허, 교불여졸.","p":"적어도 알찬 것이 헛된 것보다 낫고, 약삭빠른 것은 우직한 것만 못하다.","c":"하집(下集)","src":588,"local":154,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":588,"lower_collection_no":154},{"o":"百戰百勝不如無爭，萬言萬中不如一默。","e":"백전백승불여무쟁, 만언만중불여일묵.","p":"백 번 싸워 백 번 이기는 것이 다투지 않음만 못하고, 만 마디 말이 다 들어맞는 것이 한 번 침묵함만 못하다.","c":"하집(下集)","src":589,"local":155,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":589,"lower_collection_no":155},{"o":"有錢不置怨逆産，冤家宜解不宜結。","e":"유전불치원역산, 원가의해불의결.","p":"돈이 있어도 원망을 살 재산은 사들이지 말라. 원수는 풀어야지 맺어서는 안 된다.","c":"하집(下集)","src":590,"local":156,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":590,"lower_collection_no":156},{"o":"近朱者赤，近墨者黑。","e":"근주자적, 근묵자흑.","p":"붉은 것을 가까이하면 붉어지고, 먹을 가까이하면 검어진다.","c":"하집(下集)","src":591,"local":157,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":591,"lower_collection_no":157},{"o":"出門看天色，進門看臉色。","e":"출문간천색, 진문간검색.","p":"문을 나설 때는 하늘빛을 살피고, 문에 들어설 때는 사람의 낯빛을 살펴라.","c":"하집(下集)","src":593,"local":159,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":593,"lower_collection_no":159},{"o":"家無三年之積不成其家，國無九年之積不成其國。","e":"가무삼년지적불성기가, 국무구년지적불성기국.","p":"집에 삼 년 먹을 비축이 없으면 집이라 할 수 없고, 나라에 구 년 쓸 비축이 없으면 나라라 할 수 없다.","c":"하집(下集)","src":596,"local":162,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":596,"lower_collection_no":162},{"o":"謙虚美德，過謙即詐。","e":"겸허미덕, 과겸즉사.","p":"겸손은 미덕이지만, 지나친 겸손은 곧 거짓이다.","c":"하집(下集)","src":600,"local":166,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":600,"lower_collection_no":166},{"o":"自己跌倒自己爬，望人扶持都是假。","e":"자기질도자기파, 망인부지도시가.","p":"스스로 넘어졌으면 스스로 일어나라. 남이 붙들어 주기를 바라는 것은 다 헛일이다.","c":"하집(下集)","src":601,"local":167,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":601,"lower_collection_no":167},{"o":"人不知己過，牛不知力大。","e":"인부지기과, 우부지력대.","p":"사람은 제 허물을 모르고, 소는 제 힘이 센 줄을 모른다.","c":"하집(下集)","src":602,"local":168,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":602,"lower_collection_no":168},{"o":"滿載芝麻都漏了，還在水裏撈油花！","e":"만재지마도루료, 환재수리로유화!","p":"가득 실은 참깨는 다 흘려 버리고, 아직도 물에서 기름 방울을 건지고 있다! (큰 것을 잃고 작은 것에 매달린다.)","c":"하집(下集)","src":606,"local":172,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":606,"lower_collection_no":172},{"o":"找錢猶如針挑土，用錢猶如水推沙！","e":"조전유여침도토, 용전유여수추사!","p":"돈 벌기는 바늘로 흙을 파내듯 어렵고, 돈 쓰기는 물이 모래를 쓸어 가듯 쉽다!","c":"하집(下集)","src":610,"local":176,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":610,"lower_collection_no":176},{"o":"害人之心不可有，防人之心不可無！","e":"해인지심불가유, 방인지심불가무!","p":"남을 해치려는 마음은 있어서는 안 되고, 남을 경계하는 마음은 없어서는 안 된다!","c":"하집(下集)","src":611,"local":177,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":611,"lower_collection_no":177},{"o":"不愁無路，就怕不做。","e":"불수무로, 취파부주.","p":"길이 없을까 걱정할 것 없고, 하지 않는 것이 두려울 뿐이다.","c":"하집(下集)","src":612,"local":178,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":612,"lower_collection_no":178},{"o":"須向根頭尋活計，莫從體面下功夫！","e":"수향근두심활계, 막종체면하공부!","p":"모름지기 근본에서 살길을 찾고, 겉치레에 공을 들이지 말라!","c":"하집(下集)","src":613,"local":179,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":613,"lower_collection_no":179},{"o":"禍從口出，病從口入。","e":"화종구출, 병종구입.","p":"화는 입에서 나오고, 병은 입으로 들어온다.","c":"하집(下集)","src":614,"local":180,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":614,"lower_collection_no":180},{"o":"藥補不如肉補，肉補不如養補。","e":"약보불여육보, 육보불여양보.","p":"약으로 몸을 보하는 것은 음식으로 보하는 것만 못하고, 음식으로 보하는 것은 몸을 잘 돌보는 것만 못하다.","c":"하집(下集)","src":615,"local":181,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":615,"lower_collection_no":181},{"o":"人怕不是福，人欺不是辱。","e":"인파불시복, 인기불시욕.","p":"남이 나를 두려워하는 것이 복은 아니요, 남에게 속는 것이 욕은 아니다.","c":"하집(下集)","src":617,"local":183,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":617,"lower_collection_no":183},{"o":"能言不是眞君子，善處方爲大丈夫！","e":"능언불시진군자, 선처방위대장부!","p":"말을 잘한다고 참된 군자는 아니요, 처신을 잘해야 비로소 대장부다!","c":"하집(下集)","src":618,"local":184,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":618,"lower_collection_no":184},{"o":"爲人莫犯法，犯法身無主。","e":"위인막범법, 범법신무주.","p":"사람으로서 법을 어기지 말라. 법을 어기면 제 몸도 제 뜻대로 하지 못한다.","c":"하집(下集)","src":619,"local":185,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":619,"lower_collection_no":185},{"o":"盜賊怨失主，不孝怨父母。","e":"도적원실주, 불효원부모.","p":"도둑은 물건 잃은 주인을 원망하고, 불효자는 부모를 원망한다.","c":"하집(下集)","src":626,"local":192,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":626,"lower_collection_no":192},{"o":"一時勸人以口，百世勸人以書。","e":"일시권인이구, 백세권인이서.","p":"한때 사람을 깨우치는 것은 말로 하고, 백 대에 걸쳐 사람을 깨우치는 것은 글로 한다.","c":"하집(下集)","src":627,"local":193,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":627,"lower_collection_no":193},{"o":"我不如人我無其福，人不如我我常知足！","e":"아불여인아무기복, 인불여아아상지족!","p":"내가 남만 못한 것은 내게 그만한 복이 없어서이고, 남이 나만 못한 것을 보면 나는 늘 만족할 줄 안다!","c":"하집(下集)","src":628,"local":194,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":628,"lower_collection_no":194},{"o":"緩歩當車，無禍當福。","e":"완보당거, 무화당복.","p":"천천히 걷는 것을 수레 타는 셈으로 여기고, 화가 없는 것을 복으로 여겨라.","c":"하집(下集)","src":634,"local":200,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":634,"lower_collection_no":200},{"o":"男無良友不知己之有過，女無明鏡不知面之精粗。","e":"남무량우부지기지유과, 여무명경부지면지정조.","p":"남자는 좋은 벗이 없으면 제 허물을 모르고, 여자는 밝은 거울이 없으면 제 얼굴이 고운지 거친지 모른다.","c":"하집(下集)","src":635,"local":201,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":635,"lower_collection_no":201},{"o":"事非親做，不知難處。","e":"사비친주, 부지난처.","p":"몸소 해 보지 않으면, 그 일의 어려운 점을 모른다.","c":"하집(下集)","src":636,"local":202,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":636,"lower_collection_no":202},{"o":"積錢不如積德，閑坐不如看書。","e":"적전불여적덕, 한좌불여간서.","p":"돈을 쌓는 것은 덕을 쌓는 것만 못하고, 한가히 앉아 있는 것은 책을 읽는 것만 못하다.","c":"하집(下集)","src":638,"local":204,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":638,"lower_collection_no":204},{"o":"時來易借銀千兩，運去難賒酒半壺。","e":"시래이차은천량, 운거난사주반호.","p":"때가 오면 은 천 냥도 쉽게 빌리고, 운이 가면 술 반 병도 외상으로 얻기 어렵다.","c":"하집(下集)","src":640,"local":206,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":640,"lower_collection_no":206},{"o":"當面留一綫，過後好相見。","e":"당면류일선, 과후호상견.","p":"마주할 때 한 가닥 여지를 남겨 두면, 나중에 다시 만나기 좋다.","c":"하집(下集)","src":643,"local":209,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":643,"lower_collection_no":209},{"o":"浪子出於祖無德，孝子出於前人賢。","e":"낭자출어조무덕, 효자출어전인현.","p":"방탕한 자식은 조상에게 덕이 없는 데서 나오고, 효자는 윗대가 어진 데서 나온다.","c":"하집(下集)","src":646,"local":212,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":646,"lower_collection_no":212},{"o":"貨離鄕貴，人離鄕賤。","e":"화리향귀, 인리향천.","p":"물건은 고향을 떠나면 귀해지고, 사람은 고향을 떠나면 천해진다.","c":"하집(下集)","src":647,"local":213,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":647,"lower_collection_no":213},{"o":"樹挪死，人挪活。","e":"수나사, 인나활.","p":"나무는 옮겨 심으면 죽고, 사람은 옮겨 가면 살길이 열린다.","c":"하집(下集)","src":648,"local":214,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":648,"lower_collection_no":214},{"o":"在家千日好，出門處處難。","e":"재가천일호, 출문처처난.","p":"집에 있으면 천 날이 다 좋고, 집을 나서면 가는 곳마다 어렵다.","c":"하집(下集)","src":649,"local":215,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":649,"lower_collection_no":215},{"o":"明人自斷，愚人官斷。","e":"명인자단, 우인관단.","p":"현명한 사람은 스스로 시비를 가리고, 어리석은 사람은 관가에 가서야 가린다.","c":"하집(下集)","src":651,"local":217,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":651,"lower_collection_no":217},{"o":"天下禮儀無窮，一人知識有限。","e":"천하례의무궁, 일인지식유한.","p":"천하의 예의는 끝이 없고, 한 사람의 지식은 한계가 있다.","c":"하집(下集)","src":655,"local":221,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":655,"lower_collection_no":221},{"o":"人人依禮儀，天下不設官。","e":"인인의례의, 천하불설관.","p":"사람마다 예의를 따른다면, 천하에 관리를 둘 필요가 없다.","c":"하집(下集)","src":658,"local":224,"source":"zh.wikisource.org 增廣昔時賢文 下集","source_index_in_zg_all":658,"lower_collection_no":224},{"o":"喫盡美味還是鹽，穿盡綾羅還是
