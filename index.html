<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self';">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4ecdc">
<title>오늘의 한마디</title>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="192x192" href="icon2-192.png"><link rel="shortcut icon" href="favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon2.png"><link rel="apple-touch-icon" href="apple-touch-icon2.png"><link rel="manifest" href="manifest2.json">
<style>
:root{--bg:#f4ecdc;--card:#fffaf0;--ink:#3b2f24;--sub:#7a6a58;--accent:#8a4b2a;--line:#e6d8bf;--seal:#b03a2e;--fz:1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;-webkit-text-size-adjust:100%;line-height:1.6;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:rgba(244,236,220,.97);border-bottom:1px solid var(--line);padding:10px 12px 8px;text-align:center}
h1{margin:0;font-size:22px;letter-spacing:2px;color:var(--accent)}
h1 small{font-size:14px;color:var(--sub);letter-spacing:0;margin-left:6px}
.date{font-size:20px;margin:4px 0 8px;font-weight:700}
.nav{display:flex;gap:8px;justify-content:center}
.nav button,.tools button{font:inherit;font-size:18px;border:1px solid #c9b48f;background:#fffaf0;color:var(--ink);border-radius:12px;padding:8px 14px;min-height:44px;cursor:pointer}
.nav button.today{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.nav button:active,.tools button:active{transform:scale(.97)}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin:14px 0;box-shadow:0 1px 3px rgba(90,60,30,.08)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:10px}
.book{font-size:calc(19px*var(--fz));font-weight:700;color:var(--accent)}
.book .hz{font-size:.85em;color:var(--sub);font-weight:400;margin-left:4px}
.no{font-size:13px;color:var(--sub);white-space:nowrap}
.chap{font-size:calc(15px*var(--fz));color:var(--sub);margin:-4px 0 8px}
.orig{font-size:calc(24px*var(--fz));line-height:1.7;letter-spacing:1px;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.en{font-family:Georgia,"Times New Roman",serif;font-size:calc(20px*var(--fz));line-height:1.55;font-style:italic;color:#3b2f24}
.eum{font-size:calc(17px*var(--fz));color:#6b5a46;margin:8px 0 6px;white-space:pre-line;word-break:keep-all}
.pul{font-size:calc(18px*var(--fz));line-height:1.75;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);word-break:keep-all}
.lab{display:inline-block;font-size:12px;color:#fff;background:#b8946a;border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:2px;font-style:normal;font-family:sans-serif}
.card{border-left-width:8px}
.mx{background:#fff7ef;border-color:#e2c3a6;border-left-color:#a0522d}.mx .book{color:#a0522d}.mx .lab{background:#b9774f}
.cg{background:#f3f8ef;border-color:#c6dbbb;border-left-color:#4f7d3a}.cg .book{color:#3f6b2c}.cg .lab{background:#6d955a}
.zg{background:#f1f5fb;border-color:#c3d2e6;border-left-color:#3f5f8f}.zg .book{color:#34507c}.zg .lab{background:#6580ab}
.we{background:#f7f2fa;border-color:#d8c8e3;border-left-color:#7a4f96}.we .book{color:#6a3f86}.we .lab{background:#9171a8}
.memo{background:#fff4e0;border:2px solid #d9a05b}
.memo .book{color:var(--seal)}
.memo .item{margin:10px 0 14px}
.memo .src{font-size:calc(14px*var(--fz));color:var(--sub)}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.foot{font-size:13px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.5}
.hidden{display:none}
.replay{font-size:13px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<header>
  <h1>오늘의 한마디<small>一日一言</small></h1>
  <div class="date" id="date"></div>
  <div class="nav">
    <button id="prev" aria-label="전날">◀ 전날</button>
    <button id="today" class="today">오늘</button>
    <button id="next" aria-label="다음날">다음날 ▶</button>
  </div>
</header>
<main>
  <div id="memoTop"></div>
  <div id="cards"></div>
  <div class="tools">
    <button id="smaller">글자 작게</button>
    <button id="bigger">글자 크게</button>
    <button id="memoBtn">쌤의 메모</button>
  </div>
  <div id="memoBottom" class="hidden"></div>
  <div class="foot" id="foot"></div>
</main>
<script>
const D={"start":"2026-11-05","mx":[{"o":"子曰：「為善者，天報之以福；為不善者，天報之以禍。」","e":"자왈: “위선자, 천보지이복; 위불선자, 천보지이화.”","p":"공자께서 말씀하셨다. “착한 일을 하는 사람에게는 하늘이 복으로 갚아 주고, 착하지 않은 일을 하는 사람에게는 하늘이 화로 갚는다.”","c":"계선편(繼善篇)","src":0},{"o":"《易》云：「積善之家必有餘慶，積不善之家必有餘殃。」","e":"역운: “적선지가필유여경, 적불선지가필유여앙.”","p":"『주역』에 이르기를, “착한 일을 쌓은 집안에는 반드시 남는 경사가 있고, 착하지 않은 일을 쌓은 집안에는 반드시 남는 재앙이 있다.”","c":"계선편(繼善篇)","src":3},{"o":"漢昭烈將終，敕後主曰：「勿以惡小而為之，勿以善小而不為。」","e":"한소열장종, 칙후주왈: “물이악소이위지, 물이선소이불위.”","p":"한나라 소열제(유비)가 세상을 떠나며 후주(유선)에게 당부하였다. “악한 일은 작다고 해서 하지 말고, 착한 일은 작다고 해서 안 하지 말라.”","c":"계선편(繼善篇)","src":4},{"o":"莊子曰：「一日不念善，諸惡自皆起。」","e":"장자왈: “일일불념선, 제악자개기.”","p":"장자가 말하였다. “하루라도 착한 일을 생각하지 않으면 온갖 나쁜 마음이 저절로 일어난다.”","c":"계선편(繼善篇)","src":5},{"o":"《晉國語》云：「從善如登，從惡如崩。」","e":"진국어운: “종선여등, 종악여붕.”","p":"『진국어』에 이르기를, “착한 길을 따르기는 산을 오르듯 어렵고, 악한 길을 따르기는 무너지듯 쉽다.”","c":"계선편(繼善篇)","src":8},{"o":"太公曰：「善事須貪，惡事莫樂。」","e":"태공왈: “선사수탐, 악사막락.”","p":"태공이 말하였다. “착한 일은 욕심내어 하고, 나쁜 일은 즐기지 말라.”","c":"계선편(繼善篇)","src":9},{"o":"太公曰：「見善如渴，聞惡如聾。為善最樂，道理最大。」","e":"태공왈: “견선여갈, 문악여롱. 위선최락, 도리최대.”","p":"태공이 말하였다. “착한 것을 보면 목마른 듯이 반기고, 나쁜 말은 귀먹은 듯이 흘려들어라. 착한 일을 하는 것이 가장 큰 즐거움이요, 도리가 가장 크다.”","c":"계선편(繼善篇)","src":11},{"o":"馬援曰：「終身為善，善猶不足；一日行惡，惡自有餘。」","e":"마원왈: “종신위선, 선유부족; 일일행악, 악자유여.”","p":"마원이 말하였다. “평생 착한 일을 해도 오히려 모자라고, 단 하루 나쁜 일을 해도 그 악은 넘치고 남는다.”","c":"계선편(繼善篇)","src":12},{"o":"《易》曰：「出其言善，則千里應之；出言不善，則千里違之。」","e":"역왈: “출기언선, 즉천리응지; 출언불선, 즉천리위지.”","p":"『주역』에 이르기를, “착한 말을 하면 천 리 밖에서도 호응하고, 착하지 않은 말을 하면 천 리 밖에서도 등을 돌린다.”","c":"계선편(繼善篇)","src":14},{"o":"恩義廣施，人生何處不相逢？仇冤莫結，路逢險處難迴避。","e":"은의광시, 인생하처불상봉? 구원막결, 노봉험처난회피.","p":"은혜와 의리를 널리 베풀어라. 사람이 살다 보면 어디선들 다시 만나지 않겠는가? 원수를 맺지 말라. 좁고 험한 길에서 만나면 피하기 어렵다.","c":"계선편(繼善篇)","src":19},{"o":"與人方便，自己方便。","e":"여인방편, 자기방편.","p":"남을 편하게 해 주면 결국 나도 편해진다.","c":"계선편(繼善篇)","src":28},{"o":"先儒曰：「一日或聞一善言，行一善事，此日方不虛生。」","e":"선유왈: “일일혹문일선언, 행일선사, 차일방불허생.”","p":"옛 선비가 말하였다. “하루에 착한 말 한마디를 듣거나 착한 일 하나를 하면, 그날은 비로소 헛되이 산 날이 아니다.”","c":"계선편(繼善篇)","src":39},{"o":"孟子曰：「順天者存，逆天者亡。」","e":"맹자왈: “순천자존, 역천자망.”","p":"맹자가 말하였다. “하늘의 뜻을 따르는 자는 살아남고, 하늘을 거스르는 자는 망한다.”","c":"천리편(天理篇)","src":44},{"o":"諸葛武侯曰：「謀事在人，成事在天。」","e":"제갈무후왈: “모사재인, 성사재천.”","p":"제갈공명이 말하였다. “일을 꾀하는 것은 사람에게 달렸고, 일을 이루는 것은 하늘에 달렸다.”","c":"천리편(天理篇)","src":46},{"o":"康節邵先生曰：「天聽寂無音，蒼蒼何處尋？非高亦非遠，都只在人心。」","e":"강절소선생왈: “천청적무음, 창창하처심? 비고역비원, 도지재인심.”","p":"소강절 선생이 말하였다. “하늘은 소리 없이 듣고 있으니, 저 푸른 하늘을 어디서 찾겠는가? 높은 데도 먼 데도 있지 않고, 모두 사람의 마음속에 있다.”","c":"천리편(天理篇)","src":48},{"o":"人心生一念，天地悉皆知。善惡若無報，乾坤必有私。","e":"인심생일념, 천지실개지. 선악약무보, 건곤필유사.","p":"사람이 마음속에 한 생각을 일으키면 하늘과 땅이 다 안다. 선과 악에 갚음이 없다면 하늘과 땅이 사사로운 것이리라.","c":"천리편(天理篇)","src":49},{"o":"人可欺，天不可欺。人可瞞，天不可瞞。","e":"인가기, 천불가기. 인가만, 천불가만.","p":"사람은 속일 수 있어도 하늘은 속일 수 없다. 사람은 감출 수 있어도 하늘은 감출 수 없다.","c":"천리편(天理篇)","src":52},{"o":"湛湛青天不可欺，未曾舉意我先知。勸君莫作虧心事，古往今來放過誰？","e":"담담청천불가기, 미증거의아선지. 권군막작휴심사, 고왕금래방과수?","p":"맑고 푸른 하늘은 속일 수 없으니, 뜻을 내기도 전에 하늘이 먼저 안다. 그대에게 권하노니 양심에 어긋난 일을 하지 말라. 예부터 지금까지 하늘이 그냥 넘어간 사람이 누가 있던가?","c":"천리편(天理篇)","src":54},{"o":"人善人欺天不欺，人惡人怕天不怕。","e":"인선인기천불기, 인악인파천불파.","p":"사람이 착하면 남은 업신여겨도 하늘은 업신여기지 않고, 사람이 악하면 남은 두려워해도 하늘은 두려워하지 않는다.","c":"천리편(天理篇)","src":55},{"o":"子夏曰：「死生有命，富貴在天。」","e":"자하왈: “사생유명, 부귀재천.”","p":"자하가 말하였다. “죽고 사는 것은 운명에 달렸고, 부귀는 하늘에 달렸다.”","c":"순명편(順命篇)","src":65},{"o":"一飲一啄，事皆前定。","e":"일음일탁, 사개전정.","p":"한 번 마시고 한 번 쪼아 먹는 것까지도 모두 미리 정해져 있다.","c":"순명편(順命篇)","src":67},{"o":"萬事分已定，浮生空自忙。","e":"만사분이정, 부생공자망.","p":"모든 일은 분수가 이미 정해져 있는데, 덧없는 인생이 공연히 스스로 바쁘다.","c":"순명편(順命篇)","src":68},{"o":"會不如命，智不如福。","e":"회불여명, 지불여복.","p":"재주가 있어도 운명만 못하고, 지혜가 있어도 복만 못하다.","c":"순명편(順命篇)","src":71},{"o":"子曰：「知命之人，見利不動，臨死不怨。」","e":"자왈: “지명지인, 견리부동, 임사불원.”","p":"공자께서 말씀하셨다. “운명을 아는 사람은 이익을 보아도 흔들리지 않고, 죽음 앞에서도 원망하지 않는다.”","c":"순명편(順命篇)","src":75},{"o":"命裡有終須有，命裡無莫強求。","e":"명리유종수유, 명리무막강구.","p":"팔자에 있는 것은 끝내 오게 마련이고, 팔자에 없는 것은 억지로 구하지 말라.","c":"순명편(順命篇)","src":80},{"o":"《詩》云：「父兮生我，母兮鞠我。哀哀父母，生我劬勞。欲報深恩，昊天罔極。」","e":"시운: “부혜생아, 모혜국아. 애애부모, 생아구로. 욕보심은, 호천망극.”","p":"『시경』에 이르기를, “아버지 나를 낳으시고 어머니 나를 기르셨네. 애달프다 부모님, 나를 낳아 기르시느라 고생하셨네. 그 깊은 은혜 갚으려 하나 하늘처럼 끝이 없구나.”","c":"효행편(孝行篇)","src":82},{"o":"父母在，不遠遊，遊必有方。","e":"부모재, 불원유, 유필유방.","p":"부모가 살아 계시면 멀리 나가 놀지 말고, 나가더라도 반드시 가는 곳을 알려 드려라.","c":"효행편(孝行篇)","src":88},{"o":"父母之年不可不知也。一則以喜，一則以懼。","e":"부모지년불가부지야. 일즉이희, 일즉이구.","p":"부모의 나이는 꼭 알고 있어야 한다. 한편으로는 오래 사셔서 기쁘고, 한편으로는 늙어 가셔서 두렵기 때문이다.","c":"효행편(孝行篇)","src":89},{"o":"太公曰：「孝於親，子亦孝之。身既不孝，子何孝焉？」","e":"태공왈: “효어친, 자역효지. 신기불효, 자하효언?”","p":"태공이 말하였다. “내가 부모에게 효도하면 내 자식도 나에게 효도한다. 내가 효도하지 않으면서 자식이 어찌 효도하겠는가?”","c":"효행편(孝行篇)","src":92},{"o":"孝順還生孝順子，忤逆還生忤逆兒。不信但看簷頭水，點點滴滴不差移。","e":"효순환생효순자, 오역환생오역아. 불신단간첨두수, 점점적적불차이.","p":"효도하는 사람은 효도하는 자식을 낳고, 불효하는 사람은 불효하는 자식을 낳는다. 못 믿겠거든 처마 끝 낙숫물을 보라. 똑똑 떨어지는 물방울이 한 치도 어긋나지 않고 같은 자리에 떨어진다.","c":"효행편(孝行篇)","src":93},{"o":"養子方知父母恩，立身方知人辛苦。","e":"양자방지부모은, 입신방지인신고.","p":"자식을 길러 봐야 부모의 은혜를 알고, 스스로 세상에 서 봐야 남의 고생을 안다.","c":"효행편(孝行篇)","src":95},{"o":"《性理書》云：「見人之善而尋己之善，見人之惡而尋己之惡，如此方是有益。」","e":"성리서운: “견인지선이심기지선, 견인지악이심기지악, 여차방시유익.”","p":"『성리서』에 이르기를, “남의 좋은 점을 보면 내게도 그런 점이 있는지 찾아보고, 남의 나쁜 점을 보면 내게도 그런 점이 있는지 찾아보라. 이렇게 해야 비로소 도움이 된다.”","c":"정기편(正己篇)","src":114},{"o":"魯共公曰：「以德勝人則強，以財勝人則兇，以力勝人則亡。」","e":"노공공왈: “이덕승인즉강, 이재승인즉흉, 이력승인즉망.”","p":"노공공이 말하였다. “덕으로 남을 이기면 강해지고, 재물로 남을 이기면 흉해지고, 힘으로 남을 이기면 망한다.”","c":"정기편(正己篇)","src":122},{"o":"孟子曰：「以力服人者，非心服也。以德服人者，中心悅而誠服也。」","e":"맹자왈: “이력복인자, 비심복야. 이덕복인자, 중심열이성복야.”","p":"맹자가 말하였다. “힘으로 남을 복종시키면 마음으로 따르는 것이 아니다. 덕으로 복종시키면 속마음으로 기뻐하며 진심으로 따른다.”","c":"정기편(正己篇)","src":124},{"o":"太公曰：「見人善事，即須記之。見人惡事，即須掩之。」","e":"태공왈: “견인선사, 즉수기지. 견인악사, 즉수엄지.”","p":"태공이 말하였다. “남의 좋은 일을 보거든 곧 기억해 두고, 남의 나쁜 일을 보거든 곧 덮어 주어라.”","c":"정기편(正己篇)","src":125},{"o":"馬援曰：「聞人過失，如聞父母之名，耳可得聞口不可得言也。」","e":"마원왈: “문인과실, 여문부모지명, 이가득문구불가득언야.”","p":"마원이 말하였다. “남의 허물을 듣거든 부모의 이름을 듣듯이 하라. 귀로 들을 수는 있어도 입으로 말해서는 안 된다.”","c":"정기편(正己篇)","src":127},{"o":"《近思錄》云：「遷善當如風之速，改過當如雷之烈。」","e":"근사록운: “천선당여풍지속, 개과당여뢰지열.”","p":"『근사록』에 이르기를, “착한 쪽으로 옮겨 가기는 바람처럼 빨리 하고, 허물을 고치기는 우레처럼 단호하게 하라.”","c":"정기편(正己篇)","src":131},{"o":"子貢曰：「君子之過也，如日月之食焉。過也，人皆見之。更也，人皆仰之。」","e":"자공왈: “군자지과야, 여일월지식언. 과야, 인개견지. 경야, 인개앙지.”","p":"자공이 말하였다. “군자의 허물은 일식이나 월식과 같다. 허물이 있으면 사람들이 모두 보고, 고치면 사람들이 모두 우러러본다.”","c":"정기편(正己篇)","src":132},{"o":"知過必改，得能莫忘。","e":"지과필개, 득능막망.","p":"허물을 알면 반드시 고치고, 할 줄 알게 된 것은 잊지 말라.","c":"정기편(正己篇)","src":133},{"o":"道吾惡者是吾師，道吾好是吾賊。","e":"도오악자시오사, 도오호시오적.","p":"나의 잘못을 말해 주는 사람은 나의 스승이요, 나의 좋은 점만 말하는 사람은 나를 해치는 사람이다.","c":"정기편(正己篇)","src":136},{"o":"子曰：「三人行，必有我師焉。擇其善者而從之，其不善者而改之。」","e":"자왈: “삼인행, 필유아사언. 택기선자이종지, 기불선자이개지.”","p":"공자께서 말씀하셨다. “세 사람이 길을 가면 그 가운데 반드시 나의 스승이 있다. 좋은 점은 골라서 따르고, 좋지 않은 점은 보고 나를 고친다.”","c":"정기편(正己篇)","src":137},{"o":"太公曰：「勤為無價之寶，慎是護身之符。」","e":"태공왈: “근위무가지보, 신시호신지부.”","p":"태공이 말하였다. “부지런함은 값을 매길 수 없는 보배요, 삼가는 것은 몸을 지키는 부적이다.”","c":"정기편(正己篇)","src":140},{"o":"子曰：「君子食無求飽，居無求安。」","e":"자왈: “군자식무구포, 거무구안.”","p":"공자께서 말씀하셨다. “군자는 먹을 때 배부르기를 바라지 않고, 살 곳에 편안하기를 바라지 않는다.”","c":"정기편(正己篇)","src":151},{"o":"子曰：「君子欲訥於言，而敏於行。」","e":"자왈: “군자욕눌어언, 이민어행.”","p":"공자께서 말씀하셨다. “군자는 말은 더디게 하고, 행동은 재빠르게 하고자 한다.”","c":"정기편(正己篇)","src":172},{"o":"酒中不語真君子，財上分明大丈夫。","e":"주중불어진군자, 재상분명대장부.","p":"술자리에서 말을 아끼는 이가 참된 군자요, 돈 문제에 분명한 이가 대장부다.","c":"정기편(正己篇)","src":186},{"o":"《大學》云：「富潤屋，德潤身。」","e":"대학운: “부윤옥, 덕윤신.”","p":"『대학』에 이르기를, “부유함은 집을 윤택하게 하고, 덕은 몸을 윤택하게 한다.”","c":"정기편(正己篇)","src":187},{"o":"寧可正而不足，不可邪而有餘。","e":"영가정이부족, 불가사이유여.","p":"차라리 바르게 살다가 모자랄지언정, 그릇되게 살아서 남아돌아서는 안 된다.","c":"정기편(正己篇)","src":188},{"o":"子曰：「良藥苦口利於病，忠言逆耳利於行。」","e":"자왈: “양약고구리어병, 충언역이리어행.”","p":"공자께서 말씀하셨다. “좋은 약은 입에 쓰지만 병에 이롭고, 바른 말은 귀에 거슬리지만 행실에 이롭다.”","c":"정기편(正己篇)","src":191},{"o":"作福不如避罪，避禍不如省非。","e":"작복불여피죄, 피화불여성비.","p":"복을 지으려 애쓰기보다 죄를 피하는 것이 낫고, 화를 피하려 애쓰기보다 잘못을 살피는 것이 낫다.","c":"정기편(正己篇)","src":192},{"o":"凡戲無益，惟勤有功。","e":"범희무익, 유근유공.","p":"무릇 놀이는 이로움이 없고, 오직 부지런함만이 공이 있다.","c":"정기편(正己篇)","src":203},{"o":"人非賢莫交，物非義莫取，忿非善莫舉，事非是莫說。謹則無憂，忍則無辱，靜則常安，儉則常足。","e":"인비현막교, 물비의막취, 분비선막거, 사비시막설. 근즉무우, 인즉무욕, 정즉상안, 검즉상족.","p":"어질지 않은 사람은 사귀지 말고, 옳지 않은 물건은 갖지 말고, 착하지 않은 분노는 드러내지 말고, 옳지 않은 일은 입에 올리지 말라. 삼가면 근심이 없고, 참으면 욕됨이 없고, 고요하면 늘 편안하고, 검소하면 늘 넉넉하다.","c":"정기편(正己篇)","src":208},{"o":"耳不聞人之非，目不視人之短，口不言人之過，庶幾君子。","e":"이불문인지비, 목불시인지단, 구불언인지과, 서기군자.","p":"귀로는 남의 잘못을 듣지 않고, 눈으로는 남의 단점을 보지 않고, 입으로는 남의 허물을 말하지 않으면 군자에 가깝다.","c":"정기편(正己篇)","src":213},{"o":"子曰：「君子泰而不驕，小人驕而不泰。」","e":"자왈: “군자태이불교, 소인교이불태.”","p":"공자께서 말씀하셨다. “군자는 느긋하되 교만하지 않고, 소인은 교만하되 느긋하지 못하다.”","c":"정기편(正己篇)","src":220},{"o":"責人之非，不如行己之是。揚己之是，不如克己之非。","e":"책인지비, 불여행기지시. 양기지시, 불여극기지비.","p":"남의 잘못을 꾸짖는 것은 내가 옳은 일을 행하는 것만 못하다. 나의 옳음을 자랑하는 것은 나의 잘못을 이겨 내는 것만 못하다.","c":"정기편(正己篇)","src":233},{"o":"《景行錄》云：「知足可樂，多貪則憂。」","e":"경행록운: “지족가락, 다탐즉우.”","p":"『경행록』에 이르기를, “만족할 줄 알면 즐겁고, 욕심이 많으면 근심스럽다.”","c":"안분편(安分篇)","src":234},{"o":"知足者貧賤亦樂，不知足者富貴亦憂。","e":"지족자빈천역락, 부지족자부귀역우.","p":"만족할 줄 아는 사람은 가난해도 즐겁고, 만족할 줄 모르는 사람은 부귀해도 근심한다.","c":"안분편(安分篇)","src":235},{"o":"知足常足，終身不辱。知止常止，終身不恥。","e":"지족상족, 종신불욕. 지지상지, 종신불치.","p":"만족할 줄 알아 늘 넉넉하면 평생 욕되지 않고, 멈출 줄 알아 늘 그치면 평생 부끄럽지 않다.","c":"안분편(安分篇)","src":236},{"o":"《擊壤詩》云：「安分身無辱，知機心自閒。雖居人世上，卻是出人間。」","e":"격양시운: “안분신무욕, 지기심자한. 수거인세상, 각시출인간.”","p":"『격양시』에 이르기를, “분수를 지키면 몸에 욕됨이 없고, 때를 알면 마음이 절로 한가롭다. 비록 인간 세상에 살고 있으나 도리어 세상 밖에 사는 것과 같다.”","c":"안분편(安分篇)","src":239},{"o":"不義而富且貴，於我如浮雲。","e":"불의이부차귀, 어아여부운.","p":"의롭지 않게 얻은 부와 귀는 나에게 뜬구름과 같다.","c":"안분편(安分篇)","src":242},{"o":"先儒曰：「休怨我不如人，不如我者尚眾。休誇我能勝人，勝如我者更多。」","e":"선유왈: “휴원아불여인, 불여아자상중. 휴과아능승인, 승여아자갱다.”","p":"옛 선비가 말하였다. “내가 남만 못하다고 원망하지 말라. 나만 못한 사람이 아직 많다. 내가 남보다 낫다고 자랑하지 말라. 나보다 나은 사람이 더 많다.”","c":"안분편(安分篇)","src":253},{"o":"過度求福適以速禍，安分遠禍將自得福。","e":"과도구복적이속화, 안분원화장자득복.","p":"지나치게 복을 구하면 오히려 화를 재촉하고, 분수를 지켜 화를 멀리하면 저절로 복을 얻는다.","c":"안분편(安分篇)","src":255},{"o":"《書》曰：「滿招損，謙受益。」","e":"서왈: “만초손, 겸수익.”","p":"『서경』에 이르기를, “가득 차면 덜어짐을 부르고, 겸손하면 보탬을 받는다.”","c":"안분편(安分篇)","src":260},{"o":"將心比心，便是佛心。","e":"장심비심, 변시불심.","p":"내 마음에 비추어 남의 마음을 헤아리면, 그것이 곧 부처의 마음이다.","c":"존심편(存心篇)","src":269},{"o":"以己之心，度人之心。","e":"이기지심, 탁인지심.","p":"내 마음으로 남의 마음을 헤아려라.","c":"존심편(存心篇)","src":270},{"o":"得意處，早回頭。","e":"득의처, 조회두.","p":"뜻대로 잘될 때 일찌감치 돌아보라.","c":"존심편(存心篇)","src":277},{"o":"常將有日思無日，莫待無時思有時。","e":"상장유일사무일, 막대무시사유시.","p":"넉넉한 날에도 없을 때를 생각하고, 없게 된 뒤에야 있던 때를 그리워하지 말라.","c":"존심편(存心篇)","src":288},{"o":"有錢常記無錢日，安樂常思病患時。","e":"유전상기무전일, 안락상사병환시.","p":"돈이 있을 때 늘 돈 없던 날을 기억하고, 편안할 때 늘 병들었을 때를 생각하라.","c":"존심편(存心篇)","src":289},{"o":"施恩勿求報，與人勿追悔。","e":"시은물구보, 여인물추회.","p":"은혜를 베풀었으면 갚기를 바라지 말고, 남에게 주었으면 뒤에 후회하지 말라.","c":"존심편(存心篇)","src":292},{"o":"寸心不昧，萬法皆明。","e":"촌심불매, 만법개명.","p":"한 치 마음이 어둡지 않으면 모든 이치가 다 밝아진다.","c":"존심편(存心篇)","src":293},{"o":"念念有如臨敵日，心心常似過橋時。","e":"염념유여림적일, 심심상사과교시.","p":"생각마다 적과 마주한 날처럼 조심하고, 마음마다 늘 외나무다리를 건널 때처럼 삼가라.","c":"존심편(存心篇)","src":295},{"o":"是非只為多開口，煩惱皆因強出頭。","e":"시비지위다개구, 번뇌개인강출두.","p":"시비는 모두 입을 많이 열어서 생기고, 번뇌는 모두 억지로 나서서 생긴다.","c":"존심편(存心篇)","src":301},{"o":"君子愛財，取之有道。","e":"군자애재, 취지유도.","p":"군자도 재물을 좋아하지만, 그것을 얻는 데는 바른 길이 있다.","c":"존심편(存心篇)","src":304},{"o":"子曰：「君子坦蕩蕩，小人常戚戚。」","e":"자왈: “군자탄탕탕, 소인상척척.”","p":"공자께서 말씀하셨다. “군자는 마음이 평탄하고 넓으며, 소인은 늘 근심하고 초조하다.”","c":"존심편(存心篇)","src":306},{"o":"各人自掃門前雪，莫管他人屋上霜。","e":"각인자소문전설, 막관타인옥상상.","p":"각자 제 집 문 앞의 눈이나 쓸고, 남의 집 지붕 위 서리까지 간섭하지 말라.","c":"존심편(存心篇)","src":309},{"o":"早知今日，悔不當初。","e":"조지금일, 회부당초.","p":"오늘 이렇게 될 줄 일찍 알았더라면, 처음에 그러지 말 것을 하고 후회한다.","c":"존심편(存心篇)","src":310},{"o":"心不負人，面無慚色。","e":"심불부인, 면무참색.","p":"마음이 남을 저버리지 않으면 얼굴에 부끄러운 빛이 없다.","c":"존심편(存心篇)","src":311},{"o":"兒孫自有兒孫福，莫與兒孫作馬牛。","e":"아손자유아손복, 막여아손작마우.","p":"자손은 저마다 제 복을 타고나니, 자손을 위해 말이나 소처럼 고생만 하지 말라.","c":"존심편(存心篇)","src":317},{"o":"世上無難事，都來心不專。","e":"세상무난사, 도래심부전.","p":"세상에 어려운 일은 없다. 모두 마음을 한곳에 모으지 않아서 어려울 뿐이다.","c":"존심편(存心篇)","src":318},{"o":"子曰：「無欲速，無見小利。欲速則不達，見小利則大事不成。」","e":"자왈: “무욕속, 무견소리. 욕속즉부달, 견소리즉대사불성.”","p":"공자께서 말씀하셨다. “빨리 하려고 서두르지 말고, 작은 이익을 보지 말라. 서두르면 이르지 못하고, 작은 이익을 보면 큰일을 이루지 못한다.”","c":"존심편(存心篇)","src":329},{"o":"《景行錄》云：「人性如水。水一傾則不可復，性一縱則不可反。制水者必以堤防，制性者必以禮法。」","e":"경행록운: “인성여수. 수일경즉불가복, 성일종즉불가반. 제수자필이제방, 제성자필이례법.”","p":"『경행록』에 이르기를, “사람의 성품은 물과 같다. 물은 한번 쏟으면 되담을 수 없고, 성품은 한번 풀어 놓으면 되돌리기 어렵다. 물을 다스리려면 둑을 쌓아야 하고, 성품을 다스리려면 예법을 지켜야 한다.”","c":"계성편(戒性篇)","src":348},{"o":"忍一時之氣，免百日之憂。","e":"인일시지기, 면백일지우.","p":"한때의 분을 참으면 백 날의 근심을 면한다.","c":"계성편(戒性篇)","src":349},{"o":"得忍且忍，得戒且戒。不忍不戒，小事成大。","e":"득인차인, 득계차계. 불인불계, 소사성대.","p":"참을 수 있으면 우선 참고, 삼갈 수 있으면 우선 삼가라. 참지 않고 삼가지 않으면 작은 일이 큰일이 된다.","c":"계성편(戒性篇)","src":350},{"o":"《景行錄》云：「屈己者能處眾，好勝者必遇敵。」","e":"경행록운: “굴기자능처중, 호승자필우적.”","p":"『경행록』에 이르기를, “자기를 굽힐 줄 아는 사람은 여러 사람과 잘 어울리고, 이기기를 좋아하는 사람은 반드시 적을 만난다.”","c":"계성편(戒性篇)","src":356},{"o":"凡事留人情，後來好相見。","e":"범사류인정, 후래호상견.","p":"모든 일에 인정을 남겨 두면 뒷날 좋은 얼굴로 다시 만난다.","c":"계성편(戒性篇)","src":360},{"o":"先儒曰：「為人所不能為，方稱奇男子。忍人所不能忍，乃是大丈夫。」","e":"선유왈: “위인소불능위, 방칭기남자. 인인소불능인, 내시대장부.”","p":"옛 선비가 말하였다. “남이 하지 못하는 일을 해내야 비로소 뛰어난 남자라 하고, 남이 참지 못하는 것을 참아 내야 비로소 대장부라 한다.”","c":"계성편(戒性篇)","src":362},{"o":"子曰：「敏而好學，不恥下問。」","e":"자왈: “민이호학, 불치하문.”","p":"공자께서 말씀하셨다. “영민하면서도 배우기를 좋아하고, 아랫사람에게 묻는 것을 부끄러워하지 않는다.”","c":"권학편(勸學篇)","src":366},{"o":"《禮記》曰：「玉不琢不成器，人不學不知道。」","e":"예기왈: “옥불탁불성기, 인불학부지도.”","p":"『예기』에 이르기를, “옥도 다듬지 않으면 그릇이 되지 못하고, 사람도 배우지 않으면 도리를 알지 못한다.”","c":"권학편(勸學篇)","src":370},{"o":"太公曰：「人生不學，冥冥如夜行。」","e":"태공왈: “인생불학, 명명여야행.”","p":"태공이 말하였다. “사람이 살면서 배우지 않으면 캄캄한 밤길을 걷는 것과 같다.”","c":"권학편(勸學篇)","src":371},{"o":"《禮記》曰：「獨學無友，則孤陋寡聞。」","e":"예기왈: “독학무우, 즉고루과문.”","p":"『예기』에 이르기를, “벗 없이 혼자 배우면 견문이 좁고 들은 것이 적어진다.”","c":"권학편(勸學篇)","src":379},{"o":"學到老，不會到老。","e":"학도로, 불회도로.","p":"늙도록 배워도 늙도록 다 알지 못한다.","c":"권학편(勸學篇)","src":382},{"o":"少年易老學難成，一寸光陰不可輕。未覺池塘春草夢，階前梧葉已秋聲。","e":"소년이로학난성, 일촌광음불가경. 미각지당춘초몽, 계전오엽이추성.","p":"소년은 늙기 쉽고 학문은 이루기 어려우니, 짧은 시간도 가벼이 여기지 말라. 연못가 봄풀의 꿈이 깨기도 전에, 섬돌 앞 오동잎은 벌써 가을 소리를 낸다.","c":"권학편(勸學篇)","src":391},{"o":"陶淵明詩云：「盛年不重來，一日難再晨。及時當勉勵，歲月不待人。」","e":"도연명시운: “성년부중래, 일일난재신. 급시당면려, 세월부대인.”","p":"도연명의 시에 이르기를, “젊은 시절은 두 번 오지 않고, 하루에 새벽은 두 번 오지 않는다. 때를 놓치지 말고 힘써라. 세월은 사람을 기다려 주지 않는다.”","c":"권학편(勸學篇)","src":392},{"o":"荀子曰：「不積跬步，無以至千里。不積小流，無以成江河。」","e":"순자왈: “부적규보, 무이지천리. 부적소류, 무이성강하.”","p":"순자가 말하였다. “반걸음이라도 쌓지 않으면 천 리에 이를 수 없고, 작은 물줄기가 모이지 않으면 강과 바다를 이룰 수 없다.”","c":"권학편(勸學篇)","src":393},{"o":"《景行錄》云：「賓客不來門戶俗，詩書不教子孫愚。」","e":"경행록운: “빈객불래문호속, 시서불교자손우.”","p":"『경행록』에 이르기를, “손님이 찾아오지 않으면 집안이 속되어지고, 시와 글을 가르치지 않으면 자손이 어리석어진다.”","c":"훈자편(訓子篇)","src":397},{"o":"莊子曰：「事雖小，不作不成；子雖賢，不教不明。」","e":"장자왈: “사수소, 부작불성; 자수현, 불교불명.”","p":"장자가 말하였다. “일이 작더라도 하지 않으면 이루지 못하고, 자식이 똑똑하더라도 가르치지 않으면 밝아지지 않는다.”","c":"훈자편(訓子篇)","src":398},{"o":"《漢書》曰：「黃金滿盈，不如教子一經；賜子千金，不如教子一藝。」","e":"한서왈: “황금만영, 불여교자일경; 사자천금, 불여교자일예.”","p":"『한서』에 이르기를, “황금이 상자에 가득해도 자식에게 경서 한 권 가르치는 것만 못하고, 자식에게 천금을 주어도 기술 하나 가르치는 것만 못하다.”","c":"훈자편(訓子篇)","src":399},{"o":"至樂莫如讀書，至要莫如教子。","e":"지락막여독서, 지요막여교자.","p":"가장 큰 즐거움은 책 읽는 것만 한 것이 없고, 가장 중요한 일은 자식 가르치는 것만 한 것이 없다.","c":"훈자편(訓子篇)","src":400},{"o":"嚴父出孝子，嚴母出巧女。","e":"엄부출효자, 엄모출교녀.","p":"엄한 아버지가 효자를 길러 내고, 엄한 어머니가 솜씨 좋은 딸을 길러 낸다.","c":"훈자편(訓子篇)","src":405},{"o":"人皆愛珠玉，我愛子孫賢。","e":"인개애주옥, 아애자손현.","p":"사람들은 모두 구슬과 옥을 아끼지만, 나는 자손이 어진 것을 아낀다.","c":"훈자편(訓子篇)","src":409},{"o":"家和貧也好，不義富如何？但存一子孝，何用子孫多？","e":"가화빈야호, 불의부여하? 단존일자효, 하용자손다?","p":"집안이 화목하면 가난해도 좋지만, 의롭지 않으면 부자인들 무엇하리. 효도하는 자식 하나만 있으면 자손이 많은들 무엇하리.","c":"성심편(省心篇)","src":416},{"o":"得寵思辱，居安慮危。","e":"득총사욕, 거안려위.","p":"총애를 받을 때 욕됨을 생각하고, 편안할 때 위태로움을 염려하라.","c":"성심편(省心篇)","src":420},{"o":"欲知未來，先察已往。","e":"욕지미래, 선찰이왕.","p":"앞날을 알고 싶거든 먼저 지난 일을 살펴보라.","c":"성심편(省心篇)","src":428},{"o":"天有不測風雲，人有旦夕禍福。","e":"천유불측풍운, 인유단석화복.","p":"하늘에는 예측할 수 없는 바람과 구름이 있고, 사람에게는 아침저녁으로 바뀌는 화와 복이 있다.","c":"성심편(省心篇)","src":432},{"o":"疑人莫用，用人莫疑。","e":"의인막용, 용인막의.","p":"의심스러운 사람은 쓰지 말고, 쓴 사람은 의심하지 말라.","c":"성심편(省心篇)","src":442},{"o":"《家語》云：「安不可忘危，治不可忘亂。」","e":"가어운: “안불가망위, 치불가망란.”","p":"『공자가어』에 이르기를, “편안할 때 위태로움을 잊지 말고, 잘 다스려질 때 어지러움을 잊지 말라.”","c":"성심편(省心篇)","src":445},{"o":"畫虎畫皮難畫骨，知人知面不知心。","e":"화호화피난화골, 지인지면부지심.","p":"범을 그릴 때 가죽은 그려도 뼈는 그리기 어렵고, 사람을 알 때 얼굴은 알아도 마음은 알지 못한다.","c":"성심편(省心篇)","src":449},{"o":"太公曰：「凡人不可貌相，海水不可斗量。」","e":"태공왈: “범인불가모상, 해수불가두량.”","p":"태공이 말하였다. “사람은 겉모습으로 헤아릴 수 없고, 바닷물은 말로 될 수 없다.”","c":"성심편(省心篇)","src":452},{"o":"不經一事，不長一智。","e":"불경일사, 부장일지.","p":"한 가지 일을 겪지 않으면 한 가지 지혜가 자라지 않는다.","c":"성심편(省心篇)","src":473},{"o":"來說是非者，便是是非人。","e":"내설시비자, 변시시비인.","p":"남의 시비를 말하러 오는 사람이 바로 시비를 만드는 사람이다.","c":"성심편(省心篇)","src":475},{"o":"孟子曰：「得道者多助，失道者寡助。」","e":"맹자왈: “득도자다조, 실도자과조.”","p":"맹자가 말하였다. “도리를 얻은 사람은 돕는 이가 많고, 도리를 잃은 사람은 돕는 이가 적다.”","c":"성심편(省心篇)","src":482},{"o":"黃金千里未為貴，得人一語勝千金。","e":"황금천리미위귀, 득인일어승천금.","p":"황금 천 냥도 귀한 것이 아니다. 남에게서 좋은 말 한마디 듣는 것이 천금보다 낫다.","c":"성심편(省心篇)","src":489},{"o":"求人不如求己，能管不如能推。","e":"구인불여구기, 능관불여능추.","p":"남에게 구하는 것은 나에게 구하는 것만 못하고, 이것저것 맡아 하는 것은 사양할 줄 아는 것만 못하다.","c":"성심편(省心篇)","src":492},{"o":"知事少時煩惱少，識人多處是非多。","e":"지사소시번뇌소, 식인다처시비다.","p":"아는 일이 적을 때는 번뇌도 적고, 아는 사람이 많은 곳에는 시비도 많다.","c":"성심편(省心篇)","src":495},{"o":"大富由天，小富由勤。","e":"대부유천, 소부유근.","p":"큰 부자는 하늘이 내고, 작은 부자는 부지런함이 만든다.","c":"성심편(省心篇)","src":539},{"o":"《家語》云：「水至清則無魚，人至察則無徒。」","e":"가어운: “수지청즉무어, 인지찰즉무도.”","p":"『공자가어』에 이르기를, “물이 너무 맑으면 고기가 없고, 사람이 너무 따지면 따르는 무리가 없다.”","c":"성심편(省心篇)","src":564},{"o":"輕諾者信必寡，面譽者背必非。","e":"경낙자신필과, 면예자배필비.","p":"쉽게 승낙하는 사람은 믿음이 적고, 앞에서 칭찬하는 사람은 뒤에서 헐뜯는다.","c":"성심편(省心篇)","src":574},{"o":"《景行錄》云：「器滿則溢，人滿則喪。」","e":"경행록운: “기만즉일, 인만즉상.”","p":"『경행록』에 이르기를, “그릇이 차면 넘치고, 사람이 자만하면 잃는다.”","c":"성심편(省心篇)","src":630},{"o":"尺璧非寶，寸陰是競。","e":"척벽비보, 촌음시경.","p":"한 자 되는 구슬이 보배가 아니요, 한 치의 시간을 다투어 아껴야 한다.","c":"성심편(省心篇)","src":632},{"o":"孟子曰：「天時不如地利，地利不如人和。」","e":"맹자왈: “천시불여지리, 지리불여인화.”","p":"맹자가 말하였다. “하늘의 때는 땅의 이로움만 못하고, 땅의 이로움은 사람의 화합만 못하다.”","c":"성심편(省心篇)","src":638},{"o":"遠水難救近火，遠親不如近鄰。","e":"원수난구근화, 원친불여근린.","p":"먼 데 물로는 가까운 불을 끄기 어렵고, 먼 친척은 가까운 이웃만 못하다.","c":"성심편(省心篇)","src":639},{"o":"著意栽花花不發，無心插柳柳成陰。","e":"착의재화화불발, 무심삽류류성음.","p":"애써 꽃을 심어도 꽃은 피지 않고, 무심코 꽂은 버들가지는 그늘을 이룬다.","c":"성심편(省心篇)","src":651},{"o":"《性理書》云：「接物之要：己所不欲，勿施於人；行有不得，反求諸己。」","e":"성리서운: “접물지요: 기소불욕, 물시어인; 행유부득, 반구제기.”","p":"『성리서』에 이르기를, “사람을 대하는 요점은 이렇다. 내가 원하지 않는 일은 남에게 시키지 말고, 일이 뜻대로 되지 않으면 돌이켜 나에게서 원인을 찾아라.”","c":"성심편(省心篇)","src":657},{"o":"《景行錄》云：「為政之要，曰公與清。成家之要，曰儉與勤。」","e":"경행록운: “위정지요, 왈공여청. 성가지요, 왈검여근.”","p":"『경행록』에 이르기를, “나라를 다스리는 요점은 공정함과 청렴함이요, 집안을 일으키는 요점은 검소함과 부지런함이다.”","c":"입교편(立教篇)","src":661},{"o":"勤者富之本，儉者富之源。","e":"근자부지본, 검자부지원.","p":"부지런함은 부유함의 뿌리요, 검소함은 부유함의 샘이다.","c":"입교편(立教篇)","src":663},{"o":"《性理書》云：「五教之目：父子有親，君臣有義，夫婦有別，長幼有序，朋友有信。」","e":"성리서운: “오교지목: 부자유친, 군신유의, 부부유별, 장유유서, 붕우유신.”","p":"『성리서』에 이르기를, “다섯 가지 가르침은 이렇다. 부모와 자식은 친함이 있고, 임금과 신하는 의리가 있고, 남편과 아내는 분별이 있고, 어른과 아이는 차례가 있고, 벗과 벗은 믿음이 있다.”","c":"입교편(立教篇)","src":665},{"o":"《童蒙訓》曰：「當官之法，唯有三事：曰清，曰慎，曰勤。知此三者，則知所以持身矣。」","e":"동몽훈왈: “당관지법, 유유삼사: 왈청, 왈신, 왈근. 지차삼자, 즉지소이지신의.”","p":"『동몽훈』에 이르기를, “벼슬하는 법에는 오직 세 가지가 있으니, 청렴함과 삼감과 부지런함이다. 이 세 가지를 알면 몸가짐을 아는 것이다.”","c":"치정편(治政篇)","src":679},{"o":"其身正，不令而行。其身不正，雖令不從。","e":"기신정, 불령이행. 기신부정, 수령부종.","p":"자신이 바르면 시키지 않아도 행해지고, 자신이 바르지 않으면 시켜도 따르지 않는다.","c":"치정편(治政篇)","src":689},{"o":"勤儉常豐，至老不窮。","e":"근검상풍, 지로불궁.","p":"부지런하고 검소하면 늘 풍족하여 늙도록 궁하지 않다.","c":"치가편(治家篇)","src":703},{"o":"有錢常備無錢日，安樂須防病患時。","e":"유전상비무전일, 안락수방병환시.","p":"돈이 있을 때 늘 돈 없을 날을 대비하고, 편안할 때 반드시 병들 때를 대비하라.","c":"치가편(治家篇)","src":705},{"o":"子孝雙親樂，家和萬事成。","e":"자효쌍친락, 가화만사성.","p":"자식이 효도하면 두 어버이가 즐겁고, 집안이 화목하면 모든 일이 이루어진다.","c":"치가편(治家篇)","src":711},{"o":"莊子云：「兄弟為手足，夫婦為衣服。衣服破時更得新，手足斷時難再續。」","e":"장자운: “형제위수족, 부부위의복. 의복파시갱득신, 수족단시난재속.”","p":"장자가 말하였다. “형제는 손발과 같고, 아내는 옷과 같다. 옷은 해지면 새로 얻을 수 있지만, 손발은 끊어지면 다시 잇기 어렵다.”","c":"안의편(安義篇)","src":724},{"o":"蘇東坡云：「富不親兮貧不疏，此是人間大丈夫。富則進兮貧則退，此是人間真小輩。」","e":"소동파운: “부불친혜빈불소, 차시인간대장부. 부즉진혜빈즉퇴, 차시인간진소배.”","p":"소동파가 말하였다. “부자라고 가까이하지 않고 가난하다고 멀리하지 않는 이가 세상의 대장부요, 부자면 다가가고 가난하면 물러나는 이는 세상의 참 소인배다.”","c":"안의편(安義篇)","src":725},{"o":"有子曰：「禮之用，和為貴。」","e":"유자왈: “예지용, 화위귀.”","p":"유자가 말하였다. “예를 행할 때는 조화를 이루는 것이 가장 귀하다.”","c":"준례편(遵禮篇)","src":733},{"o":"若要人重我，無過我重人。","e":"약요인중아, 무과아중인.","p":"남이 나를 존중해 주기를 바란다면, 내가 먼저 남을 존중하는 것보다 나은 방법이 없다.","c":"준례편(遵禮篇)","src":742},{"o":"老子曰：「人之有信，如車有輪。」","e":"노자왈: “인지유신, 여거유륜.”","p":"노자가 말하였다. “사람에게 믿음이 있는 것은 수레에 바퀴가 있는 것과 같다.”","c":"존신편(存信篇)","src":755},{"o":"君子一言，快馬一鞭。一言既出，駟馬難追。","e":"군자일언, 쾌마일편. 일언기출, 사마난추.","p":"군자의 말 한마디는 빠른 말에 채찍 한 번과 같다. 한번 내뱉은 말은 네 필 말이 끄는 수레로도 따라잡지 못한다.","c":"존신편(存信篇)","src":756},{"o":"子路無宿諾。","e":"자로무숙낙.","p":"자로는 승낙한 일을 묵혀 두는 법이 없었다.","c":"존신편(存信篇)","src":757},{"o":"子曰：「夫人不言，言必有中。」","e":"자왈: “부인불언, 언필유중.”","p":"공자께서 말씀하셨다. “저 사람은 말을 잘 하지 않지만, 말을 하면 반드시 이치에 맞는다.”","c":"언어편(言語篇)","src":762},{"o":"君平曰：「口舌者，禍患之門，滅身之斧也。」","e":"군평왈: “구설자, 화환지문, 멸신지부야.”","p":"군평이 말하였다. “입과 혀는 화와 근심이 드나드는 문이요, 몸을 망치는 도끼다.”","c":"언어편(言語篇)","src":766},{"o":"荀子曰：「與人善言，暖如布帛。傷人之言，深如矛戟。」","e":"순자왈: “여인선언, 난여포백. 상인지언, 심여모극.”","p":"순자가 말하였다. “남에게 건네는 좋은 말은 솜옷처럼 따뜻하고, 남을 해치는 말은 창보다 깊이 찌른다.”","c":"언어편(言語篇)","src":768},{"o":"刀瘡易好，惡語難消。","e":"도창이호, 악어난소.","p":"칼에 베인 상처는 쉽게 낫지만, 모진 말로 입은 상처는 지워지지 않는다.","c":"언어편(言語篇)","src":770},{"o":"口是傷人斧，唇是割舌刀。閉口深藏舌，安身處處牢。","e":"구시상인부, 순시할설도. 폐구심장설, 안신처처뢰.","p":"입은 사람을 해치는 도끼요, 혀는 몸을 베는 칼이다. 입을 다물고 혀를 깊이 감추면 어디서든 몸이 편안하다.","c":"언어편(言語篇)","src":772},{"o":"《論語》云：「一言可以興邦，一言可以喪邦。」","e":"논어운: “일언가이흥방, 일언가이상방.”","p":"『논어』에 이르기를, “말 한마디로 나라를 일으킬 수도 있고, 말 한마디로 나라를 잃을 수도 있다.”","c":"언어편(言語篇)","src":774},{"o":"酒逢知己千鐘少，話不投機半句多。","e":"주봉지기천종소, 화불투기반구다.","p":"술은 마음 맞는 벗을 만나면 천 잔도 적고, 말은 뜻이 맞지 않으면 반 마디도 많다.","c":"언어편(言語篇)","src":778},{"o":"與好人交者，如蘭蕙之香，一家種之，兩家皆香。與惡人交者，如抱子上牆，一人失腳，兩人遭殃。","e":"여호인교자, 여란혜지향, 일가종지, 양가개향. 여악인교자, 여포자상장, 일인실각, 양인조앙.","p":"“착한 사람과 사귀는 것은 난초 향기와 같아서 한 집에서 심어도 두 집이 다 향기롭다. 악한 사람과 사귀는 것은 아이를 안고 담에 오르는 것과 같아서 한 사람이 발을 헛디디면 두 사람이 다 다친다.”","c":"교우편(交友篇)","src":789},{"o":"相識滿天下，知心能幾人？","e":"상식만천하, 지심능기인?","p":"얼굴 아는 사람은 세상에 가득하지만, 마음을 아는 사람은 몇이나 되겠는가?","c":"교우편(交友篇)","src":799},{"o":"古人結交惟結心，今人結交惟結面。","e":"고인결교유결심, 금인결교유결면.","p":"옛사람은 마음으로 사귀었는데, 요즘 사람은 얼굴로만 사귄다.","c":"교우편(交友篇)","src":801},{"o":"宋弘曰：「糟糠之妻不下堂，貧賤之交不可忘。」","e":"송홍왈: “조강지처불하당, 빈천지교불가망.”","p":"송홍이 말하였다. “가난할 때 함께 고생한 아내는 내쫓지 않고, 가난하고 천할 때 사귄 벗은 잊지 않는다.”","c":"교우편(交友篇)","src":802},{"o":"酒食弟兄千個有，急難之時一個無。","e":"주식제형천개유, 급난지시일개무.","p":"술 마시고 밥 먹을 때 형님 아우 하는 이는 천 명이나 되지만, 급하고 어려울 때는 한 명도 없다.","c":"교우편(交友篇)","src":804},{"o":"君子之交淡如水，小人之交甜似蜜。","e":"군자지교담여수, 소인지교첨사밀.","p":"군자의 사귐은 물처럼 담박하고, 소인의 사귐은 꿀처럼 달다.","c":"교우편(交友篇)","src":806},{"o":"路遙知馬力，事久見人心。","e":"노요지마력, 사구견인심.","p":"길이 멀어야 말의 힘을 알고, 일을 오래 겪어야 사람의 마음을 안다.","c":"교우편(交友篇)","src":809}],"cg":[{"o":"棲守道德者，寂寞一時；依附權勢者，淒涼萬古。故達人觀物外之物，思身後之身，寧受一時之寂寞，毋取萬古之淒涼。","e":"서수도덕자, 적막일시; 의부권세자, 처량만고. 고달인관물외지물, 사신후지신, 영수일시지적막, 무취만고지처량.","p":"도덕을 지키며 사는 사람은 한때 쓸쓸하지만, 권세에 빌붙는 사람은 만고에 처량하다. 그러므로 통달한 사람은 눈앞의 것 너머를 보고 죽은 뒤의 자신을 생각하여, 차라리 한때의 쓸쓸함을 받을지언정 만고의 처량함을 택하지 않는다.","c":"전집 제1장(前集 第1)","src":0},{"o":"涉世淺，點染亦淺；歷事深，機械亦深。故君子與其練達，不若樸魯；與其曲謹，不若疏狂。","e":"섭세천, 점염역천; 역사심, 기계역심. 고군자여기련달, 불약박로; 여기곡근, 불약소광.","p":"세상 경험이 얕으면 물드는 것도 얕고, 겪은 일이 깊으면 꾀도 깊어진다. 그러므로 군자는 약삭빠르기보다 차라리 소박하고 투박한 것이 낫고, 지나치게 조심스럽기보다 차라리 거리낌 없는 것이 낫다.","c":"전집 제2장(前集 第2)","src":1},{"o":"君子之心事，天青日白，不可使人不知。\n君子之才華，玉韞珠藏，不可使人易知。","e":"군자지심사, 천청일백, 불가사인부지.\n군자지재화, 옥온주장, 불가사인이지.","p":"군자의 마음은 푸른 하늘에 밝은 해처럼 남이 모르게 해서는 안 되고, 군자의 재주는 옥을 싸 두고 구슬을 감추듯 남이 쉽게 알게 해서는 안 된다.","c":"전집 제3장(前集 第3)","src":2},{"o":"疾風怒雨，禽鳥戚戚；\n霽日光風，草木欣欣。\n可見天地不可一日無和氣，人心不可一日無喜神。","e":"질풍노우, 금조척척;\n제일광풍, 초목흔흔.\n가견천지불가일일무화기, 인심불가일일무희신.","p":"모진 바람과 성난 비에는 새들도 근심하고, 갠 날 맑은 바람에는 풀과 나무도 기뻐한다. 하늘과 땅에 하루도 화기가 없어서는 안 되듯, 사람 마음에도 하루도 기쁜 기운이 없어서는 안 된다.","c":"전집 제6장(前集 第6)","src":5},{"o":"醲肥辛甘非真味，真味只是淡；\n神奇卓異非至人，至人只是常。","e":"농비신감비진미, 진미지시담;\n신기탁이비지인, 지인지시상.","p":"진하고 기름지고 맵고 단 것은 참맛이 아니다. 참맛은 그저 담백할 뿐이다. 신기하고 유별난 사람은 지극한 사람이 아니다. 지극한 사람은 그저 평범할 뿐이다.","c":"전집 제7장(前集 第7)","src":6},{"o":"天地寂然不動，而氣機無一息少停；\n日月晝夜奔馳，而貞明則萬古不易。\n故君子閒時要有喫緊的心思，忙處要有悠閒的趣味。","e":"천지적연부동, 이기기무일식소정;\n일월주야분치, 이정명즉만고불역.\n고군자한시요유끽긴적심사, 망처요유유한적취미.","p":"하늘과 땅은 고요히 움직이지 않는 듯해도 그 기운은 한순간도 쉬지 않고, 해와 달은 밤낮으로 달려도 그 밝음은 만고에 변하지 않는다. 그러므로 군자는 한가할 때 다급한 일에 대비하는 마음을 지니고, 바쁠 때 여유로운 멋을 지녀야 한다.","c":"전집 제8장(前集 第8)","src":7},{"o":"恩裏由來生害，故快意時，須早回頭；\n敗後或反成功，故拂心處，莫便放手。","e":"은리유래생해, 고쾌의시, 수조회두;\n패후혹반성공, 고불심처, 막변방수.","p":"은혜 속에서 원래 해로움이 생기니 뜻대로 될 때 일찍 돌아보고, 실패한 뒤에 도리어 성공하기도 하니 뜻대로 안 될 때 함부로 손을 놓지 말라.","c":"전집 제10장(前集 第10)","src":9},{"o":"面前的田地要放得寬，使人無不平之歎；\n身後的惠澤要流得長，使人有不匱之思。","e":"면전적전지요방득관, 사인무불평지탄;\n신후적혜택요류득장, 사인유불궤지사.","p":"살아서 내 앞의 터는 넓게 열어 두어 남들이 불평하지 않게 하고, 죽은 뒤의 은덕은 길게 흐르게 하여 남들이 모자람 없이 그리워하게 하라.","c":"전집 제12장(前集 第12)","src":11},{"o":"徑路窄處，留一步與人行；滋味濃的，減三分讓人嗜。此是涉世一極安樂法。","e":"경로착처, 유일보여인행; 자미농적, 감삼분양인기. 차시섭세일극안락법.","p":"좁은 길에서는 한 걸음 물러서서 남이 먼저 지나가게 하고, 맛있는 음식은 삼 할을 덜어 남에게 맛보게 하라. 이것이 세상을 살아가는 가장 편안한 방법이다.","c":"전집 제13장(前集 第13)","src":12},{"o":"交友須帶三分俠氣，做人要存一點素心。","e":"교우수대삼분협기, 주인요존일점소심.","p":"벗을 사귈 때는 의리 있는 기개를 조금 지니고, 사람 노릇을 할 때는 순수한 마음을 한 점 간직하라.","c":"전집 제15장(前集 第15)","src":14},{"o":"寵利毋居人前，德業毋落人後；\n受享毋踰分外，修為毋減分中。","e":"총리무거인전, 덕업무락인후;\n수향무유분외, 수위무감분중.","p":"총애와 이익은 남보다 앞서려 하지 말고, 덕을 쌓는 일은 남보다 뒤지지 말라. 누리는 것은 분수를 넘지 말고, 닦는 것은 분수보다 줄이지 말라.","c":"전집 제16장(前集 第16)","src":15},{"o":"處世讓一步為高，退步即進步的張本；\n待人寬一分是福，利人實利己的根基。","e":"처세양일보위고, 퇴보즉진보적장본;\n대인관일분시복, 이인실리기적근기.","p":"세상을 살 때 한 걸음 양보하는 것이 높은 길이니, 물러서는 것이 곧 나아가는 바탕이다. 사람을 대할 때 조금 너그러운 것이 복이니, 남을 이롭게 하는 것이 실은 나를 이롭게 하는 뿌리다.","c":"전집 제17장(前集 第17)","src":16},{"o":"蓋世功勞，當不得一個矜字；\n彌天罪過，當不得一個悔字。","e":"개세공로, 당부득일개긍자;\n미천죄과, 당부득일개회자.","p":"세상을 덮을 만한 큰 공도 ‘자랑할 긍(矜)’ 한 글자를 당해 내지 못하고, 하늘에 가득한 큰 죄도 ‘뉘우칠 회(悔)’ 한 글자를 당해 내지 못한다.","c":"전집 제18장(前集 第18)","src":17},{"o":"完名美節，不宜獨任，分些與人，可以遠害全身；\n辱行污名，不宜全推，引些歸己，可以韜光養德。","e":"완명미절, 불의독임, 분사여인, 가이원해전신;\n욕행오명, 불의전추, 인사귀기, 가이도광양덕.","p":"온전한 명예와 아름다운 절개는 혼자 차지하지 말고 남에게도 나누어 주어야 해를 멀리하고 몸을 온전히 할 수 있다. 욕된 행실과 더러운 이름은 남에게만 미루지 말고 조금은 내게로 끌어와야 빛을 감추고 덕을 기를 수 있다.","c":"전집 제19장(前集 第19)","src":18},{"o":"攻人之惡，毋太嚴，要思其堪受；\n教人之善，毋過高，當使其可從。","e":"공인지악, 무태엄, 요사기감수;\n교인지선, 무과고, 당사기가종.","p":"남의 잘못을 꾸짖을 때는 너무 엄하게 하지 말고 그가 받아들일 수 있을지 생각하라. 남에게 선을 가르칠 때는 너무 높게 하지 말고 그가 따를 수 있게 하라.","c":"전집 제23장(前集 第23)","src":22},{"o":"糞蟲至穢，變為蟬而飲露於秋風；\n腐草無光，化為螢而耀采於夏月。\n固知潔常自污出，明每從晦生也。","e":"분충지예, 변위선이음로어추풍;\n부초무광, 화위형이요채어하월.\n고지결상자오출, 명매종회생야.","p":"굼벵이는 더없이 더럽지만 매미가 되어 가을바람에 이슬을 마시고, 썩은 풀은 빛이 없지만 반딧불이 되어 여름밤을 밝힌다. 깨끗함은 늘 더러움에서 나오고 밝음은 늘 어둠에서 생긴다는 것을 알겠다.","c":"전집 제24장(前集 第24)","src":23},{"o":"處世不必邀功，無過便是功；\n與人不求感德，無怨便是德。","e":"처세불필요공, 무과변시공;\n여인불구감덕, 무원변시덕.","p":"세상을 살면서 굳이 공을 세우려 하지 말라. 허물이 없는 것이 곧 공이다. 남에게 베풀고 고마워하기를 바라지 말라. 원망이 없는 것이 곧 덕이다.","c":"전집 제28장(前集 第28)","src":27},{"o":"人至事窮勢蹙，宜原其初心；\n士當行滿功成，要觀其末路。","e":"인지사궁세축, 의원기초심;\n사당행만공성, 요관기말로.","p":"일이 막히고 형편이 궁해진 사람은 그 처음 마음을 헤아려 보고, 공을 이루고 뜻을 채운 사람은 그 마지막 길을 지켜보아야 한다.","c":"전집 제30장(前集 第30)","src":29},{"o":"人情反復，世路崎嶇。\n行不去處，須知退一步之法；\n行得去處，務加讓三分之功。","e":"인정반복, 세로기구.\n행불거처, 수지퇴일보지법;\n행득거처, 무가양삼분지공.","p":"인정은 이랬다저랬다 하고 세상길은 험하다. 가기 어려운 곳에서는 한 걸음 물러서는 법을 알아야 하고, 갈 수 있는 곳에서도 삼 할은 양보하는 공을 들여야 한다.","c":"전집 제35장(前集 第35)","src":34},{"o":"待小人，不難於嚴，而難於不惡；\n待君子，不難於恭，而難於有禮。","e":"대소인, 불난어엄, 이난어불오;\n대군자, 불난어공, 이난어유례.","p":"소인을 대할 때 엄하기는 어렵지 않으나 미워하지 않기가 어렵고, 군자를 대할 때 공손하기는 어렵지 않으나 예를 다하기가 어렵다.","c":"전집 제36장(前集 第36)","src":35},{"o":"福莫福於少事，禍莫禍於多心。\n唯苦事者，方知少事之為福；\n唯平心者，始知多心之為禍。","e":"복막복어소사, 화막화어다심.\n유고사자, 방지소사지위복;\n유평심자, 시지다심지위화.","p":"일이 적은 것보다 더 큰 복은 없고, 마음이 많은 것보다 더 큰 화는 없다. 일에 시달려 본 사람이라야 일이 적은 것이 복인 줄 알고, 마음이 평온한 사람이라야 마음 많은 것이 화인 줄 안다.","c":"전집 제50장(前集 第50)","src":49},{"o":"我有功於人不可念，而過則不可不念；\n人有恩於我不可忘，而怨則不可不忘。","e":"아유공어인불가념, 이과즉불가불념;\n인유은어아불가망, 이원즉불가불망.","p":"내가 남에게 베푼 공은 마음에 두지 말되 내 잘못은 마음에 두어야 하고, 남이 내게 베푼 은혜는 잊지 말되 원망은 잊어야 한다.","c":"전집 제52장(前集 第52)","src":51},{"o":"奢者富而不足，何如儉者貧而有餘；\n能者勞而府怨，何如拙者逸而全真。","e":"사자부이부족, 하여검자빈이유여;\n능자로이부원, 하여졸자일이전진.","p":"사치하는 사람은 부유해도 늘 모자라니, 검소한 사람이 가난해도 넉넉한 것만 하겠는가. 재주 있는 사람은 애쓰고도 원망을 사니, 서툰 사람이 편안하게 참된 본성을 지키는 것만 하겠는가.","c":"전집 제56장(前集 第56)","src":55},{"o":"苦心中，常得悅心之趣；\n得意時，須防失意之悲。","e":"고심중, 상득열심지취;\n득의시, 수방실의지비.","p":"괴로운 가운데 늘 마음 기쁜 멋을 얻고, 뜻대로 될 때 뜻을 잃는 슬픔을 미리 막아야 한다.","c":"전집 제59장(前集 第59)","src":58},{"o":"真廉無廉名，圖名者正所以為貪；\n大巧無巧術，用術者乃所以為拙。","e":"진렴무렴명, 도명자정소이위탐;\n대교무교술, 용술자내소이위졸.","p":"참으로 청렴한 사람에게는 청렴하다는 이름이 없으니, 이름을 노리는 것이 바로 탐욕이다. 참으로 솜씨 있는 사람에게는 잔재주가 없으니, 잔재주를 부리는 것이 바로 서툰 것이다.","c":"전집 제63장(前集 第63)","src":62},{"o":"欹器以滿覆，撲滿以空全。故君子寧居無不居有，寧處缺不處完。","e":"의기이만복, 박만이공전. 고군자녕거무불거유, 영처결불처완.","p":"기울어지는 그릇은 가득 차면 엎어지고, 돈 넣는 벙어리 저금통은 비어 있어야 온전하다. 그러므로 군자는 차라리 없는 쪽에 있을지언정 있는 쪽에 있지 않고, 차라리 모자란 쪽에 있을지언정 가득한 쪽에 있지 않는다.","c":"전집 제64장(前集 第64)","src":63},{"o":"心體光明，暗室中有青天；\n念頭暗昧，白日下生厲鬼。","e":"심체광명, 암실중유청천;\n염두암매, 백일하생려귀.","p":"마음이 밝으면 어두운 방 안에도 푸른 하늘이 있고, 생각이 어두우면 대낮에도 사나운 귀신이 생긴다.","c":"전집 제66장(前集 第66)","src":65},{"o":"為惡而畏人知，惡中猶有善路；\n為善而急人知，善處即是惡根。","e":"위악이외인지, 악중유유선로;\n위선이급인지, 선처즉시악근.","p":"나쁜 짓을 하고 남이 알까 두려워하면 그 악 속에도 아직 선으로 가는 길이 있고, 착한 일을 하고 남이 알아주기를 서두르면 그 선이 곧 악의 뿌리가 된다.","c":"전집 제68장(前集 第68)","src":67},{"o":"福不可邀，養喜神，以為召福之本而已；\n禍不可避，去殺機，以為遠禍之方而已。","e":"복불가요, 양희신, 이위소복지본이이;\n화불가피, 거살기, 이위원화지방이이.","p":"복은 억지로 불러올 수 없으니 기쁜 마음을 길러 복을 부르는 근본으로 삼을 뿐이고, 화는 억지로 피할 수 없으니 남을 해치려는 마음을 버려 화를 멀리하는 방법으로 삼을 뿐이다.","c":"전집 제71장(前集 第71)","src":70},{"o":"天地之氣，暖則生，寒則殺。故性氣清冷者，受享亦涼薄。唯和氣熱心之人，其福亦厚，其澤亦長。","e":"천지지기, 난즉생, 한즉살. 고성기청랭자, 수향역량박. 유화기열심지인, 기복역후, 기택역장.","p":"하늘과 땅의 기운은 따뜻하면 살리고 차가우면 죽인다. 그러므로 성품이 차가운 사람은 누리는 복도 박하고, 온화하고 따뜻한 마음을 지닌 사람이라야 복도 두텁고 은택도 길다.","c":"전집 제73장(前集 第73)","src":72},{"o":"天理路上甚寬，稍游心，胸中便覺高明廣大；\n人欲路上甚窄，纔寄跡，眼前俱是荊棘泥塗。","e":"천리로상심관, 초유심, 흉중변각고명광대;\n인욕로상심착, 재기적, 안전구시형극니도.","p":"하늘의 이치를 따르는 길은 매우 넓어서 조금만 마음을 두어도 가슴이 탁 트이고, 사람의 욕심을 따르는 길은 매우 좁아서 발을 들이자마자 눈앞이 온통 가시밭과 진흙탕이다.","c":"전집 제74장(前集 第74)","src":73},{"o":"一苦一樂相磨鍊，鍊極而成福者，其福始久；\n一疑一信相參勘，勘極而成知者，其知始真。","e":"일고일락상마련, 연극이성복자, 기복시구;\n일의일신상참감, 감극이성지자, 기지시진.","p":"괴로움과 즐거움을 번갈아 겪으며 단련하여 얻은 복이라야 그 복이 오래가고, 의심과 믿음을 번갈아 따져 보아 얻은 앎이라야 그 앎이 참되다.","c":"전집 제75장(前集 第75)","src":74},{"o":"心不可不虛，虛則義理來居；\n心不可不實，實則物欲不入。","e":"심불가불허, 허즉의리래거;\n심불가불실, 실즉물욕불입.","p":"마음은 비워 두어야 하니, 비어 있어야 바른 이치가 들어와 산다. 마음은 채워 두어야 하니, 차 있어야 욕심이 들어오지 못한다.","c":"전집 제76장(前集 第76)","src":75},{"o":"地之穢者多生物，水之清者常無魚。故君子當存含垢納污之量，不可持好潔獨行之操。","e":"지지예자다생물, 수지청자상무어. 고군자당존함구납오지량, 불가지호결독행지조.","p":"더러운 땅에는 생물이 많이 자라고, 너무 맑은 물에는 고기가 살지 않는다. 그러므로 군자는 더러움도 받아들이는 도량을 지녀야지, 깨끗한 것만 좋아하여 혼자 고고한 지조를 고집해서는 안 된다.","c":"전집 제77장(前集 第77)","src":76},{"o":"圖未就之功，不如保已成之業；\n悔既往之失，不如防將來之非。","e":"도미취지공, 불여보이성지업;\n회기왕지실, 불여방장래지비.","p":"아직 이루지 못한 공을 꾀하는 것은 이미 이룬 일을 지키는 것만 못하고, 지난 잘못을 뉘우치는 것은 앞으로의 잘못을 막는 것만 못하다.","c":"전집 제81장(前集 第81)","src":80},{"o":"氣象要高曠，而不可疏狂；\n心思要縝密，而不可瑣屑；\n趣味要沖澹，而不可偏枯；\n操守要嚴明，而不可激烈。","e":"기상요고광, 이불가소광;\n심사요진밀, 이불가쇄설;\n취미요충담, 이불가편고;\n조수요엄명, 이불가격렬.","p":"기상은 높고 넓어야 하되 거칠어서는 안 되고, 생각은 꼼꼼해야 하되 자질구레해서는 안 되며, 멋은 담백해야 하되 메말라서는 안 되고, 지조는 엄정해야 하되 과격해서는 안 된다.","c":"전집 제82장(前集 第82)","src":81},{"o":"風來疏竹，風過而竹不留聲；\n雁度寒潭，雁去而潭不留影。\n故君子事來而心始現，事去而心隨空。","e":"풍래소죽, 풍과이죽불류성;\n안도한담, 안거이담불류영.\n고군자사래이심시현, 사거이심수공.","p":"바람이 성긴 대숲을 지나가도 바람이 가고 나면 대숲은 소리를 남기지 않고, 기러기가 차가운 못을 건너가도 기러기가 가고 나면 못은 그림자를 남기지 않는다. 그러므로 군자는 일이 오면 마음이 비로소 드러나고, 일이 가면 마음도 따라서 빈다.","c":"전집 제83장(前集 第83)","src":82},{"o":"閒中不放過，忙處有受用；\n靜中不落空，動處有受用；\n暗中不欺隱，明處有受用。","e":"한중불방과, 망처유수용;\n정중불락공, 동처유수용;\n암중불기은, 명처유수용.","p":"한가할 때 헛되이 보내지 않으면 바쁠 때 쓸모가 있고, 고요할 때 멍하니 있지 않으면 움직일 때 쓸모가 있으며, 남이 안 볼 때 속이지 않으면 드러난 자리에서 쓸모가 있다.","c":"전집 제86장(前集 第86)","src":85},{"o":"平民肯種德施惠，便是無位的公相；\n士夫徒貪權市寵，竟成有爵的乞人。","e":"평민긍종덕시혜, 변시무위적공상;\n사부도탐권시총, 경성유작적걸인.","p":"평범한 백성이라도 덕을 심고 은혜를 베풀면 벼슬 없는 재상이요, 선비와 벼슬아치라도 권세만 탐하고 총애를 사고팔면 벼슬 있는 거지다.","c":"전집 제94장(前集 第94)","src":93},{"o":"君子而詐善，無異小人之肆惡；\n君子而改節，不及小人之自新。","e":"군자이사선, 무이소인지사악;\n군자이개절, 불급소인지자신.","p":"군자가 착한 척 속이는 것은 소인이 함부로 악을 저지르는 것과 다르지 않고, 군자가 지조를 바꾸는 것은 소인이 잘못을 고쳐 새로워지는 것만 못하다.","c":"전집 제96장(前集 第96)","src":95},{"o":"此心常看得圓滿，天下自無缺憾之世界；\n此心常放得寬平，天下自無險側之人情。","e":"차심상간득원만, 천하자무결감지세계;\n차심상방득관평, 천하자무험측지인정.","p":"이 마음을 늘 둥글고 넉넉하게 보면 세상에 저절로 모자란 곳이 없고, 이 마음을 늘 너그럽고 평평하게 두면 세상에 저절로 험한 인정이 없다.","c":"전집 제98장(前集 第98)","src":97},{"o":"居逆境中，周身皆鍼砭藥石，砥節勵行而不覺；\n處順境內，滿前盡兵刃戈矛，銷膏糜骨而不知。","e":"거역경중, 주신개침폄약석, 지절려행이불각;\n처순경내, 만전진병인과모, 소고미골이부지.","p":"역경 속에 있을 때는 몸 둘레가 모두 침과 약이어서 절개와 행실이 갈고 닦이는 줄도 모르고, 순경 속에 있을 때는 눈앞이 온통 칼과 창이어서 기름이 녹고 뼈가 깎이는 줄도 모른다.","c":"전집 제100장(前集 第100)","src":99},{"o":"文章做到極處，無有他奇，只是恰好；\n人品做到極處，無有他異，只是本然。","e":"문장주도극처, 무유타기, 지시흡호;\n인품주도극처, 무유타이, 지시본연.","p":"글이 지극한 경지에 이르면 다른 기이함이 없고 그저 꼭 알맞을 뿐이며, 사람됨이 지극한 경지에 이르면 다른 유별남이 없고 그저 본래 모습 그대로일 뿐이다.","c":"전집 제103장(前集 第103)","src":102},{"o":"爽口之味，皆爛腸腐骨之藥，五分便無殃；\n快心之事，悉敗身喪德之媒，五分便無悔。","e":"상구지미, 개란장부골지약, 오분변무앙;\n쾌심지사, 실패신상덕지매, 오분변무회.","p":"입에 맞는 음식은 모두 창자를 상하게 하고 뼈를 썩게 하는 독약이니 절반만 먹으면 탈이 없고, 마음에 상쾌한 일은 모두 몸을 망치고 덕을 잃게 하는 중매쟁이니 절반만 하면 후회가 없다.","c":"전집 제105장(前集 第105)","src":104},{"o":"不責人小過，不發人陰私，不念人舊惡。三者可以養德，亦可以遠害。","e":"불책인소과, 불발인음사, 불념인구악. 삼자가이양덕, 역가이원해.","p":"남의 작은 허물을 꾸짖지 말고, 남의 숨은 비밀을 들추지 말고, 남의 지난 잘못을 마음에 두지 말라. 이 세 가지로 덕을 기를 수 있고 해를 멀리할 수도 있다.","c":"전집 제106장(前集 第106)","src":105},{"o":"怨因德彰，故使人德我，不若德怨之兩忘；\n仇因恩立，故使人知恩，不若恩仇之俱泯。","e":"원인덕창, 고사인덕아, 불약덕원지량망;\n구인은립, 고사인지은, 불약은구지구민.","p":"원망은 덕 때문에 드러나니, 남이 나를 고마워하게 하는 것은 덕과 원망을 함께 잊는 것만 못하다. 원수는 은혜 때문에 생기니, 남이 은혜를 알게 하는 것은 은혜와 원수를 함께 없애는 것만 못하다.","c":"전집 제109장(前集 第109)","src":108},{"o":"老來疾病，都是壯時招的；\n衰後罪孽，都是盛時作的。\n故持盈履滿，君子尤兢兢焉。","e":"노래질병, 도시장시초적;\n쇠후죄얼, 도시성시작적.\n고지영리만, 군자우긍긍언.","p":"늙어서 생기는 병은 모두 젊을 때 불러들인 것이고, 쇠한 뒤의 죄업은 모두 한창때 지은 것이다. 그러므로 가득 차고 넘칠 때 군자는 더욱 조심하고 또 조심한다.","c":"전집 제110장(前集 第110)","src":109},{"o":"市私恩，不如扶公議；\n結新知，不如敦舊好；\n立榮名，不如種隱德；\n尚奇節，不如謹庸行。","e":"시사은, 불여부공의;\n결신지, 불여돈구호;\n입영명, 불여종은덕;\n상기절, 불여근용행.","p":"사사로운 은혜를 파는 것은 공정한 의논을 돕는 것만 못하고, 새 친구를 사귀는 것은 옛 친구와 두터이 지내는 것만 못하며, 화려한 이름을 세우는 것은 남모르는 덕을 심는 것만 못하고, 기이한 절개를 숭상하는 것은 평범한 행실을 삼가는 것만 못하다.","c":"전집 제111장(前集 第111)","src":110},{"o":"曲意而使人喜，不若直躬而使人忌；\n無善而致人譽，不若無惡而致人毀。","e":"곡의이사인희, 불약직궁이사인기;\n무선이치인예, 불약무악이치인훼.","p":"뜻을 굽혀 남을 기쁘게 하는 것은 몸을 곧게 하여 남의 미움을 사는 것만 못하고, 착한 일도 없이 칭찬을 받는 것은 나쁜 일 없이 헐뜯음을 받는 것만 못하다.","c":"전집 제113장(前集 第113)","src":112},{"o":"處父兄骨肉之變，宜從容，不宜激烈；\n遇朋友交遊之失，宜剴切，不宜優游。","e":"처부형골육지변, 의종용, 불의격렬;\n우붕우교유지실, 의개절, 불의우유.","p":"부모 형제나 가족에게 변고가 생기면 침착해야지 격하게 굴어서는 안 되고, 벗의 잘못을 보면 간곡하게 일러 주어야지 우물쭈물 넘어가서는 안 된다.","c":"전집 제114장(前集 第114)","src":113},{"o":"小處不滲漏，暗處不欺隱，末路不怠荒，纔是個真正英雄。","e":"소처불삼루, 암처불기은, 말로불태황, 재시개진정영웅.","p":"작은 곳에서도 새지 않고, 어두운 곳에서도 속이지 않으며, 끝까지 게을러지지 않아야 비로소 참된 영웅이다.","c":"전집 제115장(前集 第115)","src":114},{"o":"千金難結一時之歡，一飯竟致終身之感。蓋愛重反為仇，薄極反成喜也。","e":"천금난결일시지환, 일반경치종신지감. 개애중반위구, 박극반성희야.","p":"천금으로도 한때의 기쁨을 맺기 어려운데, 밥 한 그릇이 평생의 고마움이 되기도 한다. 사랑이 너무 무거우면 도리어 원수가 되고, 아주 박한 것이 도리어 기쁨이 되기도 하는 것이다.","c":"전집 제116장(前集 第116)","src":115},{"o":"驚奇喜異者，無遠大之識；\n苦節獨行者，非恆久之操。","e":"경기희이자, 무원대지식;\n고절독행자, 비항구지조.","p":"신기한 것을 놀라워하고 별난 것을 좋아하는 사람에게는 원대한 식견이 없고, 지나치게 괴로운 절개로 혼자 고고한 사람은 오래가는 지조가 아니다.","c":"전집 제119장(前集 第119)","src":118},{"o":"毋偏信而為奸所欺，\n毋自任而為氣所使。\n毋以己之長而形人之短，\n毋因己之拙而忌人之能。","e":"무편신이위간소기,\n무자임이위기소사.\n무이기지장이형인지단,\n무인기지졸이기인지능.","p":"한쪽 말만 믿다가 간사한 사람에게 속지 말고, 제멋대로 하다가 기분에 휘둘리지 말라. 나의 장점으로 남의 단점을 드러내지 말고, 나의 서투름 때문에 남의 재능을 시기하지 말라.","c":"전집 제121장(前集 第121)","src":120},{"o":"遇沈沈不語之士，且莫輸心；\n見悻悻自好之人，尤須防口。","e":"우침침불어지사, 차막수심;\n견행행자호지인, 우수방구.","p":"말없이 음침한 사람을 만나면 우선 마음을 털어놓지 말고, 성내며 잘난 체하는 사람을 보면 더욱 말을 조심하라.","c":"전집 제123장(前集 第123)","src":122},{"o":"覺人之詐，不形於言；\n受人之侮，不動於色。\n此中有無窮意味，亦有無窮受用。","e":"각인지사, 불형어언;\n수인지모, 부동어색.\n차중유무궁의미, 역유무궁수용.","p":"남이 속이는 줄 알아도 말로 드러내지 않고, 남에게 업신여김을 당해도 얼굴빛을 바꾸지 않는다. 이 가운데 끝없는 의미가 있고 끝없는 쓰임이 있다.","c":"전집 제127장(前集 第127)","src":126},{"o":"橫逆困窮是煅煉豪傑的一副鑪錘，能受其煅煉，則身心交益，不受其煅煉，則身心交損。","e":"횡역곤궁시단련호걸적일부로추, 능수기단련, 즉신심교익, 불수기단련, 즉신심교손.","p":"뜻밖의 어려움과 곤궁은 호걸을 단련하는 풀무와 망치다. 그 단련을 견디면 몸과 마음이 함께 좋아지고, 견디지 못하면 몸과 마음이 함께 상한다.","c":"전집 제128장(前集 第128)","src":127},{"o":"毋因群疑而阻獨見，\n毋任己意而廢人言，\n毋私小惠而傷大體，\n毋借公論以快私情。","e":"무인군의이조독견,\n무임기의이폐인언,\n무사소혜이상대체,\n무차공론이쾌사정.","p":"여러 사람이 의심한다고 해서 나만의 바른 견해를 막지 말고, 내 뜻만 믿고 남의 말을 버리지 말며, 작은 은혜에 사사로이 얽매여 큰 도리를 해치지 말고, 공론을 빌려 사사로운 감정을 풀지 말라.","c":"전집 제131장(前集 第131)","src":130},{"o":"有妍必有醜為之對，我不誇妍，誰能醜我；\n有潔必有污為之仇，我不好潔，誰能污我。","e":"유연필유추위지대, 아불과연, 수능추아;\n유결필유오위지구, 아불호결, 수능오아.","p":"아름다움이 있으면 반드시 추함이 짝이 되니 내가 아름다움을 자랑하지 않으면 누가 나를 추하다 하겠는가. 깨끗함이 있으면 반드시 더러움이 맞서니 내가 깨끗함을 내세우지 않으면 누가 나를 더럽다 하겠는가.","c":"전집 제135장(前集 第135)","src":134},{"o":"功過不容少混，混則人懷惰墮之心；\n恩仇不可太明，明則人起攜貳之志。","e":"공과불용소혼, 혼즉인회타타지심;\n은구불가태명, 명즉인기휴이지지.","p":"공과 허물은 조금도 뒤섞어서는 안 되니, 섞이면 사람들이 게으른 마음을 품는다. 은혜와 원수는 너무 분명히 갈라서는 안 되니, 너무 분명하면 사람들이 등을 돌릴 마음을 일으킨다.","c":"전집 제137장(前集 第137)","src":136},{"o":"爵位不宜太盛，太盛則危；\n能事不宜盡畢，盡畢則衰；\n行誼不宜過高，過高則謗興而毀來。","e":"작위불의태성, 태성즉위;\n능사불의진필, 진필즉쇠;\n행의불의과고, 과고즉방흥이훼래.","p":"벼슬은 너무 높아서는 안 되니 너무 높으면 위태롭고, 재능은 다 써 버려서는 안 되니 다 쓰면 쇠하며, 행실은 너무 고고해서는 안 되니 너무 고고하면 비방과 헐뜯음이 몰려온다.","c":"전집 제138장(前集 第138)","src":137},{"o":"惡忌陰，善忌陽，故惡之顯者禍淺，而隱者禍深；善之顯者功小，而隱者功大。","e":"악기음, 선기양, 고악지현자화천, 이은자화심; 선지현자공소, 이은자공대.","p":"악은 숨기는 것을 꺼리고 선은 드러내는 것을 꺼린다. 그러므로 드러난 악은 화가 얕고 숨은 악은 화가 깊으며, 드러난 선은 공이 작고 숨은 선은 공이 크다.","c":"전집 제139장(前集 第139)","src":138},{"o":"當與人同過，不當與人同功，同功則相忌；\n可與人共患難，不可與人共安樂，安樂則相仇。","e":"당여인동과, 부당여인동공, 동공즉상기;\n가여인공환난, 불가여인공안락, 안락즉상구.","p":"남과 허물은 함께 나누어도 공은 함께 나누지 말라. 공을 나누면 서로 시기한다. 남과 어려움은 함께할 수 있어도 편안함은 함께하기 어렵다. 편안해지면 서로 원수가 된다.","c":"전집 제142장(前集 第142)","src":141},{"o":"德隨量進，量由識長。故欲厚其德，不可不弘其量；欲弘其量，不可不大其識。","e":"덕수량진, 양유식장. 고욕후기덕, 불가불홍기량; 욕홍기량, 불가부대기식.","p":"덕은 도량을 따라 자라고, 도량은 식견으로 커진다. 그러므로 덕을 두텁게 하려면 도량을 넓혀야 하고, 도량을 넓히려면 식견을 키워야 한다.","c":"전집 제145장(前集 第145)","src":144},{"o":"反己者，觸事皆成藥石；\n尤人者，動念即是戈矛。\n一以闢眾善之路，一以導諸惡之源，相去霄壤矣。","e":"반기자, 촉사개성약석;\n우인자, 동념즉시과모.\n일이벽중선지로, 일이도제악지원, 상거소양의.","p":"나를 돌아보는 사람에게는 부딪히는 일마다 약이 되고, 남을 탓하는 사람에게는 생각마다 창칼이 된다. 하나는 온갖 선으로 가는 길을 열고, 하나는 온갖 악의 근원을 끌어들이니, 그 차이가 하늘과 땅만큼 크다.","c":"전집 제147장(前集 第147)","src":146},{"o":"事業文章隨身銷毀，而精神萬古如新；\n功名富貴逐世轉移，而氣節千載一日。\n君子信不當以彼易此也。","e":"사업문장수신소훼, 이정신만고여신;\n공명부귀축세전이, 이기절천재일일.\n군자신부당이피역차야.","p":"업적과 문장은 몸과 함께 사라지지만 정신은 만고에 새롭고, 공명과 부귀는 세상 따라 옮겨 가지만 기개와 절개는 천 년이 하루 같다. 군자는 결코 저것으로 이것을 바꾸어서는 안 된다.","c":"전집 제148장(前集 第148)","src":147},{"o":"事有急之不白者，寬之或自明，毋躁急以速其忿；\n人有操之不從者，縱之或自化，毋操切以益其頑。","e":"사유급지불백자, 관지혹자명, 무조급이속기분;\n인유조지부종자, 종지혹자화, 무조절이익기완.","p":"일이 급하게 하면 밝혀지지 않다가도 느긋하게 두면 저절로 밝혀지기도 하니, 조급하게 굴어 노여움을 재촉하지 말라. 사람이 다그치면 따르지 않다가도 놓아두면 저절로 바뀌기도 하니, 몰아붙여 고집을 더하게 하지 말라.","c":"전집 제153장(前集 第153)","src":152},{"o":"謝事當謝於正盛之時，\n居身宜居於獨後之地。\n謹德須謹於至微之事，\n施恩務施於不報之人。","e":"사사당사어정성지시,\n거신의거어독후지지.\n근덕수근어지미지사,\n시은무시어불보지인.","p":"일에서 물러날 때는 한창 잘나갈 때 물러나고, 몸을 둘 때는 남보다 뒤처진 자리에 두라. 덕을 삼갈 때는 아주 작은 일에서 삼가고, 은혜를 베풀 때는 갚을 수 없는 사람에게 베풀라.","c":"전집 제155장(前集 第155)","src":154},{"o":"德者事業之基，未有基不固而棟宇堅久者。\n心者後嗣之本，未有本不立而枝葉茂榮者。","e":"덕자사업지기, 미유기불고이동우견구자.\n심자후사지본, 미유본불립이지엽무영자.","p":"덕은 사업의 터전이니, 터가 단단하지 않은데 집이 오래 튼튼한 법은 없다. 마음은 자손의 뿌리이니, 뿌리가 서지 않았는데 가지와 잎이 무성한 법은 없다.","c":"전집 제157장(前集 第157)","src":156},{"o":"信人者，人未必盡誠，己則獨誠矣；\n疑人者，人未必皆詐，己則先詐矣。","e":"신인자, 인미필진성, 기즉독성의;\n의인자, 인미필개사, 기즉선사의.","p":"남을 믿는 사람은 남이 다 진실하지 않더라도 자기만은 진실하고, 남을 의심하는 사람은 남이 다 속이지 않더라도 자기가 먼저 속이는 것이다.","c":"전집 제160장(前集 第160)","src":159},{"o":"念頭寬厚的，如春風煦育，萬物遭之而生；\n念頭忌刻的，如朔雪陰凝，萬物遭之而死。","e":"염두관후적, 여춘풍후육, 만물조지이생;\n염두기각적, 여삭설음응, 만물조지이사.","p":"생각이 너그럽고 후한 사람은 봄바람이 만물을 따뜻하게 기르듯 만나는 것마다 살리고, 생각이 각박한 사람은 북쪽 눈이 얼어붙듯 만나는 것마다 죽인다.","c":"전집 제161장(前集 第161)","src":160},{"o":"為善不見其益，如草裏東瓜，自應暗長；\n為惡不見其損，如庭前春雪，勢必潛消。","e":"위선불견기익, 여초리동과, 자응암장;\n위악불견기손, 여정전춘설, 세필잠소.","p":"착한 일을 해도 당장 이익이 보이지 않지만 풀숲의 동아처럼 모르는 사이에 자라고, 나쁜 일을 해도 당장 손해가 보이지 않지만 뜰 앞의 봄눈처럼 반드시 모르는 사이에 녹아 없어진다.","c":"전집 제162장(前集 第162)","src":161},{"o":"遇故舊之交，意氣要愈新；\n處隱微之地，心迹宜愈顯；\n待衰朽的輩，恩禮當愈隆。","e":"우고구지교, 의기요유신;\n처은미지지, 심적의유현;\n대쇠후적배, 은례당유륭.","p":"오랜 벗을 만나면 마음을 더욱 새롭게 하고, 남이 안 보는 곳에서는 마음가짐을 더욱 떳떳이 하며, 늙고 쇠한 이를 대할 때는 은혜와 예를 더욱 두터이 하라.","c":"전집 제163장(前集 第163)","src":162},{"o":"人之過誤宜恕，而在己則不可恕；\n己之困辱宜忍，而在人則不可忍。","e":"인지과오의서, 이재기즉불가서;\n기지곤욕의인, 이재인즉불가인.","p":"남의 허물은 용서해야 하지만 내 허물은 용서해서는 안 되고, 나의 곤욕은 참아야 하지만 남의 곤욕은 그냥 참고 보아서는 안 된다.","c":"전집 제166장(前集 第166)","src":165},{"o":"能脫俗便是奇，作意尚奇者，不為奇而為異；\n不合污便是清，矯情求清者，不為清而為激。","e":"능탈속변시기, 작의상기자, 불위기이위이;\n불합오변시청, 교정구청자, 불위청이위격.","p":"속됨을 벗어나면 그것이 곧 기이함이니, 일부러 기이함을 좇는 사람은 기이한 것이 아니라 괴이한 것이다. 더러움에 섞이지 않으면 그것이 곧 맑음이니, 억지로 맑음을 구하는 사람은 맑은 것이 아니라 과격한 것이다.","c":"전집 제167장(前集 第167)","src":166},{"o":"恩宜自淡而濃，先濃後淡者，人忘其惠；\n威宜自嚴而寬，先寬後嚴者，人怨其酷。","e":"은의자담이농, 선농후담자, 인망기혜;\n위의자엄이관, 선관후엄자, 인원기혹.","p":"은혜는 엷게 시작해서 짙게 해야 하니, 처음에 짙다가 나중에 엷으면 사람들이 그 은혜를 잊는다. 위엄은 엄하게 시작해서 너그럽게 해야 하니, 처음에 너그럽다가 나중에 엄하면 사람들이 그 가혹함을 원망한다.","c":"전집 제168장(前集 第168)","src":167},{"o":"心虛則性現，不息心而求見性，如撥波覓月；\n意淨則心清，不了意而求明心，如索鏡增塵。","e":"심허즉성현, 불식심이구견성, 여발파멱월;\n의정즉심청, 불료의이구명심, 여색경증진.","p":"마음이 비면 본성이 드러난다. 마음을 쉬지 않고 본성을 보려는 것은 물결을 헤치며 달을 찾는 것과 같다. 뜻이 깨끗하면 마음이 맑아진다. 뜻을 정리하지 않고 마음을 밝히려는 것은 거울을 닦으며 먼지를 더하는 것과 같다.","c":"전집 제169장(前集 第169)","src":168},{"o":"一念慈祥，可以醞釀兩間和氣；\n寸心潔白，可以昭垂百代清芬。","e":"일념자상, 가이온양량간화기;\n촌심결백, 가이소수백대청분.","p":"한 생각이 자비롭고 상서로우면 하늘과 땅 사이에 화기를 빚어낼 수 있고, 한 치 마음이 깨끗하면 백 대에 걸쳐 맑은 향기를 드리울 수 있다.","c":"전집 제178장(前集 第178)","src":177},{"o":"居官有二語，曰：「惟公則生明，惟廉則生威。」\n居家有二語，曰：「惟恕則情平，惟儉則用足。」","e":"거관유이어, 왈: “유공즉생명, 유렴즉생위.”\n거가유이어, 왈: “유서즉정평, 유검즉용족.”","p":"벼슬살이에 두 마디 말이 있으니, “오직 공정하면 밝음이 생기고, 오직 청렴하면 위엄이 생긴다.” 집안살이에도 두 마디 말이 있으니, “오직 너그러우면 마음이 평온하고, 오직 검소하면 쓸 것이 넉넉하다.”","c":"전집 제184장(前集 第184)","src":183},{"o":"處富貴之地，要知貧賤的痛癢；\n當少壯之時，須念衰老的辛酸。","e":"처부귀지지, 요지빈천적통양;\n당소장지시, 수념쇠로적신산.","p":"부귀한 자리에 있을 때는 가난하고 천한 이의 아픔을 알아야 하고, 젊고 힘 있을 때는 늙고 쇠한 이의 쓰라림을 생각해야 한다.","c":"전집 제185장(前集 第185)","src":184},{"o":"持身不可太皎潔，一切污辱垢穢，要茹納些；\n與人不可太分明，一切善惡賢愚，要包容得。","e":"지신불가태교결, 일체오욕구예, 요여납사;\n여인불가태분명, 일체선악현우, 요포용득.","p":"몸가짐을 너무 결백하게 하려 하지 말고 온갖 더러움과 욕됨도 조금은 받아들여라. 사람을 대할 때 너무 분명하게 가르려 하지 말고 선악과 현우를 모두 품어 안아라.","c":"전집 제186장(前集 第186)","src":185},{"o":"休與小人仇讎，小人自有對頭；\n休向君子諂媚，君子原無私惠。","e":"휴여소인구수, 소인자유대두;\n휴향군자첨미, 군자원무사혜.","p":"소인과 원수를 맺지 말라. 소인에게는 저절로 맞상대가 있다. 군자에게 아첨하지 말라. 군자는 원래 사사로운 은혜를 베풀지 않는다.","c":"전집 제187장(前集 第187)","src":186},{"o":"縱欲之病可醫，而執理之病難醫；\n事物之障可除，而義理之障難除。","e":"종욕지병가의, 이집리지병난의;\n사물지장가제, 이의리지장난제.","p":"욕심에 빠진 병은 고칠 수 있어도 이치에 집착하는 병은 고치기 어렵고, 사물의 장애는 없앨 수 있어도 이치에 갇힌 장애는 없애기 어렵다.","c":"전집 제188장(前集 第188)","src":187},{"o":"磨礪當如百煉之金，急就者，必非邃養；\n施為宜似千鈞之弩，輕發者，決無宏功。","e":"마려당여백련지금, 급취자, 필비수양;\n시위의사천균지노, 경발자, 결무굉공.","p":"자신을 갈고 닦기는 백 번 단련한 쇠처럼 해야 하니, 서둘러 이룬 것은 결코 깊은 수양이 아니다. 일을 벌이기는 천 근 쇠뇌처럼 해야 하니, 가볍게 쏜 것에는 결코 큰 공이 없다.","c":"전집 제189장(前集 第189)","src":188},{"o":"寧為小人所忌毀，毋為小人所媚悅；\n寧為君子所責備，毋為君子所包容。","e":"영위소인소기훼, 무위소인소미열;\n영위군자소책비, 무위군자소포용.","p":"차라리 소인에게 미움과 헐뜯음을 받을지언정 소인이 아첨하며 기뻐하는 사람이 되지 말고, 차라리 군자에게 꾸지람을 받을지언정 군자가 눈감아 주는 사람이 되지 말라.","c":"전집 제190장(前集 第190)","src":189},{"o":"好利者，軼出於道義之外，其害顯而淺；\n好名者，竄入於道義之中，其害隱而深。","e":"호리자, 일출어도의지외, 기해현이천;\n호명자, 찬입어도의지중, 기해은이심.","p":"이익을 좋아하는 사람은 도의 밖으로 벗어나니 그 해가 드러나서 얕고, 이름을 좋아하는 사람은 도의 안으로 숨어드니 그 해가 숨어 있어 깊다.","c":"전집 제191장(前集 第191)","src":190},{"o":"讒夫毀士，如寸雲蔽日，不久自明；\n媚子阿人，似隙風侵肌，無疾亦損。","e":"참부훼사, 여촌운폐일, 불구자명;\n미자아인, 사극풍침기, 무질역손.","p":"헐뜯는 사람이 선비를 비방하는 것은 조각구름이 해를 가리는 것과 같아서 오래지 않아 저절로 밝아진다. 아첨하는 사람이 남에게 알랑거리는 것은 틈새 바람이 살갗에 스미는 것과 같아서 병이 없어 보여도 몸이 상한다.","c":"전집 제193장(前集 第193)","src":192},{"o":"建功立業者，多圓融之士；\n僨事失機者，必執拗之人。","e":"건공립업자, 다원융지사;\n분사실기자, 필집요지인.","p":"공을 세우고 일을 이루는 사람은 대개 원만하고 융통성 있는 사람이고, 일을 그르치고 때를 놓치는 사람은 반드시 고집 센 사람이다.","c":"전집 제195장(前集 第195)","src":194},{"o":"處世不必與俗同，亦不宜與俗異；\n作事不必令人喜，亦不可令人憎。","e":"처세불필여속동, 역불의여속이;\n작사불필령인희, 역불가령인증.","p":"세상을 살면서 꼭 세속과 같을 필요는 없지만 세속과 너무 달라서도 안 되고, 일을 할 때 꼭 남을 기쁘게 할 필요는 없지만 남이 미워하게 해서도 안 된다.","c":"전집 제196장(前集 第196)","src":195},{"o":"日既暮而猶煙霞絢爛，歲將晚而更橙橘芳馨。故末路晚年，君子更宜精神百倍。","e":"일기모이유연하현란, 세장만이갱등귤방형. 고말로만년, 군자갱의정신백배.","p":"해가 이미 저물어도 노을은 오히려 찬란하고, 한 해가 저물어 가도 귤과 유자는 더욱 향기롭다. 그러므로 인생의 끝자락, 늘그막에 군자는 더욱 정신을 백 배로 가다듬어야 한다.","c":"전집 제197장(前集 第197)","src":196},{"o":"鷹立如睡，虎行似病，正是他攫鳥噬人法術。故君子要聰明不露，才華不逞，纔有任重道遠的力量。","e":"응립여수, 호행사병, 정시타확조서인법술. 고군자요총명불로, 재화불령, 재유임중도원적력량.","p":"매는 조는 듯이 앉아 있고 범은 병든 듯이 걷는다. 이것이 바로 새를 낚아채고 사람을 무는 그들의 솜씨다. 그러므로 군자는 총명을 드러내지 않고 재주를 뽐내지 않아야 무거운 짐을 지고 먼 길을 가는 힘이 있다.","c":"전집 제198장(前集 第198)","src":197},{"o":"儉，美德也，過儉則為慳吝，為鄙嗇，反傷雅道；\n讓，懿行也，過讓則為足恭，為曲謹，多出機心。","e":"검, 미덕야, 과검즉위간린, 위비색, 반상아도;\n양, 의행야, 과양즉위족공, 위곡근, 다출기심.","p":"검소함은 미덕이지만 지나치면 인색하고 쩨쩨해져서 도리어 바른 도리를 해친다. 양보는 아름다운 행실이지만 지나치면 비굴하고 지나치게 조심스러워져서 꾀가 많아진다.","c":"전집 제199장(前集 第199)","src":198},{"o":"毋憂拂意，毋喜快心，毋恃久安，毋憚初難。","e":"무우불의, 무희쾌심, 무시구안, 무탄초난.","p":"뜻대로 안 된다고 근심하지 말고, 마음이 상쾌하다고 기뻐하지 말며, 오래 편안했다고 믿지 말고, 처음이 어렵다고 꺼리지 말라.","c":"전집 제200장(前集 第200)","src":199},{"o":"宴飲之樂多，不是個好人家；\n聲華之習勝，不是個好士子；\n名位之念重，不是個好臣工。","e":"연음지락다, 불시개호인가;\n성화지습승, 불시개호사자;\n명위지념중, 불시개호신공.","p":"잔치와 술자리의 즐거움이 많으면 좋은 집안이 아니고, 겉치레와 소문을 좇는 버릇이 강하면 좋은 선비가 아니며, 이름과 벼슬에 대한 생각이 무거우면 좋은 신하가 아니다.","c":"전집 제201장(前集 第201)","src":200},{"o":"世人以心愜處為樂，卻被樂心引入苦處；\n達士以心拂處為樂，終由苦心換得樂來。","e":"세인이심협처위락, 각피락심인입고처;\n달사이심불처위락, 종유고심환득락래.","p":"세상 사람은 마음이 흡족한 것을 즐거움으로 여기다가 그 즐거운 마음에 끌려 괴로움에 빠지고, 통달한 사람은 마음이 거슬리는 것을 즐거움으로 여기다가 끝내 그 괴로운 마음으로 즐거움을 얻는다.","c":"전집 제202장(前集 第202)","src":201},{"o":"居盈滿者，如水之將溢未溢，切忌再加一滴；\n處危急者，如木之將折未折，切忌再加一搦。","e":"거영만자, 여수지장일미일, 절기재가일적;\n처위급자, 여목지장절미절, 절기재가일닉.","p":"가득 찬 자리에 있는 사람은 넘칠 듯 말 듯한 물과 같으니 절대로 한 방울도 더하지 말고, 위급한 자리에 있는 사람은 부러질 듯 말 듯한 나무와 같으니 절대로 조금도 더 누르지 말라.","c":"전집 제203장(前集 第203)","src":202},{"o":"冷眼觀人，冷耳聽語，冷情當感，冷心思理。","e":"냉안관인, 냉이청어, 냉정당감, 냉심사리.","p":"차가운 눈으로 사람을 보고, 차가운 귀로 말을 듣고, 차가운 마음으로 느낌을 대하고, 차가운 마음으로 이치를 생각하라.","c":"전집 제204장(前集 第204)","src":203},{"o":"仁人心地寬舒，便福厚而慶長，事事成個寬舒氣象；\n鄙夫念頭迫促，便福薄而澤短，事事得個迫促規模。","e":"인인심지관서, 변복후이경장, 사사성개관서기상;\n비부념두박촉, 변복박이택단, 사사득개박촉규모.","p":"어진 사람은 마음이 너그럽고 느긋하여 복이 두텁고 경사가 길며, 하는 일마다 너그럽고 느긋한 기상을 이룬다. 속 좁은 사람은 생각이 급하고 옹색하여 복이 얇고 은택이 짧으며, 하는 일마다 급하고 옹색한 모양이 된다.","c":"전집 제205장(前集 第205)","src":204},{"o":"聞惡不可就惡，恐為讒夫洩怒；\n聞善不可急親，恐引奸人進身。","e":"문악불가취오, 공위참부설노;\n문선불가급친, 공인간인진신.","p":"남의 나쁜 소문을 듣고 곧바로 미워하지 말라. 헐뜯는 사람이 분풀이하는 것일까 두렵다. 남의 좋은 소문을 듣고 서둘러 가까이하지 말라. 간사한 사람이 출세하려는 길을 열어 줄까 두렵다.","c":"전집 제206장(前集 第206)","src":205},{"o":"性躁心粗者，一事無成；\n心和氣平者，百福自集。","e":"성조심조자, 일사무성;\n심화기평자, 백복자집.","p":"성미가 급하고 마음이 거친 사람은 한 가지 일도 이루지 못하고, 마음이 온화하고 기운이 평온한 사람에게는 온갖 복이 저절로 모인다.","c":"전집 제207장(前集 第207)","src":206},{"o":"用人不宜刻，刻則思效者去；\n交友不宜濫，濫則貢諛者來。","e":"용인불의각, 각즉사효자거;\n교우불의람, 남즉공유자래.","p":"사람을 쓸 때는 각박하게 하지 말라. 각박하면 힘쓰려던 사람도 떠난다. 벗을 사귈 때는 함부로 하지 말라. 함부로 하면 아첨하는 사람이 몰려온다.","c":"전집 제208장(前集 第208)","src":207},{"o":"風斜雨急處，要立得腳定；\n花濃柳豔處，要著得眼高；\n路危徑險處，要回得頭早。","e":"풍사우급처, 요립득각정;\n화농류염처, 요착득안고;\n노위경험처, 요회득두조.","p":"비바람이 비껴 몰아치는 곳에서는 발을 굳게 딛고 서야 하고, 꽃과 버들이 화려한 곳에서는 눈을 높이 두어야 하며, 길이 위태롭고 험한 곳에서는 일찍 발길을 돌려야 한다.","c":"전집 제209장(前集 第209)","src":208},{"o":"節義之人濟以和衷，纔不啟忿爭之路；\n功名之士承以謙德，方不開嫉妒之門。","e":"절의지인제이화충, 재불계분쟁지로;\n공명지사승이겸덕, 방불개질투지문.","p":"절개와 의리가 있는 사람은 온화한 마음으로 보태야 다툼의 길을 열지 않고, 공명을 이룬 사람은 겸손한 덕으로 받쳐야 시기의 문을 열지 않는다.","c":"전집 제210장(前集 第210)","src":209},{"o":"大人不可不畏，畏大人則無放逸之心；\n小民亦不可不畏，畏小民則無豪橫之習。","e":"대인불가불외, 외대인즉무방일지심;\n소민역불가불외, 외소민즉무호횡지습.","p":"높은 사람을 두려워하지 않을 수 없으니, 두려워하면 방자한 마음이 없어진다. 백성도 두려워하지 않을 수 없으니, 두려워하면 횡포한 버릇이 없어진다.","c":"전집 제212장(前集 第212)","src":211},{"o":"事稍拂逆，便思不如我的人，則尤怨自消；\n心稍怠荒，便思勝似我的人，則精神自奮。","e":"사초불역, 변사불여아적인, 즉우원자소;\n심초태황, 변사승사아적인, 즉정신자분.","p":"일이 조금 뜻대로 안 되면 나만 못한 사람을 생각하라. 그러면 원망이 저절로 사라진다. 마음이 조금 게을러지면 나보다 나은 사람을 생각하라. 그러면 정신이 저절로 떨쳐 일어난다.","c":"전집 제213장(前集 第213)","src":212},{"o":"不可乘喜而輕諾，不可因醉而生嗔，不可乘快而多事，不可因倦而鮮終。","e":"불가승희이경낙, 불가인취이생진, 불가승쾌이다사, 불가인권이선종.","p":"기쁘다고 가볍게 약속하지 말고, 취했다고 성내지 말며, 기분이 좋다고 일을 많이 벌이지 말고, 고단하다고 끝맺음을 소홀히 하지 말라.","c":"전집 제214장(前集 第214)","src":213},{"o":"口乃心之門，守口不密，洩盡真機；\n意乃心之足，防意不嚴，走盡邪蹊。","e":"구내심지문, 수구불밀, 설진진기;\n의내심지족, 방의불엄, 주진사혜.","p":"입은 마음의 문이니, 입을 단단히 지키지 않으면 참된 기밀이 다 새어 나간다. 뜻은 마음의 발이니, 뜻을 엄히 막지 않으면 그릇된 길로 다 달려간다.","c":"전집 제218장(前集 第218)","src":217},{"o":"責人者，原無過於有過之中，則情平；\n責己者，求有過於無過之內，則德進。","e":"책인자, 원무과어유과지중, 즉정평;\n책기자, 구유과어무과지내, 즉덕진.","p":"남을 꾸짖을 때는 허물이 있는 가운데서도 허물없는 점을 찾아 주면 마음이 평온해지고, 나를 꾸짖을 때는 허물이 없는 가운데서도 허물을 찾으면 덕이 자란다.","c":"전집 제219장(前集 第219)","src":218},{"o":"桃李雖豔，何如松蒼柏翠之堅貞；\n梨杏雖甘，何如橘綠橙黃之馨冽。\n信乎，濃夭不及淡久，早秀不如晚成也。","e":"도리수염, 하여송창백취지견정;\n이행수감, 하여귤록등황지형렬.\n신호, 농요불급담구, 조수불여만성야.","p":"복숭아와 오얏꽃이 곱다 한들 푸른 소나무와 잣나무의 굳은 절개만 하겠는가. 배와 살구가 달다 한들 노란 유자와 푸른 귤의 맑은 향기만 하겠는가. 참으로 짙고 짧은 것은 담백하고 오래가는 것에 못 미치고, 일찍 핀 꽃은 늦게 이룬 것만 못하다.","c":"전집 제222장(前集 第222)","src":221},{"o":"譚山林之樂者，未必真得山林之趣。\n厭名利之談者，未必盡忘名利之情。","e":"담산림지락자, 미필진득산림지취.\n염명리지담자, 미필진망명리지정.","p":"산림의 즐거움을 말하는 사람이 꼭 산림의 참맛을 아는 것은 아니고, 명예와 이익 이야기를 싫어하는 사람이 꼭 명리의 마음을 다 잊은 것은 아니다.","c":"후집 제1장(後集 第1)","src":222},{"o":"歲月本長，而忙者自促。\n天地本寬，而鄙者自隘。\n風花雪月本閒，而勞攘者自冗。","e":"세월본장, 이망자자촉.\n천지본관, 이비자자애.\n풍화설월본한, 이로양자자용.","p":"세월은 본래 긴데 바쁜 사람이 스스로 줄이고, 천지는 본래 넓은데 속 좁은 사람이 스스로 좁히며, 바람과 꽃과 눈과 달은 본래 한가로운데 분주한 사람이 스스로 번거롭게 한다.","c":"후집 제4장(後集 第4)","src":225},{"o":"得趣不在多。\n盆池拳石間，煙霞具足。\n會景不在遠。\n蓬窗竹屋下，風月自賖。","e":"득취부재다.\n분지권석간, 연하구족.\n회경부재원.\n봉창죽옥하, 풍월자사.","p":"멋을 얻는 것은 많은 데 있지 않으니, 작은 연못과 주먹만 한 돌 사이에도 안개와 노을이 다 갖추어져 있다. 좋은 경치는 먼 데 있지 않으니, 쑥대 창과 대나무 집 아래에도 바람과 달이 넉넉하다.","c":"후집 제5장(後集 第5)","src":226},{"o":"聽靜夜之鐘聲，喚醒夢中之夢，觀澄潭之月影，窺見身外之身。","e":"청정야지종성, 환성몽중지몽, 관징담지월영, 규견신외지신.","p":"고요한 밤의 종소리를 들으면 꿈속의 꿈에서 깨어나고, 맑은 못에 비친 달그림자를 보면 몸 밖의 몸을 엿보게 된다.","c":"후집 제6장(後集 第6)","src":227},{"o":"心無物欲，即是秋空霽海。\n坐有琴書，便成石室丹丘。","e":"심무물욕, 즉시추공제해.\n좌유금서, 변성석실단구.","p":"마음에 물욕이 없으면 그것이 곧 가을 하늘과 갠 바다요, 곁에 거문고와 책이 있으면 그것이 곧 신선이 사는 곳이다.","c":"후집 제9장(後集 第9)","src":230},{"o":"石火光中，爭長競短。\n幾何光陰。\n蝸牛角上，較雌論雄。\n許大世界。","e":"석화광중, 쟁장경단.\n기하광음.\n와우각상, 교자론웅.\n허대세계.","p":"부싯돌 불빛처럼 짧은 인생에서 길고 짧음을 다툰들 그 세월이 얼마나 되겠는가. 달팽이 뿔 위에서 누가 이기고 지는지 겨룬들 그 세상이 얼마나 크겠는가.","c":"후집 제13장(後集 第13)","src":234},{"o":"從冷視熱，然後知熱處之奔馳無益。\n從冗入閒，然後覺閒中之滋味最長。","e":"종랭시열, 연후지열처지분치무익.\n종용입한, 연후각한중지자미최장.","p":"차가운 자리에서 뜨거운 곳을 보아야 뜨거운 곳에서 바삐 달리는 것이 쓸데없음을 알고, 번잡함에서 한가로움으로 들어가 보아야 한가로움의 맛이 가장 길다는 것을 깨닫는다.","c":"후집 제16장(後集 第16)","src":237},{"o":"都來眼前事，知足者仙境，不知足者凡境。\n總出世上因，善用者生機，不善用者殺機。","e":"도래안전사, 지족자선경, 부지족자범경.\n총출세상인, 선용자생기, 불선용자살기.","p":"눈앞의 모든 일이, 만족할 줄 알면 신선의 경지요 만족할 줄 모르면 속된 경지다. 세상의 모든 인연이, 잘 쓰면 살리는 기틀이요 잘못 쓰면 죽이는 기틀이다.","c":"후집 제20장(後集 第20)","src":241},{"o":"趨炎附勢之禍，甚慘亦甚速。\n棲恬守逸之味，最淡亦最長。","e":"추염부세지화, 심참역심속.\n서념수일지미, 최담역최장.","p":"뜨거운 권세에 빌붙는 화는 몹시 참혹하고 몹시 빠르며, 고요하고 한가로움을 지키는 맛은 가장 담백하고 가장 오래간다.","c":"후집 제21장(後集 第21)","src":242},{"o":"爭先的徑路窄，退後一步自寬平一步。\n濃艷的滋味短，清淡一分自悠長一分。","e":"쟁선적경로착, 퇴후일보자관평일보.\n농염적자미단, 청담일분자유장일분.","p":"앞다투는 길은 좁으니 한 걸음 물러서면 한 걸음만큼 넓고 평탄해지고, 진하고 화려한 맛은 짧으니 한 푼 담백해지면 한 푼만큼 길고 오래간다.","c":"후집 제24장(後集 第24)","src":245},{"o":"忙處不亂性，須閒處心神養得清。\n死時不動心，須生時事物看得破。","e":"망처불란성, 수한처심신양득청.\n사시부동심, 수생시사물간득파.","p":"바쁠 때 본성을 어지럽히지 않으려면 한가할 때 마음과 정신을 맑게 길러 두어야 하고, 죽을 때 마음이 흔들리지 않으려면 살아 있을 때 세상일을 꿰뚫어 보아 두어야 한다.","c":"후집 제25장(後集 第25)","src":246},{"o":"隱逸林中無榮辱，道義路上無炎涼。","e":"은일림중무영욕, 도의로상무염량.","p":"숨어 사는 숲속에는 영화도 욕됨도 없고, 도의를 걷는 길 위에는 세상인심의 뜨거움과 차가움이 없다.","c":"후집 제26장(後集 第26)","src":247},{"o":"進步處，便思退步，庶免觸藩之禍。\n着手時，先圖放手，纔脱騎虎之危。","e":"진보처, 변사퇴보, 서면촉번지화.\n착수시, 선도방수, 재탈기호지위.","p":"나아갈 때 곧 물러설 것을 생각하면 울타리에 뿔이 걸린 양 같은 화를 면하고, 손을 댈 때 먼저 손 뗄 것을 꾀하면 범을 탄 위태로움에서 벗어난다.","c":"후집 제28장(後集 第28)","src":249},{"o":"矜名，不若逃名趣。\n練事，何如省事閒。","e":"긍명, 불약도명취.\n연사, 하여생사한.","p":"이름을 자랑하는 것은 이름을 피하는 멋만 못하고, 일에 능숙해지는 것은 일을 줄이는 한가로움만 못하다.","c":"후집 제30장(後集 第30)","src":251},{"o":"孤雲出岫，去留一無所係。\n朗鏡懸空，靜躁兩不相干。","e":"고운출수, 거류일무소계.\n낭경현공, 정조량불상간.","p":"외로운 구름이 산굴에서 나오듯 가고 머무는 데 아무 얽매임이 없고, 밝은 거울이 허공에 걸린 듯 고요함과 시끄러움에 둘 다 상관하지 않는다.","c":"후집 제32장(後集 第32)","src":253},{"o":"水流而境無聲，得處喧見寂之趣。\n山高而雲不礙，悟出有入無之機。","e":"수류이경무성, 득처훤견적지취.\n산고이운불애, 오출유입무지기.","p":"물이 흘러도 주위는 소리가 없으니, 시끄러운 가운데 고요함을 보는 멋을 얻는다. 산이 높아도 구름은 걸리지 않으니, 있음에서 나와 없음으로 드는 이치를 깨닫는다.","c":"후집 제35장(後集 第35)","src":256},{"o":"此身常放在閒處，榮辱得失，誰能差遣我。\n此心常安在靜中，是非利害，誰能瞞昧我。","e":"차신상방재한처, 영욕득실, 수능차견아.\n차심상안재정중, 시비리해, 수능만매아.","p":"이 몸을 늘 한가한 곳에 두면 영욕과 득실이 누가 나를 부릴 수 있으며, 이 마음을 늘 고요한 가운데 두면 시비와 이해가 누가 나를 속일 수 있겠는가.","c":"후집 제41장(後集 第41)","src":262},{"o":"我不希榮，何憂乎利祿之香餌。\n我不競進，何畏乎仕官之危機。","e":"아불희영, 하우호리록지향이.\n아불경진, 하외호사관지위기.","p":"내가 영화를 바라지 않으니 어찌 이익과 녹봉이라는 미끼를 걱정하며, 내가 앞다투어 나아가지 않으니 어찌 벼슬길의 위기를 두려워하겠는가.","c":"후집 제43장(後集 第43)","src":264},{"o":"多藏者厚亡。\n故知富不如貧之無慮。\n高步者疾顛。\n故知貴不如賤之常安。","e":"다장자후망.\n고지부불여빈지무려.\n고보자질전.\n고지귀불여천지상안.","p":"많이 쌓아 둔 사람은 크게 잃으니, 부유함이 가난의 근심 없음만 못하다는 것을 안다. 높이 걷는 사람은 빨리 넘어지니, 귀함이 천함의 늘 편안함만 못하다는 것을 안다.","c":"후집 제52장(後集 第52)","src":273},{"o":"自老視少，可以消奔馳角逐之心。\n自瘁視榮，可以絶紛華靡麗之念。","e":"자로시소, 가이소분치각축지심.\n자췌시영, 가이절분화미려지념.","p":"늙은 눈으로 젊음을 보면 바삐 달리고 다투는 마음을 없앨 수 있고, 시든 처지에서 영화를 보면 화려함을 좇는 생각을 끊을 수 있다.","c":"후집 제56장(後集 第56)","src":277},{"o":"熱鬧中，着一冷眼，便省許多苦心思。\n冷落處，存一熱心，便得許多真趣味。","e":"열료중, 착일랭안, 변생허다고심사.\n냉락처, 존일열심, 변득허다진취미.","p":"떠들썩한 가운데 차가운 눈을 하나 두면 많은 괴로운 생각을 덜고, 쓸쓸한 곳에서 뜨거운 마음을 하나 지니면 많은 참된 멋을 얻는다.","c":"후집 제58장(後集 第58)","src":279},{"o":"知成之必敗，則求成之心，不必太堅。\n知生之必死，則保生之道，不必過勞。","e":"지성지필패, 즉구성지심, 불필태견.\n지생지필사, 즉보생지도, 불필과로.","p":"이룬 것은 반드시 무너짐을 알면 이루려는 마음을 너무 굳게 가질 필요가 없고, 산 것은 반드시 죽음을 알면 삶을 지키는 일에 너무 애쓸 필요가 없다.","c":"후집 제61장(後集 第61)","src":282},{"o":"魚得水逝，而相忘乎水。\n鳥乘風飛，而不知有風。\n識此可以超物累，可以樂天機。","e":"어득수서, 이상망호수.\n조승풍비, 이부지유풍.\n식차가이초물루, 가이락천기.","p":"물고기는 물을 얻어 헤엄치면서도 물을 잊고, 새는 바람을 타고 날면서도 바람이 있는 줄 모른다. 이것을 알면 사물의 얽매임을 벗어나 하늘의 이치를 즐길 수 있다.","c":"후집 제67장(後集 第67)","src":288},{"o":"寵辱不驚，閑看庭前花開花落。\n去留無意，漫隨天外雲卷雲舒。","e":"총욕불경, 한간정전화개화락.\n거류무의, 만수천외운권운서.","p":"총애와 욕됨에 놀라지 않고 뜰 앞에 꽃이 피고 지는 것을 한가로이 바라보며, 가고 머무는 데 뜻을 두지 않고 하늘 밖에 구름이 걷히고 펴지는 것을 무심히 따른다.","c":"후집 제69장(後集 第69)","src":290},{"o":"伏久者，飛必高，開先者，謝獨早。\n知此，可以免蹭蹬之憂，可以消躁急之念。","e":"복구자, 비필고, 개선자, 사독조.\n지차, 가이면층등지우, 가이소조급지념.","p":"오래 엎드려 있던 새는 반드시 높이 날고, 먼저 핀 꽃은 홀로 일찍 진다. 이것을 알면 발을 헛디딜까 하는 근심을 면하고 조급한 마음을 없앨 수 있다.","c":"후집 제76장(後集 第76)","src":297},{"o":"樹木至歸根，而後知華萼枝葉之徒榮。\n人事至蓋棺，而後知子女玉帛之無益。","e":"수목지귀근, 이후지화악지엽지도영.\n인사지개관, 이후지자녀옥백지무익.","p":"나무는 잎이 떨어져 뿌리로 돌아간 뒤에야 꽃과 가지와 잎의 영화가 헛됨을 알고, 사람은 관 뚜껑을 덮을 때에 이르러서야 자녀와 재물이 소용없음을 안다.","c":"후집 제77장(後集 第77)","src":298},{"o":"繩鋸木斷，水滴石穿。\n學道者須加力索。\n水到渠成，瓜熟蔕落。\n得道者一任天機。","e":"승거목단, 수적석천.\n학도자수가력색.\n수도거성, 과숙체락.\n득도자일임천기.","p":"새끼줄 톱으로도 나무를 자르고 물방울로도 돌을 뚫는다. 도를 배우는 사람은 모름지기 힘써 찾아야 한다. 물이 이르면 도랑이 생기고 오이가 익으면 꼭지가 떨어진다. 도를 얻은 사람은 하늘의 흐름에 맡긴다.","c":"후집 제109장(後集 第109)","src":330},{"o":"雨餘觀山色，景象便覺新妍。\n夜靜聽鐘聲，音響尤為清越。","e":"우여관산색, 경상변각신연.\n야정청종성, 음향우위청월.","p":"비 갠 뒤에 산 빛을 보면 경치가 새롭고 곱게 느껴지고, 고요한 밤에 종소리를 들으면 울림이 더욱 맑고 멀리 퍼진다.","c":"후집 제112장(後集 第112)","src":333},{"o":"登高使人心曠，臨流使人意遠。\n讀書於雨雪之夜，使人神清，舒嘯於丘阜之嶺，使人興邁。","e":"등고사인심광, 임류사인의원.\n독서어우설지야, 사인신청, 서소어구부지령, 사인흥매.","p":"높은 곳에 오르면 마음이 탁 트이고, 흐르는 물가에 서면 생각이 멀어진다. 비 오고 눈 내리는 밤에 책을 읽으면 정신이 맑아지고, 언덕 마루에서 휘파람을 불면 흥이 솟는다.","c":"후집 제113장(後集 第113)","src":334},{"o":"心曠則萬鐘如瓦缶，心隘則一髮似車輪。","e":"심광즉만종여와부, 심애즉일발사차륜.","p":"마음이 넓으면 만 종의 녹봉도 질그릇 같고, 마음이 좁으면 머리카락 한 올도 수레바퀴만큼 커 보인다.","c":"후집 제114장(後集 第114)","src":335},{"o":"花看半開，酒飲微醉。\n此中大佳趣。\n若至爛漫酕醄，便成惡境矣。\n履盈滿者，宜思之。","e":"화간반개, 주음미취.\n차중대가취.\n약지란만모도, 변성악경의.\n이영만자, 의사지.","p":"꽃은 반쯤 피었을 때 보고, 술은 살짝 취할 만큼 마신다. 그 안에 큰 멋이 있다. 꽃이 흐드러지고 술에 곤드레가 되면 도리어 나쁜 지경이 된다. 가득 찬 자리에 있는 사람은 이를 깊이 생각해야 한다.","c":"후집 제122장(後集 第122)","src":343}],"zg":[{"o":"觀今宜鑒古，無古不成今。","e":"관금의감고, 무고불성금.","p":"오늘을 보려면 마땅히 옛일을 거울삼아야 하니, 옛날 없이는 오늘도 없다.","c":"상집(上集)","src":1},{"o":"知己知彼，將心比心。","e":"지기지피, 장심비심.","p":"나를 알고 남을 알며, 내 마음에 비추어 남의 마음을 헤아려라.","c":"상집(上集)","src":2},{"o":"酒逢知己飲，詩向會人吟。相識滿天下，知心能幾人？","e":"주봉지기음, 시향회인음. 상식만천하, 지심능기인?","p":"술은 마음 아는 벗을 만나야 마시고, 시는 알아주는 사람을 향해 읊는다. 얼굴 아는 이는 세상에 가득해도 마음 아는 이는 몇이나 될까?","c":"상집(上集)","src":3},{"o":"近水知魚性，近山識鳥音。","e":"근수지어성, 근산식조음.","p":"물 가까이 살면 물고기의 성질을 알고, 산 가까이 살면 새소리를 알아듣는다.","c":"상집(上集)","src":5},{"o":"易漲易退山溪水，易反易覆小人心。","e":"이창이퇴산계수, 이반이복소인심.","p":"쉽게 불었다 쉽게 빠지는 것은 산골 개울물이요, 쉽게 뒤집고 쉽게 엎는 것은 소인의 마음이다.","c":"상집(上集)","src":6},{"o":"運去金成鐵，時來鐵似金。","e":"운거금성철, 시래철사금.","p":"운이 가면 금도 쇠가 되고, 때가 오면 쇠도 금처럼 된다.","c":"상집(上集)","src":7},{"o":"讀書須用意，一字値千金。","e":"독서수용의, 일자치천금.","p":"책을 읽을 때는 마음을 기울여야 한다. 한 글자가 천금의 값어치가 있다.","c":"상집(上集)","src":8},{"o":"有意栽花花不發，無心插柳柳成蔭。","e":"유의재화화불발, 무심삽류류성음.","p":"애써 꽃을 심어도 꽃은 피지 않고, 무심코 꽂은 버들가지는 그늘을 이룬다.","c":"상집(上集)","src":10},{"o":"流水下灘非有意，白雲出岫本無心。","e":"유수하탄비유의, 백운출수본무심.","p":"흐르는 물이 여울을 내려가는 것은 뜻이 있어서가 아니고, 흰 구름이 산굴에서 나오는 것도 본래 무심해서다.","c":"상집(上集)","src":13},{"o":"路遙知馬力，日久見人心。","e":"노요지마력, 일구견인심.","p":"길이 멀어야 말의 힘을 알고, 날이 오래되어야 사람의 마음을 안다.","c":"상집(上集)","src":15},{"o":"兩人一般心，無錢堪買金；一人一般心，有錢難買針。","e":"양인일반심, 무전감매금; 일인일반심, 유전난매침.","p":"두 사람이 한마음이면 돈이 없어도 금을 살 수 있고, 저마다 딴마음이면 돈이 있어도 바늘 하나 사기 어렵다.","c":"상집(上集)","src":16},{"o":"馬行無力皆因瘦，人不風流只爲貧。","e":"마행무력개인수, 인불풍류지위빈.","p":"말이 힘없이 걷는 것은 다 여위었기 때문이고, 사람이 멋을 못 부리는 것은 다만 가난하기 때문이다.","c":"상집(上集)","src":18},{"o":"美不美，鄕中水；親不親，故鄕人。","e":"미불미, 향중수; 친불친, 고향인.","p":"맛이 좋든 나쁘든 고향의 물이요, 친하든 안 친하든 고향 사람이다.","c":"상집(上集)","src":21},{"o":"貧居鬧市無人問，富在深山有遠親。","e":"빈거뇨시무인문, 부재심산유원친.","p":"가난하면 번화한 저잣거리에 살아도 찾는 이가 없고, 부유하면 깊은 산속에 살아도 먼 친척이 찾아온다.","c":"상집(上集)","src":28},{"o":"長江後浪推前浪，世上新人趕舊人。","e":"장강후랑추전랑, 세상신인간구인.","p":"장강의 뒷물결이 앞물결을 밀어내듯, 세상에서는 새 사람이 옛사람을 쫓아낸다.","c":"상집(上集)","src":34},{"o":"近水樓臺先得月，向陽花木早逢春。","e":"근수루대선득월, 향양화목조봉춘.","p":"물가의 누대가 먼저 달을 맞고, 볕 바른 곳의 꽃나무가 먼저 봄을 만난다.","c":"상집(上集)","src":35},{"o":"古人不見今時月，今月曾經照古人。","e":"고인불견금시월, 금월증경조고인.","p":"옛사람은 오늘의 달을 보지 못했지만, 오늘의 달은 일찍이 옛사람을 비추었다.","c":"상집(上集)","src":36},{"o":"莫道君行早，更有早行人。","e":"막도군행조, 갱유조행인.","p":"그대가 일찍 길을 나섰다고 말하지 말라. 더 일찍 길을 나선 사람이 있다.","c":"상집(上集)","src":38},{"o":"自恨枝無葉，莫怨太陽偏。","e":"자한지무엽, 막원태양편.","p":"가지에 잎이 없음을 스스로 한탄할 일이지, 해가 고르게 비추지 않는다고 원망하지 말라.","c":"상집(上集)","src":41},{"o":"一年之計在於春，一日之計在於晨；一家之計在於和，一生之計在於勤。","e":"일년지계재어춘, 일일지계재어신; 일가지계재어화, 일생지계재어근.","p":"한 해의 계획은 봄에 있고, 하루의 계획은 새벽에 있다. 한 집안의 계획은 화목에 있고, 한평생의 계획은 부지런함에 있다.","c":"상집(上集)","src":43},{"o":"責人之心責己，恕己之心恕人。","e":"책인지심책기, 서기지심서인.","p":"남을 꾸짖는 마음으로 나를 꾸짖고, 나를 용서하는 마음으로 남을 용서하라.","c":"상집(上集)","src":44},{"o":"寧可人負我，切莫我負人。","e":"영가인부아, 절막아부인.","p":"차라리 남이 나를 저버릴지언정, 절대로 내가 남을 저버리지는 말라.","c":"상집(上集)","src":46},{"o":"人情似紙張張薄，世事如棋局局新。","e":"인정사지장장박, 세사여기국국신.","p":"인정은 종이처럼 장마다 얇고, 세상일은 바둑처럼 판마다 새롭다.","c":"상집(上集)","src":52},{"o":"山中也有千年樹，世上難逢百歳人。","e":"산중야유천년수, 세상난봉백세인.","p":"산속에는 천 년 묵은 나무도 있지만, 세상에서는 백 살 사람을 만나기 어렵다.","c":"상집(上集)","src":53},{"o":"力微休負重，言輕莫勸人。","e":"역미휴부중, 언경막권인.","p":"힘이 약하면 무거운 짐을 지지 말고, 말발이 약하면 남을 타이르지 말라.","c":"상집(上集)","src":54},{"o":"平生不做皺眉事，世上應無切齒人。","e":"평생부주추미사, 세상응무절치인.","p":"평생 남의 눈살 찌푸릴 일을 하지 않으면, 세상에 나를 이 갈며 미워할 사람이 없다.","c":"상집(上集)","src":56},{"o":"求人須求大丈夫，濟人須濟急時無。","e":"구인수구대장부, 제인수제급시무.","p":"남에게 도움을 청하려거든 대장부에게 청하고, 남을 도우려거든 급할 때 없는 이를 도와라.","c":"상집(上集)","src":59},{"o":"渇時一滴如甘露，醉後添杯不如無。","e":"갈시일적여감로, 취후첨배불여무.","p":"목마를 때 물 한 방울은 단 이슬 같지만, 취한 뒤에 더하는 술잔은 없느니만 못하다.","c":"상집(上集)","src":60},{"o":"有田不耕倉廩虚，有書不讀子孫愚。","e":"유전불경창름허, 유서부독자손우.","p":"밭이 있어도 갈지 않으면 곳간이 비고, 책이 있어도 읽지 않으면 자손이 어리석어진다.","c":"상집(上集)","src":67},{"o":"聽君一席話，勝讀十年書。","e":"청군일석화, 승독십년서.","p":"그대와 나눈 한자리 이야기가 십 년 동안 책 읽은 것보다 낫다.","c":"상집(上集)","src":69},{"o":"救人一命，勝造七級浮屠。","e":"구인일명, 승조칠급부도.","p":"사람 목숨 하나를 구하는 것이 칠 층 탑을 쌓는 것보다 낫다.","c":"상집(上集)","src":73},{"o":"城門失火，殃及池魚。","e":"성문실화, 앙급지어.","p":"성문에 불이 나면 그 재앙이 연못의 물고기에게까지 미친다.","c":"상집(上集)","src":74},{"o":"欲求生富貴，須下死工夫。","e":"욕구생부귀, 수하사공부.","p":"살아서 부귀를 얻고 싶거든 죽을 각오로 공부하라.","c":"상집(上集)","src":76},{"o":"百年成之不足，一旦敗之有餘。","e":"백년성지부족, 일단패지유여.","p":"백 년 걸려 이루어도 모자라고, 하루아침에 무너뜨리기는 남는다.","c":"상집(上集)","src":77},{"o":"寧可信其有，不可信其無。","e":"영가신기유, 불가신기무.","p":"차라리 있다고 믿을지언정, 없다고 믿지는 말라.","c":"상집(上集)","src":86},{"o":"竹籬茅舍風光好，道院僧堂終不如。","e":"죽리모사풍광호, 도원승당종불여.","p":"대울타리 초가집의 풍광이 좋으니, 도관이나 절집도 끝내 이만 못하다.","c":"상집(上集)","src":87},{"o":"人情似水分髙下，世事如雲任巻舒。","e":"인정사수분고하, 세사여운임권서.","p":"인정은 물과 같아서 높고 낮음이 나뉘고, 세상일은 구름과 같아서 걷히고 펴지는 대로 맡겨 둔다.","c":"상집(上集)","src":93},{"o":"磨刀恨不利，刀利傷人指。","e":"마도한불리, 도리상인지.","p":"칼을 갈 때는 잘 들지 않는다고 한탄하다가, 칼이 잘 들면 사람 손가락을 벤다.","c":"상집(上集)","src":95},{"o":"求財恨不得，財多害自己。","e":"구재한부득, 재다해자기.","p":"재물을 구할 때는 얻지 못해 한탄하다가, 재물이 많아지면 제 몸을 해친다.","c":"상집(上集)","src":96},{"o":"若登髙必自卑，若渉遠必自邇。","e":"약등고필자비, 약섭원필자이.","p":"높이 오르려면 반드시 낮은 데서 시작하고, 멀리 가려면 반드시 가까운 데서 시작한다.","c":"상집(上集)","src":101},{"o":"三思而行，再思可矣。","e":"삼사이행, 재사가의.","p":"세 번 생각하고 행하라 하지만, 두 번 생각하면 충분하다.","c":"상집(上集)","src":102},{"o":"使口不如親爲，求人不如求己。","e":"사구불여친위, 구인불여구기.","p":"남의 입을 부리는 것은 내가 몸소 하는 것만 못하고, 남에게 구하는 것은 나에게 구하는 것만 못하다.","c":"상집(上集)","src":103},{"o":"人見白頭嗔，我見白頭喜。","e":"인견백두진, 아견백두희.","p":"남들은 흰머리를 보면 성을 내지만, 나는 흰머리를 보면 기쁘다. (늙도록 살아 있음이 복이기 때문이다.)","c":"상집(上集)","src":106},{"o":"好事不出門，惡事傳千里。","e":"호사불출문, 악사전천리.","p":"좋은 일은 문밖을 나가지 않고, 나쁜 일은 천 리 밖까지 퍼진다.","c":"상집(上集)","src":109},{"o":"若要人不知，除非己莫爲。","e":"약요인부지, 제비기막위.","p":"남이 모르게 하려거든 애초에 하지 않는 수밖에 없다.","c":"상집(上集)","src":110},{"o":"爲人不做虧心事，半夜敲門心不驚。","e":"위인부주휴심사, 반야고문심불경.","p":"평생 양심에 어긋난 일을 하지 않으면, 한밤중에 누가 문을 두드려도 놀라지 않는다.","c":"상집(上集)","src":111},{"o":"貧窮自在，富貴多憂。","e":"빈궁자재, 부귀다우.","p":"가난하고 궁해도 마음은 자유롭고, 부귀하면 근심이 많다.","c":"상집(上集)","src":114},{"o":"寧向直中取，不可曲中求。","e":"영향직중취, 불가곡중구.","p":"차라리 곧은 길에서 얻을지언정, 굽은 길에서 구하지 말라.","c":"상집(上集)","src":116},{"o":"人無遠慮，必有近憂。","e":"인무원려, 필유근우.","p":"사람이 멀리 내다보는 생각이 없으면 반드시 가까운 근심이 생긴다.","c":"상집(上集)","src":117},{"o":"成事莫説，覆水難收。","e":"성사막설, 복수난수.","p":"이미 이루어진 일은 말하지 말라. 엎지른 물은 다시 담기 어렵다.","c":"상집(上集)","src":120},{"o":"人生一世，草生一春。","e":"인생일세, 초생일춘.","p":"사람의 한평생은 풀의 한 해 봄과 같다.","c":"상집(上集)","src":125},{"o":"黑髮不知勤學早，白首方悔讀書遲。","e":"흑발부지근학조, 백수방회독서지.","p":"검은 머리 때는 일찍 부지런히 배울 줄 모르다가, 흰머리가 되어서야 책 읽기 늦었음을 뉘우친다.","c":"상집(上集)","src":126},{"o":"月過十五光明少，人到中年萬事休。","e":"월과십오광명소, 인도중년만사휴.","p":"보름이 지나면 달빛이 줄고, 사람도 중년에 이르면 만사가 시들해진다.","c":"상집(上集)","src":127},{"o":"人生不滿百，常懷千歳憂。","e":"인생불만백, 상회천세우.","p":"인생은 백 년도 채우지 못하면서, 늘 천 년 근심을 품고 산다.","c":"상집(上集)","src":130},{"o":"今朝有酒今朝醉，明日愁來明日憂。","e":"금조유주금조취, 명일수래명일우.","p":"오늘 술이 있으면 오늘 취하고, 내일 근심이 오면 내일 걱정하리라.","c":"상집(上集)","src":131},{"o":"人貧不語，水平不流。","e":"인빈불어, 수평불류.","p":"사람은 가난하면 말이 없어지고, 물은 평평하면 흐르지 않는다.","c":"상집(上集)","src":134},{"o":"三杯通大道，一醉解千愁。","e":"삼배통대도, 일취해천수.","p":"석 잔 술에 큰 도에 통하고, 한 번 취하면 천 가지 근심이 풀린다.","c":"상집(上集)","src":137},{"o":"深山畢竟藏猛虎，大海終須納細流。","e":"심산필경장맹호, 대해종수납세류.","p":"깊은 산은 끝내 사나운 범을 품고, 큰 바다는 끝내 가는 물줄기를 받아들인다.","c":"상집(上集)","src":138},{"o":"受恩深處宜先退，得意濃時便可休。","e":"수은심처의선퇴, 득의농시변가휴.","p":"은혜를 깊이 입은 곳에서는 먼저 물러나야 하고, 뜻이 무르익었을 때 곧 그칠 줄 알아야 한다.","c":"상집(上集)","src":141},{"o":"忍一句，息一怒，饒一著，退一歩。","e":"인일구, 식일노, 요일착, 퇴일보.","p":"한마디 참고, 한 번의 노여움을 가라앉히고, 한 수 양보하고, 한 걸음 물러서라.","c":"상집(上集)","src":146},{"o":"一寸光陰一寸金，寸金難買寸光陰。","e":"일촌광음일촌금, 촌금난매촌광음.","p":"한 치의 시간은 한 치의 금이지만, 한 치의 금으로도 한 치의 시간은 사기 어렵다.","c":"상집(上集)","src":149},{"o":"人生似鳥同林宿，大限來時各自飛。","e":"인생사조동림숙, 대한래시각자비.","p":"인생은 한 숲에서 자는 새들과 같아서, 마지막 때가 오면 저마다 날아간다.","c":"상집(上集)","src":151},{"o":"人善被人欺，馬善被人騎。","e":"인선피인기, 마선피인기.","p":"사람이 착하면 남에게 업신여김을 당하고, 말이 순하면 남이 올라탄다.","c":"상집(上集)","src":152},{"o":"善惡到頭終有報，只爭來早與來遲。","e":"선악도두종유보, 지쟁래조여래지.","p":"선과 악은 끝내 갚음이 있으니, 다만 빨리 오느냐 늦게 오느냐의 차이다.","c":"상집(上集)","src":155},{"o":"黃河尙有澄淸日，豈可人無得運時。","e":"황하상유징청일, 기가인무득운시.","p":"누런 황하도 맑아지는 날이 있는데, 어찌 사람에게 운이 트일 때가 없겠는가.","c":"상집(上集)","src":156},{"o":"人情莫道春光好，只怕秋來有冷時。","e":"인정막도춘광호, 지파추래유랭시.","p":"인정이 봄볕처럼 좋다고 말하지 말라. 가을이 오면 차가워질 때가 있을까 두렵다.","c":"상집(上集)","src":160},{"o":"送君千里，終須一別。","e":"송군천리, 종수일별.","p":"그대를 천 리까지 배웅해도 끝내는 한 번 헤어져야 한다.","c":"상집(上集)","src":161},{"o":"但將冷眼看螃蟹，看你橫行到幾時。","e":"단장랭안간방해, 간니횡행도기시.","p":"차가운 눈으로 저 게를 지켜보라. 네가 옆으로 설치고 다니는 것이 언제까지 가나 보자.","c":"상집(上集)","src":162},{"o":"許人一物，千金不移。","e":"허인일물, 천금불이.","p":"남에게 주겠다고 약속한 물건은 천금을 준대도 바꾸지 않는다.","c":"상집(上集)","src":167},{"o":"龍游淺水遭蝦戲，虎落平陽被犬欺。","e":"용유천수조하희, 호락평양피견기.","p":"용도 얕은 물에서 놀면 새우에게 놀림을 당하고, 범도 평지로 내려오면 개에게 업신여김을 당한다.","c":"상집(上集)","src":169},{"o":"十年窗下無人問，一舉成名天下知。","e":"십년창하무인문, 일거성명천하지.","p":"십 년 동안 창 아래서 공부할 때는 묻는 이가 없더니, 한 번 급제하여 이름을 이루니 온 세상이 안다.","c":"상집(上集)","src":171},{"o":"酒債尋常行處有，人生七十古來稀。","e":"주채심상행처유, 인생칠십고래희.","p":"술빚은 가는 곳마다 흔히 있지만, 사람이 일흔까지 사는 것은 예부터 드물다.","c":"상집(上集)","src":172},{"o":"當家纔知鹽米貴，養子方知父母恩。","e":"당가재지염미귀, 양자방지부모은.","p":"살림을 맡아 봐야 소금과 쌀이 귀한 줄 알고, 자식을 길러 봐야 부모의 은혜를 안다.","c":"상집(上集)","src":175},{"o":"樹欲靜而風不止，子欲養而親不待。","e":"수욕정이풍부지, 자욕양이친부대.","p":"나무는 고요하고자 하나 바람이 그치지 않고, 자식은 봉양하고자 하나 어버이는 기다려 주지 않는다.","c":"상집(上集)","src":177},{"o":"少壯不努力，老大徒傷悲。","e":"소장불노력, 노대도상비.","p":"젊어서 힘쓰지 않으면, 늙어서 부질없이 슬퍼한다.","c":"상집(上集)","src":189},{"o":"種麻得麻，種豆得豆。","e":"종마득마, 종두득두.","p":"삼을 심으면 삼을 거두고, 콩을 심으면 콩을 거둔다.","c":"상집(上集)","src":193},{"o":"螳螂捕蟬，豈知黃雀在後。","e":"당랑포선, 기지황작재후.","p":"사마귀가 매미를 노리지만, 그 뒤에서 참새가 자기를 노리는 줄 어찌 알겠는가.","c":"상집(上集)","src":197},{"o":"不求金玉重重貴，但願兒孫箇箇賢。","e":"불구금옥중중귀, 단원아손개개현.","p":"금과 옥이 겹겹이 귀하기를 바라지 않고, 다만 자손이 하나하나 어질기를 바란다.","c":"상집(上集)","src":198},{"o":"百世修來同船渡，千世修來共枕眠。","e":"백세수래동선도, 천세수래공침면.","p":"백 대를 닦아야 한배를 타고 강을 건너고, 천 대를 닦아야 한 베개를 베고 잔다. (부부의 인연은 그만큼 귀하다.)","c":"상집(上集)","src":200},{"o":"枯木逢春猶再發，人無兩度再少年。","e":"고목봉춘유재발, 인무량도재소년.","p":"마른 나무도 봄을 만나면 다시 싹이 트지만, 사람은 두 번 다시 젊어지지 않는다.","c":"상집(上集)","src":203},{"o":"撃石原有火，不撃乃無煙。","e":"격석원유화, 불격내무연.","p":"돌을 치면 본래 불이 있지만, 치지 않으면 연기조차 없다.","c":"상집(上集)","src":209},{"o":"爲學始知道，不學亦徒然。","e":"위학시지도, 불학역도연.","p":"배워야 비로소 도리를 알고, 배우지 않으면 모든 것이 헛되다.","c":"상집(上集)","src":210},{"o":"和得鄰里好，猶如拾片寶。","e":"화득린리호, 유여습편보.","p":"이웃과 사이좋게 지내는 것은 보물 한 조각을 줍는 것과 같다.","c":"상집(上集)","src":212},{"o":"但能依本分，終須無煩惱。","e":"단능의본분, 종수무번뇌.","p":"다만 제 분수를 지킬 수 있다면 끝내 번뇌가 없으리라.","c":"상집(上集)","src":213},{"o":"凡事要好，須問三老。","e":"범사요호, 수문삼로.","p":"무슨 일이든 잘하려면 경험 많은 어른 세 분에게 물어라.","c":"상집(上集)","src":223},{"o":"因風吹火，用力不多。","e":"인풍취화, 용력부다.","p":"바람을 따라 불을 붙이면 힘이 많이 들지 않는다.","c":"상집(上集)","src":230},{"o":"無求到處人情好，不飲從他酒價髙。","e":"무구도처인정호, 불음종타주가고.","p":"남에게 바라는 것이 없으면 가는 곳마다 인정이 좋고, 술을 마시지 않으면 술값이 오르든 말든 상관없다.","c":"상집(上集)","src":232},{"o":"入山不怕傷人虎，只怕人情兩面刀。","e":"입산불파상인호, 지파인정량면도.","p":"산에 들어가서 사람 해치는 범은 두렵지 않으나, 다만 인정의 양날 칼이 두렵다.","c":"상집(上集)","src":234},{"o":"強中更有強中手，惡人須用惡人磨。","e":"강중갱유강중수, 악인수용악인마.","p":"강한 자 위에 더 강한 자가 있고, 악한 사람은 악한 사람이 갈아 놓는다.","c":"상집(上集)","src":235},{"o":"光陰似箭，日月如梭。","e":"광음사전, 일월여사.","p":"세월은 화살 같고, 해와 달은 베틀의 북처럼 빨리 오간다.","c":"상집(上集)","src":237},{"o":"世上萬般皆下品，思量唯有讀書髙。","e":"세상만반개하품, 사량유유독서고.","p":"세상 모든 일이 다 낮은 등급이고, 생각해 보면 오직 책 읽는 것만이 높다.","c":"상집(上集)","src":240},{"o":"羊有跪乳之恩，鴉有反哺之義。","e":"양유궤유지은, 아유반포지의.","p":"어린 양은 무릎 꿇고 젖을 먹는 은혜를 알고, 까마귀는 늙은 어미에게 먹이를 물어다 주는 의리가 있다.","c":"상집(上集)","src":243},{"o":"你急他未急，人閒心不閒。","e":"이급타미급, 인한심불한.","p":"너는 급해도 그는 급하지 않고, 몸은 한가해도 마음은 한가하지 않다.","c":"상집(上集)","src":246},{"o":"人生知足何時足，人老偸閒且是閒。","e":"인생지족하시족, 인로투한차시한.","p":"인생에서 만족을 안다면 언제인들 넉넉하지 않으랴. 늙어서 짬을 내어 쉬면 그것이 바로 한가로움이다.","c":"상집(上集)","src":251},{"o":"見者易，學者難。莫將容易得，便作等閒看。","e":"견자이, 학자난. 막장용이득, 변작등한간.","p":"보기는 쉬워도 배우기는 어렵다. 쉽게 얻었다고 해서 대수롭지 않게 보지 말라.","c":"상집(上集)","src":253},{"o":"厭靜還思喧，嫌喧又憶山。","e":"염정환사훤, 혐훤우억산.","p":"고요하면 다시 시끄러운 데가 그립고, 시끄러우면 또 산이 생각난다.","c":"상집(上集)","src":254},{"o":"自從心定後，無處不安然。","e":"자종심정후, 무처불안연.","p":"마음이 자리 잡은 뒤로는 어디서나 편안하다.","c":"상집(上集)","src":255},{"o":"用心計較般般錯，退歩思量事事難。","e":"용심계교반반착, 퇴보사량사사난.","p":"마음을 써서 따지고 재면 하나하나 어긋나고, 한 걸음 물러나 생각해 보면 일마다 어려움을 안다.","c":"상집(上集)","src":256},{"o":"從儉入奢易，從奢入儉難。","e":"종검입사이, 종사입검난.","p":"검소하다가 사치하기는 쉬워도, 사치하다가 검소해지기는 어렵다.","c":"상집(上集)","src":258},{"o":"知音説與知音聽，不是知音莫與彈。","e":"지음설여지음청, 불시지음막여탄.","p":"마음 아는 벗에게는 마음을 털어놓되, 마음 아는 벗이 아니면 거문고를 타 주지 말라.","c":"상집(上集)","src":259},{"o":"誰人不愛子孫賢，誰人不愛千鍾粟。","e":"수인불애자손현, 수인불애천종속.","p":"누군들 자손이 어질기를 바라지 않으며, 누군들 천 섬 곡식을 바라지 않겠는가.","c":"상집(上集)","src":264},{"o":"書到用時方恨少，事非經過不知難。","e":"서도용시방한소, 사비경과부지난.","p":"책은 쓸 때가 되어서야 적게 읽은 것을 한탄하고, 일은 겪어 보지 않으면 그 어려움을 모른다.","c":"상집(上集)","src":267},{"o":"但行好事，莫問前程。","e":"단행호사, 막문전정.","p":"다만 좋은 일을 행할 뿐, 앞날을 묻지 말라.","c":"상집(上集)","src":270},{"o":"河狹水激，人急計生。","e":"하협수격, 인급계생.","p":"강이 좁으면 물살이 세지고, 사람이 급하면 꾀가 생긴다.","c":"상집(上集)","src":271},{"o":"明知山有虎，莫向虎山行。","e":"명지산유호, 막향호산행.","p":"산에 범이 있는 줄 뻔히 알면서 범이 있는 산으로 가지 말라.","c":"상집(上集)","src":272},{"o":"路不行不到，事不爲不成。","e":"노불행부도, 사불위불성.","p":"길은 가지 않으면 이르지 못하고, 일은 하지 않으면 이루지 못한다.","c":"상집(上集)","src":273},{"o":"人不勸不善，鐘不打不鳴。","e":"인불권불선, 종불타불명.","p":"사람은 권하지 않으면 착해지지 않고, 종은 치지 않으면 울리지 않는다.","c":"상집(上集)","src":274},{"o":"滅卻心頭火，剔起佛前燈。","e":"멸각심두화, 척기불전등.","p":"마음속의 불을 끄고, 부처님 앞의 등불을 돋우어라.","c":"상집(上集)","src":280},{"o":"衆星朗朗，不如孤月獨明。","e":"중성랑랑, 불여고월독명.","p":"뭇별이 아무리 반짝여도 외로운 달 하나의 밝음만 못하다.","c":"상집(上集)","src":282},{"o":"牡丹花好空入目，棗花雖小結實成。","e":"모란화호공입목, 조화수소결실성.","p":"모란꽃은 고와도 눈만 즐겁게 할 뿐이고, 대추꽃은 작아도 열매를 맺는다.","c":"상집(上集)","src":285},{"o":"人老心未老，人窮志莫窮。","e":"인로심미로, 인궁지막궁.","p":"몸은 늙어도 마음은 늙지 말고, 처지는 궁해도 뜻은 궁하지 말라.","c":"상집(上集)","src":292},{"o":"人無千日好，花無百日紅。","e":"인무천일호, 화무백일홍.","p":"사람은 천 날을 내리 좋을 수 없고, 꽃은 백 날을 내리 붉을 수 없다.","c":"상집(上集)","src":293},{"o":"乍富不知新受用，乍貧難改舊家風。","e":"사부부지신수용, 사빈난개구가풍.","p":"갑자기 부자가 되면 새로 누리는 법을 모르고, 갑자기 가난해지면 옛 집안 버릇을 고치기 어렵다.","c":"상집(上集)","src":297},{"o":"屋漏更遭連夜雨，行船又遇打頭風。","e":"옥루갱조련야우, 행선우우타두풍.","p":"지붕이 새는데 밤새 비까지 내리고, 배를 모는데 맞바람까지 만난다.","c":"상집(上集)","src":299},{"o":"筍因落籜方成竹，魚爲奔波始化龍。","e":"순인락탁방성죽, 어위분파시화룡.","p":"죽순은 껍질을 벗어야 대나무가 되고, 물고기는 거센 물살을 거슬러야 용이 된다.","c":"상집(上集)","src":300},{"o":"記得少年騎竹馬，看看又是白頭翁。","e":"기득소년기죽마, 간간우시백두옹.","p":"어릴 적 죽마 타던 일이 기억나는데, 어느새 또 흰머리 노인이 되었구나.","c":"상집(上集)","src":301},{"o":"天上衆星皆拱北，世間無水不朝東。","e":"천상중성개공북, 세간무수부조동.","p":"하늘의 뭇별은 다 북극성을 향하고, 세상의 물은 동쪽으로 흐르지 않는 것이 없다.","c":"상집(上集)","src":303},{"o":"有縁千里來相會，無縁對面不相逢。","e":"유연천리래상회, 무연대면불상봉.","p":"인연이 있으면 천 리 밖에서도 와서 만나고, 인연이 없으면 얼굴을 마주하고도 만나지 못한다.","c":"상집(上集)","src":309},{"o":"爽口食多偏作藥，快心事過恐生殃。","e":"상구식다편작약, 쾌심사과공생앙.","p":"입에 맞는 음식도 많이 먹으면 도리어 약을 먹게 되고, 마음 시원한 일도 지나치면 재앙이 생길까 두렵다.","c":"상집(上集)","src":316},{"o":"貪他一斗米，失卻半年糧。","e":"탐타일두미, 실각반년량.","p":"남의 쌀 한 말을 탐내다가 반년 양식을 잃는다.","c":"상집(上集)","src":319},{"o":"平生只會量人短，何不回頭把自量。","e":"평생지회량인단, 하불회두파자량.","p":"평생 남의 단점만 잴 줄 알았지, 어찌하여 고개를 돌려 자신을 재어 보지 않는가.","c":"상집(上集)","src":322},{"o":"自家心裏急，他人未知忙。","e":"자가심리급, 타인미지망.","p":"내 마음은 급해도, 남은 바쁜 줄을 모른다.","c":"상집(上集)","src":325},{"o":"秋至滿山多秀色，春來無處不花香。","e":"추지만산다수색, 춘래무처불화향.","p":"가을이 오니 온 산에 고운 빛이 가득하고, 봄이 오니 꽃향기 없는 곳이 없다.","c":"상집(上集)","src":328},{"o":"蒿草之下，或有蘭香。茅茨之屋，或有侯王。","e":"호초지하, 혹유란향. 모자지옥, 혹유후왕.","p":"쑥대 풀 아래에도 난초 향기가 있을 수 있고, 띠풀 지붕 집에서도 제후와 왕이 날 수 있다.","c":"상집(上集)","src":331},{"o":"醉裏乾坤大，壺中日月長。","e":"취리건곤대, 호중일월장.","p":"취한 속에서는 하늘과 땅이 크고, 술병 속에서는 세월이 길다.","c":"상집(上集)","src":333},{"o":"千里送毫毛，禮輕仁義重。","e":"천리송호모, 예경인의중.","p":"천 리 밖에서 터럭 하나를 보내도, 선물은 가벼우나 정의는 무겁다.","c":"상집(上集)","src":336},{"o":"萬金良藥，不如無疾。","e":"만금량약, 불여무질.","p":"만금짜리 좋은 약도 병이 없는 것만 못하다.","c":"상집(上集)","src":340},{"o":"世事明如鏡，前程暗似漆。","e":"세사명여경, 전정암사칠.","p":"지난 세상일은 거울처럼 밝지만, 앞날은 옻칠처럼 어둡다.","c":"상집(上集)","src":342},{"o":"一夫當關，萬夫莫開。","e":"일부당관, 만부막개.","p":"한 사람이 관문을 지키면 만 사람도 열지 못한다.","c":"상집(上集)","src":357},{"o":"白雲本是無心物，卻被淸風引出來。","e":"백운본시무심물, 각피청풍인출래.","p":"흰 구름은 본래 무심한 것인데, 맑은 바람에 이끌려 나온다.","c":"상집(上集)","src":359},{"o":"人各有心，心各有見。","e":"인각유심, 심각유견.","p":"사람마다 마음이 있고, 마음마다 제 생각이 있다.","c":"상집(上集)","src":367},{"o":"口説不如身逢，耳聞不如目見。","e":"구설불여신봉, 이문불여목견.","p":"입으로 듣는 것은 몸소 겪는 것만 못하고, 귀로 듣는 것은 눈으로 보는 것만 못하다.","c":"상집(上集)","src":368},{"o":"養軍千日，用在一朝。","e":"양군천일, 용재일조.","p":"군사를 천 날 기르는 것은 하루아침에 쓰기 위해서다.","c":"상집(上集)","src":370},{"o":"利刀割體痕易合，惡語傷人恨不消。","e":"이도할체흔이합, 악어상인한불소.","p":"날카로운 칼에 베인 상처는 쉽게 아물지만, 모진 말로 입은 상처는 한이 사라지지 않는다.","c":"상집(上集)","src":372},{"o":"苗從地發，樹向枝分。","e":"묘종지발, 수향지분.","p":"싹은 땅에서 나오고, 나무는 가지로 갈라진다.","c":"상집(上集)","src":376},{"o":"父子和而家不退，兄弟和而家不分。","e":"부자화이가불퇴, 형제화이가불분.","p":"아버지와 아들이 화목하면 집안이 기울지 않고, 형과 아우가 화목하면 집안이 갈라지지 않는다.","c":"상집(上集)","src":380},{"o":"根深不怕風搖動，樹正無愁月影斜。","e":"근심불파풍요동, 수정무수월영사.","p":"뿌리가 깊으면 바람에 흔들릴까 두렵지 않고, 나무가 곧으면 달그림자가 비뚤어질까 근심하지 않는다.","c":"상집(上集)","src":387},{"o":"愚者千慮，必有一得，智者千慮，必有一失。","e":"우자천려, 필유일득, 지자천려, 필유일실.","p":"어리석은 사람도 천 번 생각하면 반드시 하나는 얻고, 지혜로운 사람도 천 번 생각하면 반드시 하나는 잃는다.","c":"상집(上集)","src":389},{"o":"珠沉淵而川媚，玉韞石而山輝。","e":"주침연이천미, 옥온석이산휘.","p":"구슬이 못에 잠겨 있으면 냇물이 곱고, 옥이 돌 속에 감춰져 있으면 산이 빛난다.","c":"상집(上集)","src":393},{"o":"夕陽無限好，只恐不多時。","e":"석양무한호, 지공부다시.","p":"저녁노을은 한없이 좋지만, 다만 남은 시간이 많지 않을까 걱정이다.","c":"상집(上集)","src":394},{"o":"久旱逢甘霖，他鄕遇故知；洞房花燭夜，金榜題名時。","e":"구한봉감림, 타향우고지; 동방화촉야, 금방제명시.","p":"오랜 가뭄 끝에 단비를 만나고, 타향에서 옛 친구를 만나고, 신방에 촛불 밝힌 밤, 과거 급제 명단에 이름이 오른 때. (인생의 네 가지 기쁨)","c":"상집(上集)","src":395},{"o":"惜花春起早，愛月夜眠遲。","e":"석화춘기조, 애월야면지.","p":"꽃을 아끼니 봄에는 일찍 일어나고, 달을 사랑하니 밤에는 늦게 잔다.","c":"상집(上集)","src":396},{"o":"掬水月在手，弄花香滿衣。","e":"국수월재수, 농화향만의.","p":"물을 두 손으로 뜨니 달이 손안에 있고, 꽃을 만지니 향기가 옷에 가득하다.","c":"상집(上集)","src":397}],"w":[{"b":"명상록","en":"Through not observing what is in the mind of another a man has seldom been seen to be unhappy; but those who do not observe the movements of their own minds must of necessity be unhappy.","ko":"남의 마음속을 살피지 않는다고 불행해진 사람은 거의 없다. 그러나 제 마음의 움직임을 살피지 않는 사람은 반드시 불행해진다.","c":"제2권 8절 (Book II, 8)","src":"2.8"},{"b":"가난한 리처드의 달력","en":"Early to bed and early to rise, makes a man healthy, wealthy, and wise.","ko":"일찍 자고 일찍 일어나면 몸이 건강하고 살림이 넉넉하고 지혜로워진다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#131"},{"b":"잠언","en":"The fear of the LORD is the beginning of knowledge: but fools despise wisdom and instruction.","ko":"주를 경외하는 것이 지식의 시작이다. 그러나 어리석은 자는 지혜와 훈계를 업신여긴다.","c":"1장 7절 (Proverbs 1:7, KJV)","src":"1:7"},{"b":"명상록","en":"Take away thy opinion, and then there is taken away the complaint, \"I have been harmed.\" Take away the complaint, \"I have been harmed,\" and the harm is taken away.","ko":"생각을 버려라. 그러면 ‘나는 해를 입었다’는 불평이 사라진다. ‘나는 해를 입었다’는 불평을 버려라. 그러면 해 자체가 사라진다.","c":"제4권 7절 (Book IV, 7)","src":"4.7"},{"b":"가난한 리처드의 달력","en":"Lost time is never found again.","ko":"잃어버린 시간은 다시 찾을 수 없다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#332"},{"b":"잠언","en":"Trust in the LORD with all thine heart; and lean not unto thine own understanding.","ko":"마음을 다하여 주를 믿고, 네 슬기에만 기대지 말라.","c":"3장 5절 (Proverbs 3:5, KJV)","src":"3:5"},{"b":"명상록","en":"That which does not make a man worse than he was, also does not make his life worse, nor does it harm him either from without or from within.","ko":"사람을 전보다 나쁘게 만들지 않는 것은 그의 삶도 나쁘게 만들지 않으며, 밖으로나 안으로나 그를 해치지 않는다.","c":"제4권 8절 (Book IV, 8)","src":"4.8"},{"b":"가난한 리처드의 달력","en":"God helps them that help themselves.","ko":"하늘은 스스로 돕는 자를 돕는다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#163"},{"b":"잠언","en":"In all thy ways acknowledge him, and he shall direct thy paths.","ko":"네가 가는 모든 길에서 그분을 인정하라. 그리하면 그분이 네 길을 곧게 이끄시리라.","c":"3장 6절 (Proverbs 3:6, KJV)","src":"3:6"},{"b":"명상록","en":"Do not have such an opinion of things as he has who does thee wrong, or such as he wishes thee to have, but look at them as they are in truth.","ko":"너에게 잘못한 사람이 보는 대로, 또는 그가 네가 보아 주기를 바라는 대로 사물을 보지 말고, 있는 그대로의 참모습을 보라.","c":"제4권 11절 (Book IV, 11)","src":"4.11"},{"b":"가난한 리처드의 달력","en":"Well done is better than well said.","ko":"잘 해낸 것이 잘 말한 것보다 낫다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#609"},{"b":"잠언","en":"Withhold not good from them to whom it is due, when it is in the power of thine hand to do it.","ko":"베풀어야 할 사람에게 선을 아끼지 말라. 네 손에 그럴 힘이 있을 때에.","c":"3장 27절 (Proverbs 3:27, KJV)","src":"3:27"},{"b":"명상록","en":"Hast thou reason? I have.--Why then dost not thou use it? For if this does its own work, what else dost thou wish?","ko":"너에게 이성이 있는가? 있다. 그렇다면 왜 쓰지 않는가? 이성이 제 할 일을 한다면 그 밖에 무엇을 더 바라는가?","c":"제4권 13절 (Book IV, 13)","src":"4.13"},{"b":"가난한 리처드의 달력","en":"Little strokes fell great oaks.","ko":"작은 도끼질이 큰 참나무를 쓰러뜨린다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#330"},{"b":"잠언","en":"Wisdom is the principal thing; therefore get wisdom: and with all thy getting get understanding.","ko":"지혜가 으뜸이니 지혜를 얻어라. 무엇을 얻든 슬기를 얻어라.","c":"4장 7절 (Proverbs 4:7, KJV)","src":"4:7"},{"b":"명상록","en":"Do not act as if thou wert going to live ten thousand years. Death hangs over thee. While thou livest, while it is in thy power, be good.","ko":"만 년이나 살 것처럼 행동하지 말라. 죽음이 머리 위에 걸려 있다. 살아 있는 동안, 할 수 있는 동안 선하게 살라.","c":"제4권 17절 (Book IV, 17)","src":"4.17"},{"b":"가난한 리처드의 달력","en":"Haste makes waste.","ko":"서두르면 일을 망친다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#184"},{"b":"잠언","en":"Keep thy heart with all diligence; for out of it are the issues of life.","ko":"무엇보다 네 마음을 힘써 지켜라. 생명의 샘이 거기서 흘러나온다.","c":"4장 23절 (Proverbs 4:23, KJV)","src":"4:23"},{"b":"명상록","en":"Love the art, poor as it may be, which thou hast learned, and be content with it; and pass through the rest of life like one who has intrusted to the gods with his whole soul all that he has, making thyself neither the tyrant nor the slave of any man.","ko":"네가 배운 일이 아무리 보잘것없어도 그 일을 사랑하고 만족하라. 그리고 가진 모든 것을 온 마음으로 하늘에 맡긴 사람처럼 남은 생을 지나가라. 누구의 폭군도, 누구의 노예도 되지 말라.","c":"제4권 31절 (Book IV, 31)","src":"4.31"},{"b":"가난한 리처드의 달력","en":"Fish and visitors stink in three days.","ko":"생선과 손님은 사흘이 지나면 냄새가 난다.","c":"벤저민 프랭클린 (Poor Richard's Almanack)","src":"PR#143"},{"b":"잠언","en":"Go to the ant, thou sluggard; consider her ways, and be wise: Which having no guide, overseer, or ruler, Provideth her meat in the summer, and gathereth her food in the harvest.","ko":"게으른 자여, 개미에게 가서 그 하는 일을 보고 지혜를 얻어라. 개미는 우두머리도 감독도 다스리는 이도 없으나, 여름에 먹을 것을 마련하고 추수 때 양식을 모은다.","c":"6장 6–8절 (Proverbs 6:6–8, KJV)","src":"6:6–8"},{"b":"명상록","en":"Everything is only for a day, both that which remembers and t
